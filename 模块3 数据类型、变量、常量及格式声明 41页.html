<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>模块3 · 数据类型、变量、常量及格式声明</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        .slides-container {
            display: flex;
            width: 100vw; height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw; height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar { width: 10px; }
        .slide::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb:hover { background: #a0b0c0; }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700; color: #0a2a4a;
            margin-bottom: 0.4vh; line-height: 1.2; flex-shrink: 0;
        }
        .slide-title .hl { color: #e88934; }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72; font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh; margin-bottom: 0.8vh; flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff;
            padding: 0.8vh 2.5vw; border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a; font-weight: 500; line-height: 1.5;
            margin-bottom: 1vh; flex-shrink: 0;
        }
        .core-takeaway strong { color: #e88934; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; }
        .content-grid.single { grid-template-columns: 1fr; }
        .content-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .info-block {
            background: #f8fafc; padding: 1vh 1.8vw; border-radius: 16px;
            border: 1px solid #e9edf4; font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600; color: #0a2a4a; margin-bottom: 0.2vh;
        }
        .info-block p, .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44; line-height: 1.5;
        }
        .info-block ul { padding-left: 2vw; margin: 0.2vh 0; }
        .info-block ul li { margin-bottom: 0.1vh; }

        .data-highlight { background: #0a2a4a; color: #fff; padding: 0.2vh 1.5vw; border-radius: 40px; font-size: clamp(28px, 3vh, 40px); font-weight: 600; display: inline-block; }

        .code-block {
            background: #132433; border-radius: 16px;
            padding: 1.2vh 2vw; margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap; word-break: break-word;
        }
        .code-block .comment { color: #7a9bb5; }
        .code-block .keyword { color: #ffb347; }
        .code-block .string { color: #8bcb8b; }
        .code-block .func { color: #7fc1ff; }
        .code-block .num { color: #f5a97f; }
        .code-label {
            display: inline-block; background: #0a2a4a; color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600; padding: 0.1vh 1.5vw; border-radius: 30px;
            margin-bottom: 0.2vh; letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a; border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .table-wrap { overflow-x: auto; margin: 0.4vh 0; }
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: clamp(22px, 2.4vh, 32px);
            background: #f8fafc; border-radius: 14px; overflow: hidden;
        }
        .styled-table thead { background: #0a2a4a; color: #fff; }
        .styled-table th, .styled-table td {
            padding: 0.6vh 1vw;
            text-align: left; border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td { border-bottom: none; }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-cover .main-title { font-size: clamp(64px, 8vh, 96px); font-weight: 800; color: #0a2a4a; letter-spacing: 2px; line-height: 1.2; }
        .slide-cover .sub-title { font-size: clamp(36px, 4.5vh, 56px); font-weight: 300; color: #e88934; margin: 1vh 0 2vh 0; letter-spacing: 4px; }
        .slide-cover .divider-line { background: #0a2a4a; height: 4px; width: 12vw; border-radius: 4px; margin: 1.5vh auto 2.5vh auto; }
        .slide-cover .info-text { font-size: clamp(30px, 3.6vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-cover .date-text { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.5vh; }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-end .end-title { font-size: clamp(68px, 8vh, 96px); font-weight: 300; color: #0a2a4a; letter-spacing: 6px; }
        .slide-end .end-line { background: #e88934; height: 4px; width: 10vw; border-radius: 4px; margin: 2vh auto 3vh auto; }
        .slide-end .end-sub { font-size: clamp(32px, 3.8vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-end .end-desc { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.2vh; }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-chapter .ch-title { font-size: clamp(48px, 6vh, 72px); font-weight: 700; letter-spacing: 2px; }
        .slide-chapter .ch-sub { font-size: clamp(30px, 3.6vh, 48px); color: #b8d0e8; margin-top: 1vh; }
        .slide-chapter .ch-desc { font-size: clamp(28px, 3.2vh, 44px); color: #d0dce8; margin-top: 1.5vh; max-width: 80%; line-height: 1.6; }

        .click-area { position: fixed; top: 0; height: 100vh; z-index: 100; cursor: pointer; }
        #clickLeft { left: 0; width: 33.33vw; }
        #clickRight { right: 12px; width: calc(33.33vw - 12px); }
        #clickCenter { left: 33.33vw; width: calc(33.33vw - 12px); pointer-events: none; cursor: default; }

        .chart-placeholder {
            background: #f0f6fe; border: 3px dashed #8aa9d0;
            border-radius: 20px; padding: 1.5vh 2vw;
            text-align: center; color: #2a4a6a;
            font-weight: 500; margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon { font-size: clamp(44px, 5vh, 64px); display: block; margin-bottom: 0.3vh; }

        @media (max-width: 768px) {
            .slide { padding: 2vh 4vw; }
            .content-grid { grid-template-columns: 1fr; gap: 0.8vh 0; }
            .content-grid.three { grid-template-columns: 1fr; }
            .slide-title { font-size: clamp(36px, 4.5vh, 48px); }
            .core-takeaway { font-size: clamp(28px, 3.2vh, 38px); }
            .info-block { font-size: clamp(24px, 2.6vh, 34px); }
            .code-block { font-size: clamp(16px, 2vh, 24px); padding: 1vh 2vw; }
            .slide-cover .main-title { font-size: clamp(44px, 5.5vh, 60px); }
            .slide-cover .sub-title { font-size: clamp(28px, 3.4vh, 40px); }
            .slide-chapter .ch-title { font-size: clamp(36px, 4.5vh, 52px); }
            .slide-end .end-title { font-size: clamp(48px, 6vh, 68px); }
            #clickRight { right: 8px; width: calc(33.33vw - 8px); }
            .styled-table { font-size: clamp(18px, 2vh, 26px); }
        }

        /* ----- 课后小练习 样式 ----- */
        .exercise-section {
            margin-top: 1.2vh;
            padding-top: 0.6vh;
            border-top: 3px solid #e88934;
            position: relative;
            z-index: 101;
        }
        .exercise-section .exercise-title {
            font-size: clamp(30px, 3.4vh, 44px);
            font-weight: 700;
            color: #0a2a4a;
            margin-bottom: 0.4vh;
            display: flex;
            align-items: center;
            gap: 0.8vw;
        }
        .exercise-section .exercise-title::before {
            content: "📝";
            font-size: clamp(32px, 3.6vh, 48px);
        }
        .exercise-item {
            background: #f8fafc;
            padding: 0.8vh 1.5vw;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            margin-bottom: 0.8vh;
            font-size: clamp(24px, 2.6vh, 34px);
            position: relative;
            z-index: 102;
        }
        .exercise-item .q {
            font-weight: 600;
            color: #0a2a4a;
            margin-bottom: 0.2vh;
        }
        .exercise-item .opts {
            color: #1f2e44;
            margin: 0.2vh 0 0.2vh 1vw;
            display: block;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.6;
        }
        .exercise-item .opts .opt-line {
            display: block;
            padding-left: 0.5vw;
        }
        .exercise-item .code-block {
            margin: 0.4vh 0;
            font-size: clamp(18px, 2vh, 26px);
            padding: 0.8vh 1.5vw;
        }
        .exercise-item .ans-area {
            color: #e88934;
            font-weight: 600;
            margin: 0.3vh 0 0 0;
            display: none;
            font-size: clamp(22px, 2.4vh, 30px);
        }
        .exercise-item .ans-area.show {
            display: block;
        }
        .exercise-item .btn-answer {
            display: block;
            margin: 0.4vh auto 0.2vh auto;
            padding: 0.2vh 2vw;
            background: #0a2a4a;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: clamp(20px, 2.2vh, 28px);
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            width: fit-content;
            pointer-events: auto;
            position: relative;
            z-index: 103;
        }
        .exercise-item .btn-answer:hover {
            background: #e88934;
        }
        .exercise-item .btn-answer:active {
            transform: scale(0.95);
        }
        .btn-wrapper {
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 103;
            pointer-events: auto;
        }
        .slide .exercise-section {
            position: relative;
            z-index: 101;
        }
        .slide .exercise-item {
            position: relative;
            z-index: 102;
        }
    </style>
</head>
<body>
    <div id="clickLeft" class="click-area"></div>
    <div id="clickCenter" class="click-area"></div>
    <div id="clickRight" class="click-area"></div>
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 辅助函数
        // ============================================================
        function codeBlock(code, label = '') {
            return `<div style="margin-top:0.2vh;">
                ${label ? `<div class="code-label">${label}</div>` : ''}
                <div class="code-block">${code}</div>
            </div>`;
        }

        function outputBlock(text) {
            return `<div class="output-block">${text}</div>`;
        }

        function textBlock(html) {
            return `<div class="info-block" style="margin-bottom:0.4vh;">${html}</div>`;
        }

        function tableBlock(headers, rows) {
            let html = `<div class="table-wrap"><table class="styled-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function gridBlock(items, cols = 2) {
            let cls = cols === 3 ? 'content-grid three' : (cols === 1 ? 'content-grid single' : 'content-grid');
            let html = items.map(item =>
                `<div class="info-block"><h4>${item.title}</h4><p>${item.content}</p></div>`
            ).join('');
            return `<div class="${cls}">${html}</div>`;
        }

        function chartPlaceholder(icon, desc) {
            return `<div class="chart-placeholder"><span class="icon">${icon}</span>${desc}</div>`;
        }

        // ============================================================
        // 练习构建函数
        // ============================================================
        function buildExercises(exList) {
            if (!exList || exList.length === 0) return '';
            let html = `<div class="exercise-section"><div class="exercise-title">课后小练习</div>`;
            exList.forEach((ex, idx) => {
                let qHtml = ex.q || '';
                let codeHtml = '';
                if (ex.code) {
                    codeHtml = `<div class="code-block">${ex.code}</div>`;
                }
                let optsHtml = '';
                if (ex.opts) {
                    const lines = ex.opts.split('\n').filter(s => s.trim());
                    if (lines.length > 1) {
                        optsHtml = `<span class="opts">${lines.map(line => `<span class="opt-line">${line.trim()}</span>`).join('')}</span>`;
                    } else {
                        optsHtml = `<span class="opts">${ex.opts}</span>`;
                    }
                }
                const ansText = ex.ans ? `✅ 答案：${ex.ans}` : '';
                html += `<div class="exercise-item" data-exidx="${idx}">
                    <div class="q">${idx+1}. ${qHtml}</div>
                    ${codeHtml}
                    ${optsHtml}
                    <div class="ans-area" id="ans-${idx}">${ansText}</div>
                    <div class="btn-wrapper">
                        <button class="btn-answer" onclick="toggleAnswer(this, ${idx})">显示答案</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        // 全局切换答案
        function toggleAnswer(btn, idx) {
            const item = btn.closest('.exercise-item');
            if (!item) return;
            const ansArea = item.querySelector('.ans-area');
            if (!ansArea) return;
            const isHidden = ansArea.style.display === 'none' || ansArea.style.display === '';
            if (isHidden) {
                ansArea.style.display = 'block';
                ansArea.classList.add('show');
                btn.textContent = '隐藏答案';
            } else {
                ansArea.style.display = 'none';
                ansArea.classList.remove('show');
                btn.textContent = '显示答案';
            }
        }

        // ============================================================
        // 幻灯片数据（完全保留原课件所有内容 + exercises）
        // ============================================================
        const slides = [];

        function addSlide(title, subtitle, takeaway, contentBlocks, chapter = '', exercises = null) {
            slides.push({ title, subtitle, takeaway, contentBlocks, chapter, exercises });
        }

        // ============================================================
        // 1. 封面 & 目录
        // ============================================================
        slides.push({
            type: 'cover',
            mainTitle: '模块3 · 数据类型、变量、常量及格式声明',
            subTitle: '常量分类 · 进制转换 · 变量类型 · 格式声明',
            date: '授课日期：2026年8月'
        });

        addSlide(
            '📋 课程目录',
            '数据类型与存储基础',
            '本课件涵盖常量、进制转换、变量类型、格式声明、附表及自我测试。',
            [{
                type: 'toc',
                items: [
                    { ch: '3.1 常量', desc: '整型 · 实型 · 字符 · 字符串 · 进制转换' },
                    { ch: '3.2 变量', desc: '整型 · 实型 · 字符型' },
                    { ch: '3.3 格式声明', desc: '对齐 · 精度 · 前缀 · 匹配' },
                    { ch: '3.4 附表', desc: '常量类型表 · 变量数据类型表' },
                    { ch: '3.5 自我测试', desc: '选择题 · 改错 · 输出结果' }
                ]
            }],
            '',
            null
        );

        // ============================================================
        // 3.1 常量
        // ============================================================
        addSlide(
            '3.1 常量',
            '程序运行过程中值不能改变的量',
            '常量分为整型、实型、字符、字符串四大类。',
            [
                textBlock('<strong>定义：</strong>在程序运行过程中，<strong>其值不能被改变</strong>的量。'),
                textBlock('四大分类：整型常量、实型常量、字符常量、字符串常量。')
            ],
            '3.1',
            [
                { q: '以下不是合法C常量的是（  ）', opts: 'A. 0x3A\nB. 057\nC. 2.8f\nD. 3e8.0', ans: 'D' },
                { q: '以下合法的八进制数是（  ）', opts: 'A. 0135\nB. 068\nC. 013.54\nD. o7', ans: 'A' }
            ]
        );

        // 整型常量
        addSlide(
            '整型常量 — 十进制与八进制',
            '十进制：正常数字 · 八进制：以0开头',
            '整型常量有三种进制表示。',
            [
                textBlock('<strong>十进制：</strong>正负号 + 0~9，如 <span class="hl">-36、25</span>。'),
                textBlock('<strong>八进制：</strong>正负号 + 0~7，<span class="hl">以 0 开头</span>，如 <code>025</code> = 2×8¹+5 = <span class="hl">21</span>。'),
                textBlock('<strong>十六进制：</strong>正负号 + 0~9 + A~F，<span class="hl">以 0x 开头</span>，如 <code>0xd</code> = 13，<code>0x15</code> = 1×16+5 = <span class="hl">21</span>。')
            ],
            '3.1',
            [
                { q: '以下合法的十六进制数是（  ）', opts: 'A. 0x\nB. 0x4de\nC. 0x1h\nD. ox77', ans: 'B' },
                { q: '以下选项中非法的数值常量是（  ）', opts: 'A. 019\nB. 0L\nC. 0xff\nD. 1e1', ans: 'A' }
            ]
        );

        // 实型常量
        addSlide(
            '实型常量 — 十进制小数与指数形式',
            '小数点是实数的标志 · 指数形式 aEn',
            '实型常量有小数形式和指数形式。',
            [
                textBlock('<strong>十进制小数形式：</strong>由正负号 + 0~9 + 小数点组成，如 <span class="hl">1.23、-3.4</span>。'),
                textBlock('注意：<code>5 / 2</code> 得 <span class="hl">2</span>（整数除法截断），<code>5.0 / 2</code> 得 <span class="hl">2.5</span>（浮点除法）。'),
                textBlock('<strong>指数形式：</strong><code>aEn</code> 表示 a×10ⁿ，其中 a 为 1~9 的实数，n 为十进制整数。'),
                textBlock('例：0.11 = <span class="hl">1.100000E-01</span>，125.6 = <span class="hl">1.256000E+02</span>。')
            ],
            '3.1',
            [
                { q: '以下正确的实型常量是（  ）', opts: 'A. 1.2E\nB. 579899\nC. 1.2e0.6\nD. 8', ans: 'B' },
                { q: '以下选项中合法的实型常数是（  ）', opts: 'A. 5E2.0\nB. E-3\nC. 2E0\nD. 1.3E', ans: 'C' }
            ]
        );

        // 字符常量
        addSlide(
            '字符常量 — 普通字符',
            '单引号括起的单个字符 · 占1字节',
            '普通字符常量由单引号括起，在内存中占1字节。',
            [
                textBlock('<strong>定义：</strong>由 <span class="hl">单引号</span> 括起来的单个字符，如 <code>&#39;A&#39;</code>、<code>&#39;a&#39;</code>、<code>&#39;3&#39;</code>。'),
                textBlock('内存长度：<span class="hl">1 字节</span>，存储字符的ASCII码值。'),
                textBlock('⚠️ 单引号是字符常量的标志，与字符串的双引号区分。')
            ],
            '3.1',
            [
                { q: '在C语言中，合法的字符常量是（  ）', opts: 'A. \'084\'\nB. \'x43\'\nC. \'ab\'\nD. \'0\'', ans: 'D' },
                { q: '下列数据中不属于"字符常量"的是（  ）', opts: 'A. \'a\'\nB. \'160\'\nC. \'070\'\nD. 070', ans: 'D' }
            ]
        );

        addSlide(
            '转义字符列表（上）',
            '以 \ 开头，表示特殊含义',
            '转义字符用于表示控制字符或特殊符号。',
            [
                tableBlock(
                    ['转义字符', '含义'],
                    [
                        ['\\\'', '单引号'],
                        ['\\\"', '双引号'],
                        ['\\\\', '反斜杠'],
                        ['\\a', '响铃'],
                        ['\\b', '退格'],
                        ['\\n', '换行'],
                        ['\\t', '到下一个制表位']
                    ]
                )
            ],
            '3.1',

                textBlock('A. 0x80 → 128'),
                textBlock('B. 0174 → 1×64+7×8+4=124'),
                textBlock('C. 11111011B → 251'),
                textBlock('D. 125D → 125'),
                textBlock('答案：<span class="hl">C</span>（251最大）')
            ],
            '3.5',
            null
        );

        // 选择题⑤
        addSlide(
            '选择题 ⑤',
            '字符串常量与变量名',
            '有变量声明 <code>char come = \'g\';</code>，则 <code>printf("%s", "come");</code> 的输出结果是（  ）。',
            [
                textBlock('A. 103'),
                textBlock('B. g'),
                textBlock('C. come'),
                textBlock('D. s'),
                textBlock('答案：<span class="hl">C</span>（双引号中的 "come" 是字符串常量，原样输出）')
            ],
            '3.5',
            null
        );

        // 改错题 — 程序（上）
        addSlide(
            '改错题 — 程序（上）',
            '找出程序中的错误',
            '下面程序有多处错误，请指出。',
            [
                codeBlock(
                    '1. include <stdio.h>               // 缺少 #\n' +
                    '2. define N 3.14                   // 缺少 #\n' +
                    '3. int main()\n' +
                    '4. {char name="Lucy";              // 字符串不能赋给char变量\n' +
                    '5. int x_1,float x_2=3,x_3=4;short s; // 语法错误\n' +
                    '6. printf("Please input x_1 \\n");\n' +
                    '7. scanf("%d",x_1);                // 缺少 &',
                    ''
                )
            ],
            '3.5',
            null
        );

        // 改错题 — 程序（下）
        addSlide(
            '改错题 — 程序（下）',
            '错误汇总与修正',
            '完整错误列表和正确写法。',
            [
                textBlock('① 第1行：应为 <code>#include &lt;stdio.h&gt;</code>'),
                textBlock('② 第2行：应为 <code>#define N 3.14</code>'),
                textBlock('③ 第4行：应改为 <code>char name[] = "Lucy";</code> 或 <code>char *name = "Lucy";</code>'),
                textBlock('④ 第5行：应分开定义 <code>int x_1; float x_2=3, x_3=4; short s;</code>'),
                textBlock('⑤ 第7行：应为 <code>scanf("%d", &x_1);</code>'),
                textBlock('⑥ 第10行：应为 <code>printf("%s s result is:", name);</code>'),
                textBlock('⑦ 第11行：应为 <code>printf("x_1=%d,s=%f \\n", x_1, s);</code>')
            ],
            '3.5',
            null
        );

        // printf 输出结果预测（上）
        addSlide(
            'printf 输出结果预测（上）',
            '格式声明与数据类型的匹配',
            '写出下列 printf 语句的输出结果。',
            [
                codeBlock(
                    'printf("%u,%d", -1, -1);            // 65535,-1\n' +
                    'printf("%o", 10);                   // 12\n' +
                    'printf("%x", 10);                   // a\n' +
                    'printf("%x", 10.00);                // 错误（格式与类型不匹配）\n' +
                    'printf("%x", -1);                   // ffffffff（或ffff）\n' +
                    'printf("%f", 2.1);                  // 2.100000\n' +
                    'printf("%e", 2.8);                  // 2.800000e+00\n' +
                    'printf("%g", 2.8000);               // 2.8\n' +
                    'printf("%c", \'c\');                 // c\n' +
                    'printf("%d", \'A\');                 // 65',
                    ''
                )
            ],
            '3.5',
            null
        );

        // printf 输出结果预测（下）
        addSlide(
            'printf 输出结果预测（下）',
            '转义字符 · 进制前缀 · 截取 · 精度',
            '继续写出下列语句的输出结果。',
            [
                codeBlock(
                    'printf("%c", 97);                   // a\n' +
                    'printf("%s", "abcd");               // abcd\n' +
                    'printf("\\123\\164\\165\\x64\\x65\\x6e\\x164"); // Student? 实际解析需注意\n' +
                    'int a = 21; printf("%#x", a);       // 0x15\n' +
                    'int b = 21; printf("%#o", b);       // 025\n' +
                    'char ch[15] = "goodluck";\n' +
                    'printf("%.4s", ch);                 // good\n' +
                    'float P = 3.1415926;\n' +
                    'printf("%5.4f", P);                 // 3.1416（四舍五入）',
                    ''
                )
            ],
            '3.5',
            null
        );

        // ============================================================
        // 结束页
        // ============================================================
        slides.push({
            type: 'end',
            title: 'Thank You',
            sub: '模块3 · 数据类型、变量、常量及格式声明',
            desc: '常量分类 · 进制转换 · 变量类型 · 格式声明 · 自我测试'
        });

        // ============================================================
        // 渲染引擎
        // ============================================================
        const container = document.getElementById('slidesContainer');

        function renderSlide(data) {
            const section = document.createElement('section');
            section.className = 'slide';

            if (data.type === 'cover') {
                section.classList.add('slide-cover');
                section.innerHTML = `
                    <div class="main-title">${data.mainTitle}</div>
                    <div class="sub-title">${data.subTitle}</div>
                    <div class="divider-line"></div>
                    <div class="info-text">中职计算机专业 · 课堂教学</div>
                    <div class="date-text">${data.date}</div>
                `;
                return section;
            }

            if (data.type === 'end') {
                section.classList.add('slide-end');
                section.innerHTML = `
                    <div class="end-title">${data.title}</div>
                    <div class="end-line"></div>
                    <div class="end-sub">${data.sub}</div>
                    <div class="end-desc">${data.desc}</div>
                `;
                return section;
            }

            let meta = '';
            if (data.chapter) {
                meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">${data.chapter}</span>
                </div>`;
            }

            let content = '';
            if (data.takeaway) {
                content += `<div class="core-takeaway">${data.takeaway}</div>`;
            }

            for (const block of data.contentBlocks) {
                if (typeof block === 'string') {
                    content += block;
                } else if (block.type === 'text') {
                    content += block;
                } else if (block.type === 'code') {
                    content += block;
                } else if (block.type === 'output') {
                    content += block;
                } else if (block.type === 'grid') {
                    content += block;
                } else if (block.type === 'table') {
                    content += block;
                } else if (block.type === 'chart') {
                    content += block;
                } else if (block.type === 'toc') {
                    let itemsHtml = block.items.map(item =>
                        `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                            <h4 style="font-size:clamp(28px,3.2vh,42px);">${item.ch}</h4>
                            <p style="font-size:clamp(24px,2.8vh,36px); color:#2a4a6a;">${item.desc}</p>
                        </div>`
                    ).join('');
                    content += `<div style="display:grid; grid-template-columns:1fr; gap:0.6vh; margin-top:0.3vh;">${itemsHtml}</div>`;
                } else if (block.type === 'chapter_guide') {
                    content += `<div class="core-takeaway" style="border-left-color:#0a2a4a; background:#eef4fa;">${block.desc}</div>`;
                }
            }

            // 追加练习
            let exerciseHtml = '';
            if (data.exercises && data.exercises.length > 0) {
                exerciseHtml = buildExercises(data.exercises);
            }

            section.innerHTML = meta + `
                <div class="slide-title">${data.title}</div>
                <div class="slide-sub">${data.subtitle}</div>
                ${content}
                ${exerciseHtml}
            `;
            return section;
        }

        // 处理特殊页面
        slides.forEach((data) => {
            let el;
            if (data.type === 'cover') {
                el = renderSlide(data);
            } else if (data.type === 'end') {
                el = renderSlide(data);
            } else if (data.contentBlocks && data.contentBlocks.length > 0 && data.contentBlocks[0].type === 'chapter_guide') {
                const c = data.contentBlocks[0];
                el = document.createElement('section');
                el.className = 'slide slide-chapter';
                el.innerHTML = `
                    <div class="ch-title">${data.title}</div>
                    <div class="ch-sub">${data.subtitle}</div>
                    <div class="ch-desc">${c.desc}</div>
                `;
            } else {
                el = renderSlide(data);
            }
            container.appendChild(el);
        });

        // ===== 翻页控制 =====
        let current = 0;
        const total = slides.length;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;
        }

        document.getElementById('clickLeft').addEventListener('click', () => goTo(current - 1));
        document.getElementById('clickRight').addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            else if (e.key === 'ArrowRight') goTo(current + 1);
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) goTo(current + 1);
                else goTo(current - 1);
            }
        }, { passive: true });

        goTo(0);
    </script>
</body>
</html>
