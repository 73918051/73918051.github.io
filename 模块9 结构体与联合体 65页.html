<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>模块9 · 结构体与联合体</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        .slides-container {
            display: flex;
            width: 100vw; height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw; height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar { width: 10px; }
        .slide::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb:hover { background: #a0b0c0; }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700; color: #0a2a4a;
            margin-bottom: 0.4vh; line-height: 1.2; flex-shrink: 0;
        }
        .slide-title .hl { color: #e88934; }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72; font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh; margin-bottom: 0.8vh; flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff;
            padding: 0.8vh 2.5vw; border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a; font-weight: 500; line-height: 1.5;
            margin-bottom: 1vh; flex-shrink: 0;
        }
        .core-takeaway strong { color: #e88934; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; }
        .content-grid.single { grid-template-columns: 1fr; }
        .content-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .info-block {
            background: #f8fafc; padding: 1vh 1.8vw; border-radius: 16px;
            border: 1px solid #e9edf4; font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600; color: #0a2a4a; margin-bottom: 0.2vh;
        }
        .info-block p, .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44; line-height: 1.5;
        }
        .info-block ul { padding-left: 2vw; margin: 0.2vh 0; }
        .info-block ul li { margin-bottom: 0.1vh; }

        .data-highlight { background: #0a2a4a; color: #fff; padding: 0.2vh 1.5vw; border-radius: 40px; font-size: clamp(28px, 3vh, 40px); font-weight: 600; display: inline-block; }

        .code-block {
            background: #132433; border-radius: 16px;
            padding: 1.2vh 2vw; margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap; word-break: break-word;
        }
        .code-block .comment { color: #7a9bb5; }
        .code-block .keyword { color: #ffb347; }
        .code-block .string { color: #8bcb8b; }
        .code-block .func { color: #7fc1ff; }
        .code-block .num { color: #f5a97f; }
        .code-label {
            display: inline-block; background: #0a2a4a; color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600; padding: 0.1vh 1.5vw; border-radius: 30px;
            margin-bottom: 0.2vh; letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a; border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .table-wrap { overflow-x: auto; margin: 0.4vh 0; }
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: clamp(22px, 2.4vh, 32px);
            background: #f8fafc; border-radius: 14px; overflow: hidden;
        }
        .styled-table thead { background: #0a2a4a; color: #fff; }
        .styled-table th, .styled-table td {
            padding: 0.6vh 1vw;
            text-align: left; border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td { border-bottom: none; }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-cover .main-title { font-size: clamp(64px, 8vh, 96px); font-weight: 800; color: #0a2a4a; letter-spacing: 2px; line-height: 1.2; }
        .slide-cover .sub-title { font-size: clamp(36px, 4.5vh, 56px); font-weight: 300; color: #e88934; margin: 1vh 0 2vh 0; letter-spacing: 4px; }
        .slide-cover .divider-line { background: #0a2a4a; height: 4px; width: 12vw; border-radius: 4px; margin: 1.5vh auto 2.5vh auto; }
        .slide-cover .info-text { font-size: clamp(30px, 3.6vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-cover .date-text { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.5vh; }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-end .end-title { font-size: clamp(68px, 8vh, 96px); font-weight: 300; color: #0a2a4a; letter-spacing: 6px; }
        .slide-end .end-line { background: #e88934; height: 4px; width: 10vw; border-radius: 4px; margin: 2vh auto 3vh auto; }
        .slide-end .end-sub { font-size: clamp(32px, 3.8vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-end .end-desc { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.2vh; }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-chapter .ch-title { font-size: clamp(48px, 6vh, 72px); font-weight: 700; letter-spacing: 2px; }
        .slide-chapter .ch-sub { font-size: clamp(30px, 3.6vh, 48px); color: #b8d0e8; margin-top: 1vh; }
        .slide-chapter .ch-desc { font-size: clamp(28px, 3.2vh, 44px); color: #d0dce8; margin-top: 1.5vh; max-width: 80%; line-height: 1.6; }

        .click-area { position: fixed; top: 0; height: 100vh; z-index: 100; cursor: pointer; }
        #clickLeft { left: 0; width: 33.33vw; }
        #clickRight { right: 12px; width: calc(33.33vw - 12px); }
        #clickCenter { left: 33.33vw; width: calc(33.33vw - 12px); cursor: default; }

        .chart-placeholder {
            background: #f0f6fe; border: 3px dashed #8aa9d0;
            border-radius: 20px; padding: 1.5vh 2vw;
            text-align: center; color: #2a4a6a;
            font-weight: 500; margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon { font-size: clamp(44px, 5vh, 64px); display: block; margin-bottom: 0.3vh; }

        @media (max-width: 768px) {
            .slide { padding: 2vh 4vw; }
            .content-grid { grid-template-columns: 1fr; gap: 0.8vh 0; }
            .content-grid.three { grid-template-columns: 1fr; }
            .slide-title { font-size: clamp(36px, 4.5vh, 48px); }
            .core-takeaway { font-size: clamp(28px, 3.2vh, 38px); }
            .info-block { font-size: clamp(24px, 2.6vh, 34px); }
            .code-block { font-size: clamp(16px, 2vh, 24px); padding: 1vh 2vw; }
            .slide-cover .main-title { font-size: clamp(44px, 5.5vh, 60px); }
            .slide-cover .sub-title { font-size: clamp(28px, 3.4vh, 40px); }
            .slide-chapter .ch-title { font-size: clamp(36px, 4.5vh, 52px); }
            .slide-end .end-title { font-size: clamp(48px, 6vh, 68px); }
            #clickRight { right: 8px; width: calc(33.33vw - 8px); }
            .styled-table { font-size: clamp(18px, 2vh, 26px); }
        }
    </style>
</head>
<body>
    <div id="clickLeft" class="click-area"></div>
    <div id="clickCenter" class="click-area"></div>
    <div id="clickRight" class="click-area"></div>
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 辅助函数
        // ============================================================
        function codeBlock(code, label = '') {
            return `<div style="margin-top:0.2vh;">
                ${label ? `<div class="code-label">${label}</div>` : ''}
                <div class="code-block">${code}</div>
            </div>`;
        }

        function outputBlock(text) {
            return `<div class="output-block">${text}</div>`;
        }

        function textBlock(html) {
            return `<div class="info-block" style="margin-bottom:0.4vh;">${html}</div>`;
        }

        function tableBlock(headers, rows) {
            let html = `<div class="table-wrap"><table class="styled-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function gridBlock(items, cols = 2) {
            let cls = cols === 3 ? 'content-grid three' : (cols === 1 ? 'content-grid single' : 'content-grid');
            let html = items.map(item =>
                `<div class="info-block"><h4>${item.title}</h4><p>${item.content}</p></div>`
            ).join('');
            return `<div class="${cls}">${html}</div>`;
        }

        function chartPlaceholder(icon, desc) {
            return `<div class="chart-placeholder"><span class="icon">${icon}</span>${desc}</div>`;
        }

        // ============================================================
        // 幻灯片数据
        // ============================================================
        const slides = [];

        function addSlide(title, subtitle, takeaway, contentBlocks, chapter = '') {
            slides.push({ title, subtitle, takeaway, contentBlocks, chapter });
        }

        // ============================================================
        // 1. 封面 & 目录
        // ============================================================
        slides.push({
            type: 'cover',
            mainTitle: '模块9 · 结构体与联合体',
            subTitle: 'struct · union · enum · typedef · malloc · 结构体指针',
            date: '授课日期：2026年8月'
        });

        addSlide(
            '📋 课程目录',
            '自定义数据类型 —— struct · union · enum',
            '本课件涵盖结构体、结构体数组、结构体指针、结构体与函数、typedef与malloc、联合体、枚举及8个示例。',
            [{
                type: 'toc',
                items: [
                    { ch: '9.1 结构体', desc: '定义 · 变量 · 赋值 · 内存' },
                    { ch: '9.2 结构体数组', desc: '定义 · 赋值 · 引用 · 示例' },
                    { ch: '9.3 结构体指针', desc: '定义 · 三种等价表示 · 数组指针' },
                    { ch: '9.4 结构体与函数', desc: '值传递 · 地址传递' },
                    { ch: '9.5 typedef与malloc', desc: '类型别名 · 动态内存' },
                    { ch: '9.6 联合体', desc: '定义 · 内存共享 · 示例' },
                    { ch: '9.7 枚举', desc: '定义 · 规则 · 应用' }
                ]
            }]
        );

        // ============================================================
        // 9.1 结构体
        // ============================================================
        addSlide(
            '9.1 结构体（变量）的定义与说明',
            'struct 关键字 · 不同数据类型变量的集合',
            '结构体将多个不同类型的数据组合成一个整体。',
            [
                textBlock('<strong>定义：</strong>结构体使用 <code>struct</code> 关键字，是不同数据类型变量的集合。'),
                textBlock('示例：')
            ],
            '9.1'
        );

        addSlide(
            '结构体的定义',
            'struct 结构体名 { 成员列表 };',
            '末尾分号不能省略。',
            [
                codeBlock(
                    'struct student {                     // 定义结构体student\n' +
                    '    char name[8];                    // 姓名成员，字符数组\n' +
                    '    char sex;                        // 性别成员，字符\n' +
                    '    char nation[10];                 // 民族成员，字符数组\n' +
                    '    int age;                         // 年龄成员，整型\n' +
                    '    float score;                     // 成绩成员，浮点型\n' +
                    '};                                  // 分号不能省略',
                    '编写程序'
                ),
                textBlock('⚠️ 结构体定义时系统<strong>不分配内存</strong>，只描述“模板”。')
            ],
            '9.1'
        );

        addSlide(
            '结构体变量定义的三种方式',
            '方式①：先定义结构后定义变量 · 方式②：同时定义 · 方式③：省略结构体名',
            '方式①最规范，推荐使用。',
            [
                textBlock('<strong>方式①（推荐）：</strong>先定义结构，后定义变量。'),
                codeBlock(
                    'struct student {                     // 定义结构体\n' +
                    '    char name[8];\n' +
                    '    char sex;\n' +
                    '    int age;\n' +
                    '    float score;\n' +
                    '};\n' +
                    'struct student x, y;                 // 定义两个结构体变量x和y',
                    ''
                ),
                textBlock('<strong>方式②：</strong>定义结构体的同时定义变量。'),
                codeBlock(
                    'struct student {                     // 定义结构体并同时定义变量x和y\n' +
                    '    char name[8];\n' +
                    '    char sex;\n' +
                    '    int age;\n' +
                    '    float score;\n' +
                    '} x, y;',
                    ''
                ),
                textBlock('<strong>方式③（不推荐）：</strong>省略结构体名。')
            ],
            '9.1'
        );

        addSlide(
            '结构体的嵌套定义',
            '一个结构体的变量作为另一个结构体的成员',
            '嵌套结构体用 <code>.</code> 逐级访问。',
            [
                codeBlock(
                    'struct date {                        // 定义日期结构体\n' +
                    '    int year;                        // 年\n' +
                    '    int month;                       // 月\n' +
                    '    int day;                         // 日\n' +
                    '};\n' +
                    'struct student {                     // 定义学生结构体\n' +
                    '    char name[20];                   // 姓名\n' +
                    '    char sex;                        // 性别\n' +
                    '    char nation[10];                 // 民族\n' +
                    '    int age;                         // 年龄\n' +
                    '    struct date birthday;            // 嵌套结构体变量birthday\n' +
                    '} x;                                 // 定义变量x',
                    ''
                ),
                textBlock('访问：<code>x.birthday.year</code>')
            ],
            '9.1'
        );

        addSlide(
            '表9-1 结构体变量赋值',
            '按成员顺序用 { } 初始化',
            '结构体变量初始化必须在定义时进行。',
            [
                chartPlaceholder('📊', '【此处插入 表9-1】结构体变量赋值示例'),
                codeBlock(
                    'struct student x = {"Lixiaomei", \'f\', "dongze", 18, 456}; // 按成员顺序初始化',
                    ''
                ),
                textBlock('字符数组用<strong>双引号</strong>，字符用<strong>单引号</strong>。')
            ],
            '9.1'
        );

        addSlide(
            '结构体变量的使用 — 成员引用',
            '变量名.成员名 · . 是最高优先级',
            '成员运算符 <code>.</code> 与 <code>()</code>、<code>[]</code> 同为最高优先级。',
            [
                textBlock('<strong>语法：</strong><code>变量名.成员名</code>'),
                codeBlock(
                    'strcpy(x.name, "Lily");              // 字符数组赋值，不能写成 x.name = "Lily"\n' +
                    'x.sex = \'f\';\n' +
                    'x.age = 18;\n' +
                    'x.score = 428;',
                    ''
                ),
                textBlock('⚠️ 数组名是地址常量，不能直接赋值，需用 <code>strcpy</code>。')
            ],
            '9.1'
        );

        addSlide(
            '📝 例9-1：结构体动态赋值 (思路)',
            '对结构体变量各成员逐一赋值，嵌套成员逐级访问',
            '相同结构体变量可以整体赋值。',
            [
                textBlock('<strong>解题思路：</strong>定义结构体 student（含嵌套 date），分别对成员赋值，然后用整体赋值 <code>y = x</code> 复制。'),
                textBlock('输入：无输入（直接赋值）'),
                textBlock('输出：显示 x 和 y 的成员值')
            ],
            '9.1'
        );

        addSlide(
            '📝 例9-1：结构体动态赋值 (代码 上)',
            '定义结构体与变量初始化',
            '',
            [
                codeBlock(
                    '#include &lt;stdio.h&gt;                 // 包含标准输入输出头文件\n' +
                    '#include &lt;string.h&gt;                // 包含字符串处理头文件\n' +
                    'struct date {                       // 定义日期结构体\n' +
                    '    int year;                       // 年\n' +
                    '    int month;                      // 月\n' +
                    '    int day;                        // 日\n' +
                    '};\n' +
                    'struct student {                    // 定义学生结构体\n' +
                    '    char name[20];                  // 姓名\n' +
                    '    char sex;                       // 性别\n' +
                    '    char nation[10];                // 民族\n' +
                    '    int age;                        // 年龄\n' +
                    '    float score;                    // 成绩\n' +
                    '    struct date birthday;           // 嵌套日期\n' +
                    '} y = {"zhangjie", \'m\', "don", 18, 340}; // 初始化y，birthday未赋值\n' +
                    'int main() {                        // 主函数\n' +
                    '    struct student x, z;            // 定义变量x和z',
                    '编写程序（上）'
                )
            ],
            '9.1'
        );

        addSlide(
            '📝 例9-1：结构体动态赋值 (代码 下)',
            '对x赋值，整体赋值y=x，部分成员赋值',
            '',
            [
                codeBlock(
                    '    strcpy(x.name, "Lily");          // 给x的name赋值（不能用 =）\n' +
                    '    x.sex = \'f\';\n' +
                    '    strcpy(x.nation, "dongzi");\n' +
                    '    x.age = 18;\n' +
                    '    x.score = 428;\n' +
                    '    x.birthday.year = 1999;           // 嵌套成员逐级访问\n' +
                    '    x.birthday.month = 5;\n' +
                    '    x.birthday.day = 23;\n' +
                    '    y = x;                           // 整体赋值，x复制给y\n' +
                    '    z.nation = x.nation;              // 部分成员赋值\n' +
                    '    z.sex = y.sex;\n' +
                    '    printf("%s,%c,%s,%d,%.1f\\n", x.name, x.sex, x.nation, x.age, x.score);\n' +
                    '    printf("%d-%d-%d\\n", x.birthday.year, x.birthday.month, x.birthday.day);\n' +
                    '    return 0;\n' +
                    '}',
                    '编写程序（下）'
                ),
                outputBlock('Lily,f,dongzi,18,428.0\n1999-5-23')
            ],
            '9.1'
        );

        addSlide(
            '结构体变量的内存长度计算',
            '各成员长度之和（含嵌套成员）',
            '结构体各成员“同时存在”，内存累加。',
            [
                textBlock('<strong>规则：</strong>结构体变量内存长度 = 各成员长度之和。'),
                textBlock('示例结构体 student：'),
                textBlock('name[20] 20B + sex 1B + nation[10] 10B + age 2B + score 4B + birthday 6B = <span class="hl">43B</span>'),
                textBlock('嵌套成员 birthday 占用 2+2+2 = 6B。')
            ],
            '9.1'
        );

        // ============================================================
        // 9.2 结构体数组
        // ============================================================
        addSlide(
            '9.2 结构体数组',
            '每个元素都是一个结构体变量',
            '结构体数组用于管理多条同类记录。',
            [
                textBlock('<strong>定义：</strong><code>struct student stu[5];</code>'),
                textBlock('每个元素都是一个结构体变量，可访问其成员。')
            ],
            '9.2'
        );

        addSlide(
            '结构体数组的定义与赋值',
            '每个元素用 { } 括起来，可部分初始化',
            '初始化方式与普通数组类似。',
            [
                codeBlock(
                    'struct student stu1[5] = {            // 定义并初始化结构体数组\n' +
                    '    {"Tangwei", \'m\', "hang", 18, 524}, // 第0个元素\n' +

            let meta = '';
            if (data.chapter) {
                meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">${data.chapter}</span>
                </div>`;
            }

            let content = '';
            if (data.takeaway) {
                content += `<div class="core-takeaway">${data.takeaway}</div>`;
            }

            for (const block of data.contentBlocks) {
                if (typeof block === 'string') {
                    content += block;
                } else if (block.type === 'text') {
                    content += block;
                } else if (block.type === 'code') {
                    content += block;
                } else if (block.type === 'output') {
                    content += block;
                } else if (block.type === 'grid') {
                    content += block;
                } else if (block.type === 'table') {
                    content += block;
                } else if (block.type === 'chart') {
                    content += block;
                } else if (block.type === 'toc') {
                    let itemsHtml = block.items.map(item =>
                        `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                            <h4 style="font-size:clamp(28px,3.2vh,42px);">${item.ch}</h4>
                            <p style="font-size:clamp(24px,2.8vh,36px); color:#2a4a6a;">${item.desc}</p>
                        </div>`
                    ).join('');
                    content += `<div style="display:grid; grid-template-columns:1fr; gap:0.6vh; margin-top:0.3vh;">${itemsHtml}</div>`;
                } else if (block.type === 'chapter_guide') {
                    content += `<div class="core-takeaway" style="border-left-color:#0a2a4a; background:#eef4fa;">${block.desc}</div>`;
                }
            }

            section.innerHTML = meta + `
                <div class="slide-title">${data.title}</div>
                <div class="slide-sub">${data.subtitle}</div>
                ${content}
            `;
            return section;
        }

        // 处理特殊页面
        slides.forEach((data) => {
            let el;
            if (data.type === 'cover') {
                el = renderSlide(data);
            } else if (data.type === 'end') {
                el = renderSlide(data);
            } else if (data.contentBlocks && data.contentBlocks.length > 0 && data.contentBlocks[0].type === 'chapter_guide') {
                const c = data.contentBlocks[0];
                el = document.createElement('section');
                el.className = 'slide slide-chapter';
                el.innerHTML = `
                    <div class="ch-title">${data.title}</div>
                    <div class="ch-sub">${data.subtitle}</div>
                    <div class="ch-desc">${c.desc}</div>
                `;
            } else {
                el = renderSlide(data);
            }
            container.appendChild(el);
        });

        // ===== 翻页控制 =====
        let current = 0;
        const total = slides.length;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;
        }

        document.getElementById('clickLeft').addEventListener('click', () => goTo(current - 1));
        document.getElementById('clickRight').addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            else if (e.key === 'ArrowRight') goTo(current + 1);
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) goTo(current + 1);
                else goTo(current - 1);
            }
        }, { passive: true });

        goTo(0);
    </script>
</body>
</html>
