<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>模块12 · 文件</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        .slides-container {
            display: flex;
            width: 100vw; height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw; height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar { width: 10px; }
        .slide::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb:hover { background: #a0b0c0; }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700; color: #0a2a4a;
            margin-bottom: 0.4vh; line-height: 1.2; flex-shrink: 0;
        }
        .slide-title .hl { color: #e88934; }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72; font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh; margin-bottom: 0.8vh; flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff;
            padding: 0.8vh 2.5vw; border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a; font-weight: 500; line-height: 1.5;
            margin-bottom: 1vh; flex-shrink: 0;
        }
        .core-takeaway strong { color: #e88934; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; }
        .content-grid.single { grid-template-columns: 1fr; }
        .content-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .info-block {
            background: #f8fafc; padding: 1vh 1.8vw; border-radius: 16px;
            border: 1px solid #e9edf4; font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600; color: #0a2a4a; margin-bottom: 0.2vh;
        }
        .info-block p, .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44; line-height: 1.5;
        }
        .info-block ul { padding-left: 2vw; margin: 0.2vh 0; }
        .info-block ul li { margin-bottom: 0.1vh; }

        .data-highlight { background: #0a2a4a; color: #fff; padding: 0.2vh 1.5vw; border-radius: 40px; font-size: clamp(28px, 3vh, 40px); font-weight: 600; display: inline-block; }

        .code-block {
            background: #132433; border-radius: 16px;
            padding: 1.2vh 2vw; margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap; word-break: break-word;
        }
        .code-block .comment { color: #7a9bb5; }
        .code-block .keyword { color: #ffb347; }
        .code-block .string { color: #8bcb8b; }
        .code-block .func { color: #7fc1ff; }
        .code-block .num { color: #f5a97f; }
        .code-label {
            display: inline-block; background: #0a2a4a; color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600; padding: 0.1vh 1.5vw; border-radius: 30px;
            margin-bottom: 0.2vh; letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a; border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .table-wrap { overflow-x: auto; margin: 0.4vh 0; }
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: clamp(22px, 2.4vh, 32px);
            background: #f8fafc; border-radius: 14px; overflow: hidden;
        }
        .styled-table thead { background: #0a2a4a; color: #fff; }
        .styled-table th, .styled-table td {
            padding: 0.6vh 1vw;
            text-align: left; border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td { border-bottom: none; }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-cover .main-title { font-size: clamp(64px, 8vh, 96px); font-weight: 800; color: #0a2a4a; letter-spacing: 2px; line-height: 1.2; }
        .slide-cover .sub-title { font-size: clamp(36px, 4.5vh, 56px); font-weight: 300; color: #e88934; margin: 1vh 0 2vh 0; letter-spacing: 4px; }
        .slide-cover .divider-line { background: #0a2a4a; height: 4px; width: 12vw; border-radius: 4px; margin: 1.5vh auto 2.5vh auto; }
        .slide-cover .info-text { font-size: clamp(30px, 3.6vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-cover .date-text { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.5vh; }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-end .end-title { font-size: clamp(68px, 8vh, 96px); font-weight: 300; color: #0a2a4a; letter-spacing: 6px; }
        .slide-end .end-line { background: #e88934; height: 4px; width: 10vw; border-radius: 4px; margin: 2vh auto 3vh auto; }
        .slide-end .end-sub { font-size: clamp(32px, 3.8vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-end .end-desc { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.2vh; }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-chapter .ch-title { font-size: clamp(48px, 6vh, 72px); font-weight: 700; letter-spacing: 2px; }
        .slide-chapter .ch-sub { font-size: clamp(30px, 3.6vh, 48px); color: #b8d0e8; margin-top: 1vh; }
        .slide-chapter .ch-desc { font-size: clamp(28px, 3.2vh, 44px); color: #d0dce8; margin-top: 1.5vh; max-width: 80%; line-height: 1.6; }

        /* 点击区域：左右翻页，中间穿透 */
        .click-area { position: fixed; top: 0; height: 100vh; z-index: 100; cursor: pointer; }
        #clickLeft { left: 0; width: 33.33vw; }
        #clickRight { right: 0; width: 33.33vw; }
        #clickCenter { left: 33.33vw; width: 33.33vw; pointer-events: none; cursor: default; }

        .chart-placeholder {
            background: #f0f6fe; border: 3px dashed #8aa9d0;
            border-radius: 20px; padding: 1.5vh 2vw;
            text-align: center; color: #2a4a6a;
            font-weight: 500; margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon { font-size: clamp(44px, 5vh, 64px); display: block; margin-bottom: 0.3vh; }

        @media (max-width: 768px) {
            .slide { padding: 2vh 4vw; }
            .content-grid { grid-template-columns: 1fr; gap: 0.8vh 0; }
            .content-grid.three { grid-template-columns: 1fr; }
            .slide-title { font-size: clamp(36px, 4.5vh, 48px); }
            .core-takeaway { font-size: clamp(28px, 3.2vh, 38px); }
            .info-block { font-size: clamp(24px, 2.6vh, 34px); }
            .code-block { font-size: clamp(16px, 2vh, 24px); padding: 1vh 2vw; }
            .slide-cover .main-title { font-size: clamp(44px, 5.5vh, 60px); }
            .slide-cover .sub-title { font-size: clamp(28px, 3.4vh, 40px); }
            .slide-chapter .ch-title { font-size: clamp(36px, 4.5vh, 52px); }
            .slide-end .end-title { font-size: clamp(48px, 6vh, 68px); }
            #clickRight { right: 0; width: 33.33vw; }
            .styled-table { font-size: clamp(18px, 2vh, 26px); }
        }

        /* ----- 课后小练习 样式 (复用info-block风格) ----- */
        .exercise-section {
            margin-top: 1.2vh;
            padding-top: 0.6vh;
            border-top: 3px solid #e88934;
            position: relative;
            z-index: 101;
        }
        .exercise-section .exercise-title {
            font-size: clamp(30px, 3.4vh, 44px);
            font-weight: 700;
            color: #0a2a4a;
            margin-bottom: 0.4vh;
            display: flex;
            align-items: center;
            gap: 0.8vw;
        }
        .exercise-section .exercise-title::before {
            content: "📝";
            font-size: clamp(32px, 3.6vh, 48px);
        }
        .exercise-item {
            background: #f8fafc;
            padding: 0.8vh 1.5vw;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            margin-bottom: 0.8vh;
            font-size: clamp(24px, 2.6vh, 34px);
            position: relative;
            z-index: 102;
        }
        .exercise-item .q {
            font-weight: 600;
            color: #0a2a4a;
            margin-bottom: 0.2vh;
        }
        .exercise-item .opts {
            color: #1f2e44;
            margin: 0.2vh 0 0.2vh 1vw;
            display: block;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.6;
        }
        .exercise-item .opts .opt-line {
            display: block;
            padding-left: 0.5vw;
        }
        .exercise-item .code-block {
            margin: 0.4vh 0;
            font-size: clamp(18px, 2vh, 26px);
            padding: 0.8vh 1.5vw;
        }
        .exercise-item .ans-area {
            color: #e88934;
            font-weight: 600;
            margin: 0.3vh 0 0 0;
            display: none;
            font-size: clamp(22px, 2.4vh, 30px);
        }
        .exercise-item .ans-area.show {
            display: block;
        }
        .exercise-item .btn-answer {
            display: block;
            margin: 0.4vh auto 0.2vh auto;
            padding: 0.2vh 2vw;
            background: #0a2a4a;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: clamp(20px, 2.2vh, 28px);
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            width: fit-content;
            pointer-events: auto;
            position: relative;
            z-index: 103;
        }
        .exercise-item .btn-answer:hover {
            background: #e88934;
        }
        .exercise-item .btn-answer:active {
            transform: scale(0.95);
        }
        .btn-wrapper {
            text-align: center;
            width: 100%;
            position: relative;
            z-index: 103;
            pointer-events: auto;
        }
        .slide .exercise-section {
            position: relative;
            z-index: 101;
        }
        .slide .exercise-item {
            position: relative;
            z-index: 102;
        }
    </style>
</head>
<body>
    <div id="clickLeft" class="click-area"></div>
    <div id="clickCenter" class="click-area"></div>
    <div id="clickRight" class="click-area"></div>
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 辅助函数（与原课件一致）
        // ============================================================
        function codeBlock(code, label = '') {
            return `<div style="margin-top:0.2vh;">
                ${label ? `<div class="code-label">${label}</div>` : ''}
                <div class="code-block">${code}</div>
            </div>`;
        }

        function outputBlock(text) {
            return `<div class="output-block">${text}</div>`;
        }

        function textBlock(html) {
            return `<div class="info-block" style="margin-bottom:0.4vh;">${html}</div>`;
        }

        function tableBlock(headers, rows) {
            let html = `<div class="table-wrap"><table class="styled-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function gridBlock(items, cols = 2) {
            let cls = cols === 3 ? 'content-grid three' : (cols === 1 ? 'content-grid single' : 'content-grid');
            let html = items.map(item =>
                `<div class="info-block"><h4>${item.title}</h4><p>${item.content}</p></div>`
            ).join('');
            return `<div class="${cls}">${html}</div>`;
        }

        function chartPlaceholder(icon, desc) {
            return `<div class="chart-placeholder"><span class="icon">${icon}</span>${desc}</div>`;
        }

        // ============================================================
        // 练习构建函数（支持代码块、选项换行）
        // ============================================================
        function buildExercises(exList) {
            if (!exList || exList.length === 0) return '';
            let html = `<div class="exercise-section"><div class="exercise-title">课后小练习</div>`;
            exList.forEach((ex, idx) => {
                let qHtml = ex.q || '';
                let codeHtml = '';
                if (ex.code) {
                    codeHtml = `<div class="code-block">${ex.code}</div>`;
                }
                let optsHtml = '';
                if (ex.opts) {
                    const lines = ex.opts.split('\n').filter(s => s.trim());
                    if (lines.length > 1) {
                        optsHtml = `<span class="opts">${lines.map(line => `<span class="opt-line">${line.trim()}</span>`).join('')}</span>`;
                    } else {
                        optsHtml = `<span class="opts">${ex.opts}</span>`;
                    }
                }
                const ansText = ex.ans ? `✅ 答案：${ex.ans}` : '';
                html += `<div class="exercise-item" data-exidx="${idx}">
                    <div class="q">${idx+1}. ${qHtml}</div>
                    ${codeHtml}
                    ${optsHtml}
                    <div class="ans-area" id="ans-${idx}">${ansText}</div>
                    <div class="btn-wrapper">
                        <button class="btn-answer" onclick="toggleAnswer(this, ${idx})">显示答案</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        // 全局切换答案
        function toggleAnswer(btn, idx) {
            const item = btn.closest('.exercise-item');
            if (!item) return;
            const ansArea = item.querySelector('.ans-area');
            if (!ansArea) return;
            const isHidden = ansArea.style.display === 'none' || ansArea.style.display === '';
            if (isHidden) {
                ansArea.style.display = 'block';
                ansArea.classList.add('show');
                btn.textContent = '隐藏答案';
            } else {
                ansArea.style.display = 'none';
                ansArea.classList.remove('show');
                btn.textContent = '显示答案';
            }
        }

        // ============================================================
        // 幻灯片数据（完全保留原课件所有内容）
        // ============================================================
        const slides = [];

        function addSlide(title, subtitle, takeaway, contentBlocks, chapter = '') {
            slides.push({ title, subtitle, takeaway, contentBlocks, chapter });
        }

        // ============================================================
        // 1. 封面 & 目录
        // ============================================================
        slides.push({
            type: 'cover',
            mainTitle: '模块12 · 文件',
            subTitle: '文件指针 · 文件操作函数 · argc/argv 命令行参数',
            date: '授课日期：2026年8月'
        });

        addSlide(
            '📋 课程目录',
            '数据的持久化存储 —— C语言文件操作',
            '本课件涵盖文件基本概念、文件指针、文件操作函数、argc/argv命令行参数及全部示例。',
            [{
                type: 'toc',
                items: [
                    { ch: '12.1 文件概念', desc: '普通文件 · 设备文件 · ASCII vs 二进制' },
                    { ch: '12.2 文件指针', desc: 'FILE *fp' },
                    { ch: '12.3 文件操作函数', desc: 'fopen/fclose · fgetc/fputc · fgets/fputs · fprintf/fscanf · fseek/feof/ftell · fread/fwrite · ferror/clearerr' },
                    { ch: '12.4 argc 和 argv', desc: '命令行参数 · 例12-1 · 例12-2' }
                ]
            }]
        );

        // ============================================================
        // 12.1 文件基本概念
        // ============================================================
        addSlide(
            '12.1 文件的基本概念',
            '文件 = 一组相关数据的有序集合，有文件名',
            '文件分为普通文件和设备文件；编码方式分为ASCII码文件和二进制码文件。',
            [
                textBlock('<strong>定义：</strong>一组相关数据的有序集合，有文件名。'),
                textBlock('分类维度：<strong>普通文件 vs 设备文件</strong>，<strong>ASCII码文件 vs 二进制码文件</strong>。')
            ],
            '12.1'
        );

        addSlide(
            '12.1.1 普通文件',
            '文件名.扩展名 · 源文件.c · 目标文件.obj · 可执行文件.exe',
            '普通文件是存储在存储介质上的数据文件。',
            [
                textBlock('普通文件由 <strong>文件名.扩展名</strong> 组成。'),
                textBlock('C语言程序文件：<strong>.c</strong> 源文件、<strong>.obj</strong> 目标文件、<strong>.exe</strong> 可执行文件。')
            ],
            '12.1'
        );

        addSlide(
            '12.1.1 设备文件',
            '显示器 = 标准输出 · 键盘 = 标准输入',
            '操作系统把外部设备当作文件管理。',
            [
                textBlock('<strong>显示器</strong>：标准输出文件，对应 <code>printf()</code>、<code>putchar()</code>、<code>puts()</code>。'),
                textBlock('<strong>键盘</strong>：标准输入文件，对应 <code>scanf()</code>、<code>getchar()</code>、<code>gets()</code>。')
            ],
            '12.1'
        );

        addSlide(
            '12.1.2 ASCII码文件',
            '每个字符1字节 · 可读懂 · 源文件是ASCII文件',
            'ASCII文件按字符存储，适合人类阅读。',
            [
                textBlock('每个字符对应 <strong>1 字节</strong>，存储ASCII码。'),
                textBlock('例：5678 存储为 4 个字符，占 <strong>4 字节</strong>。'),
                textBlock('C程序源文件 <strong>.c</strong> 就是ASCII码文件。')
            ],
            '12.1'
        );

        addSlide(
            '12.1.2 二进制码文件',
            '按二进制编码存放 · 不可读懂 · 流式文件',
            '二进制文件存储效率高，适合程序数据存储。',
            [
                textBlock('按二进制编码存放，内容 <strong>不可读懂</strong>。'),
                textBlock('例：5678（int型）占 <strong>2 字节</strong>。'),
                textBlock('C系统按 <strong>字节</strong> 处理，不区分类型，也称为 <strong>流式文件</strong>。')
            ],
            '12.1'
        );

        // ============================================================
        // 12.2 文件指针
        // ============================================================
        addSlide(
            '12.2 文件指针',
            'FILE *fp;  ·  FILE 只能大写',
            '文件指针指向整个文件，是操作文件的入口。',
            [
                textBlock('<strong>定义：</strong><code>FILE *fp;</code>（FILE 必须大写）。'),
                textBlock('系统为每个文件在内存中开辟区域存放文件信息，保存在 FILE 结构体变量中。'),
                textBlock('文件指针指向 <strong>整个文件</strong>（不是文件内容）。')
            ],
            '12.2'
        );

        // ============================================================
        // 12.3 文件操作函数
        // ============================================================
        addSlide(
            '12.3 文件操作函数概述',
            '所有函数都带字母 f（file）',
            '操作对象是磁盘文件，而非标准输入/输出。',
            [
                textBlock('常见函数：<code>fopen</code>、<code>fclose</code>、<code>fgetc</code>、<code>fputc</code>、<code>rewind</code>、<code>fgets</code>、<code>fputs</code>、<code>fprintf</code>、<code>fscanf</code>、<code>fseek</code>、<code>feof</code>、<code>ftell</code>、<code>fread</code>、<code>fwrite</code>、<code>ferror</code>、<code>clearerr</code>。')
            ],
            '12.3'
        );

        // 12.3.1 fopen/fclose/fgetc/fputc/rewind
        addSlide(
            '12.3.1 fopen / fclose / fgetc / fputc / rewind',
            '打开 · 关闭 · 读字符 · 写字符 · 位置指针复位',
            '这些是文件操作的基本函数。',
            [
                textBlock('<strong>fopen()：</strong><code>fp = fopen("文件名", "使用方式");</code> 打开失败返回 <code>NULL</code>。'),
                textBlock('<strong>fclose()：</strong><code>fclose(fp);</code> 正常关闭返回0，否则非0。'),
                textBlock('<strong>fgetc()：</strong><code>ch = fgetc(fp);</code> 读取一个字符，位置指针后移。'),
                textBlock('<strong>fputc()：</strong><code>fputc(ch, fp);</code> 写入一个字符到文件。'),
                textBlock('<strong>rewind()：</strong><code>rewind(fp);</code> 位置指针返回文件头。'),
                textBlock('⚠️ 文件指针指向整个文件，位置指针指向当前读写位置。')
            ],
            '12.3'

                    '#include &lt;string.h&gt;                // 包含字符串头文件\n' +
                    'int main(int argc, char *argv[]) {   // 带命令行参数的主函数\n' +
                    '    int i, len = 0;                  // 定义变量\n' +
                    '    for(i=0; i&lt;argc; i++)             // 遍历参数\n' +
                    '        printf("Argument %d is:%s \\n", i, argv[i]);\n' +
                    '    for(i=1; i&lt;argc; i++)             // 从第2个开始统计长度\n' +
                    '        len += strlen(argv[i]);\n' +
                    '    printf("len=%d", len);\n' +
                    '    return 0;\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('Argument 0 is:d:\\ex.exe\nArgument 1 is:abc\nArgument 2 is:good\nArgument 3 is:ok\nArgument 4 is:finish\nlen=15')
            ],
            '12.4'
        );

        // 例12-2 文件合并工具
        addSlide(
            '📝 例12-2：文件合并工具 (思路)',
            '将多个文本文件连接到指定文件',
            '演示命令行参数在文件操作中的典型应用。',
            [
                textBlock('<strong>解题思路：</strong>用 <code>fopen()</code> 以追加方式打开目标文件，依次打开每个源文件，用 <code>fgets()</code> 读取每行并用 <code>fputs()</code> 写入目标文件。')
            ],
            '12.4'
        );

        addSlide(
            '📝 例12-2：文件合并工具 (代码 上)',
            '主函数与参数解析',
            '',
            [
                codeBlock(
                    '#include &lt;stdio.h&gt;                 // 包含标准输入输出头文件\n' +
                    '#define B 128                       // 每行最大字符数\n' +
                    'int main(int argc, char **argv) {   // 使用 **argv\n' +
                    '    FILE *fp, *fg;                  // 目标文件指针和源文件指针\n' +
                    '    char s[B];                      // 缓冲区\n' +
                    '    if(argc &lt; 2) {                   // 参数不足\n' +
                    '        printf("Haven\'t cat filename");\n' +
                    '        return 0;\n' +
                    '    }\n' +
                    '    if((fp = fopen(*++argv, "a+")) == NULL) { // 跳过可执行文件名，以追加方式打开目标文件\n' +
                    '        printf("Can\'t open file %s", *argv);\n' +
                    '        return 0;\n' +
                    '    }',
                    '编写程序（上）'
                )
            ],
            '12.4'
        );

        addSlide(
            '📝 例12-2：文件合并工具 (代码 下)',
            '遍历源文件并合并',
            '',
            [
                codeBlock(
                    '    argc = argc - 2;                  // 减去可执行文件名和目标文件名\n' +
                    '    while(argc--) {                   // 遍历剩余源文件\n' +
                    '        if((fg = fopen(*++argv, "r")) == NULL) { // 打开源文件\n' +
                    '            printf("Can\'t open file %s", *argv);\n' +
                    '            return 0;\n' +
                    '        }\n' +
                    '        while(!feof(fg))              // 未到文件尾\n' +
                    '            fputs(fgets(s, B, fg), fp); // 读取一行并写入目标文件\n' +
                    '        fclose(fg);                   // 关闭源文件\n' +
                    '    }\n' +
                    '    fclose(fp);                       // 关闭目标文件\n' +
                    '    return 0;\n' +
                    '}',
                    '编写程序（下）'
                ),
                outputBlock('(将多个文件合并到目标文件)')
            ],
            '12.4'
        );

        // ============================================================
        // 结束页
        // ============================================================
        slides.push({
            type: 'end',
            title: 'Thank You',
            sub: '模块12 · C语言文件操作',
            desc: '文件指针 · 文件操作函数 · argc/argv 命令行参数'
        });

        // ============================================================
        // 注入课后练习（根据标题匹配）
        // ============================================================
        // 习题库（从PDF提取，完美匹配知识点）
        const exLib = {
            // 文件基本概念
            file_concept: [
                {
                    q: '根据数据的组织形式，C中将文件分为 和两种类型。',
                    opts: 'A. 文本文件和二进制文件\nB. 普通文件和设备文件\nC. 只读文件和读写文件\nD. 顺序文件和随机文件',
                    ans: 'A'
                },
                {
                    q: '以下叙述中错误的是（  ）',
                    opts: 'A. C语言中对二进制文件的访问速度比文本文件快\nB. C语言中随机文件以二进制代码形式存储数据\nC. 语句 FILE fp; 定义了一个名为 fp 的文件指针\nD. C语言中的文本文件以ASCII码形式存储数据',
                    ans: 'C'
                }
            ],
            // 文件指针
            file_ptr: [
                {
                    q: '以下可以作为文件打开函数 fopen 中的第一个参数的正确格式是（  ）',
                    opts: 'A. "file1.txt"\nB. file1.txt\nC. file1.txt,w\nD. "file1.txt,w"',
                    ans: 'A'
                }
            ],
            // fopen/fclose 使用方式
            fopen_use: [
                {
                    q: '若要打开 A 盘上 user 子目录下名为 abc.txt 的文本文件进行读、写操作，下面符合此要求的函数调用是（  ）',
                    opts: 'A. fopen("A:\\user\\abc.txt", "r")\nB. fopen("A:\\user\\abc.txt", "r+")\nC. fopen("A:\\user\\abc.txt", "rb")\nD. fopen("A:\\user\\abc.txt", "w")',
                    ans: 'B'
                },
                {
                    q: '当已经存在一个 file1.txt 文件，执行函数 fopen("file1.txt", "r+") 的功能是（  ）',
                    opts: 'A. 打开file1.txt文件，清除原有的内容\nB. 打开file1.txt文件，只能写入新的内容\nC. 打开file1.txt文件，只能读取原有内容\nD. 打开file1.txt文件，可以读取和写入新的内容',
                    ans: 'D'
                }
            ],
            // fgetc/fputc/rewind
            fgetc_fputc: [
                {
                    q: 'getc 函数的作用是从指定文件读入一个字符，该文件的打开方式必须是（  ）',
                    opts: 'A. 只写\nB. 追加\nC. 读或读写\nD. 答案B和C都正确',
                    ans: 'C'
                },
                {
                    q: '下面程序执行后，文件 test 中的内容是（  ）\nvoid fun(char *fname, char *st) { FILE *myf; int i; myf=fopen(fname,"w"); for(i=0;i<strlen(st);i++) fputc(st[i],myf); fclose(myf); }\nmain() { fun("test","new world"); fun("test","hello,"); }',
                    opts: 'A. hello,\nB. new worldhello,\nC. new world\nD. hello,rd',
                    ans: 'A'
                }
            ],
            // fgets/fputs
            fgets_fputs: [
                {
                    q: '以下程序的功能是（  ）\nmain() { FILE *fp; char str[]="Beijing 2008"; fp=fopen("file2","w"); fputs(str,fp); fclose(fp); }',
                    opts: 'A. 在屏幕上显示"Beijing 2008"\nB. 把"Beijing 2008"存入file2文件中\nC. 在打印机上打印出"Beijing 2008"\nD. 以上都不对',
                    ans: 'B'
                }
            ],
            // fprintf/fscanf
            fprintf_fscanf: [
                {
                    q: 'fscanf 函数的正确调用形式是（  ）',
                    opts: 'A. fscanf(fp, 格式字符串, 输出表列)\nB. fscanf(格式字符串, 输出表列, fp)\nC. fscanf(格式字符串, 文件指针, 输出表列)\nD. fscanf(文件指针, 格式字符串, 输入表列)',
                    ans: 'D'
                },
                {
                    q: '有以下程序，程序运行后的输出结果是（  ）\n#include <stdio.h>\nmain() { FILE *fp; int i=20,j=30,k,n; fp=fopen("d1.dat","w"); fprintf(fp,"%d\\n",i); fprintf(fp,"%d\\n",j); fclose(fp); fp=fopen("d1.dat","r"); fscanf(fp,"%d%d",&k,&n); printf("%d%d\\n",k,n); fclose(fp); }',
                    opts: 'A. 20 30\nB. 20 50\nC. 30 50\nD. 30 20',
                    ans: 'A'
                }
            ],
            // fseek/feof/ftell
            fseek_feof: [
                {
                    q: '若 fp 已正确定义并指向某个文件，当未遇到该文件结束标志时函数 feof(fp) 的值为（  ）',
                    opts: 'A. 0\nB. 1\nC. -1\nD. 一个非0值',
                    ans: 'A'
                },
                {
                    q: '函数调用语句：fseek(fp, -10L, 2); 的含义是（  ）',
                    opts: 'A. 将文件位置指针从文件末尾处向文件头的方向移动10个字节\nB. 将文件位置指针从当前位置向文件头的方向移动10个字节\nC. 将文件位置指针从当前位置向文件末尾方向移动10个字节\nD. 将文件位置指针移到距离文件头10个字节处',
                    ans: 'A'
                },
                {
                    q: '函数 rewind 的作用是（  ）',
                    opts: 'A. 使位置指针重新返回文件的开头\nB. 将位置指针指向文件中所要求的特定位置\nC. 使位置指针指向文件的末尾\nD. 返回位置指针的当前位置',
                    ans: 'A'
                }
            ],
            // fread/fwrite
            fread_fwrite: [
                {
                    q: 'fread(buf, 64, 2, fp) 的功能是（  ）',
                    opts: 'A. 从fp所指向的文件中，读出整数64，并存放在buf中\nB. 从fp所指向的文件中，读出整数64和2，并存放在buf中\nC. 从fp所指向的文件中，读出64个字节的字符，读两次，并存放在buf地址中\nD. 从fp所指向的文件中，读出64个字节的字符，并存放在buf中',
                    ans: 'C'
                },
                {
                    q: '已知函数的调用形式：fread(buf, size, count, fp)，参数 buf 的含义是（  ）',
                    opts: 'A. 一个整型变量，代表要读入的数据项总数\nB. 一个文件指针，指向要读的文件\nC. 一个指针，指向要读入数据的存放地址\nD. 一个存储区，存放要读的数据项',
                    ans: 'C'
                }
            ],
            // ferror/clearerr
            ferror: [
                {
                    q: '检查由 fp 指定的文件在读写时是否出错的函数是（  ）',
                    opts: 'A. feof()\nB. ferror()\nC. clearerr(fp)\nD. ferror(fp)',
                    ans: 'D'
                }
            ],
            // 文件分隔符（无直接习题）
            // argc/argv
            argc_argv: [
                // 课件中无直接习题，可跳过
            ]
        };

        // 匹配标题并添加练习
        slides.forEach((slide, index) => {
            if (slide.type === 'cover' || slide.type === 'end' || slide.title === '📋 课程目录') return;
            const title = slide.title || '';
            if (title.includes('12.1 文件的基本概念') || title.includes('12.1.1 普通文件') || title.includes('12.1.1 设备文件') || title.includes('12.1.2 ASCII码文件') || title.includes('12.1.2 二进制码文件')) {
                slide.exercises = exLib.file_concept;
            } else if (title.includes('12.2 文件指针')) {
                slide.exercises = exLib.file_ptr;
            } else if (title.includes('表12-1 文件使用方式')) {
                slide.exercises = exLib.fopen_use;
            } else if (title.includes('12.3.1 fopen / fclose / fgetc / fputc / rewind')) {
                slide.exercises = exLib.fgetc_fputc;
            } else if (title.includes('12.3.2 fgets() / fputs()')) {
                slide.exercises = exLib.fgets_fputs;
            } else if (title.includes('12.3.3 fprintf / fscanf / fseek / feof / ftell')) {
                slide.exercises = exLib.fprintf_fscanf.concat(exLib.fseek_feof);
            } else if (title.includes('表12-2 起始点名称代码')) {
                slide.exercises = exLib.fseek_feof;
            } else if (title.includes('12.3.4 fread / fwrite / ferror / clearerr')) {
                slide.exercises = exLib.fread_fwrite.concat(exLib.ferror);
            } else if (title.includes('12.4 argc 和 argv 命令行参数')) {
                // 无合适习题，跳过
            }
        });

        // ============================================================
        // 渲染引擎（修改以支持练习）
        // ============================================================
        const container = document.getElementById('slidesContainer');

        function renderSlide(data) {
            const section = document.createElement('section');
            section.className = 'slide';

            if (data.type === 'cover') {
                section.classList.add('slide-cover');
                section.innerHTML = `
                    <div class="main-title">${data.mainTitle}</div>
                    <div class="sub-title">${data.subTitle}</div>
                    <div class="divider-line"></div>
                    <div class="info-text">中职计算机专业 · 课堂教学</div>
                    <div class="date-text">${data.date}</div>
                `;
                return section;
            }

            if (data.type === 'end') {
                section.classList.add('slide-end');
                section.innerHTML = `
                    <div class="end-title">${data.title}</div>
                    <div class="end-line"></div>
                    <div class="end-sub">${data.sub}</div>
                    <div class="end-desc">${data.desc}</div>
                `;
                return section;
            }

            let meta = '';
            if (data.chapter) {
                meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">${data.chapter}</span>
                </div>`;
            }

            let content = '';
            if (data.takeaway) {
                content += `<div class="core-takeaway">${data.takeaway}</div>`;
            }

            for (const block of data.contentBlocks) {
                if (typeof block === 'string') {
                    content += block;
                } else if (block.type === 'text') {
                    content += block;
                } else if (block.type === 'code') {
                    content += block;
                } else if (block.type === 'output') {
                    content += block;
                } else if (block.type === 'grid') {
                    content += block;
                } else if (block.type === 'table') {
                    content += block;
                } else if (block.type === 'chart') {
                    content += block;
                } else if (block.type === 'toc') {
                    let itemsHtml = block.items.map(item =>
                        `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                            <h4 style="font-size:clamp(28px,3.2vh,42px);">${item.ch}</h4>
                            <p style="font-size:clamp(24px,2.8vh,36px); color:#2a4a6a;">${item.desc}</p>
                        </div>`
                    ).join('');
                    content += `<div style="display:grid; grid-template-columns:1fr; gap:0.6vh; margin-top:0.3vh;">${itemsHtml}</div>`;
                } else if (block.type === 'chapter_guide') {
                    content += `<div class="core-takeaway" style="border-left-color:#0a2a4a; background:#eef4fa;">${block.desc}</div>`;
                }
            }

            // 追加练习
            let exerciseHtml = '';
            if (data.exercises && data.exercises.length > 0) {
                exerciseHtml = buildExercises(data.exercises);
            }

            section.innerHTML = meta + `
                <div class="slide-title">${data.title}</div>
                <div class="slide-sub">${data.subtitle}</div>
                ${content}
                ${exerciseHtml}
            `;
            return section;
        }

        // 处理特殊页面（chapter 引导页）
        slides.forEach((data) => {
            let el;
            if (data.type === 'cover') {
                el = renderSlide(data);
            } else if (data.type === 'end') {
                el = renderSlide(data);
            } else if (data.contentBlocks && data.contentBlocks.length > 0 && data.contentBlocks[0].type === 'chapter_guide') {
                const c = data.contentBlocks[0];
                el = document.createElement('section');
                el.className = 'slide slide-chapter';
                el.innerHTML = `
                    <div class="ch-title">${data.title}</div>
                    <div class="ch-sub">${data.subtitle}</div>
                    <div class="ch-desc">${c.desc}</div>
                `;
            } else {
                el = renderSlide(data);
            }
            container.appendChild(el);
        });

        // ===== 翻页控制 =====
        let current = 0;
        const total = slides.length;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;
        }

        document.getElementById('clickLeft').addEventListener('click', () => goTo(current - 1));
        document.getElementById('clickRight').addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            else if (e.key === 'ArrowRight') goTo(current + 1);
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) goTo(current + 1);
                else goTo(current - 1);
            }
        }, { passive: true });

        goTo(0);
    </script>
