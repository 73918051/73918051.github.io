<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>C语言文件操作 · 习题精讲</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ===== 完全复用第一份HTML的样式，包括滚动条 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        .slides-container {
            display: flex;
            width: 100vw; height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw; height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar { width: 10px; }
        .slide::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb:hover { background: #a0b0c0; }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700; color: #0a2a4a;
            margin-bottom: 0.4vh; line-height: 1.2; flex-shrink: 0;
        }
        .slide-title .hl { color: #e88934; }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72; font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh; margin-bottom: 0.8vh; flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff; padding: 0.8vh 2.5vw; border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a; font-weight: 500; line-height: 1.5;
            margin-bottom: 1vh; flex-shrink: 0;
        }
        .core-takeaway strong { color: #e88934; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; }
        .content-grid.single { grid-template-columns: 1fr; }
        .content-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .info-block {
            background: #f8fafc; padding: 1vh 1.8vw; border-radius: 16px;
            border: 1px solid #e9edf4; font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600; color: #0a2a4a; margin-bottom: 0.2vh;
        }
        .info-block p, .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44; line-height: 1.5;
        }
        .info-block ul { padding-left: 2vw; margin: 0.2vh 0; }
        .info-block ul li { margin-bottom: 0.1vh; }

        .data-highlight { background: #0a2a4a; color: #fff; padding: 0.2vh 1.5vw; border-radius: 40px; font-size: clamp(28px, 3vh, 40px); font-weight: 600; display: inline-block; }

        .code-block {
            background: #132433; border-radius: 16px;
            padding: 1.2vh 2vw; margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap; word-break: break-word;
        }
        .code-block .comment { color: #7a9bb5; }
        .code-block .keyword { color: #ffb347; }
        .code-block .string { color: #8bcb8b; }
        .code-block .func { color: #7fc1ff; }
        .code-block .num { color: #f5a97f; }
        .code-label {
            display: inline-block; background: #0a2a4a; color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600; padding: 0.1vh 1.5vw; border-radius: 30px;
            margin-bottom: 0.2vh; letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a; border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .table-wrap { overflow-x: auto; margin: 0.4vh 0; }
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: clamp(22px, 2.4vh, 32px);
            background: #f8fafc; border-radius: 14px; overflow: hidden;
        }
        .styled-table thead { background: #0a2a4a; color: #fff; }
        .styled-table th, .styled-table td {
            padding: 0.6vh 1vw;
            text-align: left; border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td { border-bottom: none; }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-cover .main-title { font-size: clamp(64px, 8vh, 96px); font-weight: 800; color: #0a2a4a; letter-spacing: 2px; line-height: 1.2; }
        .slide-cover .sub-title { font-size: clamp(36px, 4.5vh, 56px); font-weight: 300; color: #e88934; margin: 1vh 0 2vh 0; letter-spacing: 4px; }
        .slide-cover .divider-line { background: #0a2a4a; height: 4px; width: 12vw; border-radius: 4px; margin: 1.5vh auto 2.5vh auto; }
        .slide-cover .info-text { font-size: clamp(30px, 3.6vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-cover .date-text { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.5vh; }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-end .end-title { font-size: clamp(68px, 8vh, 96px); font-weight: 300; color: #0a2a4a; letter-spacing: 6px; }
        .slide-end .end-line { background: #e88934; height: 4px; width: 10vw; border-radius: 4px; margin: 2vh auto 3vh auto; }
        .slide-end .end-sub { font-size: clamp(32px, 3.8vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-end .end-desc { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.2vh; }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-chapter .ch-title { font-size: clamp(48px, 6vh, 72px); font-weight: 700; letter-spacing: 2px; }
        .slide-chapter .ch-sub { font-size: clamp(30px, 3.6vh, 48px); color: #b8d0e8; margin-top: 1vh; }
        .slide-chapter .ch-desc { font-size: clamp(28px, 3.2vh, 44px); color: #d0dce8; margin-top: 1.5vh; max-width: 80%; line-height: 1.6; }

        .click-area { display: none; }

        .chart-placeholder {
            background: #f0f6fe; border: 3px dashed #8aa9d0;
            border-radius: 20px; padding: 1.5vh 2vw;
            text-align: center; color: #2a4a6a;
            font-weight: 500; margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon { font-size: clamp(44px, 5vh, 64px); display: block; margin-bottom: 0.3vh; }

        .exercise-card {
            background: #f8fafc; border-radius: 14px; border: 1px solid #e9edf4;
            padding: 0.8vh 1.6vw; margin-bottom: 0.6vh;
            font-size: clamp(26px, 2.8vh, 38px);
            text-align: left;
        }
        .exercise-card .q-text { font-weight: 500; color: #0a2a4a; margin-bottom: 0.2vh; font-size: clamp(26px, 2.8vh, 38px); }
        .exercise-card .q-options { color: #1f2e44; font-size: clamp(24px, 2.6vh, 36px); padding-left: 1vw; line-height: 1.6; }
        .exercise-card .q-options .opt-label { font-weight: 600; color: #0a2a4a; }
        .exercise-card .q-code { margin: 0.2vh 0; }

        .answer-btn-wrapper { text-align: center; margin-top: 0.3vh; }
        .answer-btn {
            display: inline-block; background: #0a2a4a; color: #fff; border: none;
            border-radius: 30px; padding: 0.2vh 2.5vw;
            font-size: clamp(22px, 2.4vh, 32px); font-weight: 600;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
            font-family: inherit; pointer-events: auto;
            position: relative;
            z-index: 200;
        }
        .answer-btn:hover { background: #1a3a5a; }
        .answer-btn:active { transform: scale(0.96); }
        .answer-btn.showing { background: #e88934; }
        .answer-btn.showing:hover { background: #d07820; }

        .answer-panel {
            display: none; background: #f0f6fe; border-radius: 12px;
            padding: 0.6vh 1.6vw; margin-top: 0.4vh;
            border-left: 5px solid #e88934;
            font-size: clamp(24px, 2.6vh, 36px); line-height: 1.6;
            text-align: left;
        }
        .answer-panel.open { display: block; }
        .answer-panel .ans-label { font-weight: 700; color: #e88934; }
        .answer-panel .ans-detail { color: #1f2e44; }
        .answer-panel .ans-detail code { background: #e8edf4; padding: 0.05vh 0.6vw; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: clamp(20px, 2.2vh, 30px); }

        .exercise-list { display: flex; flex-direction: column; gap: 0.4vh; margin-top: 0.2vh; flex: 1 1 auto;  }
        .exercise-list::-webkit-scrollbar { width: 6px; }
        .exercise-list::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .exercise-list::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }

        .exercise-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6vh 1.5vw; }
        .exercise-grid-2 .exercise-card { margin-bottom: 0; }

        @media (max-width: 768px) {
            .slide { padding: 2vh 4vw; }
            .exercise-grid-2 { grid-template-columns: 1fr; gap: 0.4vh 0; }
            .slide-title { font-size: clamp(36px, 4.5vh, 48px); }
            .core-takeaway { font-size: clamp(28px, 3.2vh, 38px); }
            .info-block { font-size: clamp(24px, 2.6vh, 34px); }
            .code-block { font-size: clamp(16px, 2vh, 24px); padding: 1vh 2vw; }
            .slide-cover .main-title { font-size: clamp(44px, 5.5vh, 60px); }
            .slide-cover .sub-title { font-size: clamp(28px, 3.4vh, 40px); }
            .slide-chapter .ch-title { font-size: clamp(36px, 4.5vh, 52px); }
            .slide-end .end-title { font-size: clamp(48px, 6vh, 68px); }
            .styled-table { font-size: clamp(18px, 2vh, 26px); }
            .exercise-card { font-size: clamp(22px, 2.4vh, 32px); padding: 0.6vh 1.2vw; }
            .exercise-card .q-text { font-size: clamp(22px, 2.4vh, 32px); }
            .exercise-card .q-options { font-size: clamp(20px, 2.2vh, 30px); }
            .answer-btn { font-size: clamp(18px, 2vh, 28px); padding: 0.15vh 4vw; }
            .answer-panel { font-size: clamp(20px, 2.2vh, 30px); }
        }
    </style>
</head>
<body>
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 辅助函数
        // ============================================================
        function codeBlock(code, label = '') {
            return `<div style="margin-top:0.2vh;">
                ${label ? `<div class="code-label">${label}</div>` : ''}
                <div class="code-block">${code}</div>
            </div>`;
        }
        function outputBlock(text) {
            return `<div class="output-block">${text}</div>`;
        }
        function textBlock(html) {
            return `<div class="info-block" style="margin-bottom:0.4vh;">${html}</div>`;
        }
        function tableBlock(headers, rows) {
            let html = `<div class="table-wrap"><table class="styled-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }
        function gridBlock(items, cols = 2) {
            let cls = cols === 3 ? 'content-grid three' : (cols === 1 ? 'content-grid single' : 'content-grid');
            let html = items.map(item =>
                `<div class="info-block"><h4>${item.title}</h4><p>${item.content}</p></div>`
            ).join('');
            return `<div class="${cls}">${html}</div>`;
        }
        function chartPlaceholder(icon, desc) {
            return `<div class="chart-placeholder"><span class="icon">${icon}</span>${desc}</div>`;
        }

        // ============================================================
        // 习题卡片渲染（按钮居中，兼容简写属性）
        // ============================================================
        function exerciseCard(q, idx) {
            const question = q.q || q.question || '';
            const options = q.op || q.options || [];
            const answer = q.a || q.answer || '';
            const analysis = q.an || q.analysis || '';
            const code = q.c || q.code || '';
            const output = q.o || q.output || '';

            const qId = 'q_' + idx + '_' + Math.random().toString(36).substr(2, 6);
            let optHtml = '';
            if (options && options.length) {
                optHtml = '<div class="q-options">' + options.map(o => '<div>' + o + '</div>').join('') + '</div>';
            }
            let codeHtml = '';
            if (code) {
                codeHtml = `<div class="q-code">${codeBlock(code, '程序代码')}</div>`;
            }
            let ansHtml = '';
            if (answer) {
                const ansLabel = '正确答案';
                ansHtml = `
                    <div class="answer-panel" id="${qId}_ans">
                        <div><span class="ans-label">${ansLabel}：</span><span class="ans-detail">${answer}</span></div>
                        ${analysis ? `<div class="ans-detail" style="margin-top:0.2vh;">${analysis}</div>` : ''}
                        ${output ? `<div class="ans-detail" style="margin-top:0.2vh;">${outputBlock(output)}</div>` : ''}
                    </div>
                `;
            }
            return `
                <div class="exercise-card" id="${qId}_card">
                    <div class="q-text">${question}</div>
                    ${optHtml}
                    ${codeHtml}
                    <div class="answer-btn-wrapper">
                        <button class="answer-btn" data-target="${qId}_ans" onclick="toggleAnswer('${qId}_ans', this)">📖 显示答案与解析</button>
                    </div>
                    ${ansHtml}
                </div>
            `;
        }

        window.toggleAnswer = function(targetId, btn) {
            const panel = document.getElementById(targetId);
            if (!panel) return;
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                panel.classList.remove('open');
                btn.textContent = '📖 显示答案与解析';
                btn.classList.remove('showing');
            } else {
                panel.classList.add('open');
                btn.textContent = '📖 收起答案';
                btn.classList.add('showing');
            }
        };

        function exerciseSlide(title, subtitle, takeaway, questions, cols = 1) {
            let gridClass = cols === 2 ? 'exercise-grid-2' : 'exercise-list';
            let itemsHtml = questions.map((q, i) => exerciseCard(q, i)).join('');
            let content = `
                <div class="core-takeaway">${takeaway}</div>
                <div class="${gridClass}" style="flex:1 1 auto;  padding-right:0.2vw;">${itemsHtml}</div>
            `;
            return { title, subtitle, contentBlocks: [{ type: 'custom', html: content }], chapter: '' };
        }

        function chapterSlide(title, subtitle, desc) {
            return { type: 'chapter', title, subtitle, desc };
        }
        function coverSlide(mainTitle, subTitle, date) {
            return { type: 'cover', mainTitle, subTitle, date };
        }
        function endSlide(title, sub, desc) {
            return { type: 'end', title, sub, desc };
        }
        function chunk(arr, size) {
            const result = [];
            for (let i = 0; i < arr.length; i += size) {
                result.push(arr.slice(i, i + size));
            }
            return result;
        }

        // ============================================================
        // 全部习题数据（完整覆盖PDF所有题目，约80+题）
        // 使用简写属性名压缩数据：q=题目, op=选项, a=答案, an=解析, c=代码, o=输出
        // ============================================================

        // ---------- 9.1 文件的打开与关闭 填空题 ----------
        const ex91_fill = [
            {q:'文件是指',a:'存储在外部介质上的数据集合',an:'文件是数据存储的载体。'},
            {q:'根据数据的组织形式，C中将文件分为 和 两种类型。',a:'文本文件 和 二进制文件',an:'文本文件以ASCII码存储，二进制文件以二进制形式存储。'},
            {q:'现要求以读写方式，打开一个文本文件stu1，写出语句：',a:'FILE *fp; fp = fopen("stu1", "r+");',an:'"r+" 表示以读写方式打开文本文件。'},
            {q:'现要求将打开的文件关闭掉，写出语句：',a:'fclose(fp);',an:'fclose() 用于关闭文件。'},
            {q:'若要用fopen函数打开一个新的二进制文件，该文件要既能读也能写，则打开文件方式字符串应该是',a:'"wb+"',an:'"wb+" 表示以读写方式创建二进制文件。'}
        ];

        // ---------- 9.1 选择题 ----------
        const ex91_choice = [
            {q:'若要打开A盘上user子目录下名为abc.txt的文本文件进行读、写操作，下面符合此要求的函数调用是（ ）',op:['A. fopen("A:\\user\abc.txt","r")','B. fopen("A:\\user\\abc.txt","r+")','C. fopen("A:\\user\\abc.txt","rb")','D. fopen("A:\\user\\abc.txt","w")'],a:'B',an:'"r+" 以读写方式打开文本文件，路径中需使用双反斜杠。'},
            {q:'若fp已正确定义并指向某个文件，当未遇到该文件结束标志时函数feof(fp)的值为（ ）',op:['A. 0','B. 1','C. -1','D. 一个非0值'],a:'A',an:'feof() 在文件结束时返回非0，否则返回0。'},
            {q:'当已经存在一个file1.txt文件，执行函数fopen("file1.txt","r+")的功能是（ ）',op:['A. 打开file1.txt文件，清除原有的内容','B. 打开file1.txt文件，只能写入新的内容','C. 打开file1.txt文件，只能读取原有内容','D. 打开file1.txt文件，可以读取和写入新的内容'],a:'D',an:'"r+" 可读可写，且文件必须存在。'},
            {q:'以下程序是建立一个名为myfile的文件，并把从键盘输入字符存入该文件，当键盘上输入结束时关闭该文件。选择正确内容填空。',a:'略',an:'使用 fopen("myfile","w") 和 fclose(fp)。'},
            {q:'以下程序的功能是（ ） main(){FILE *fp; char ch; if((fp=fopen("file1","r"))==NULL){printf("cannot open file\\n");exit(0);} while((ch=getc(fp))!=EOF) putchar(ch); fclose(fp);}',op:['A. 复制文件','B. 统计文件字符数','C. 显示文件内容','D. 写入文件内容'],a:'C',an:'程序读取并显示文件内容。'},
            {q:'若要用fopen函数打开一个新的二进制文件，该文件要既能读也能写，则打开方式字符串应是（ ）',op:['A. "ab+"','B. "wb+"','C. "rb+"','D. "ab"'],a:'B',an:'"wb+" 创建新二进制文件用于读写。'},
            {q:'fopen函数的返回值是（ ）',op:['A. 一个整数','B. 一个文件指针','C. 一个字符','D. 一个字符串'],a:'B',an:'fopen返回 FILE* 类型指针。'},
            {q:'下列关于文件操作的叙述中，正确的是（ ）',op:['A. 文件指针指向文件本身','B. 文件指针指向文件缓冲区','C. 文件指针是一个结构体变量','D. 文件指针是一个结构体指针'],a:'D',an:'FILE 是一个结构体类型，文件指针指向它。'},
            {q:'若要用fopen函数打开一个文本文件，要求只能读取，则打开方式字符串是（ ）',op:['A. "r"','B. "w"','C. "a"','D. "r+"'],a:'A',an:'"r" 只读打开文本文件。'},
            {q:'若要用fopen函数打开一个文本文件，要求只能写入，若文件不存在则创建，若存在则清空内容，则打开方式字符串是（ ）',op:['A. "r"','B. "w"','C. "a"','D. "r+"'],a:'B',an:'"w" 只写创建/清空文件。'},
            {q:'若要用fopen函数打开一个文本文件，要求追加写入，则打开方式字符串是（ ）',op:['A. "r"','B. "w"','C. "a"','D. "r+"'],a:'C',an:'"a" 追加写入，文件不存在则创建。'},
            {q:'fclose函数的返回值，若成功关闭文件则返回（ ）',op:['A. 0','B. 1','C. EOF','D. NULL'],a:'A',an:'fclose 成功返回0，失败返回EOF。'},
            {q:'若fp是文件指针，则 fclose(fp) 的功能是（ ）',op:['A. 关闭文件','B. 删除文件','C. 清空文件','D. 刷新文件缓冲区'],a:'A',an:'fclose 关闭文件并释放缓冲区。'},

                return section;
            }

            if (data.type === 'summary') {
                let itemsHtml = data.items.map(item =>
                    `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                        <p style="font-size:clamp(28px,3vh,40px); color:#1f2e44;">${item}</p>
                    </div>`
                ).join('');
                let meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">总结</span>
                </div>`;
                section.innerHTML = meta + `
                    <div class="slide-title">${data.title}</div>
                    <div class="slide-sub">${data.subtitle}</div>
                    <div style="display:grid; grid-template-columns:1fr; gap:0.6vh; margin-top:0.3vh; flex:1 1 auto; align-content:start;">${itemsHtml}</div>
                `;
                return section;
            }

            if (data.type === 'toc') {
                let itemsHtml = data.items.map(item =>
                    `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                        <h4 style="font-size:clamp(28px,3.2vh,42px);">${item.ch}</h4>
                        <p style="font-size:clamp(24px,2.8vh,36px); color:#2a4a6a;">${item.desc}</p>
                    </div>`
                ).join('');
                let meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">目录</span>
                </div>`;
                section.innerHTML = meta + `
                    <div class="slide-title">${data.title}</div>
                    <div class="slide-sub">${data.subtitle}</div>
                    <div class="core-takeaway">${data.takeaway}</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6vh; margin-top:0.3vh; flex:1 1 auto;  align-content:start;">${itemsHtml}</div>
                `;
                return section;
            }

            let meta = '';
            if (data.chapter) {
                meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">${data.chapter}</span>
                </div>`;
            }

            let content = '';
            if (data.contentBlocks && data.contentBlocks.length) {
                for (const block of data.contentBlocks) {
                    if (block.type === 'custom') {
                        content += block.html;
                    }
                }
            }

            section.innerHTML = meta + `
                <div class="slide-title">${data.title}</div>
                <div class="slide-sub">${data.subtitle}</div>
                ${content}
            `;
            return section;
        }

        slideData.forEach((data) => {
            const el = renderSlide(data);
            container.appendChild(el);
        });

        // ============================================================
        // 翻页控制（坐标检测，排除按钮点击）
        // ============================================================
        let current = 0;
        const total = slideData.length;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;
        }

        document.addEventListener('click', function(e) {
            if (e.target.closest('.answer-btn') || e.target.closest('button') || e.target.closest('input')) return;
            const x = e.clientX;
            const w = window.innerWidth;
            if (x < w * 0.3333) goTo(current - 1);
            else if (x > w * 0.6667) goTo(current + 1);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            else if (e.key === 'ArrowRight') goTo(current + 1);
        });

        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diffX = touchStartX - e.changedTouches[0].screenX;
            const diffY = touchStartY - e.changedTouches[0].screenY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
                if (diffX > 0) goTo(current + 1);
                else goTo(current - 1);
            }
        }, { passive: true });

        goTo(0);
    </script>
</body>
</html>
