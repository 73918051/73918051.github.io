<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>YJK风格 · 多层框架结构模型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #1a1c20;
            overflow: hidden;
            font-family: "Microsoft Yahei", sans-serif;
        }
        #info {
            position: absolute;
            top: 12px;
            left: 16px;
            color: #eee;
            z-index: 10;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 16px;
            border-radius: 6px;
            pointer-events: none;
            user-select: none;
            border-left: 3px solid #f9d348;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            z-index: 10;
            font-size: 13px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            user-select: none;
            letter-spacing: 1px;
        }
        #legend {
            position: absolute;
            bottom: 70px;
            right: 20px;
            z-index: 10;
            color: #ddd;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 16px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid #333;
            pointer-events: none;
            user-select: none;
            line-height: 1.8;
        }
        #legend .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: middle;
        }
        #legend .row {
            margin: 2px 0;
        }
        @media (max-width: 640px) {
            #info {
                font-size: 11px;
                padding: 5px 10px;
                top: 8px;
                left: 8px;
            }
            #legend {
                font-size: 10px;
                padding: 8px 10px;
                bottom: 60px;
                right: 10px;
            }
            #stats {
                font-size: 11px;
                padding: 4px 12px;
                bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="info">🏗️ YJK 多层框架 · 鼠标拖拽旋转 ｜ 滚轮缩放</div>
    <div id="stats">3 层 ｜ 4×3 跨 ｜ 柱 · 主梁 · 次梁 · 楼板 · 基础</div>
    <div id="legend">
        <div class="row"><span class="dot" style="background:#f9d348;"></span> 柱</div>
        <div class="row"><span class="dot" style="background:#30b8c8;"></span> 主梁</div>
        <div class="row"><span class="dot" style="background:#ff8c42;"></span> 次梁</div>
        <div class="row"><span class="dot" style="background:rgba(70,130,220,0.4);border:1px solid #4682b4;"></span> 楼板 (半透明)</div>
        <div class="row"><span class="dot" style="background:#8a8a8a;"></span> 独立基础</div>
        <div class="row"><span class="dot" style="background:#ff2222;"></span> 轴网</div>
    </div>

    <!-- 使用 import map 加载 Three.js (ES Module) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ----- 导入 -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ----- 场景 / 相机 / 渲染器 -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1c20);
        // 雾效，让远处柔和
        scene.fog = new THREE.Fog(0x1a1c20, 35, 65);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(22, 16, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ----- 控制器 -----
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(12, 6, 9);
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 5;
        controls.maxDistance = 55;
        controls.update();

        // ----- 光照 -----
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(25, 35, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 80;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x8ab4f8, 0.4);
        fillLight.position.set(-15, 10, -20);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffd58a, 0.3);
        backLight.position.set(-10, 5, 25);
        scene.add(backLight);

        // 地面微弱光晕
        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a3a3a, 0.6);
        scene.add(hemiLight);

        // ----- 结构参数 -----
        const CONFIG = {
            // 层数
            floors: 3,
            // 层高 (m)
            floorHeight: 3.6,
            // X方向跨数, Z方向跨数
            spanX: 4,
            spanZ: 3,
            // 每跨长度 (m)
            spanLen: 6,
            // 柱截面 (宽, 深)
            colW: 0.45,
            colD: 0.45,
            // 主梁截面 (宽, 高)
            beamW: 0.30,
            beamH: 0.65,
            // 次梁截面 (宽, 高)
            subBeamW: 0.20,
            subBeamH: 0.45,
            // 楼板厚度 (m)
            slabThick: 0.12,
            // 基础尺寸 (宽, 高)
            footW: 1.2,
            footH: 0.4,
        };

        const { floors, floorHeight, spanX, spanZ, spanLen, colW, colD, beamW, beamH, subBeamW, subBeamH, slabThick, footW,
            footH } = CONFIG;

        const totalX = spanX * spanLen;
        const totalZ = spanZ * spanLen;
        const totalH = floors * floorHeight;

        // 生成轴网坐标
        const xCoords = Array.from({ length: spanX + 1 }, (_, i) => i * spanLen);
        const zCoords = Array.from({ length: spanZ + 1 }, (_, i) => i * spanLen);

        // 所有柱位 (x, z)
        const colPositions = [];
        for (const x of xCoords) {
            for (const z of zCoords) {
                colPositions.push([x, z]);
            }
        }

        // ----- 材质定义 -----
        const matColumn = new THREE.MeshStandardMaterial({
            color: 0xf9d348,
            roughness: 0.4,
            metalness: 0.1,
            emissive: 0x332200,
            emissiveIntensity: 0.05,
        });
        const matBeam = new THREE.MeshStandardMaterial({
            color: 0x30b8c8,
            roughness: 0.3,
            metalness: 0.15,
            emissive: 0x003344,
            emissiveIntensity: 0.04,
        });
        const matSubBeam = new THREE.MeshStandardMaterial({
            color: 0xff8c42,
            roughness: 0.4,
            metalness: 0.1,
            emissive: 0x442200,
            emissiveIntensity: 0.04,
        });
        const matSlab = new THREE.MeshStandardMaterial({
            color: 0x4682b4,
            roughness: 0.3,
            metalness: 0.05,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const matFooting = new THREE.MeshStandardMaterial({
            color: 0x8a8a8a,
            roughness: 0.7,
            metalness: 0.05,
        });
        const matGrid = new THREE.LineBasicMaterial({ color: 0xff2222, transparent: true, opacity: 0.7 });

        // ----- 辅助函数：生成梁 -----
        function createBeam(x1, z1, x2, z2, y, w, h, material, label = '') {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const len = Math.sqrt(dx * dx + dz * dz);
            if (len < 0.001) return null;
            const geo = new THREE.BoxGeometry(len, h, w);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
            mesh.rotation.y = Math.atan2(dz, dx);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // ----- 1. 生成柱子 -----
        const colGroup = new THREE.Group();
        for (let f = 0; f < floors; f++) {
            const yBase = f * floorHeight;
            const yCenter = yBase + floorHeight / 2;
            for (const [x, z] of colPositions) {
                const geo = new THREE.BoxGeometry(colW, floorHeight, colD);
                const mesh = new THREE.Mesh(geo, matColumn);
                mesh.position.set(x, yCenter, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                colGroup.add(mesh);
            }
        }
        scene.add(colGroup);

        // ----- 2. 生成主梁 (沿柱网轴线) -----
        const beamGroup = new THREE.Group();
        for (let f = 0; f < floors; f++) {
            const y = f * floorHeight + floorHeight; // 梁顶标高 = 楼面标高
            // X方向主梁 (Z固定)
            for (const z of zCoords) {
                const m = createBeam(0, z, totalX, z, y, beamW, beamH, matBeam);
                if (m) beamGroup.add(m);
            }
            // Z方向主梁 (X固定)
            for (const x of xCoords) {
                const m = createBeam(x, 0, x, totalZ, y, beamW, beamH, matBeam);
                if (m) beamGroup.add(m);
            }
        }
        scene.add(beamGroup);

        // ----- 3. 生成次梁 (跨中布置) -----
        const subBeamGroup = new THREE.Group();
        for (let f = 0; f < floors; f++) {
            const y = f * floorHeight + floorHeight;
            // X方向次梁: 在每跨中间Z位置
            for (let i = 0; i < spanZ; i++) {
                const zMid = zCoords[i] + spanLen / 2;
                const m = createBeam(0, zMid, totalX, zMid, y, subBeamW, subBeamH, matSubBeam);
                if (m) subBeamGroup.add(m);
            }
            // Z方向次梁: 在每跨中间X位置
            for (let i = 0; i < spanX; i++) {
                const xMid = xCoords[i] + spanLen / 2;
                const m = createBeam(xMid, 0, xMid, totalZ, y, subBeamW, subBeamH, matSubBeam);
                if (m) subBeamGroup.add(m);
            }
        }
        scene.add(subBeamGroup);

        // ----- 4. 生成楼板 (每层一块大板, 半透明) -----
        const slabGroup = new THREE.Group();
        for (let f = 0; f < floors; f++) {
            const y = f * floorHeight + floorHeight - slabThick / 2;
            const geo = new THREE.BoxGeometry(totalX, slabThick, totalZ);
            const mesh = new THREE.Mesh(geo, matSlab);
            mesh.position.set(totalX / 2, y, totalZ / 2);
            mesh.receiveShadow = true;
            mesh.castShadow = false;
            slabGroup.add(mesh);
        }
        scene.add(slabGroup);

        // ----- 5. 生成独立基础 (柱下) -----
        const footGroup = new THREE.Group();
        for (const [x, z] of colPositions) {
            const geo = new THREE.BoxGeometry(footW, footH, footW);
            const mesh = new THREE.Mesh(geo, matFooting);
            mesh.position.set(x, footH / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            footGroup.add(mesh);
            // 基础短柱 (连接基础与上部柱)
            const stubGeo = new THREE.BoxGeometry(colW * 0.8, 0.3, colD * 0.8);
            const stubMat = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.6 });
            const stub = new THREE.Mesh(stubGeo, stubMat);
            stub.position.set(x, footH + 0.15, z);
            stub.castShadow = true;
            stub.receiveShadow = true;
            footGroup.add(stub);
        }
        scene.add(footGroup);

        // ----- 6. 轴网 (红色) -----
        const gridGroup = new THREE.Group();
        const gridPoints = [];

        // X方向轴线
        for (const z of zCoords) {
            gridPoints.push(0, 0, z, totalX, 0, z);
        }
        // Z方向轴线
        for (const x of xCoords) {
            gridPoints.push(x, 0, 0, x, 0, totalZ);
        }

        const gridGeo = new THREE.BufferGeometry();
        gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPoints, 3));
        const gridLine = new THREE.LineSegments(gridGeo, matGrid);
        gridGroup.add(gridLine);

        // 轴网标注小点 (在轴线交点)
        const dotMat = new THREE.PointsMaterial({
            color: 0xff4444,
            size: 0.15,
            sizeAttenuation: true,
        });
        const dotPositions = [];
        for (const x of xCoords) {
            for (const z of zCoords) {
                dotPositions.push(x, 0.02, z);
            }
        }
        const dotGeo = new THREE.BufferGeometry();
        dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
        const dotPoints = new THREE.Points(dotGeo, dotMat);
        gridGroup.add(dotPoints);
        scene.add(gridGroup);

        // ----- 7. 屋顶构架 (装饰性) -----
        const roofGroup = new THREE.Group();
        const roofMat = new THREE.MeshStandardMaterial({
            color: 0x6a8caf,
            roughness: 0.5,
            metalness: 0.2,
            transparent: true,
            opacity: 0.15,
            side: THREE.DoubleSide,
        });
        // 屋顶构架梁 (沿边缘)
        const roofY = totalH + 0.5;
        const roofBeamMat = new THREE.MeshStandardMaterial({
            color: 0x5a7a9a,
            roughness: 0.4,
            metalness: 0.1,
            emissive: 0x112233,
            emissiveIntensity: 0.05,
        });
        // 四周的构架梁
        const roofBeams = [
            [0, 0, totalX, 0],
            [0, totalZ, totalX, totalZ],
            [0, 0, 0, totalZ],
            [totalX, 0, totalX, totalZ]
        ];
        for (const [x1, z1, x2, z2] of roofBeams) {
            const m = createBeam(x1, z1, x2, z2, roofY, 0.15, 0.25, roofBeamMat);
            if (m) roofGroup.add(m);
        }
        // 对角线构架 (装饰)
        const diagBeams = [
            [0, 0, totalX, totalZ],
            [totalX, 0, 0, totalZ]
        ];
        for (const [x1, z1, x2, z2] of diagBeams) {
            const m = createBeam(x1, z1, x2, z2, roofY, 0.10, 0.18, roofBeamMat);
            if (m) roofGroup.add(m);
        }
        // 屋顶板 (半透明)
        const roofSlabGeo = new THREE.BoxGeometry(totalX * 0.92, 0.06, totalZ * 0.92);
        const roofSlabMat = new THREE.MeshStandardMaterial({
            color: 0x7a9abf,
            roughness: 0.3,
            metalness: 0.1,
            transparent: true,
            opacity: 0.12,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const roofSlab = new THREE.Mesh(roofSlabGeo, roofSlabMat);
        roofSlab.position.set(totalX / 2, roofY + 0.15, totalZ / 2);
        roofGroup.add(roofSlab);
        scene.add(roofGroup);

        // ----- 8. 地面网格 (参考) -----
        const groundGridHelper = new THREE.GridHelper(50, 20, 0x444466, 0x333355);
        groundGridHelper.position.set(totalX / 2, 0.01, totalZ / 2);
        scene.add(groundGridHelper);

        // ----- 9. 坐标轴 (带箭头) -----
        const axesHelper = new THREE.AxesHelper(3.5);
        axesHelper.position.set(-0.5, 0.1, -0.5);
        scene.add(axesHelper);

        // 添加一些标签文字 (用Sprite简单示意)
        function makeLabel(text, pos, color = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'Bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = color;
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 8;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const mat = new THREE.SpriteMaterial({ map: texture, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(pos[0], pos[1], pos[2]);
            sprite.scale.set(2.5, 1.2, 1);
            return sprite;
        }

        scene.add(makeLabel('X', [totalX + 2.5, 0.5, -0.5], '#ff6666'));
        scene.add(makeLabel('Z', [-0.5, 0.5, totalZ + 2.5], '#66aaff'));
        scene.add(makeLabel('Y', [-0.5, totalH + 2.5, -0.5], '#66ff66'));

        // 楼层标高标注
        for (let f = 0; f <= floors; f++) {
            const y = f * floorHeight;
            const label = `+${(f * floorHeight).toFixed(1)}m`;
            const pos = [-0.8, y, -0.8];
            const sprite = makeLabel(label, pos, '#aaccff');
            sprite.scale.set(1.8, 0.9, 1);
            scene.add(sprite);
        }

        // ----- 10. 环境辅助: 地面反射光晕 (圆环) -----
        const ringGeo = new THREE.RingGeometry(0.5, totalX * 0.6, 64);
        const ringMat = new THREE.MeshBasicMaterial({
            color: 0x2a2a3a,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.3,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(totalX / 2, 0.01, totalZ / 2);
        scene.add(ring);

        // ----- 动画循环 -----
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ----- 响应式 -----
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- 控制台提示 -----
        console.log('🏗️ YJK 多层框架模型加载完成');
        console.log(`  层数: ${floors}  |  跨数: ${spanX}×${spanZ}  |  总高: ${totalH}m`);
        console.log(`  柱: ${colPositions.length * floors} 根`);
        console.log('  主梁: ' + ( (spanX+1)*spanZ + (spanZ+1)*spanX ) * floors + ' 条');
        console.log('  次梁: ' + ( spanX*spanZ + spanX*spanZ ) * floors + ' 条');
        console.log('  楼板: ' + floors + ' 块  |  基础: ' + colPositions.length + ' 个');
    </script>
</body>
</html>
