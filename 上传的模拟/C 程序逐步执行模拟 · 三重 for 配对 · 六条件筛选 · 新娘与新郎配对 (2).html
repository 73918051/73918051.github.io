<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 三重 for 配对 · 六条件筛选 · 新娘与新郎配对</title>
<style>
/* ============================================================
   全局变量：1920×1080 下后排 10 米可读
   ============================================================ */
:root{
  --bg:#0d1117;
  --panel-bg:rgba(13,17,23,.80);
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
  --green:#3fb950;
  --amber:#d29922;
  --pink:#ff7b72;
  --purple:#d2a8ff;
  --orange:#ffa657;
  --teal:#39d353;

  --code-font : clamp(80px, 4.6vw, 116px);
  --out-font  : clamp(72px, 4.0vw, 100px);
  --var-font  : clamp(40px, 2.1vw, 54px);
  --exp-font  : clamp(48px, 2.5vw, 64px);
  --btn-font  : clamp(40px, 1.9vw, 52px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;
}

/* ============================================================
   1. 全屏代码区
   ============================================================ */
#codePane{
  position:fixed; inset:0; overflow:auto; background:var(--bg);
  scrollbar-width:thin; scrollbar-color:#3a4451 transparent; z-index:1;
}
#codePane::-webkit-scrollbar{width:14px;height:14px;}
#codePane::-webkit-scrollbar-thumb{background:#3a4451;border-radius:8px;}
#codePane::-webkit-scrollbar-track{background:transparent;}
#codeInner{min-width:max-content;padding-bottom:45vh;}
.cl{
  display:flex; align-items:flex-start;
  white-space:pre;                    /* 每行代码+注释只占一行，不折行 */
  line-height:1.5;
  padding:.06em 90px .06em 0;
  border-left:10px solid transparent;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font); font-weight:500;
  transition:background .25s,border-color .25s,opacity .25s;
}
.cl .ln{
  flex:0 0 auto; position:sticky; left:0; z-index:3; align-self:stretch;
  display:flex; align-items:center; justify-content:flex-end;
  width:3.4ch; padding-right:.35em; margin-right:.55em;
  font-size:.58em; color:#4d5866; background:var(--bg);
  user-select:none; font-variant-numeric:tabular-nums;
  border-right:2px solid #21262d;
}
.cl .cd{flex:1 1 auto;}
.pp{color:var(--purple);font-weight:700;}
.str{color:#7ee787;}
.cmt{color:#6e7681;font-style:italic;}
.fn{color:var(--accent);font-weight:600;}
.kw{color:var(--pink);font-weight:700;}
.num{color:var(--amber);}
.op{color:var(--orange);font-weight:700;}

.cl.active{
  background:linear-gradient(90deg,rgba(88,166,255,.28),rgba(88,166,255,.05) 60%,transparent);
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 3px rgba(88,166,255,.35);
}
.cl.active .cd{color:#ffffff;}
.cl.active .ln{color:var(--accent);font-weight:900;border-right-color:var(--accent);}
.cl.hit{
  background:linear-gradient(90deg,rgba(63,185,80,.24),rgba(63,185,80,.03) 60%,transparent);
  border-left-color:var(--green);
}
.cl.hit .ln{color:var(--green);}
.cl.skip{opacity:.20;}

/* ============================================================
   2. 悬浮面板
   ============================================================ */
.panel{
  position:fixed;
  background:var(--panel-bg);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border:2px solid var(--border); border-radius:16px;
  box-shadow:0 12px 44px rgba(0,0,0,.65);
  display:flex; flex-direction:column; overflow:hidden;
  z-index:100;
  transition:border-color .18s,box-shadow .18s;
}
.panel.top{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(88,166,255,.35), 0 18px 60px rgba(0,0,0,.75);
}
.panel.hidden{display:none;}
.ph{
  flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 12px 10px 18px;
  background:linear-gradient(180deg,rgba(33,38,45,.95),rgba(22,27,34,.95));
  border-bottom:2px solid var(--border);
  cursor:move; touch-action:none; user-select:none;
}
.pt{font-size:clamp(28px,1.5vw,40px);font-weight:800;letter-spacing:.06em;color:#adbac7;white-space:nowrap;}
.sp{flex:1 1 auto;min-width:8px;}
.pb{flex:1 1 auto;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#3a4451 transparent;}
.pb::-webkit-scrollbar{width:12px;height:12px;}
.pb::-webkit-scrollbar-thumb{background:#3a4451;border-radius:8px;}

.btn{
  font:inherit; font-size:var(--btn-font); font-weight:700;
  min-height:72px; padding:0 22px; border-radius:14px;
  border:2px solid #3d4753; background:#1c2430; color:var(--text);
  cursor:pointer; white-space:nowrap;
  transition:background .15s,border-color .15s,transform .08s;
  touch-action:manipulation;
}
.btn:hover:not(:disabled){background:#26313f;border-color:#5a6a7d;}
.btn:active:not(:disabled){transform:translateY(3px);}
.btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.primary{background:linear-gradient(180deg,#1f6feb,#1158c7);border-color:#58a6ff;color:#fff;}
.btn.primary.playing{background:linear-gradient(180deg,#d29922,#9e6a00);border-color:#e3b341;color:#161000;}

.pclose{
  flex:0 0 auto; width:64px;height:64px;min-width:64px;
  font-size:44px;line-height:1; border-radius:12px;
  border:2px solid #5c3a3a; background:#3a1d1d; color:#ff9c9c;
  cursor:pointer; display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.pclose:hover{background:#5c2626;color:#fff;}

.rs{
  position:absolute; right:0; bottom:0; width:70px;height:70px;
  cursor:nwse-resize; touch-action:none; z-index:20;
}
.rs::after{
  content:''; position:absolute; right:10px; bottom:10px;
  width:26px;height:26px;
  border-right:6px solid #7d8590; border-bottom:6px solid #7d8590;
  border-radius:0 0 6px 0; opacity:.85;
}
.rs:hover::after{border-color:var(--accent);}

.spd{
  display:flex;align-items:center;gap:12px;
  font-size:var(--btn-font);color:var(--muted);
  white-space:nowrap;padding:0 10px;
}
.spd input[type=range]{width:clamp(160px,14vw,320px);height:52px;accent-color:var(--accent);cursor:pointer;}
.spd b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3em;display:inline-block;}

/* ============================================================
   3. 变量面板
   ============================================================ */
#varBody{padding:10px 12px;display:flex;flex-direction:column;gap:7px;}
.vr{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:7px 16px; border-radius:10px;
  background:rgba(22,27,34,.9); border:2px solid #21262d;
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.vr.k-ctx{background:#0f2a45;border-color:#1f5f96;}
.vr.k-main{border-left:10px solid #39c5cf;}
.vr.k-money{border-left:10px solid var(--amber);}
.vr.k-sw{border-left:10px solid var(--teal);}
.vr.k-sub{border-left:10px solid var(--accent);}
.vr.k-val{border-left:10px solid var(--pink);}
.vr.k-note{border-left:10px solid #2dd4bf;}
.vr.k-ret{border-left:10px solid #8b949e;}
.vr.changed{background:rgba(88,166,255,.20);border-color:var(--accent);}
.vn{color:var(--muted);white-space:nowrap;font-size:.86em;}
.vv{
  font-family:ui-monospace,Consolas,monospace; font-weight:800;
  font-variant-numeric:tabular-nums; text-align:right;
  color:var(--accent); white-space:nowrap;
}
.vr.k-money .vv{color:var(--amber);}
.vr.k-sw .vv{color:var(--teal);}
.vr.k-val .vv{color:var(--pink);}
.vr.k-ctx .vv{color:#79c0ff;}
.vr.k-note .vv{color:#7ee787;font-size:.82em;font-weight:600;}
.vr.k-ret .vv{color:#e3b341;}
@keyframes vflash{
  0%{transform:scale(1);}
  35%{transform:scale(1.30);color:#fff;text-shadow:0 0 26px var(--accent);}
  100%{transform:scale(1);}
}
.vv.flash{animation:vflash .55s ease-out;}

/* ============================================================
   4. 输出面板
   ============================================================ */
#outBody{
  padding:14px 18px;
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font); line-height:1.45; white-space:pre;
  color:#c9d1d9;
}
.out-line{animation:slideIn .35s ease-out;}
.seg-ans{color:var(--amber);font-weight:900;}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:none;}}
.out-empty{color:#484f58;font-size:var(--var-font);}

/* ============================================================
   5. 说明条
   ============================================================ */
#expBody{padding:18px 24px;font-size:var(--exp-font);line-height:1.62;color:#c9d1d9;}
#expBody .badge{
  display:inline-block;padding:4px 20px;margin-right:16px;border-radius:12px;
  background:rgba(88,166,255,.24);color:var(--accent);
  font-weight:900;font-size:.86em;vertical-align:middle;
}
#expBody .badge.hit{background:rgba(63,185,80,.24);color:var(--green);}
#expBody .badge.batch{background:rgba(210,168,255,.24);color:var(--purple);}
#expBody .badge.ans{background:rgba(210,153,34,.28);color:var(--amber);}
#expBody strong{color:#ffffff;}
#expBody code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(110,118,129,.22);border-radius:8px;padding:0 10px;color:#e6edf3;
}
#expBody .tip{
  display:block;margin-top:14px;padding:12px 18px;border-radius:10px;
  background:rgba(57,211,83,.12);border-left:8px solid var(--teal);
  color:#c3f0d3;font-size:.92em;
}
#expBody .warn{
  display:block;margin-top:14px;padding:12px 18px;border-radius:10px;
  background:rgba(210,153,34,.16);border-left:8px solid var(--amber);
  color:#ffe6b0;font-size:.92em;
}

/* ============================================================
   6. 缩略图
   ============================================================ */
#miniBody{flex:1 1 auto;min-height:0;overflow:hidden;padding:8px;}
#miniStage{position:relative;width:100%;height:100%;}
#miniCode{position:absolute;inset:0;}
.ml{
  white-space:pre; overflow:hidden;
  font-family:ui-monospace,Consolas,monospace; color:#8b949e;
}
.ml .pp{color:#d2a8ff;}
.ml .str{color:#7ee787;}
.ml .cmt{color:#4d5866;font-style:italic;}
.ml .fn{color:#79c0ff;}
.ml .kw{color:#ff7b72;}
.ml .num{color:#e3b341;}
.ml .op{color:#ffa657;}

#miniVp{
  position:absolute; left:-4px; right:-4px; top:0; height:60px;
  background:rgba(88,166,255,.20);
  border:2px solid rgba(88,166,255,.75);
  border-radius:4px; pointer-events:none;
  box-shadow:0 0 14px rgba(88,166,255,.45);
  z-index:3;
}
#miniCur{
  position:absolute; left:0; right:0; top:0; height:10px;
  background:rgba(63,185,80,.55);
  border-left:4px solid #3fb950;
  pointer-events:none; z-index:4; display:none;
}

/* ============================================================
   7. 底部提示
   ============================================================ */
#hint{
  position:fixed; left:50%; transform:translateX(-50%); bottom:14px;
  padding:12px 34px; border-radius:14px;
  background:rgba(13,17,23,.72); border:2px solid var(--border);
  color:#7d8590; font-size:clamp(26px,1.3vw,34px);
  z-index:50; pointer-events:none; white-space:nowrap;
}
</style>
</head>
<body>

<!-- ==================== 全屏代码区 ==================== -->
<div id="codePane"><div id="codeInner"></div></div>

<!-- ==================== 顶部控制栏 ==================== -->
<div class="panel" id="pTop">
  <div class="ph" data-drag>
    <span class="pt">控制台</span>
    <button class="btn" id="btnReset">⟲ 重置</button>
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 自动播放</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <label class="spd">速度
      <input type="range" id="spd" min="300" max="3000" step="100" value="1200">
      <b id="spdLbl">1.20s</b>
    </label>
    <button class="btn" id="btnFull">⛶ 全屏</button>
    <button class="btn" id="btnTog">▣ 面板</button>
    <button class="btn" id="btnMini">▤ 缩略图</button>
    <button class="btn" id="btnLayout">⟳ 重置布局</button>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
</div>

<!-- ==================== 变量 / 状态面板 ==================== -->
<div class="panel" id="pVars">
  <div class="ph" data-drag>
    <span class="pt">变量 · 循环条件 · 六条件 · 状态</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="varBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 程序输出面板 ==================== -->
<div class="panel" id="pOut">
  <div class="ph" data-drag>
    <span class="pt">程序运行结果（屏幕输出）</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="outBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 当前语句说明条 ==================== -->
<div class="panel" id="pExp">
  <div class="ph" data-drag>
    <span class="pt">当前语句说明</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="expBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 缩略图 ==================== -->
<div class="panel" id="pMini">
  <div class="ph" data-drag>
    <span class="pt">缩略图</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="miniBody">
    <div id="miniStage">
      <div id="miniCode"></div>
      <div id="miniVp"></div>
      <div id="miniCur"></div>
    </div>
  </div>
  <div class="rs" data-resize></div>
</div>

<div id="hint">空格=播放/暂停 · ←/→=上一步/下一步 · R=重置 · F=全屏 · M=缩略图 · H=显示/隐藏所有面板</div>

<script>
(function(){
'use strict';

/* ============================================================
   PART 1 · 源代码（16 行，每行代码与注释同一行，绝不折行）
   ============================================================ */
var CODE = [
  {n:1,  ind:0,  code:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>', cmt:'包含标准输入输出头文件'},
  {n:2,  ind:0,  code:'<span class="kw">int</span> <span class="fn">main</span>() {', cmt:'定义主函数'},
  {n:3,  ind:4,  code:'<span class="kw">int</span> x, y, z;', cmt:'三位新娘的配偶编号'},
  {n:4,  ind:4,  code:'<span class="kw">for</span> (x<span class="op">=</span><span class="num">1</span>; x<span class="op">&lt;=</span><span class="num">3</span>; x<span class="op">++</span>) {', cmt:'新娘 x 的配偶'},
  {n:5,  ind:8,  code:'<span class="kw">for</span> (y<span class="op">=</span><span class="num">1</span>; y<span class="op">&lt;=</span><span class="num">3</span>; y<span class="op">++</span>) {', cmt:'新娘 y 的配偶'},
  {n:6,  ind:12, code:'<span class="kw">for</span> (z<span class="op">=</span><span class="num">1</span>; z<span class="op">&lt;=</span><span class="num">3</span>; z<span class="op">++</span>) {', cmt:'新娘 z 的配偶'},
  {n:7,  ind:16, code:'<span class="kw">if</span> (x<span class="op">!=</span><span class="num">1</span> <span class="op">&amp;&amp;</span> x<span class="op">!=</span><span class="num">3</span> <span class="op">&amp;&amp;</span> z<span class="op">!=</span><span class="num">3</span> <span class="op">&amp;&amp;</span> x<span class="op">!=</span>y <span class="op">&amp;&amp;</span> x<span class="op">!=</span>z <span class="op">&amp;&amp;</span> y<span class="op">!=</span>z) {', cmt:'满足所有条件'},
  {n:8,  ind:20, code:'<span class="fn">printf</span>(<span class="str">"x will marry to %d \\n"</span>, x);', cmt:''},
  {n:9,  ind:20, code:'<span class="fn">printf</span>(<span class="str">"y will marry to %d \\n"</span>, y);', cmt:''},
  {n:10, ind:20, code:'<span class="fn">printf</span>(<span class="str">"z will marry to %d \\n"</span>, z);', cmt:''},
  {n:11, ind:16, code:'}', cmt:'结束 if'},
  {n:12, ind:12, code:'}', cmt:'结束最内层 for（z）'},
  {n:13, ind:8,  code:'}', cmt:'结束中层 for（y）'},
  {n:14, ind:4,  code:'}', cmt:'结束外层 for（x）'},
  {n:15, ind:4,  code:'<span class="kw">return</span> <span class="num">0</span>;', cmt:'返回0，程序结束'},
  {n:16, ind:0,  code:'}', cmt:'结束 main'}
];

/* ============================================================
   PART 2 · 逐步执行轨迹（16 行代码真实执行顺序）
   ============================================================ */
var STEPS = [];
var consoleLines = [];        /* 输出快照 */
var SHORT = '未判断（短路）';   /* 短路标记 */

function V(o){
  var base = {
    x:'—', y:'—', z:'—',
    condX:'—', condY:'—', condZ:'—',
    c1:'—', c2:'—', c3:'—', c4:'—', c5:'—', c6:'—',
    expr:'—', exprVal:'—', note:'—',
    pc:'0', ways:'0', ret:'—'
  };
  if (o) for (var p in o) if (Object.prototype.hasOwnProperty.call(o,p)) base[p]=o[p];
  return base;
}
function push(o){
  STEPS.push({
    line: o.line, ctx: o.ctx, vars: V(o.vars),
    out: consoleLines.slice(),
    hit: o.hit || [], skip: o.skip || [],
    title: o.title, desc: o.desc
  });
}

/* ---------- 第 1 行 ---------- */
push({
  line:1, ctx:'预处理阶段',
  vars:{ expr:'#include <stdio.h>', exprVal:'引入标准输入输出头文件',
         note:'预处理指令，编译前已处理，不占运行时间' },
  hit:[], skip:[],
  title:'预处理指令 #include &lt;stdio.h&gt;',
  desc:'预处理器把标准输入输出头文件 <code>stdio.h</code> 的内容引入源文件，让 <code>printf</code> 获得正确的函数声明。<br>这一行不是 C 语句，编译前就被处理完了，不占运行时间，也不产生任何屏幕输出。'
});

/* ---------- 第 2 行 ---------- */
push({
  line:2, ctx:'main · 程序入口',
  vars:{ expr:'int main()', exprVal:'程序开始', note:'main 是程序入口' },
  hit:[], skip:[],
  title:'int main() {  程序从这里开始',
  desc:'操作系统把控制权交给 <code>main</code>，为它建立<b>栈帧</b>；变量 x、y、z 都存放在这个栈帧里。'
});

/* ---------- 第 3 行 ---------- */
push({
  line:3, ctx:'main · 声明变量',
  vars:{
    x:'未初始化（不定值）', y:'未初始化（不定值）', z:'未初始化（不定值）',
    expr:'int x, y, z;', exprVal:'三个变量均未初始化',
    note:'x=新娘x的配偶  y=新娘y的配偶  z=新娘z的配偶'
  },
  hit:[], skip:[],
  title:'int x, y, z;  声明 3 个变量',
  desc:'声明 3 个 <b>int</b> 变量，分别代表三位新娘的配偶编号：<br>· <b>x</b>：新娘 x 的配偶编号；<br>· <b>y</b>：新娘 y 的配偶编号；<br>· <b>z</b>：新娘 z 的配偶编号。<br>编号取值 1~3，代表三位新郎。'
});

/* ============================================================
   x = 1 阶段
   ============================================================ */
push({
  line:4, ctx:'main · 外层 x 循环初始化（x = 1）',
  vars:{
    x:'1', condX:'1 <= 3 → 真',
    expr:'for (x=1; x<=3; x++)', exprVal:'x = 1，条件成立',
    note:'x 从 1 开始枚举'
  },

var codePane  = document.getElementById('codePane');

/* ---------- 渲染代码（全屏 + 缩略图） ---------- */
var codeLines = [];
CODE.forEach(function(l){

  m.style.paddingLeft = (l.ind * 1.4) + 'px';
  m.innerHTML = l.code + cmtHtml;
  miniCode.appendChild(m);
});

/* ---------- 变量表结构 ---------- */
var VAR_ROWS = [
  {key:'ctx',   name:'当前执行位置',            kind:'k-ctx'},
  {key:'x',     name:'x (int) 新娘x的配偶编号',  kind:'k-main'},

  {key:'condX', name:'外层条件 x <= 3',         kind:'k-sw'},

  {key:'c2',    name:'条件② x != 3',           kind:'k-sw'},
  {key:'c3',    name:'条件③ z != 3',           kind:'k-sw'},
  {key:'c4',    name:'条件④ x != y',           kind:'k-sw'},
  {key:'c5',    name:'条件⑤ x != z',           kind:'k-sw'},

(function buildVarTable(){
  var html = '';
  VAR_ROWS.forEach(function(r){
    html += '<div class="vr ' + r.kind + '" data-key="' + r.key + '">' +
              '<span class="vn">' + r.name + '</span>' +
              '<span class="vv">—</span>' +
            '</div>';
  });
  varBody.innerHTML = html;
})();

var varEls = {};
VAR_ROWS.forEach(function(r){
  var row = varBody.querySelector('.vr[data-key="' + r.key + '"]');
  varEls[r.key] = { row: row, val: row.querySelector('.vv') };
});

/* ============================================================
   PART 4 · 逐步执行状态机
   ============================================================ */
var current = -1;
var playing = false;
var timer = null;
var speed = Number(spdInput.value);
var lastOutKey = '';

function renderVars(step){
  VAR_ROWS.forEach(function(r){
    var el = varEls[r.key];
    var v;
    if (!step) {
      v = '—';
    } else if (r.key === 'ctx') {
      v = step.ctx;
    } else {
      v = step.vars[r.key];
    }
    v = String(v == null ? '—' : v);
    if (el.val.textContent !== v) {
      el.val.textContent = v;
      el.val.classList.toggle('dim', v === '—');
      el.val.classList.remove('flash');
      void el.val.offsetWidth;
      el.val.classList.add('flash');
      el.row.classList.add('changed');
      (function(row){
        window.setTimeout(function(){ row.classList.remove('changed'); }, 700);
      })(el.row);
    }
  });
}

function renderCode(step){
  var activeLine = step ? step.line : null;
  var hit  = step ? step.hit  : [];
  var skip = step ? step.skip : [];

  codeLines.forEach(function(el){
    var n = Number(el.getAttribute('data-line'));
    el.classList.toggle('active', activeLine !== null && n === activeLine);
    el.classList.toggle('hit',    hit.indexOf(n)  !== -1 && n !== activeLine);
    el.classList.toggle('skip',   skip.indexOf(n) !== -1);
  });
}

function renderOutput(step){
  var lines = step ? step.out : [];
  var key = lines.length + '|' + (lines.length ? lines[lines.length - 1] : '');
  if (key === lastOutKey) return;
  lastOutKey = key;

  outBody.innerHTML = '';
  if (!lines.length) {
    outBody.innerHTML = '<div class="out-empty">（等待程序输出…）</div>';
    return;
  }
  var frag = document.createDocumentFragment();
  lines.forEach(function(t){
    var div = document.createElement('div');
    div.className = 'out-line';
    var span = document.createElement('span');
    span.className = 'seg-ans';
    span.textContent = t;
    div.appendChild(span);
    frag.appendChild(div);
  });
  outBody.appendChild(frag);
  outBody.scrollTop = outBody.scrollHeight;
}

function renderExplain(step){
  if (!step) {
    expBody.innerHTML =
      '<span class="badge">待开始</span><strong>点击「自动播放」或「下一步」，开始逐条执行程序。</strong>' +
      '本程序用<b>三重 for 循环</b>枚举三位新娘（x、y、z）嫁给三位新郎（1、2、3）的全部 <b>27</b> 种配对，' +
      '再用一个含 <b>6 个条件的 if 语句</b>（含 <code>&amp;&amp;</code> 短路求值）筛选，最后 printf 输出合法方案。<br>' +
      '共 27 次检查，最终命中 <b>1</b> 组可行配对：<b>x→2，y→3，z→1</b>。';
    return;
  }
  var cls = (step.line >= 8 && step.line <= 10) || step.title.indexOf('★') !== -1
              ? ' ans'
              : (/批量/.test(step.title) ? ' batch' : (step.hit.length ? ' hit' : ''));
  expBody.innerHTML =
    '<span class="badge' + cls + '">第 ' + step.line + ' 行</span>' +
    '<strong>' + step.title + '</strong><br>' + step.desc;
}

/* ---------- 缩略图同步：荧光框严格等于全屏可见行 ---------- */
var miniLh = 10;
var rafPending = false;

function fullLineHeight(){
  if (!codeLines.length) return 1;
  var h = codeLines[0].getBoundingClientRect().height;
  return h > 0 ? h : 1;
}

function layoutMini(){
  var h = miniBody.clientHeight - 16;   /* 去掉 padding */
  if (h <= 0) h = 160;
  miniLh = h / CODE.length;

  var rows = miniCode.querySelectorAll('.ml');
  for (var k = 0; k < rows.length; k++) {
    rows[k].style.height     = miniLh + 'px';
    rows[k].style.lineHeight = miniLh + 'px';
    rows[k].style.fontSize   = Math.max(4, miniLh * 0.66) + 'px';
  }
  miniStage.style.height = h + 'px';
}

function syncMini(){
  var lh = fullLineHeight();
  var st = codePane.scrollTop;
  var ch = codePane.clientHeight;

  /* 缩略图荧光框高度 = 全屏可见行数 × 缩略图单行高度 */
  var visibleLines = ch / lh;
  miniVp.style.top    = (st / lh) * miniLh + 'px';
  miniVp.style.height = Math.max(8, visibleLines * miniLh) + 'px';

  var step = current >= 0 ? STEPS[current] : null;
  if (step) {
    miniCur.style.display = 'block';
    miniCur.style.top    = ((step.line - 1) * miniLh) + 'px';
    miniCur.style.height = miniLh + 'px';
  } else {
    miniCur.style.display = 'none';
  }
}

function requestMiniSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){
    rafPending = false;
    syncMini();
  });
}

/* ---------- 主渲染 ---------- */
function render(){
  var step = current >= 0 ? STEPS[current] : null;

  renderCode(step);
  renderVars(step);
  renderOutput(step);
  renderExplain(step);

  if (step) {
    var el = codeLines[step.line - 1];
    if (el) {
      var lh = fullLineHeight();
      var targetTop = (step.line - 1) * lh - (codePane.clientHeight - lh) / 2;
      targetTop = Math.max(0, Math.min(targetTop, codePane.scrollHeight - codePane.clientHeight));
      codePane.scrollTo({ top: targetTop, behavior: 'smooth' });
    }
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  requestMiniSync();
}

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  btnPlay.classList.toggle('playing', playing);
}

function tick(){
  if (current >= STEPS.length - 1) { pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}

function play(){
  if (playing) return;
  if (current >= STEPS.length - 1) { current = -1; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}

function nextStep(){ pause(); if (current < STEPS.length - 1) { current += 1; render(); } }
function prevStep(){ pause(); if (current > -1) { current -= 1; render(); } }

function resetAll(){
  pause();
  current = -1;
  lastOutKey = '';
  outBody.innerHTML = '';
  codePane.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* ============================================================
   PART 5 · 面板交互：拖动 / 关闭 / 任意调整大小 / 点击置顶
   ============================================================ */
var zTop = 100;

function bringToFront(panel){
  zTop += 1;
  panel.style.zIndex = zTop;
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('top', p === panel);
  });
}

var DEFAULT_LAYOUT = [
  {id:'pTop',    left:null, top:10,   w:null, h:null},
  {id:'pVars',   left:16,   top:120,  w:700,  h:900},
  {id:'pOut',    left:null, top:null, w:820,  h:420, right:16, bottom:16},
  {id:'pExp',    left:16,   top:null, w:960,  h:320, bottom:16},
  {id:'pMini',   left:null, top:120,  w:260,  h:340, right:16}
];

function layoutPanels(){
  var W = window.innerWidth;
  var H = window.innerHeight;

  DEFAULT_LAYOUT.forEach(function(cfg){
    var el = document.getElementById(cfg.id);
    if (!el) return;

    if (cfg.w) el.style.width  = cfg.w + 'px';
    if (cfg.h) el.style.height = cfg.h + 'px';

    var rw = el.offsetWidth;
    var rh = el.offsetHeight;

    if (cfg.left !== null && cfg.left !== undefined) {
      el.style.left = cfg.left + 'px';
    } else if (cfg.right !== null && cfg.right !== undefined) {
      el.style.left = Math.max(8, W - rw - cfg.right) + 'px';
    }
    if (cfg.top !== null && cfg.top !== undefined) {
      el.style.top = cfg.top + 'px';
    } else if (cfg.bottom !== null && cfg.bottom !== undefined) {
      el.style.top = Math.max(8, H - rh - cfg.bottom) + 'px';
    }
  });

  var top = document.getElementById('pTop');
  if (top) {
    top.style.left = Math.max(8, (W - top.offsetWidth) / 2) + 'px';
    top.style.top = '10px';
  }

  window.requestAnimationFrame(function(){
    layoutMini();
    syncMini();
  });
}

function centerTopBar(){
  var top = document.getElementById('pTop');
  if (!top) return;
  if (top.dataset.moved === '1') return;
  top.style.left = Math.max(8, (window.innerWidth - top.offsetWidth) / 2) + 'px';
}

function setupPanel(panel){
  var head   = panel.querySelector('.ph');
  var handle = panel.querySelector('.rs');
  var state  = null;

  panel.addEventListener('pointerdown', function(){ bringToFront(panel); }, true);
  panel.addEventListener('focusin',     function(){ bringToFront(panel); }, true);

  if (head) {
    head.addEventListener('pointerdown', function(e){
      if (e.target.closest('button')) return;
      if (e.target.closest('input'))  return;
      bringToFront(panel);
      var r = panel.getBoundingClientRect();
      state = { mode:'drag', sx:e.clientX, sy:e.clientY, sl:r.left, st:r.top };
      panel.dataset.moved = '1';
      try { head.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
    });
    head.addEventListener('pointermove', function(e){
      if (!state || state.mode !== 'drag') return;
      panel.style.left = (state.sl + e.clientX - state.sx) + 'px';
      panel.style.top  = (state.st + e.clientY - state.sy) + 'px';
    });
    head.addEventListener('pointerup', function(e){
      if (state && state.mode === 'drag') {
        state = null;
        try { head.releasePointerCapture(e.pointerId); } catch(err){}
      }
    });
    head.addEventListener('pointercancel', function(){ state = null; });
  }

  if (handle) {
    handle.addEventListener('pointerdown', function(e){
      bringToFront(panel);
      var r = panel.getBoundingClientRect();
      state = { mode:'resize', sx:e.clientX, sy:e.clientY, sw:r.width, sh:r.height };
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function(e){
      if (!state || state.mode !== 'resize') return;
      var w = state.sw + (e.clientX - state.sx);
      var h = state.sh + (e.clientY - state.sy);
      /* 不设最小/最大限制，完全由用户控制 */
      panel.style.width  = w + 'px';
      panel.style.height = h + 'px';
      if (panel.id === 'pMini') {
        window.requestAnimationFrame(function(){ layoutMini(); syncMini(); });
      }
    });
    handle.addEventListener('pointerup', function(e){
      if (state && state.mode === 'resize') {
        state = null;
        try { handle.releasePointerCapture(e.pointerId); } catch(err){}
        requestMiniSync();
      }
    });
    handle.addEventListener('pointercancel', function(){ state = null; });
  }

  var closeBtn = panel.querySelector('[data-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e){
      e.stopPropagation();
      panel.classList.add('hidden');
    });
  }
}

document.querySelectorAll('.panel').forEach(setupPanel);

/* ============================================================
   PART 6 · 缩略图点击跳转
   ============================================================ */
miniStage.addEventListener('pointerdown', function(e){
  var r = miniStage.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLh);
  idx = Math.max(0, Math.min(CODE.length - 1, idx));

  var lh = fullLineHeight();
  var target = idx * lh - (codePane.clientHeight - lh) / 2;
  target = Math.max(0, Math.min(target, codePane.scrollHeight - codePane.clientHeight));
  codePane.scrollTo({ top: target, behavior: 'smooth' });

  bringToFront(document.getElementById('pMini'));
});

/* ============================================================
   PART 7 · 事件绑定
   ============================================================ */
btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

btnFull.addEventListener('click', function(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
});

btnTog.addEventListener('click', function(){
  var panels = document.querySelectorAll('.panel');
  var anyVisible = false;
  panels.forEach(function(p){ if (!p.classList.contains('hidden')) anyVisible = true; });
  panels.forEach(function(p){
    if (anyVisible) p.classList.add('hidden');
    else p.classList.remove('hidden');
  });
  if (!anyVisible) document.getElementById('pMini').classList.remove('hidden');
  window.requestAnimationFrame(function(){ layoutPanels(); syncMini(); });
});

btnMini.addEventListener('click', function(){
  var m = document.getElementById('pMini');
  m.classList.toggle('hidden');
  if (!m.classList.contains('hidden')) bringToFront(m);
  window.requestAnimationFrame(function(){ layoutMini(); syncMini(); });
});

btnLayout.addEventListener('click', function(){
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.remove('hidden');
    p.dataset.moved = '0';
    p.style.width = '';
    p.style.height = '';
  });
  window.requestAnimationFrame(function(){
    layoutPanels();
    window.requestAnimationFrame(function(){
      centerTopBar();
      syncMini();
    });
  });
});

spdInput.addEventListener('input', function(){
  speed = Number(spdInput.value);
  spdLbl.textContent = (speed / 1000).toFixed(2) + 's';
  if (playing) {
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

/* 全局快捷键：不依赖面板是否可见 */
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.code !== 'Space') return;
  }
  if (e.code === 'Space')            { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowRight')  { e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft')   { e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR')        { resetAll(); }
  else if (e.code === 'KeyF')        { btnFull.click(); }
  else if (e.code === 'KeyM')        { btnMini.click(); }
  else if (e.code === 'KeyH')        {
    var panels = document.querySelectorAll('.panel');
    var anyVisible = false;
    panels.forEach(function(p){ if (!p.classList.contains('hidden')) anyVisible = true; });
    panels.forEach(function(p){ p.classList.toggle('hidden', anyVisible); });
    if (!anyVisible) document.getElementById('pMini').classList.remove('hidden');
    window.requestAnimationFrame(function(){ layoutPanels(); syncMini(); });
  }
});

/* 滚动 / 尺寸同步 */
codePane.addEventListener('scroll', requestMiniSync, { passive: true });
window.addEventListener('resize', function(){
  requestMiniSync();
  centerTopBar();
}, { passive: true });

/* 字体加载完成后重新测量 */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){
    window.requestAnimationFrame(function(){ layoutMini(); syncMini(); });
  });
}

/* 面板尺寸变化 → 重新同步缩略图 */
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function(){
    layoutMini();
    requestMiniSync();
  });
  ro.observe(codePane);
  ro.observe(miniBody);
}

/* ============================================================
   PART 8 · 启动
   ============================================================ */
spdLbl.textContent = (speed / 1000).toFixed(2) + 's';

window.requestAnimationFrame(function(){
  layoutPanels();
  window.requestAnimationFrame(function(){
    centerTopBar();
    layoutMini();
    syncMini();
    render();
  });
});

})();
</script>
</body>
</html>
