<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 四重 for 换零钱 · 100元换1/2/5/10元 · count计数</title>
<style>
/* ============================================================
   全局变量：希沃大屏字号硬指标（1920×1080 下后排 10 米可读）
   ============================================================ */
:root{
  --bg:#0d1117;
  --panel-bg:rgba(13,17,23,.80);
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#58a6ff;
  --green:#3fb950;
  --amber:#d29922;
  --pink:#ff7b72;
  --purple:#d2a8ff;
  --orange:#ffa657;
  --teal:#39d353;

  --code-font: clamp(80px, 5vw, 120px);
  --out-font : clamp(72px, 4.2vw, 104px);
  --var-font : clamp(40px, 2.2vw, 56px);
  --exp-font : clamp(48px, 2.6vw, 66px);
  --btn-font : clamp(40px, 2vw, 54px);
  --title-font: clamp(56px, 2.8vw, 76px);

  --mini-lh: 10px;          /* 缩略图单行高度（与 JS 共用同一常量） */
  --mini-total: 220px;      /* 22 行 × 10px */
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;
}

/* ============================================================
   1. 全屏代码区（不透明、始终是视觉主体）
   ============================================================ */
#codePane{
  position:fixed; inset:0;
  overflow:auto;
  background:var(--bg);
  scrollbar-width:thin;
  scrollbar-color:#3a4451 transparent;
  z-index:1;
}
#codePane::-webkit-scrollbar{width:14px;height:14px;}
#codePane::-webkit-scrollbar-thumb{background:#3a4451;border-radius:8px;}
#codePane::-webkit-scrollbar-track{background:transparent;}

#codeInner{
  min-width:max-content;
  padding-bottom:45vh;          /* 让最后几行也能滚到视野中央 */
}

.cl{
  display:flex;
  align-items:flex-start;
  white-space:pre;              /* 关键：不折行，每行代码+注释只占一行 */
  line-height:1.5;
  padding:.06em 90px .06em 0;
  border-left:10px solid transparent;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font);
  font-weight:500;
  transition:background .25s,border-color .25s,opacity .25s;
}

/* 行号：横向滚动时固定在左侧 */
.cl .ln{
  flex:0 0 auto;
  position:sticky; left:0; z-index:3;
  align-self:stretch;
  display:flex; align-items:center; justify-content:flex-end;
  width:3.4ch;
  padding-right:.35em;
  margin-right:.55em;
  font-size:.58em;
  color:#4d5866;
  background:var(--bg);
  user-select:none;
  font-variant-numeric:tabular-nums;
  border-right:2px solid #21262d;
}

.cl .cd{ flex:1 1 auto; }

/* 语法高亮 */
.pp{color:var(--purple);font-weight:700;}
.str{color:var(--green);}
.cmt{color:#6e7681;font-style:italic;}
.fn{color:var(--accent);font-weight:600;}
.kw{color:var(--pink);font-weight:700;}
.num{color:var(--amber);}
.op{color:var(--orange);font-weight:700;}

/* 当前执行行 */
.cl.active{
  background:linear-gradient(90deg,rgba(88,166,255,.28),rgba(88,166,255,.05) 60%,transparent);
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 3px rgba(88,166,255,.35);
}
.cl.active .cd{color:#ffffff;}
.cl.active .ln{color:var(--accent);font-weight:900;border-right-color:var(--accent);}

/* 循环体命中（绿底） */
.cl.hit{
  background:linear-gradient(90deg,rgba(63,185,80,.24),rgba(63,185,80,.03) 60%,transparent);
  border-left-color:var(--green);
}
.cl.hit .ln{color:var(--green);}

/* 被跳过（灰） */
.cl.skip{opacity:.20;}

/* ============================================================
   2. 通用悬浮面板：可拖动 / 可关闭 / 可任意调整大小 / 点击置顶
   ============================================================ */
.panel{
  position:fixed;
  background:var(--panel-bg);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);
  backdrop-filter:blur(16px) saturate(1.3);
  border:2px solid var(--border);
  border-radius:16px;
  box-shadow:0 12px 44px rgba(0,0,0,.65);
  display:flex; flex-direction:column;
  overflow:hidden;
  z-index:100;
  transition:border-color .18s, box-shadow .18s, opacity .18s;
}
.panel.top{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(88,166,255,.35), 0 18px 60px rgba(0,0,0,.75);
}
.panel.hidden{display:none;}

/* 标题栏（拖拽把手） */
.ph{
  flex:0 0 auto;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 12px 10px 18px;
  background:linear-gradient(180deg,rgba(33,38,45,.95),rgba(22,27,34,.95));
  border-bottom:2px solid var(--border);
  cursor:move;
  touch-action:none;
  user-select:none;
}
.pt{
  font-size:clamp(28px,1.5vw,40px);
  font-weight:800;
  letter-spacing:.06em;
  color:#adbac7;
  white-space:nowrap;
}
.sp{flex:1 1 auto;min-width:8px;}

/* 内容区 */
.pb{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  scrollbar-width:thin;
  scrollbar-color:#3a4451 transparent;
}
.pb::-webkit-scrollbar{width:12px;height:12px;}
.pb::-webkit-scrollbar-thumb{background:#3a4451;border-radius:8px;}

/* 按钮 */
.btn{
  font:inherit;
  font-size:var(--btn-font);
  font-weight:700;
  min-height:72px;
  padding:0 22px;
  border-radius:14px;
  border:2px solid #3d4753;
  background:#1c2430;
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s,border-color .15s,transform .08s;
  touch-action:manipulation;
}
.btn:hover:not(:disabled){background:#26313f;border-color:#5a6a7d;}
.btn:active:not(:disabled){transform:translateY(3px);}
.btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.primary{
  background:linear-gradient(180deg,#1f6feb,#1158c7);
  border-color:#58a6ff;color:#fff;
}
.btn.primary.playing{
  background:linear-gradient(180deg,#d29922,#9e6a00);
  border-color:#e3b341;color:#161000;
}

/* 关闭按钮 */
.pclose{
  flex:0 0 auto;
  width:64px;height:64px;
  min-width:64px;
  font-size:44px;line-height:1;
  border-radius:12px;
  border:2px solid #5c3a3a;
  background:#3a1d1d;
  color:#ff9c9c;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.pclose:hover{background:#5c2626;color:#fff;}

/* 右下角缩放手柄：可任意调整大小，无最小/最大限制 */
.rs{
  position:absolute; right:0; bottom:0;
  width:70px;height:70px;
  cursor:nwse-resize;
  touch-action:none;
  z-index:20;
}
.rs::after{
  content:'';
  position:absolute; right:10px; bottom:10px;
  width:26px;height:26px;
  border-right:6px solid #7d8590;
  border-bottom:6px solid #7d8590;
  border-radius:0 0 6px 0;
  opacity:.85;
}
.rs:hover::after{border-color:var(--accent);}

/* 速度滑块 */
.spd{
  display:flex;align-items:center;gap:12px;
  font-size:var(--btn-font);
  color:var(--muted);
  white-space:nowrap;
  padding:0 10px;
}
.spd input[type=range]{
  width:clamp(160px,14vw,320px);
  height:52px;
  accent-color:var(--accent);
  cursor:pointer;
}
.spd b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3em;display:inline-block;}

/* ============================================================
   3. 变量 / 状态面板
   ============================================================ */
#varBody{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.vr{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:8px 16px;
  border-radius:10px;
  background:rgba(22,27,34,.9);
  border:2px solid #21262d;
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.vr.k-ctx{background:#0f2a45;border-color:#1f5f96;}
.vr.k-main{border-left:10px solid #39c5cf;}
.vr.k-money{border-left:10px solid var(--amber);}
.vr.k-sw{border-left:10px solid var(--teal);}
.vr.k-sub{border-left:10px solid var(--accent);}
.vr.k-val{border-left:10px solid var(--pink);}
.vr.k-note{border-left:10px solid #2dd4bf;}
.vr.k-ret{border-left:10px solid #8b949e;}
.vr.changed{background:rgba(88,166,255,.20);border-color:var(--accent);}
.vn{color:var(--muted);white-space:nowrap;font-size:.86em;}
.vv{
  font-family:ui-monospace,Consolas,monospace;
  font-weight:800;
  font-variant-numeric:tabular-nums;
  text-align:right;
  color:var(--accent);
  white-space:nowrap;
}
.vr.k-money .vv{color:var(--amber);}
.vr.k-sw .vv{color:var(--teal);}
.vr.k-val .vv{color:var(--pink);}
.vr.k-ctx .vv{color:#79c0ff;}
.vr.k-note .vv{color:#7ee787;font-size:.82em;font-weight:600;}
.vr.k-ret .vv{color:#e3b341;}
@keyframes vflash{
  0%{transform:scale(1);}
  35%{transform:scale(1.30);color:#fff;text-shadow:0 0 26px var(--accent);}
  100%{transform:scale(1);}
}
.vv.flash{animation:vflash .55s ease-out;}

/* ============================================================
   4. 程序输出面板
   ============================================================ */
#outBody{
  padding:14px 18px;
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font);
  line-height:1.45;
  white-space:pre;
  color:#c9d1d9;
}
.out-line{animation:slideIn .35s ease-out;}
.seg-sol{color:var(--green);font-weight:700;}
.seg-total{color:var(--amber);font-weight:900;}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px);}to{opacity:1;transform:none;}}
.out-empty{color:#484f58;font-size:var(--var-font);}

/* ============================================================
   5. 当前语句说明条
   ============================================================ */
#expBody{
  padding:18px 24px;
  font-size:var(--exp-font);
  line-height:1.62;
  color:#c9d1d9;
}
#expBody .badge{
  display:inline-block;
  padding:4px 20px;margin-right:16px;
  border-radius:12px;
  background:rgba(88,166,255,.24);
  color:var(--accent);
  font-weight:900;
  font-size:.86em;
  vertical-align:middle;
}
#expBody .badge.hit{background:rgba(63,185,80,.24);color:var(--green);}
#expBody .badge.batch{background:rgba(210,168,255,.24);color:var(--purple);}
#expBody strong{color:#ffffff;}
#expBody code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(110,118,129,.22);
  border-radius:8px;
  padding:0 10px;
  color:#e6edf3;
}
#expBody .tip{
  display:block;margin-top:14px;padding:12px 18px;border-radius:10px;
  background:rgba(57,211,83,.12);border-left:8px solid var(--teal);
  color:#c3f0d3;font-size:.92em;
}
#expBody .warn{
  display:block;margin-top:14px;padding:12px 18px;border-radius:10px;
  background:rgba(210,153,34,.16);border-left:8px solid var(--amber);
  color:#ffe6b0;font-size:.92em;
}

/* ============================================================
   6. 缩略图（VSCode 风格 minimap）
   ============================================================ */
#miniBody{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  padding:8px;
}
#miniStage{
  position:relative;
  width:100%;
  height:var(--mini-total);      /* 22 × 10px */
}
#miniCode{ position:absolute; inset:0; }
.ml{
  height:var(--mini-lh);
  line-height:var(--mini-lh);
  font-size:7px;
  white-space:pre;
  overflow:hidden;
  font-family:ui-monospace,Consolas,monospace;
  color:#8b949e;
}
.ml .pp{color:#d2a8ff;}
.ml .str{color:#7ee787;}
.ml .cmt{color:#4d5866;font-style:italic;}
.ml .fn{color:#79c0ff;}
.ml .kw{color:#ff7b72;}
.ml .num{color:#e3b341;}
.ml .op{color:#ffa657;}

/* 视口荧光框 */
#miniVp{
  position:absolute; left:-4px; right:-4px; top:0; height:60px;
  background:rgba(88,166,255,.20);
  border:2px solid rgba(88,166,255,.75);
  border-radius:4px;
  pointer-events:none;
  box-shadow:0 0 14px rgba(88,166,255,.45);
  z-index:3;
}
/* 当前执行行标记 */
#miniCur{
  position:absolute; left:0; right:0; top:0; height:10px;
  background:rgba(63,185,80,.55);
  border-left:4px solid #3fb950;
  pointer-events:none;
  z-index:4;
  display:none;
}

/* ============================================================
   7. 提示条
   ============================================================ */
#hint{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:14px;
  padding:12px 34px;
  border-radius:14px;
  background:rgba(13,17,23,.72);
  border:2px solid var(--border);
  color:#7d8590;
  font-size:clamp(26px,1.3vw,34px);
  z-index:50;
  pointer-events:none;
  white-space:nowrap;
}
</style>
</head>
<body>

<!-- ==================== 全屏代码区 ==================== -->
<div id="codePane"><div id="codeInner"></div></div>

<!-- ==================== 顶部控制栏 ==================== -->
<div class="panel" id="pTop">
  <div class="ph" data-drag>
    <span class="pt">控制台</span>
    <button class="btn" id="btnReset">⟲ 重置</button>
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 自动播放</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <label class="spd">速度
      <input type="range" id="spd" min="300" max="3000" step="100" value="1200">
      <b id="spdLbl">1.20s</b>
    </label>
    <button class="btn" id="btnFull">⛶ 全屏</button>
    <button class="btn" id="btnTog">▣ 面板</button>
    <button class="btn" id="btnMini">▤ 缩略图</button>
    <button class="btn" id="btnLayout">⟳ 重置布局</button>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
</div>

<!-- ==================== 变量 / 状态面板 ==================== -->
<div class="panel" id="pVars">
  <div class="ph" data-drag>
    <span class="pt">变量 · 循环条件 · 状态</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="varBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 程序输出面板 ==================== -->
<div class="panel" id="pOut">
  <div class="ph" data-drag>
    <span class="pt">程序运行结果（屏幕输出）</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="outBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 当前语句说明条 ==================== -->
<div class="panel" id="pExp">
  <div class="ph" data-drag>
    <span class="pt">当前语句说明</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="expBody"></div>
  <div class="rs" data-resize></div>
</div>

<!-- ==================== 缩略图 ==================== -->
<div class="panel" id="pMini">
  <div class="ph" data-drag>
    <span class="pt">缩略图</span>
    <span class="sp"></span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="pb" id="miniBody">
    <div id="miniStage">
      <div id="miniCode"></div>
      <div id="miniVp"></div>
      <div id="miniCur"></div>
    </div>
  </div>
  <div class="rs" data-resize></div>
</div>

<div id="hint">空格=播放/暂停 &nbsp;·&nbsp; ←/→=上一步/下一步 &nbsp;·&nbsp; R=重置 &nbsp;·&nbsp; F=全屏 &nbsp;·&nbsp; M=缩略图 &nbsp;·&nbsp; H=显示/隐藏所有面板</div>

<script>
(function(){
'use strict';

/* ============================================================
   PART 1 · 预计算：按程序真实执行顺序枚举所有换法
   —— 外层 a 从 1 到 99，第二层 b 从 1 到 49，
      第三层 c 从 1 到 19，最内层 d 从 1 到 9，
      只有 a + 2b + 5c + 10d == 100 时才 count++
   ============================================================ */
var solutions = [];        // {a,b,c,d,n}
var outputLines = [];      // 每个元素是一行的片段数组（每行最多 4 组）
var buf = [];
var runningCount = 0;

for (var A = 1; A < 100; A++) {
  for (var B = 1; B < 50; B++) {
    for (var C = 1; C < 20; C++) {
      for (var D = 1; D < 10; D++) {
        if (A + 2*B + 5*C + 10*D === 100) {
          runningCount++;
          buf.push('a=' + A + ',b=' + B + ',c=' + C + ',d=' + D);
          if (runningCount % 4 === 0) { outputLines.push(buf); buf = []; }
          solutions.push({ a:A, b:B, c:C, d:D, n:runningCount });
        }
      }
    }
  }
}
if (buf.length) outputLines.push(buf);   // 最后一行的 2 组（1254 % 4 == 2）

var TOTAL_WAYS    = solutions.length;                     // 1254
var FULL_ROWS     = Math.floor(TOTAL_WAYS / 4);           // 313
var PRINTF_CALLS  = TOTAL_WAYS + FULL_ROWS + 1;           // 1568
var CHECK_TOTAL   = 99 * 49 * 19 * 9;                     // 829521

/* 按 a 分组，便于批量步骤求和 */
var byA = {};
for (var i = 0; i < solutions.length; i++) {
  var sa = solutions[i].a;
  (byA[sa] || (byA[sa] = [])).push(solutions[i]);
}

/* ============================================================
   PART 2 · 源代码（22 行，每行代码与注释同一行，绝不折行）
   ============================================================ */
var CODE = [
  {n:1,  ind:0,  code:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>', cmt:'包含标准输入输出头文件'},
  {n:2,  ind:0,  code:'<span class="kw">int</span> <span class="fn">main</span>() {', cmt:'定义主函数'},
  {n:3,  ind:4,  code:'<span class="kw">int</span> a, b, c, d;', cmt:'定义四种面值的张数'},
  {n:4,  ind:4,  code:'<span class="kw">int</span> count <span class="op">=</span> <span class="num">0</span>;', cmt:'统计总方法数'},
  {n:5,  ind:4,  code:'<span class="kw">for</span> (a<span class="op">=</span><span class="num">1</span>; a<span class="op">&lt;</span><span class="num">100</span>; a<span class="op">++</span>) {', cmt:'1元面值，至少1张，a 从 1 到 99'},
  {n:6,  ind:8,  code:'<span class="kw">for</span> (b<span class="op">=</span><span class="num">1</span>; b<span class="op">&lt;</span><span class="num">50</span>; b<span class="op">++</span>) {', cmt:'2元面值，至少1张，b 从 1 到 49'},
  {n:7,  ind:12, code:'<span class="kw">for</span> (c<span class="op">=</span><span class="num">1</span>; c<span class="op">&lt;</span><span class="num">20</span>; c<span class="op">++</span>) {', cmt:'5元面值，至少1张，c 从 1 到 19'},
  {n:8,  ind:16, code:'<span class="kw">for</span> (d<span class="op">=</span><span class="num">1</span>; d<span class="op">&lt;</span><span class="num">10</span>; d<span class="op">++</span>) {', cmt:'10元面值，至少1张，d 从 1 到 9'},
  {n:9,  ind:20, code:'<span class="kw">if</span> (a <span class="op">+</span> <span class="num">2</span><span class="op">*</span>b <span class="op">+</span> <span class="num">5</span><span class="op">*</span>c <span class="op">+</span> <span class="num">10</span><span class="op">*</span>d <span class="op">==</span> <span class="num">100</span>) {', cmt:'判断合计金额是否恰好 100 元'},
  {n:10, ind:24, code:'<span class="fn">printf</span>(<span class="str">"a=%d,b=%d,c=%d,d=%d"</span>, a,b,c,d);', cmt:'输出一种换法（无换行）'},
  {n:11, ind:24, code:'count<span class="op">++</span>;', cmt:'方法数加 1'},

  , true);

  /* ---------- 第 21 行 ---------- */
  P(21, 'main · return', {
    condA:'—',
    sub:'return 0;', subv:'返回 0，程序结束',

  );

  /* ---------- 第 22 行 ---------- */
  P(22, '程序结束', {
    condA:'—', sub:'—', subv:'—', note:'main 栈帧销毁，a/b/c/d/count 随栈帧释放',
    ret:'0'
  }, [], [],
  'main 函数体结束 }',
  '函数收尾，main 的栈帧被销毁，变量 a、b、c、d、count 随栈帧一起释放。<br><b>printf 调用统计：</b><br>· 第 10 行：' + TOTAL_WAYS + ' 次（每次一组换法）<br>· 第 13 行：' + FULL_ROWS + ' 次（count = 4, 8, …, ' + (FULL_ROWS * 4) + ' 时换行）<br>· 第 20 行：1 次（输出总数）<br>· <b>合计 ' + PRINTF_CALLS + ' 次</b><br><span class="tip"><b>本程序要点总结：</b><br>① <b>四重 for 嵌套</b>：每层控制一种面值的张数，范围都是「至少 1 张、最多不超过 100 ÷ 面值 − 1」；<br>② <b>最内层检查等式</b> <code>a + 2b + 5c + 10d == 100</code>：<b>恰好等于 100</b> 才算一种换法；<br>③ <b>count++ 计数</b>：每命中一次加 1；<br>④ <b>count % 4 == 0 时换行</b>：每输出 4 组换法就换一行；<br>⑤ <b>最后输出总数</b>，格式 <code>There are %d ways</code>；<br>⑥ 最内层总检查 <b>829,521 次</b>，printf 总调用 <b>' + PRINTF_CALLS + ' 次</b>。<br><b>100 元换 1、2、5、10 元（每种至少一张）共有 ' + count + ' 种方法。</b><br><b>常见错误：</b>① 把某个循环写成 <code>&lt;=</code>，会多出张数上限的情况（违反「至少一张」）；② 忘记 <code>count%4==0</code> 的换行判断，所有换法会挤在一行；③ 等式写成 <code>&gt;=</code>，会重复统计超额的情况；④ 计数器没清零，总数会出错。</span>'
  );

  return st;
}

/* ============================================================
   PART 5 · 逐步执行状态机
   ============================================================ */
var current = -1;
var playing = false;
var timer = null;
var speed = Number(spdInput.value);
var lastOutKey = '';

function renderVars(step){
  VAR_ROWS.forEach(function(r){
    var el = varEls[r.key];
    var v;
    if (!step) {
      v = (r.key === 'ctx') ? '—' : '—';
    } else if (r.key === 'ctx') {
      v = step.ctx;
    } else {
      v = step.v[r.key];
    }
    v = String(v);
    if (el.val.textContent !== v) {
      el.val.textContent = v;
      el.val.classList.remove('flash');
      void el.val.offsetWidth;
      el.val.classList.add('flash');
      el.row.classList.add('changed');
      (function(row){
        window.setTimeout(function(){ row.classList.remove('changed'); }, 700);
      })(el.row);
    }
  });
}

function renderCode(step){
  var activeLine = step ? step.line : null;
  var hit = step ? step.hit : [];
  var skip = step ? step.skip : [];

  codeLines.forEach(function(el){
    var n = Number(el.getAttribute('data-line'));
    el.classList.toggle('active', activeLine !== null && n === activeLine);
    el.classList.toggle('hit', hit.indexOf(n) !== -1);
    el.classList.toggle('skip', skip.indexOf(n) !== -1);
  });
}

function renderOutput(step){
  var n = step ? step.outCount : 0;
  var total = step ? step.total : false;
  var key = n + '|' + (total ? 1 : 0);
  if (key === lastOutKey) return;
  lastOutKey = key;

  if (n === 0 && !total) {
    outBody.innerHTML = '<div class="out-empty">（等待程序输出…）</div>';
    return;
  }

  var frag = document.createDocumentFragment();
  var shown = 0;
  var li = 0;

  while (shown < n && li < outputLines.length) {
    var line = outputLines[li];
    var take = Math.min(line.length, n - shown);

    var div = document.createElement('div');
    div.className = 'out-line';

    for (var k = 0; k < take; k++) {
      var sp = document.createElement('span');
      sp.className = 'seg-sol';
      sp.textContent = line[k];
      div.appendChild(sp);
    }
    /* 最后一行不完整 + 总数直接接在末尾 */
    if (take < 4 && total) {
      var tp = document.createElement('span');
      tp.className = 'seg-total';
      tp.textContent = 'There are ' + n + ' ways';
      div.appendChild(tp);
    }
    frag.appendChild(div);

    shown += take;
    li++;
  }

  /* 如果没有不完整行（n % 4 == 0），总数单独追加到新行 */
  if (total && n % 4 === 0) {
    var div2 = document.createElement('div');
    div2.className = 'out-line';
    var tp2 = document.createElement('span');
    tp2.className = 'seg-total';
    tp2.textContent = 'There are ' + n + ' ways';
    div2.appendChild(tp2);
    frag.appendChild(div2);
  }

  outBody.innerHTML = '';
  outBody.appendChild(frag);
  outBody.scrollTop = outBody.scrollHeight;
}

function renderExplain(step){
  if (!step) {
    expBody.innerHTML =
      '<span class="badge">待开始</span><strong>点击「自动播放」或「下一步」，开始逐条执行程序。</strong>' +
      '本程序用<b>四重 for 循环</b>穷举 1、2、5、10 元纸币的张数（每种至少 1 张），' +
      '检查合计金额是否恰好 100 元。<br>最内层共检查 <b>829,521 次</b>，最终找到 <b>' +
      TOTAL_WAYS + '</b> 种换法，printf 总调用 <b>' + PRINTF_CALLS + '</b> 次。';
    return;
  }
  var cls = /批量/.test(step.title) ? ' batch' : (step.hit.length ? ' hit' : '');
  expBody.innerHTML =
    '<span class="badge' + cls + '">第 ' + step.line + ' 行</span>' +
    '<strong>' + step.title + '</strong><br>' + step.desc;
}

/* ---------- 缩略图同步（同一套行高 / 行索引 / 滚动位置） ---------- */
var MINI_LH = 10;             /* 与 CSS --mini-lh 一致 */
var rafPending = false;

function fullLineHeight(){
  if (!codeLines.length) return 1;
  var h = codeLines[0].getBoundingClientRect().height;
  return h > 0 ? h : 1;
}

function syncMini(){
  var lh = fullLineHeight();
  var st = codePane.scrollTop;
  var ch = codePane.clientHeight;

  var visibleLines = ch / lh;                 /* 与全屏实际可见行数严格一致 */
  var topPx = (st / lh) * MINI_LH;            /* 荧光框 top */
  var hPx   = visibleLines * MINI_LH;         /* 荧光框高度 */

  miniVp.style.top    = topPx + 'px';
  miniVp.style.height = Math.max(8, hPx) + 'px';
}

function requestMiniSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){
    rafPending = false;
    syncMini();
  });
}

function updateMiniCur(lineNo){
  if (!lineNo) { miniCur.style.display = 'none'; return; }
  miniCur.style.display = 'block';
  miniCur.style.top = ((lineNo - 1) * MINI_LH) + 'px';
  miniCur.style.height = MINI_LH + 'px';
}

/* ---------- 主渲染 ---------- */
function render(){
  var step = current >= 0 ? STEPS[current] : null;

  renderCode(step);
  renderVars(step);
  renderOutput(step);
  renderExplain(step);
  updateMiniCur(step ? step.line : null);

  /* 当前执行行自动滚动到视野中央 */
  if (step) {
    var el = codeLines[step.line - 1];
    if (el) {
      var lh = fullLineHeight();
      var targetTop = (step.line - 1) * lh - (codePane.clientHeight - lh) / 2;
      targetTop = Math.max(0, Math.min(targetTop, codePane.scrollHeight - codePane.clientHeight));
      codePane.scrollTo({ top: targetTop, behavior: 'smooth' });
    }
  }

  /* 更新控制按钮状态 */
  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  var counter = document.querySelector('#pTop .pt');
  /* 步骤计数在 hint 里显示，避免控制栏过于拥挤 */

  requestMiniSync();
}

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  btnPlay.classList.toggle('playing', playing);
}

function tick(){
  if (current >= STEPS.length - 1) { pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}

function play(){
  if (playing) return;
  if (current >= STEPS.length - 1) { current = -1; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}

function nextStep(){
  pause();
  if (current < STEPS.length - 1) { current += 1; render(); }
}

function prevStep(){
  pause();
  if (current > -1) { current -= 1; render(); }
}

function resetAll(){
  pause();
  current = -1;
  lastOutKey = '';
  outBody.innerHTML = '';
  codePane.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* ============================================================
   PART 6 · 面板交互：拖动 / 关闭 / 任意调整大小 / 点击置顶
   ============================================================ */
var zTop = 100;

function bringToFront(panel){
  zTop += 1;
  panel.style.zIndex = zTop;
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('top', p === panel);
  });
}

var DEFAULT_LAYOUT = [
  {id:'pTop',    left:null, top:10,   w:null, h:null},
  {id:'pVars',   left:16,   top:120,  w:640,  h:700},
  {id:'pOut',    left:null, top:null, w:820,  h:560, right:16, bottom:16},
  {id:'pExp',    left:16,   top:null, w:900,  h:280, bottom:16},
  {id:'pMini',   left:null, top:120,  w:240,  h:320, right:16}
];

function layoutPanels(){
  var W = window.innerWidth;
  var H = window.innerHeight;

  DEFAULT_LAYOUT.forEach(function(cfg){
    var el = document.getElementById(cfg.id);
    if (!el) return;

    var w = cfg.w;
    var h = cfg.h;
    if (w) el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';

    /* 先测量尺寸 */
    var rw = el.offsetWidth;
    var rh = el.offsetHeight;

    if (cfg.left !== null && cfg.left !== undefined) {
      el.style.left = cfg.left + 'px';
    } else if (cfg.right !== null && cfg.right !== undefined) {
      el.style.left = Math.max(8, W - rw - cfg.right) + 'px';
    }

    if (cfg.top !== null && cfg.top !== undefined) {
      el.style.top = cfg.top + 'px';
    } else if (cfg.bottom !== null && cfg.bottom !== undefined) {
      el.style.top = Math.max(8, H - rh - cfg.bottom) + 'px';
    }
  });

  /* 顶部控制栏水平居中 */
  var top = document.getElementById('pTop');
  if (top) {
    top.style.left = Math.max(8, (W - top.offsetWidth) / 2) + 'px';
    top.style.top = '10px';
  }

  window.requestAnimationFrame(syncMini);
}

/* 顶部栏居中（内容宽度变化后） */
function centerTopBar(){
  var top = document.getElementById('pTop');
  if (!top) return;
  if (top.dataset.moved === '1') return;
  top.style.left = Math.max(8, (window.innerWidth - top.offsetWidth) / 2) + 'px';
}

/* 通用交互 */
function setupPanel(panel){
  var head = panel.querySelector('.ph');
  var handle = panel.querySelector('.rs');
  var state = null;

  /* 点击任意位置 → 置顶 */
  panel.addEventListener('pointerdown', function(){ bringToFront(panel); }, true);
  panel.addEventListener('focusin', function(){ bringToFront(panel); }, true);

  /* 拖动 */
  if (head) {
    head.addEventListener('pointerdown', function(e){
      if (e.target.closest('button')) return;
      if (e.target.closest('input')) return;
      bringToFront(panel);
      var r = panel.getBoundingClientRect();
      state = { mode:'drag', sx:e.clientX, sy:e.clientY, sl:r.left, st:r.top };
      panel.dataset.moved = '1';
      try { head.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
    });
    head.addEventListener('pointermove', function(e){
      if (!state || state.mode !== 'drag') return;
      panel.style.left = (state.sl + e.clientX - state.sx) + 'px';
      panel.style.top  = (state.st + e.clientY - state.sy) + 'px';
    });
    head.addEventListener('pointerup', function(e){
      if (state && state.mode === 'drag') {
        state = null;
        try { head.releasePointerCapture(e.pointerId); } catch(err){}
      }
    });
    head.addEventListener('pointercancel', function(){ state = null; });
  }

  /* 调整大小（任意大小，不设限） */
  if (handle) {
    handle.addEventListener('pointerdown', function(e){
      bringToFront(panel);
      var r = panel.getBoundingClientRect();
      state = { mode:'resize', sx:e.clientX, sy:e.clientY, sw:r.width, sh:r.height };
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', function(e){
      if (!state || state.mode !== 'resize') return;
      var w = state.sw + (e.clientX - state.sx);
      var h = state.sh + (e.clientY - state.sy);
      /* 不设最小/最大限制，完全由用户控制 */
      panel.style.width  = w + 'px';
      panel.style.height = h + 'px';
    });
    handle.addEventListener('pointerup', function(e){
      if (state && state.mode === 'resize') {
        state = null;
        try { handle.releasePointerCapture(e.pointerId); } catch(err){}
        requestMiniSync();
      }
    });
    handle.addEventListener('pointercancel', function(){ state = null; });
  }

  /* 关闭按钮 */
  var closeBtn = panel.querySelector('[data-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e){
      e.stopPropagation();
      panel.classList.add('hidden');
    });
  }
}

document.querySelectorAll('.panel').forEach(setupPanel);

/* 全局快捷键：不依赖面板是否可见 */
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') {
    if (e.code !== 'Space') return;
  }
  if (e.code === 'Space')       { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft')  { e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR')   { resetAll(); }
  else if (e.code === 'KeyF')   { btnFull.click(); }
  else if (e.code === 'KeyM')   { btnMini.click(); }
  else if (e.code === 'KeyH')   {
    var panels = document.querySelectorAll('.panel');
    var anyVisible = false;
    panels.forEach(function(p){ if (!p.classList.contains('hidden')) anyVisible = true; });
    panels.forEach(function(p){ p.classList.toggle('hidden', anyVisible); });
    if (anyVisible) {
      /* 全部隐藏 */
    } else {
      document.getElementById('pMini').classList.remove('hidden');
    }
    window.requestAnimationFrame(function(){
      layoutPanels();
      syncMini();
    });
  }
});

/* 滚动 / 尺寸同步（requestAnimationFrame 节流） */
codePane.addEventListener('scroll', requestMiniSync, { passive: true });
window.addEventListener('resize', function(){
  requestMiniSync();
  centerTopBar();
}, { passive: true });

/* 字体加载完成后重新测量行高 */
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function(){
    window.requestAnimationFrame(function(){
      layoutPanels();
      syncMini();
    });
  });
}

/* 面板尺寸变化 → 重新同步缩略图 */
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function(){ requestMiniSync(); });
  ro.observe(codePane);
  var miniPanel = document.getElementById('pMini');
  if (miniPanel) ro.observe(miniPanel);
}

/* ============================================================
   PART 9 · 启动
   ============================================================ */
spdLbl.textContent = (speed / 1000).toFixed(2) + 's';

window.requestAnimationFrame(function(){
  layoutPanels();
  window.requestAnimationFrame(function(){
    centerTopBar();
    syncMini();
    render();
  });
});

})();
</script>
</body>
</html>
