<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 逐步执行模拟 · 数组循环右移 fun1/fun · 希沃大屏版</title>
<style>
/* ======================================================================
   希沃大屏教学版 —— 数组循环右移 fun1/fun · {1..7} → {6,7,1,2,3,4,5}
   逻辑要点：
     · 第 2~9 行（fun1）与第 10~15 行（fun）必须被调用后才执行
     · 三层嵌套：main → fun → fun1（共 2 次 fun1 调用）
     · t = a[n-1] 先备份尾元素，再从右往左搬，a[0] = t 归位
     · printf("%d ", a[i]) 末尾带空格、无 \n，7 个数在同一行
   ====================================================================== */
:root{
  --bg:#0d1117;
  --code-font:   clamp(32px, 4.2vw, 88px);
  --ln-font:     clamp(20px, 2.0vw, 48px);
  --out-font:    clamp(30px, 3.4vw, 76px);
  --var-font:    clamp(15px, 1.75vw, 34px);
  --explain-font:clamp(18px, 2.1vw, 44px);
  --btn-font:    clamp(15px, 1.9vw, 36px);
  --title-font:  clamp(15px, 1.8vw, 34px);
  --accent:#38bdf8;
  --green:#4ade80;
  --amber:#fbbf24;
  --pink:#f472b6;
  --purple:#c084fc;
  --teal:#2dd4bf;
  --orange:#fb923c;
  --gold:#facc15;
  --red:#ef4444;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg);color:#dce8f8;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===================== 全屏代码区 ===================== */
#codeScroll{
  position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:1;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
#codeScroll::-webkit-scrollbar{width:16px;height:16px;}
#codeScroll::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:9px;}
#codeScroll::-webkit-scrollbar-track{background:#0d1117;}

#codeInner{padding:12px 0 40vh 0;}

.cl{
  display:flex;white-space:pre;
  padding:0 3vw 0 0;
  border-left:10px solid transparent;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font);
  line-height:1.48;
  transition:background .25s,border-color .25s,opacity .3s,color .3s;
}
.cl .ln{
  flex:0 0 auto;width:3.2ch;text-align:right;margin-right:1.6ch;
  color:#3d5578;font-size:var(--ln-font);line-height:inherit;
  font-variant-numeric:tabular-nums;user-select:none;
  align-self:center;
}
.cl .src{flex:0 0 auto;color:#c9d8ee;}

.cl.done .src{color:#7b8ea8;}
.cl.done .ln{color:#2c405e;}
.cl.skipped .src{opacity:.32;font-style:italic;}
.cl.skipped .ln{opacity:.4;}

.cl.active{
  background:linear-gradient(90deg,rgba(56,189,248,.34),rgba(56,189,248,.02));
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 2px rgba(56,189,248,.30);
}
.cl.active .src{color:#ffffff;}
.cl.active .ln{color:var(--accent);font-weight:700;}
.cl.active{animation:linePulse .5s ease-out;}
@keyframes linePulse{
  0%{transform:translateX(-16px);opacity:.55;}
  100%{transform:translateX(0);opacity:1;}
}

/* 语法高亮 */
.pp{color:var(--purple);font-weight:700;}
.str{color:var(--green);}
.cmt{color:#5b7292;font-style:italic;}
.fn{color:var(--accent);}
.fn1{color:var(--purple);font-weight:700;}
.fnFun{color:var(--pink);font-weight:700;}
.kw{color:var(--pink);font-weight:700;}
.kw-static{color:var(--teal);font-weight:700;}
.num{color:var(--amber);}
.op{color:var(--orange);font-weight:700;}
.sp-hl{
  color:#facc15;font-weight:800;
  background:rgba(250,204,21,.18);
  padding:0 .12em;border-radius:4px;
  text-decoration:underline wavy rgba(250,204,21,.65);
}

/* ===================== 浮动面板 ===================== */
.panel{
  position:fixed;z-index:100;
  display:flex;flex-direction:column;
  background:rgba(13,17,23,.86);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(56,189,248,.30);
  border-radius:16px;
  box-shadow:0 14px 50px rgba(0,0,0,.65);
  overflow:hidden;
  transition:border-color .18s,box-shadow .18s;
}
.panel.top{
  border-color:rgba(56,189,248,.9);
  box-shadow:0 0 0 2px rgba(56,189,248,.28),0 18px 60px rgba(0,0,0,.78);
}
.phead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  background:linear-gradient(180deg,rgba(30,48,78,.95),rgba(20,32,52,.95));
  border-bottom:1px solid rgba(56,189,248,.22);
  cursor:grab;touch-action:none;
  font-size:var(--title-font);font-weight:700;color:#9fd8ff;
  letter-spacing:.02em;
}
.phead:active{cursor:grabbing;}
.ptitle{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbtns{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;}
.pb{
  width:clamp(28px,2vw,44px);height:clamp(28px,2vw,44px);
  border-radius:10px;border:1px solid rgba(120,160,210,.38);
  background:rgba(30,48,78,.75);color:#bcd4f0;
  font-size:clamp(13px,1vw,22px);line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.pb:hover{background:rgba(56,189,248,.30);border-color:var(--accent);color:#fff;}

.pbody{
  flex:1 1 auto;min-height:0;overflow:auto;
  padding:10px 12px;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
.pbody::-webkit-scrollbar{width:10px;height:10px;}
.pbody::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}

.panel.collapsed .pbody{display:none;}
.panel.collapsed .rs{display:none;}

.rs{
  position:absolute;right:0;bottom:0;width:38px;height:38px;
  cursor:nwse-resize;z-index:9;touch-action:none;
}
.rs::after{
  content:'';position:absolute;right:6px;bottom:6px;width:18px;height:18px;
  border-right:4px solid rgba(56,189,248,.85);
  border-bottom:4px solid rgba(56,189,248,.85);
  border-radius:0 0 5px 0;
}

/* ===================== 控制栏 ===================== */
#p-bar .pbody{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  overflow:visible;padding:10px 12px;
}
#p-bar button.act{
  font-size:var(--btn-font);font-weight:700;
  padding:.42em .82em;min-height:clamp(38px,3vw,66px);
  border-radius:12px;border:1px solid rgba(120,160,210,.42);
  background:rgba(30,48,78,.85);color:#dce8f8;cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s;
  white-space:nowrap;
}
#p-bar button.act:hover{background:rgba(56,189,248,.28);border-color:var(--accent);}
#p-bar button.act:active{transform:translateY(2px);}
#p-bar button.act:disabled{opacity:.3;cursor:not-allowed;}
#p-bar button.primary{
  background:linear-gradient(180deg,#0ea5e9,#0284c7);
  border-color:#38bdf8;color:#04121f;
}
#p-bar button.primary.playing{
  background:linear-gradient(180deg,#f59e0b,#d97706);
  border-color:#fbbf24;color:#1a1200;
}
.speedWrap{
  display:flex;align-items:center;gap:10px;
  font-size:var(--btn-font);color:#9db1cb;white-space:nowrap;
  padding:0 6px;
}
.speedWrap input[type=range]{
  width:clamp(100px,9vw,240px);height:clamp(20px,1.6vw,38px);
  accent-color:var(--accent);cursor:pointer;
}
.speedWrap b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.6em;display:inline-block;}
.counter{
  font-size:var(--btn-font);color:#9fd8ff;font-weight:700;
  padding:.38em .78em;border-radius:10px;background:rgba(56,189,248,.14);
  white-space:nowrap;
}

/* ===================== 变量/调用栈 ===================== */
.infoStrip{
  display:flex;align-items:center;gap:.55em;flex-wrap:wrap;
  padding:6px 8px;border-radius:10px;
  background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.24);
  margin-bottom:8px;
  font-family:ui-monospace,Consolas,monospace;
  font-size:calc(var(--var-font)*.86);
}
.infoStrip .tag{
  padding:.14em .5em;border-radius:6px;
  background:rgba(148,163,184,.16);color:#9db1cb;
  font-size:.85em;
}
.infoStrip .val{color:var(--teal);font-weight:800;}
.infoStrip .val.fn{color:var(--purple);}
.infoStrip .val.tval{color:var(--gold);}
.infoStrip .val.rot{color:var(--green);}

.stackStrip{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  padding:6px 8px;border-radius:10px;
  background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.28);
  margin-bottom:10px;
}
.stackLabel{
  font-size:calc(var(--var-font)*.8);color:#9db1cb;
  font-family:ui-monospace,Consolas,monospace;
  flex:0 0 auto;
}
.stackBody{display:flex;align-items:center;gap:.45em;flex-wrap:wrap;}
.frame{
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  font-size:calc(var(--var-font)*.95);
  padding:.22em .68em;border-radius:9px;
  background:#0d1728;border:1px solid #1e3350;color:#8aa2c0;
  transition:all .25s;
}
.frame.main{border-left:4px solid rgba(34,211,238,.7);}
.frame.funf{border-left:4px solid rgba(244,114,182,.9);}
.frame.fun1f{border-left:4px solid rgba(192,132,252,.9);}
.frame.topF{
  border-color:var(--accent);background:rgba(56,189,248,.22);color:#fff;
  box-shadow:0 0 16px rgba(56,189,248,.55);
  animation:framePop .4s ease-out;
}
.frame.funf.topF{
  border-color:var(--pink);background:rgba(244,114,182,.24);
  box-shadow:0 0 18px rgba(244,114,182,.55);
}
.frame.fun1f.topF{
  border-color:var(--purple);background:rgba(192,132,252,.24);
  box-shadow:0 0 18px rgba(192,132,252,.55);
}
@keyframes framePop{
  0%{transform:scale(.6);opacity:0;}
  60%{transform:scale(1.16);}
  100%{transform:scale(1);opacity:1;}
}
.arr2{color:#3f5a7d;font-size:calc(var(--var-font)*1.05);}
.empty{color:#3d5474;font-size:calc(var(--var-font)*.85);font-family:ui-monospace,monospace;}

.scope-group{
  display:flex;flex-direction:column;gap:.16em;
  border-radius:10px;padding:.42em .5em .5em;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(148,163,184,.10);
  margin-bottom:8px;
}
.scope-group.scope-main{border-left:4px solid rgba(34,211,238,.55);}
.scope-group.scope-fun{border-left:4px solid rgba(244,114,182,.7);background:rgba(244,114,182,.03);}
.scope-group.scope-fun1{border-left:4px solid rgba(192,132,252,.7);background:rgba(192,132,252,.03);}
.scope-head{
  display:flex;align-items:baseline;gap:.5em;
  font-size:calc(var(--var-font)*.8);color:#8aa2c0;
  padding:0 .3em .2em;
}
.scope-head .fname{
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  color:#9fd8ff;font-size:calc(var(--var-font)*1.0);
}
.scope-head .role{color:#6d82a2;margin-left:auto;font-size:calc(var(--var-font)*.74);}

.vrow{
  display:flex;align-items:center;gap:.5em;
  padding:.22em .55em;border-radius:8px;
  background:#0d1728;border:1px solid #1b293f;
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.vk{
  flex:0 0 auto;color:#8399b8;white-space:nowrap;
  font-family:ui-monospace,Consolas,monospace;
  display:flex;align-items:baseline;gap:.4em;
}
.vt{font-size:.72em;color:#4d5f78;padding:.02em .3em;border-radius:4px;background:rgba(148,163,184,.1);}
.vv{
  flex:1 1 auto;min-width:0;text-align:right;
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vv.dim{color:#5f7796;font-weight:500;font-style:italic;}
.scope-fun .vv{color:var(--pink);}
.scope-fun1 .vv{color:var(--purple);}
.vrow.changed{border-color:rgba(56,189,248,.9);background:rgba(56,189,248,.14);}
.vrow.changed .vv{color:#ffffff;}
.scope-fun .vrow.changed{border-color:rgba(244,114,182,.9);background:rgba(244,114,182,.16);}
.scope-fun1 .vrow.changed{border-color:rgba(192,132,252,.9);background:rgba(192,132,252,.16);}
.vv.flash{animation:vflash .55s ease-out;}
@keyframes vflash{
  0%{transform:scale(1);}
  30%{transform:scale(1.22);color:#fff;text-shadow:0 0 18px currentColor;}
  100%{transform:scale(1);}
}

/* ===================== 数组可视化 ===================== */
.arrGrid{
  display:grid;gap:.4em;
  grid-template-columns:repeat(7, 1fr);
  margin-bottom:10px;
}
.arrHead{
  text-align:center;font-size:calc(var(--var-font)*.68);color:#6d82a2;
  padding:.06em 0;font-family:ui-monospace,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.ch{
  text-align:center;border-radius:9px;
  padding:.42em .06em .46em;
  background:#0d1728;border:2px solid #1b293f;
  transition:background .28s,border-color .28s,box-shadow .28s,transform .28s;
  min-width:0;overflow:hidden;
}
.ch .chVal{
  display:block;
  font-family:ui-monospace,Consolas,monospace;
  font-weight:800;font-size:calc(var(--var-font)*1.25);
  color:#8aa2c0;line-height:1.2;
  white-space:nowrap;
}
.ch .chIdx{
  display:block;margin-top:.18em;
  font-size:calc(var(--var-font)*.62);color:#3d5474;
  font-variant-numeric:tabular-nums;
}

.ch.is-hl{
  border-color:var(--accent);background:rgba(56,189,248,.18);
  box-shadow:0 0 0 2px rgba(56,189,248,.45),0 0 18px rgba(56,189,248,.3);
  transform:translateY(-3px);
}
.ch.is-hl .chVal{color:#ffffff;}

.ch.is-emit{
  border-color:var(--gold);background:rgba(250,204,21,.28);
  box-shadow:0 0 0 2px rgba(250,204,21,.75),0 0 24px rgba(250,204,21,.5);
  transform:translateY(-4px) scale(1.08);
}
.ch.is-emit .chVal{color:#fff8d0;font-size:calc(var(--var-font)*1.4);}

.ch.is-done{
  border-color:var(--green);background:rgba(74,222,128,.12);
  box-shadow:0 0 0 1px rgba(74,222,128,.3);
}
.ch.is-done .chVal{color:#c9f7d6;}

@keyframes chFlash{
  0%{transform:scale(1);}
  40%{transform:scale(1.35);color:#fff;}
  100%{transform:scale(1);}
}
.ch .chVal.flash{animation:chFlash .55s ease-out;}

.tStrip{
  display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;
  font-size:calc(var(--var-font)*.82);color:#8ba7c8;
  padding:.4em .7em;margin-bottom:8px;border-radius:8px;
  background:rgba(250,204,21,.10);border-left:4px solid var(--gold);
  line-height:1.5;
}
.tStrip .tagT{
  padding:.14em .5em;border-radius:6px;
  background:rgba(250,204,21,.20);color:#facc15;
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
}
.tStrip .tval{
  color:var(--gold);font-weight:800;
  font-family:ui-monospace,Consolas,monospace;
  font-size:calc(var(--var-font)*1.15);
}
.tStrip .tval.dim{color:#5f7796;font-weight:500;font-style:italic;}

/* ===================== 输出面板 ===================== */
.outNote{
  font-size:calc(var(--var-font)*.78);color:#8ba7c8;
  padding:.4em .7em;margin-bottom:8px;border-radius:8px;
  background:rgba(74,222,128,.10);border-left:4px solid var(--green);
  line-height:1.5;
}
.outNote .fmt{color:var(--green);font-weight:800;font-family:ui-monospace,monospace;}
.console{
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font);line-height:1.4;color:#86efac;
  white-space:pre;overflow-x:auto;word-break:keep-all;
  min-height:2em;padding:.2em 0;
  letter-spacing:.04em;
}
.cursor{
  display:inline-block;color:var(--green);
  animation:blink 1s step-end infinite;margin-left:2px;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ===================== 说明条 ===================== */
.expLine{
  display:inline-block;padding:.16em .65em;border-radius:8px;
  background:rgba(56,189,248,.20);color:var(--accent);
  font-weight:800;font-size:.84em;margin-right:.55em;vertical-align:middle;
}
.expLine.gold{background:rgba(250,204,21,.22);color:#facc15;}
.expLine.mv{background:rgba(244,114,182,.22);color:var(--pink);}
.expLine.pre{background:rgba(192,132,252,.22);color:var(--purple);}
.expLine.ret{background:rgba(251,191,36,.22);color:var(--amber);}
.expLine.dw{background:rgba(244,114,182,.22);color:#f9a8d4;}
.expLine.skip{background:rgba(148,163,184,.28);color:#cbd5e1;}
#expText{
  font-size:var(--explain-font);line-height:1.5;color:#c3d4ea;
}
#expText strong{color:#fff;}
#expText code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(148,163,184,.18);border-radius:5px;
  padding:0 .32em;color:#e6eefb;
}
#expText .tip{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(45,212,191,.12);border-left:6px solid var(--teal);
  color:#bff5ec;font-size:.9em;
}
#expText .warn{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(251,191,36,.13);border-left:6px solid var(--amber);
  color:#ffe6b0;font-size:.9em;
}
#expText .danger{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(239,68,68,.16);border-left:6px solid #ef4444;
  color:#ffc9c9;font-size:.9em;
}
#expText .win{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(250,204,21,.16);border-left:6px solid var(--gold);
  color:#fff3c4;font-size:.9em;font-weight:600;
}

/* ===================== 缩略图 ===================== */
#miniBody{position:relative;padding:8px;overflow:hidden;cursor:pointer;}
#miniInner{position:relative;}
.ml{
  white-space:pre;overflow:hidden;
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  line-height:1.35;
  opacity:.72;
  transition:opacity .2s,background .2s;
}
.ml.active{opacity:1;background:rgba(56,189,248,.30);box-shadow:inset 3px 0 0 var(--accent);}
.ml.done{opacity:.40;}
#miniView{
  position:absolute;left:0;right:0;top:0;
  border:2px solid rgba(56,189,248,.85);
  background:rgba(56,189,248,.10);
  border-radius:5px;pointer-events:none;
  transition:top .08s linear,height .08s linear;
  z-index:3;
}
</style>
</head>
<body>

<!-- ===================== 全屏代码区 ===================== -->
<div id="codeScroll">
  <div id="codeInner"></div>
</div>

<!-- ===================== 控制栏 ===================== -->
<div class="panel" id="p-bar">
  <div class="phead">
    <span class="ptitle">▣ 控制台</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody">
    <button class="act" id="btnReset">⟲ 重置</button>
    <button class="act" id="btnPrev">◀ 上一步</button>
    <button class="act primary" id="btnPlay">▶ 播放</button>
    <button class="act" id="btnNext">下一步 ▶</button>
    <label class="speedWrap">速度
      <input type="range" id="speed" min="200" max="3000" step="100" value="1000">
      <b id="speedLbl">1.0s</b>
    </label>
    <button class="act" id="btnFs">⛶ 全屏</button>
    <button class="act" id="btnPanels">▣ 面板</button>
    <button class="act" id="btnMini">▤ 缩略图</button>
    <button class="act" id="btnLayout">↺ 重置布局</button>
    <span class="counter" id="stepCounter">步骤 — / 0</span>
  </div>
  <div class="rs"></div>
</div>

<!-- ===================== 调用栈 · 变量 ===================== -->
<div class="panel" id="p-vars">
  <div class="phead">
    <span class="ptitle">调用栈 · 变量 i / t / n / m · 状态表</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div class="infoStrip">
      <span class="tag">当前函数</span>
      <span class="val fn" id="funcVal">—</span>
      <span style="color:#2c3f5e">│</span>
      <span class="tag">右移进度</span>
      <span class="val rot" id="rotVal">0 / 2</span>
    </div>

    <div class="stackStrip">
      <span class="stackLabel">调用栈</span>
      <span class="stackBody" id="stackBody"><span class="empty">（空）</span></span>
    </div>

    <div id="varsBlock"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- ===================== 数组可视化 ===================== -->
<div class="panel" id="p-arr">
  <div class="phead">
    <span class="ptitle">数组 a[7] · fun1 暂存 t</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div class="tStrip">
      <span class="tagT">t (fun1 暂存)</span>
      <span class="tval dim" id="tValBox">—（未进入 fun1）</span>
      <span style="margin-left:auto;font-size:.82em;color:#8ba7c8;" id="arrPhase">—</span>
    </div>
    <div class="arrGrid" id="arrGrid"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- ===================== 程序输出 ===================== -->
<div class="panel" id="p-out">
  <div class="phead">
    <span class="ptitle">程序运行结果（屏幕输出）</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div class="outNote">格式串 <span class="fmt">"%d "</span>：%d 后<b>有一个空格</b>、<b>没有 \n</b>，所以 7 个数全部挤在同一行，末尾带一个空格</div>
    <div class="console" id="consoleBody"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- ===================== 当前语句说明 ===================== -->
<div class="panel" id="p-exp">
  <div class="phead">
    <span class="ptitle">当前语句说明</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div id="expText"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- ===================== 缩略图 ===================== -->
<div class="panel" id="p-mini">
  <div class="phead">
    <span class="ptitle">缩略图</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>
      <button class="pb" data-act="close" title="关闭">✕</button>
    </span>
  </div>
  <div class="pbody" id="miniBody">
    <div id="miniInner"></div>
    <div id="miniView"></div>
  </div>
  <div class="rs"></div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   一、源代码数据（严格 24 行）
   ===================================================================== */
var LINES = [
  {n:1,  h:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>                              <span class="cmt">// 包含标准输入输出头文件</span>'},
  {n:2,  h:'<span class="kw">void</span> <span class="fn1">fun1</span>(<span class="kw">int</span> a[], <span class="kw">int</span> n) {                     <span class="cmt">// 右移一位函数</span>'},
  {n:3,  h:'    <span class="kw">int</span> t, i;                                   <span class="cmt">// 定义临时变量和循环变量</span>'},
  {n:4,  h:'    t <span class="op">=</span> a[n<span class="op">-</span><span class="num">1</span>];                                 <span class="cmt">// 暂存最后一个元素</span>'},
  {n:5,  h:'    <span class="kw">for</span>(i<span class="op">=</span>n<span class="op">-</span><span class="num">1</span>; i<span class="op">&gt;</span><span class="num">0</span>; i<span class="op">--</span>) {                      <span class="cmt">// 整体右移</span>'},
  {n:6,  h:'        a[i] <span class="op">=</span> a[i<span class="op">-</span><span class="num">1</span>];'},
  {n:7,  h:'    }'},
  {n:8,  h:'    a[<span class="num">0</span>] <span class="op">=</span> t;                                   <span class="cmt">// 将暂存值放到第一位</span>'},
  {n:9,  h:'}'},
  {n:10, h:'<span class="kw">void</span> <span class="fnFun">fun</span>(<span class="kw">int</span> a[], <span class="kw">int</span> n, <span class="kw">int</span> m) {                <span class="cmt">// 移动m次函数</span>'},
  {n:11, h:'    <span class="kw">int</span> i;                                      <span class="cmt">// 定义循环变量</span>'},
  {n:12, h:'    <span class="kw">for</span>(i<span class="op">=</span><span class="num">0</span>; i<span class="op">&lt;</span>m; i<span class="op">++</span>) {                        <span class="cmt">// 循环m次</span>'},
  {n:13, h:'        <span class="fn1">fun1</span>(a, n);                             <span class="cmt">// 每次调用fun1右移一位</span>'},
  {n:14, h:'    }'},
  {n:15, h:'}'},
  {n:16, h:'<span class="kw">int</span> <span class="fn">main</span>() {                                    <span class="cmt">// 主函数</span>'},
  {n:17, h:'    <span class="kw-static">static</span> <span class="kw">int</span> a[<span class="num">7</span>] <span class="op">=</span> {<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>,<span class="num">4</span>,<span class="num">5</span>,<span class="num">6</span>,<span class="num">7</span>};          <span class="cmt">// 初始化数组</span>'},
  {n:18, h:'    <span class="kw">int</span> i;                                      <span class="cmt">// 定义循环变量</span>'},
  {n:19, h:'    <span class="fnFun">fun</span>(a, <span class="num">7</span>, <span class="num">2</span>);                               <span class="cmt">// 向右移动2位</span>'},
  {n:20, h:'    <span class="kw">for</span>(i<span class="op">=</span><span class="num">0</span>; i<span class="op">&lt;</span><span class="num">7</span>; i<span class="op">++</span>) {                       <span class="cmt">// 输出移动后的数组</span>'},
  {n:21, h:'        <span class="fn">printf</span>(<span class="str">"%d<span class="sp-hl"> </span>"</span>, a[i]);'},
  {n:22, h:'    }'},
  {n:23, h:'    <span class="kw">return</span> <span class="num">0</span>;                                 <span class="cmt">// 返回0，程序结束</span>'},
  {n:24, h:'}'}
];

/* =====================================================================
   二、构建全屏代码区 + 缩略图
   ===================================================================== */
var codeScroll = document.getElementById('codeScroll');
var codeInner  = document.getElementById('codeInner');
var miniInner  = document.getElementById('miniInner');
var miniBody   = document.getElementById('miniBody');
var miniView   = document.getElementById('miniView');

var codeLineEls = [];
var miniLineEls = [];

LINES.forEach(function(L){
  var d = document.createElement('div');
  d.className = 'cl';
  d.dataset.line = L.n;
  d.innerHTML = '<span class="ln">' + L.n + '</span><span class="src">' + L.h + '</span>';
  codeInner.appendChild(d);
  codeLineEls.push(d);

  var m = document.createElement('div');
  m.className = 'ml';
  m.dataset.line = L.n;
  m.innerHTML = L.h;
  miniInner.appendChild(m);
  miniLineEls.push(m);
});

/* =====================================================================
   三、逐步执行数据
   ===================================================================== */
var INIT_ARR = [1, 2, 3, 4, 5, 6, 7];
var N = 7;
var M = 2;

var S = {
  stack: [],
  arr: null,
  mainI: null,
  funI: null,
  fun1I: null,
  tVal: null,
  nVal: null,
  mVal: null,
  func: '—',
  expr: '—', exprVal: '—', note: '—',
  printfCount: 0,
  funCount: 0,
  fun1Count: 0,
  rotDone: 0,
  mainRet: '—',
  out: '',
  hlCells: [],
  emitCells: [],
  doneCells: [],
  arrPhase: '—'
};

var STEPS = [];

function emit(o){
  if (o.stack)      S.stack = o.stack.slice();
  if (o.arr)        S.arr = o.arr.slice();
  if (o.mainI !== undefined) S.mainI = o.mainI;
  if (o.funI !== undefined)  S.funI = o.funI;
  if (o.fun1I !== undefined) S.fun1I = o.fun1I;
  if (o.tVal !== undefined)  S.tVal = o.tVal;
  if (o.nVal !== undefined)  S.nVal = o.nVal;
  if (o.mVal !== undefined)  S.mVal = o.mVal;
  if (o.func !== undefined)  S.func = o.func;
  if (o.expr !== undefined)  S.expr = o.expr;
  if (o.exprVal !== undefined) S.exprVal = o.exprVal;
  if (o.note !== undefined)  S.note = o.note;
  if (o.printfCount !== undefined) S.printfCount = o.printfCount;
  if (o.funCount !== undefined)    S.funCount    = o.funCount;
  if (o.fun1Count !== undefined)   S.fun1Count   = o.fun1Count;
  if (o.rotDone !== undefined)     S.rotDone     = o.rotDone;
  if (o.mainRet !== undefined) S.mainRet = o.mainRet;
  if (o.append) S.out += o.append;
  if (o.hlCells)   S.hlCells = o.hlCells.slice();
  else S.hlCells = [];
  if (o.emitCells) S.emitCells = o.emitCells.slice();
  else S.emitCells = [];
  if (o.doneCells) S.doneCells = o.doneCells.slice();
  else S.doneCells = [];
  if (o.arrPhase !== undefined) S.arrPhase = o.arrPhase;

  STEPS.push({
    line: o.line,
    kind: o.kind || 'exec',
    title: o.title,
    desc: o.desc,
    stack: S.stack.slice(),
    func: S.func,
    arr: S.arr ? S.arr.slice() : null,
    mainI: S.mainI,
    funI: S.funI,
    fun1I: S.fun1I,
    tVal: S.tVal,
    nVal: S.nVal,
    mVal: S.mVal,
    expr: S.expr, exprVal: S.exprVal, note: S.note,
    printfCount: S.printfCount,
    funCount: S.funCount,
    fun1Count: S.fun1Count,
    rotDone: S.rotDone,
    mainRet: S.mainRet,
    out: S.out,
    hlCells: S.hlCells.slice(),
    emitCells: S.emitCells.slice(),
    doneCells: S.doneCells.slice(),
    arrPhase: S.arrPhase,
    gold: !!o.gold
  });
}

/* ============ 1：第 1 行 ============ */
S.note = '预处理：stdio.h 提供 printf 声明';
emit({
  line:1, kind:'pre',
  title:'#include &lt;stdio.h&gt;',
  desc:'预处理指令：把标准输入输出头文件包含进来，让 <code>printf</code> 拿到函数声明。<br>' +
       '这一行<b>不是 C 语句</b>，编译之前就处理完了，不产生任何屏幕输出。'
});

/* ============ 2：第 2 行 fun1 定义登记 ============ */
S.note = 'fun1 定义已登记（不执行），调用时才运行';
emit({
  line:2, kind:'pre',
  title:'void fun1(int a[], int n) { ... }　右移一位函数（登记）',
  desc:'编译器在这里<b>登记</b> fun1 函数的定义：<br>' +
       '· 返回类型 <code>void</code>——不需要返回值，修改直接写回数组；<br>' +
       '· 参数 <code>int a[]</code> 形式上写成数组，实际等价于指针 <code>int *a</code>，' +
       '接收的是<b>数组首地址</b>；<br>' +
       '· 参数 <code>int n</code> 是数组长度；<br>' +
       '· <b>此刻不会执行</b>——只有 fun 中第 13 行调用它时才真正运行。' +
       '<span class="tip"><b>fun1 的右移思路：</b><br>' +
       '① 先把<b>最后一个元素</b>暂存到 <code>t</code>（否则它会被覆盖丢掉）；<br>' +
       '② 从右往左，把每个元素搬到它<b>右边一格</b>：<code>a[i] = a[i-1]</code>；<br>' +
       '③ 最后把 <code>t</code> 放到 <code>a[0]</code>，完成一次「循环右移一位」。</span>'
});

/* ============ 3：第 10 行 fun 定义登记 ============ */
S.note = 'fun 定义已登记（不执行），调用时才运行';
emit({
  line:10, kind:'pre',
  title:'void fun(int a[], int n, int m) { ... }　右移 m 位函数（登记）',
  desc:'编译器在这里<b>登记</b> fun 函数的定义：<br>' +
       '· 参数 <code>n</code> 是数组长度，<code>m</code> 是要右移的位数；<br>' +
       '· 函数体是一个 for 循环：<b>调用 fun1 共 m 次</b>，' +
       '每次让数组循环右移一位，累计就是右移 m 位；<br>' +
       '· <b>此刻不会执行</b>——只有 main 中第 19 行调用 <code>fun(a,7,2)</code> 时才运行。' +
       '<span class="tip"><b>为什么要拆成两个函数？</b><br>' +
       'fun1 只负责「移一位」这一件小事，逻辑简单不易出错；<br>' +
       'fun 负责「移 m 位」，只需重复调用 fun1。<br>' +
       '这就是<b>函数复用</b>：把复杂任务拆成简单的可复用步骤。</span>'
});

/* ============ 4：第 16 行 main 入口 ============ */
S.stack = ['main'];
S.func = 'main';
S.note = 'main 栈帧建立，程序正式开始';
emit({
  line:16, kind:'exec',
  title:'int main() {　程序从 main 开始执行',
  desc:'操作系统把控制权交给 <code>main</code>，程序正式开始，系统为 main 建立<b>栈帧</b>。<br>' +
       '<b>整体流程：</b><br>' +
       '① 第 17 行：初始化静态数组 <code>a[7]</code>；<br>' +
       '② 第 18 行：<code>int i;</code> 声明输出循环变量；<br>' +
       '③ 第 19 行：调用 <code>fun(a, 7, 2)</code> 把数组右移 2 位；<br>' +
       '④ 第 20~22 行：循环 7 次，用 <code>printf("%d ", a[i])</code> 输出结果；<br>' +
       '⑤ 第 23 行：<code>return 0;</code> 结束程序。' +
       '<span class="tip"><b>预计屏幕输出（1 行，末尾带空格）：</b><br>' +
       '<code>6 7 1 2 3 4 5 ▊</code></span>'
});

/* ============ 5：第 17 行 数组初始化 ============ */
S.arr = INIT_ARR.slice();
S.hlCells = [];
S.emitCells = [];
S.doneCells = [];
S.arrPhase = '初始状态';
S.note = '数组 a 初始化完成，共 7 个元素';
emit({
  line:17, kind:'gold',
  hlCells: [0,1,2,3,4,5,6],
  title:'static int a[7] = {1,2,3,4,5,6,7};',
  desc:'声明并初始化一个 <code>static</code> 的整型数组：<br>' +
       '· <b>static</b> 表示静态存储——数组在程序整个运行期间都存在；<br>' +
       '· 7 个元素一次填好：<code>' + S.arr.join(', ') + '</code>；<br>' +
       '· 下标依次是 0~6，右侧数组面板会实时显示它每一步的变化。' +
       '<span class="tip"><b>本轮目标：</b>把这一串数字<b>循环右移 2 位</b>，' +
       '即变成 <code>{6,7,1,2,3,4,5}</code>。</span>'
});

/* ============ 6：第 18 行 int i ============ */
S.note = 'main 的 i 未初始化';
emit({
  line:18, kind:'exec',
  title:'int i;　声明输出循环变量（未初始化）',
  desc:'声明一个整型变量 <code>i</code>，用来控制后面第 20 行的输出循环。<br>' +
       '· 此刻它<b>没有初始化</b>，值是栈上的垃圾值；<br>' +
       '· 变量表里显示为 <b>—</b>；<br>' +
       '· 注意：这个 <code>i</code> 是 <b>main 的局部变量</b>，' +
       '和 fun、fun1 里同名的 <code>i</code> 是<b>三个完全不同的变量</b>。'
});

/* ============ 7：第 19 行 准备调用 fun ============ */
S.expr = 'fun(a, 7, 2)';
S.exprVal = 'a 退化为 &a[0]（int *）；n = 7；m = 2';
S.note = '准备进入 fun（数组传地址，不是值传递）';
S.funCount = 1;
emit({
  line:19, kind:'call',
  title:'fun(a, 7, 2);　准备调用右移函数',
  desc:'第 19 行调用 <code>fun(a, 7, 2)</code>：<br>' +
       '· 实参 <code>a</code> 传的是<b>数组首地址</b>（不是把 7 个数复制一份）；<br>' +
       '· 实参 <code>7</code> 传给形参 <code>n</code>，实参 <code>2</code> 传给形参 <code>m</code>；<br>' +
       '· 控制权交给 fun，main 暂停在这一行等待它返回。' +
       '<span class="warn"><b>关键点：数组是「传地址」而不是「传值」</b><br>' +
       '函数里的形参 <code>a</code> 和 main 里的数组 <code>a</code> 指向<b>同一块内存</b>。<br>' +
       '所以在 fun1 里执行 <code>a[i] = a[i-1]</code> 时，' +
       'main 中的数组会<b>同步改变</b>。</span>'
});

/* ============ 8：进入 fun ============ */
S.stack = ['main', 'fun'];
S.func = 'fun';
S.nVal = N;
S.mVal = M;
S.funI = null;
S.note = 'fun 栈帧建立，n = 7，m = 2';
emit({
  line:10, kind:'call',
  title:'进入 fun：形参 <b>n = 7</b>、<b>m = 2</b>',
  desc:'控制权交给 fun，函数体开始执行：<br>' +
       '· 形参 <code>n</code> 被创建并初始化为 <b>7</b>；<br>' +
       '· 形参 <code>m</code> 被创建并初始化为 <b>2</b>；<br>' +
       '· 形参 <code>a</code> 是一个指针，指向 main 里那个数组的第一个元素；<br>' +
       '· 这些都会随 fun 的栈帧一起销毁。' +
       '<span class="tip"><b>调用栈：</b>main → fun（fun 成为当前函数）</span>'
});

/* ============ 9：第 11 行 fun 中 int i ============ */
S.note = 'fun 的 i 未初始化';
emit({
  line:11, kind:'exec',
  title:'int i;　声明循环变量（未初始化）',
  desc:'声明一个整型局部变量 <code>i</code>，作为 for 循环的计数变量。<br>' +
       '· 它<b>还没有赋值</b>，变量表里显示为 <b>—</b>；<br>' +
       '· 它的作用是记录「已经调用 fun1 右移了几次」。'
});

/* ============ 10：第 12 行 for 初始化 i = 0 ============ */
S.funI = 0;
S.note = 'for 第 1 轮，i = 0';
S.expr = 'i = 0';
S.exprVal = 'i = 0';
emit({
  line:12, kind:'mv',
  title:'for 第 1 轮：<b>i = 0</b>',
  desc:'for 循环的<b>初始化部分</b>先执行：<code>i = 0</code>。<br>' +
       '· i 表示「已经完成了多少次右移」；<br>' +
       '· 接下来判断条件 <code>i &lt; m</code>。'
});

/* ============ 11：第 12 行 for 条件 i < m ============ */
S.note = 'i < m 成立（0 < 2）';
S.expr = 'i < m   →   0 < 2';
S.exprVal = '真 → 进入循环体';
emit({
  line:12, kind:'mv',
  title:'for 条件：<b>0 &lt; 2</b> → <b>真</b>',
  desc:'判断循环条件 <code>i &lt; m</code>：<br>' +
       '· i = <b>0</b>，m = <b>2</b>，<code>0 &lt; 2</code> 成立；<br>' +
       '· 进入循环体，调用 fun1 把数组右移一位。'
});

/* ============ 12：第 13 行 准备调用 fun1 ============ */
S.expr = 'fun1(a, n)   →   fun1(a, 7)';
S.exprVal = '把数组首地址和长度 7 传给 fun1';
S.note = '准备进入 fun1 函数';
S.fun1Count = 1;
emit({
  line:13, kind:'call',
  title:'fun1(a, n);　准备调用右移一位函数（第 1 次）',
  desc:'第 13 行调用 <code>fun1(a, n)</code>：<br>' +
       '· 实参 <code>a</code> 仍然是<b>数组首地址</b>，被继续往下传；<br>' +

function bringFront(el){
  zTop += 1;
  el.style.zIndex = zTop;
  panelEls.forEach(function(p){ p.classList.remove('top'); });
  el.classList.add('top');
}

function makePanel(el){
  var head = el.querySelector('.phead');
  var rs   = el.querySelector('.rs');

  el.addEventListener('pointerdown', function(){ bringFront(el); }, true);

  var cbtn = el.querySelector('[data-act="collapse"]');
  if (cbtn) cbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.classList.toggle('collapsed');
  });
  var xbtn = el.querySelector('[data-act="close"]');
  if (xbtn) xbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.style.display = 'none';
  });

  head.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    bringFront(el);
    var r = el.getBoundingClientRect();
    var dx = e.clientX - r.left;
    var dy = e.clientY - r.top;
    function mv(ev){
      el.style.left = (ev.clientX - dx) + 'px';
      el.style.top  = (ev.clientY - dy) + 'px';
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
  });

  if (rs) rs.addEventListener('pointerdown', function(e){
    bringFront(el);
    var r = el.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    function mv(ev){
      el.style.width  = Math.max(0, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(0, sh + ev.clientY - sy) + 'px';
      if (el.id === 'p-mini') rebuildMini();
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      if (el.id === 'p-mini') rebuildMini();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
    e.stopPropagation();
  });
}
panelEls.forEach(makePanel);

var miniLineH = 8;

function rebuildMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;

  var body = document.getElementById('miniBody');
  var w = body.clientWidth - 16;
  if (w <= 10) return;

  var f = Math.max(2, w / 75);
  miniLineH = f * 1.35;

  miniInner.style.fontSize = f + 'px';
  miniLineEls.forEach(function(el){
    el.style.height = miniLineH + 'px';
    el.style.lineHeight = miniLineH + 'px';
  });
  syncMini();
}

function syncMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;
  if (!miniLineH) return;

  var firstCl = codeLineEls[0];
  if (!firstCl) return;

  var lineH = firstCl.getBoundingClientRect().height;
  if (!lineH) return;

  var lineTopOffset = firstCl.offsetTop;
  var sTop = codeScroll.scrollTop;
  var sH   = codeScroll.clientHeight;

  var relTop = Math.max(0, sTop - lineTopOffset);
  var firstIdx = relTop / lineH;
  var count    = sH / lineH;

  var total = 24 * miniLineH;
  var top  = firstIdx * miniLineH;
  var h    = count * miniLineH;

  if (top < 0) top = 0;
  if (top > total) top = total;
  if (top + h > total) h = total - top;
  if (h < 4) h = 4;

  miniView.style.top    = top + 'px';
  miniView.style.height = h + 'px';
}

miniBody.addEventListener('click', function(e){
  if (!miniLineH) return;
  var r = miniInner.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLineH);
  if (idx < 0) idx = 0;
  if (idx > 23) idx = 23;
  centerLine(idx + 1, true);
});

function renderStack(step){
  var stack = (step && step.stack) || [];
  var key = stack.join('/');
  if (key === lastStackKey) return;
  lastStackKey = key;

  if (!stack.length){
    stackBody.innerHTML = '<span class="empty">（空）</span>';
    return;
  }
  var html = '';
  for (var k = 0; k < stack.length; k++){
    if (k > 0) html += '<span class="arr2">→</span>';
    var cls = 'frame';
    if (stack[k] === 'main') cls += ' main';
    else if (stack[k] === 'fun') cls += ' funf';
    else if (stack[k] === 'fun1') cls += ' fun1f';
    if (k === stack.length - 1) cls += ' topF';
    var label = stack[k] === 'main' ? 'main()'
              : stack[k] === 'fun'   ? 'fun(int a[], int n, int m)'
              :                        'fun1(int a[], int n)';
    html += '<span class="' + cls + '">' + label + '</span>';
  }
  stackBody.innerHTML = html;
}

  lastVarsKey = key;

  varsBlock.innerHTML = '';

  var inMain = step.stack.indexOf('main') !== -1;
  var inFun  = step.stack.indexOf('fun')  !== -1;
  var inFun1 = step.stack.indexOf('fun1') !== -1;

  /* main 作用域 */
  if (inMain){
    var gM = document.createElement('div');
    gM.className = 'scope-group scope-main';
    var hM = document.createElement('div');
    hM.className = 'scope-head';
    hM.innerHTML = '<span class="fname">main</span><span class="role">主函数作用域</span>';
    gM.appendChild(hM);

    var iChg = prevStep && prevStep.mainI !== step.mainI;
    gM.appendChild(buildVarRow('i', 'int', fmtNum(step.mainI), step.mainI === null, iChg));

    varsBlock.appendChild(gM);
  }

  /* fun 作用域 */
  if (inFun){
    var gF = document.createElement('div');
    gF.className = 'scope-group scope-fun';
    var hF = document.createElement('div');
    hF.className = 'scope-head';
    hF.innerHTML = '<span class="fname">fun</span><span class="role">右移 m 位（外层封装）</span>';
    gF.appendChild(hF);

    gF.appendChild(buildVarRow('a', 'int *', '→ &a[0]', false, false));

    var nChg = prevStep && prevStep.nVal !== step.nVal;
    gF.appendChild(buildVarRow('n', 'int', fmtNum(step.nVal), step.nVal === null, nChg));

    var mChg = prevStep && prevStep.mVal !== step.mVal;
    gF.appendChild(buildVarRow('m', 'int', fmtNum(step.mVal), step.mVal === null, mChg));

    var iChg2 = prevStep && prevStep.funI !== step.funI;
    gF.appendChild(buildVarRow('i', 'int', fmtNum(step.funI), step.funI === null, iChg2));

    varsBlock.appendChild(gF);
  }

  /* fun1 作用域 */
  if (inFun1){
    var g1 = document.createElement('div');
    g1.className = 'scope-group scope-fun1';
    var h1 = document.createElement('div');
    h1.className = 'scope-head';
    h1.innerHTML = '<span class="fname">fun1</span><span class="role">右移 1 位（每次全新）</span>';
    g1.appendChild(h1);

    g1.appendChild(buildVarRow('a', 'int *', '→ &a[0]', false, false));

    var n1Chg = prevStep && prevStep.nVal !== step.nVal;
    g1.appendChild(buildVarRow('n', 'int', fmtNum(step.nVal), step.nVal === null, n1Chg));

    var tChg = prevStep && prevStep.tVal !== step.tVal;
    g1.appendChild(buildVarRow('t', 'int', fmtNum(step.tVal), step.tVal === null, tChg));

    var i1Chg = prevStep && prevStep.fun1I !== step.fun1I;
    g1.appendChild(buildVarRow('i', 'int', fmtNum(step.fun1I), step.fun1I === null, i1Chg));

    varsBlock.appendChild(g1);
  }

  /* 闪烁 */
  Array.prototype.slice.call(varsBlock.querySelectorAll('.vrow.changed .vv'))
    .forEach(function(el){
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    });
}

function centerLine(n, smooth){
  var el = codeInner.querySelector('.cl[data-line="' + n + '"]');
  if (!el) return;
  var target = el.offsetTop - codeScroll.clientHeight / 2 + el.offsetHeight / 2;
  if (target < 0) target = 0;
  codeScroll.scrollTo({top: target, behavior: smooth ? 'smooth' : 'auto'});
}

function renderOutput(text){
  if (text === lastOut) return;
  lastOut = text;

  consoleBody.innerHTML = '';

  if (!text){
    var ph = document.createElement('span');
    ph.style.color = '#3d5474';
    ph.textContent = '（等待程序输出…）';
    consoleBody.appendChild(ph);
    return;
  }

  consoleBody.appendChild(document.createTextNode(text));
  var cur = document.createElement('span');
  cur.className = 'cursor';
  cur.textContent = '▊';
  consoleBody.appendChild(cur);
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current - 1] : null;
  var activeLine = step ? step.line : null;

  var done = {};
  for (var k = 0; k <= current; k++){
    if (STEPS[k]) done[STEPS[k].line] = true;
  }

  codeLineEls.forEach(function(el){
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);
    el.classList.toggle('done', !!done[n] && n !== activeLine);
  });

  updateMiniActive(activeLine);
  renderStack(step);
  renderVars(step, prev);
  renderArr(step);
  renderT(step);
  renderOutput(step ? step.out : '');

  funcValEl.textContent = step ? step.func : '—';

  /* 右移进度 */
  if (step){
    if (step.fun1Count > 0){
      var doneCnt = (step.rotDone !== null && step.rotDone !== undefined) ? step.rotDone : 0;
      var inFun1 = step.stack.indexOf('fun1') !== -1;
      var inFun  = step.stack.indexOf('fun')  !== -1;
      if (inFun1) doneCnt = (step.funI !== null && step.funI !== undefined) ? step.funI : doneCnt;
      rotValEl.textContent = doneCnt + ' / ' + M;
    } else {
      rotValEl.textContent = '0 / ' + M;
    }
  } else {
    rotValEl.textContent = '0 / ' + M;
  }

  if (step){
    var cls = 'expLine';
    if (step.kind === 'pre') cls += ' pre';
    else if (step.kind === 'call') cls += ' mv';
    else if (step.kind === 'out') cls += ' gold';
    else if (step.kind === 'ret') cls += ' ret';
    else if (step.kind === 'skip') cls += ' skip';

    expText.innerHTML =
      '<span class="' + cls + '">第 ' + step.line + ' 行</span>' +
      '<strong>' + step.title + '</strong><br>' + step.desc;
    stepCounter.textContent = '步骤 ' + (current + 1) + ' / ' + STEPS.length;
  } else {
    expText.innerHTML =
      '<strong>点击「▶ 播放」或「下一步」，开始逐条执行程序。</strong><br>' +
      '本程序演示 <b>数组循环右移</b>、<b>三层函数嵌套调用</b>、<b>调用栈</b>、' +
      '<b>数组传地址</b> 与 <b>值传递</b>：<br>' +
      '· <b>fun1(a, n)</b>：把数组循环右移一位（暂存尾元素 → 整体后移 → 尾元素放到首位）；<br>' +
      '· <b>fun(a, n, m)</b>：调用 fun1 共 m 次，实现右移 m 位；<br>' +
      '· <b>main</b>：初始化数组 → 调用 fun(a,7,2) → 循环输出结果。<br>' +
      '· 初始数组：<b>1, 2, 3, 4, 5, 6, 7</b><br>' +
      '· 右移 2 位后：<b>6, 7, 1, 2, 3, 4, 5</b><br>' +
      '<span class="tip"><b>预计输出（1 行，末尾带空格）：</b><br>' +
      '<code>6 7 1 2 3 4 5 ▊</code></span>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  if (activeLine) centerLine(activeLine, true);
  window.requestAnimationFrame(syncMini);
}

/* =====================================================================
   十、播放控制
   ===================================================================== */
function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btnPlay.classList.toggle('playing', playing);
}

function tick(){
  if (current >= STEPS.length - 1){ pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}

function play(){
  if (playing) return;
  if (current >= STEPS.length - 1){ current = -1; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}

function nextStep(){
  pause();
  if (current < STEPS.length - 1){ current += 1; render(); }
}

function prevStep(){
  pause();
  if (current > -1){ current -= 1; render(); }
}

function resetAll(){
  pause();
  current = -1;
  lastOut = null;
  lastVarsKey = null;
  lastArrKey = null;
  lastStackKey = null;
  lastTKey = null;
  consoleBody.innerHTML = '';
  codeScroll.scrollTop = 0;
  render();
  window.requestAnimationFrame(function(){
    codeScroll.scrollTop = 0;
    syncMini();
  });
}

btnPlay.addEventListener('click', function(){ if (playing) pause(); else play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

function updateSpeedLabel(){
  speedLbl.textContent = (speed / 1000).toFixed(1) + 's';
}
speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  updateSpeedLabel();
  if (playing){
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

btnFs.addEventListener('click', function(){
  if (!document.fullscreenElement){
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});

btnPanels.addEventListener('click', function(){
  var anyVisible = panelEls.some(function(p){ return p.style.display !== 'none'; });
  panelEls.forEach(function(p){
    p.style.display = anyVisible ? 'none' : '';
    if (!anyVisible) p.classList.remove('collapsed');
  });
  if (!anyVisible) rebuildMini();
});

btnMini.addEventListener('click', function(){
  var m = document.getElementById('p-mini');
  var hidden = (m.style.display === 'none');
  m.style.display = hidden ? '' : 'none';
  if (hidden) rebuildMini();
});

btnLayout.addEventListener('click', function(){
  panelEls.forEach(function(p){
    p.style.display = '';
    p.classList.remove('collapsed');
  });
  applyDefaultLayout();
  render();
});

/* =====================================================================
   十一、全局快捷键
   ===================================================================== */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

  if (e.code === 'Space'){ e.preventDefault(); if (playing) pause(); else play(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR'){ e.preventDefault(); resetAll(); }
  else if (e.code === 'KeyF'){ e.preventDefault(); btnFs.click(); }
  else if (e.code === 'KeyM'){ e.preventDefault(); btnMini.click(); }
  else if (e.code === 'KeyH'){ e.preventDefault(); btnPanels.click(); }
});

/* =====================================================================
   十二、滚动同步
   ===================================================================== */
var rafPending = false;
function scheduleSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){
    rafPending = false;
    syncMini();
  });
}

codeScroll.addEventListener('scroll', scheduleSync, {passive:true});
window.addEventListener('resize', function(){
  rebuildMini();
  scheduleSync();
});
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ rebuildMini(); syncMini(); });
}

/* =====================================================================
   十三、启动
   ===================================================================== */
applyDefaultLayout();
updateSpeedLabel();
render();
window.requestAnimationFrame(function(){
  rebuildMini();
  syncMini();
});
window.setTimeout(function(){ rebuildMini(); syncMini(); }, 300);

})();
</script>
</body>
</html>
