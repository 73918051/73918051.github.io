<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 指针相减 p1 - p · 输出 4</title>
<style>
  :root{
    --code-font: clamp(34px, 4.4vw, 88px);
    --ln-font:   clamp(20px, 2.5vw, 52px);
    --out-font:  clamp(36px, 4.6vw, 84px);
    --var-font:  clamp(18px, 2.1vw, 40px);
    --small-font:clamp(14px, 1.5vw, 28px);
    --explain-font: clamp(20px, 2.5vw, 48px);
    --btn-font:  clamp(16px, 2.0vw, 38px);
    --title-font:clamp(18px, 1.9vw, 36px);
    --bg:#0d1117;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:#dce8f8;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }

  /* ============ 全屏代码区 ============ */
  #codeArea{position:fixed;inset:0;background:var(--bg);z-index:0;overflow:hidden;}
  #codeScroll{
    position:absolute;inset:0;overflow:auto;
    padding:10vh 60px 55vh 12px;
    scrollbar-width:thin;scrollbar-color:#334155 transparent;
    white-space:nowrap;              /* 修复①：不换行 */
  }
  #codeScroll::-webkit-scrollbar{width:16px;height:16px;}
  #codeScroll::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:10px;}
  #codeScroll::-webkit-scrollbar-track{background:#0d1117;}

  #codeInner{display:inline-block;min-width:100%;}

  .code-line{
    display:flex;align-items:flex-start;
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    font-size:var(--code-font);line-height:1.7;white-space:pre;
    /* 修复②：单行不折行 */
    width:max-content;min-width:100%;
    border-left:10px solid transparent;border-radius:8px;
    transition:background .25s,border-color .25s,opacity .25s;
  }
  .code-line .ln{
    flex:0 0 auto;width:3.4ch;text-align:right;color:#3f5a7d;
    user-select:none;font-size:var(--ln-font);line-height:1.7;padding-right:.7ch;
  }
  .code-line .src{flex:1 1 auto;white-space:pre;}
  .code-line.done{opacity:.34;}
  .code-line.active{
    opacity:1;
    background:linear-gradient(90deg,rgba(56,189,248,.30),rgba(56,189,248,.03));
    border-left-color:#38bdf8;
    box-shadow:inset 0 0 0 3px rgba(56,189,248,.4);
  }
  .code-line.active .src{color:#ffffff;}
  .code-line.active .ln{color:#38bdf8;font-weight:800;}

  .pp{color:#c084fc;font-weight:700;}
  .str{color:#4ade80;}
  .cmt{color:#5b6f8c;font-style:italic;}
  .fn{color:#38bdf8;font-weight:700;}
  .kw{color:#f472b6;font-weight:700;}
  .num{color:#fbbf24;}
  .op{color:#fb923c;font-weight:800;}
  .v-a{color:#22d3ee;font-weight:700;}
  .v-p{color:#f472b6;font-weight:700;text-decoration:underline;text-decoration-color:rgba(244,114,182,.5);}
  .v-p1{color:#2dd4bf;font-weight:700;text-decoration:underline;text-decoration-color:rgba(45,212,191,.5);}
  .v-n{color:#facc15;font-weight:700;}
  .v-sub{color:#facc15;font-weight:800;}
  .v-illegal{color:#ef4444;font-weight:800;text-decoration:line-through;}

  /* ============ 面板通用 ============ */
  .panel{
    position:fixed;z-index:10;display:flex;flex-direction:column;
    background:rgba(13,17,23,.82);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:2px solid #22334d;border-radius:16px;
    box-shadow:0 14px 48px rgba(0,0,0,.65);overflow:hidden;
  }
  .panel.is-active{
    border-color:#38bdf8;
    box-shadow:0 0 0 3px rgba(56,189,248,.45),0 14px 48px rgba(0,0,0,.75);
  }
  .panel-head{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:8px 12px;background:rgba(30,47,73,.75);
    border-bottom:1px solid #22334d;cursor:move;user-select:none;touch-action:none;
  }
  .panel-title{
    font-size:var(--title-font);font-weight:800;color:#9fd4ff;
    letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:1 1 auto;
  }
  .panel-close{
    margin-left:auto;flex:0 0 auto;
    width:48px;height:48px;min-width:48px;
    border-radius:12px;border:2px solid #3a4f6e;
    background:#1b2a42;color:#dce8f8;font-size:32px;line-height:1;
    font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .panel-close:hover{background:#c0392b;border-color:#e74c3c;color:#fff;}
  .panel-body{
    flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;
    scrollbar-width:thin;scrollbar-color:#334155 transparent;
  }
  .panel-body::-webkit-scrollbar{width:12px;height:12px;}
  .panel-body::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}
  .rs{position:absolute;right:0;bottom:0;width:44px;height:44px;
      cursor:nwse-resize;z-index:9;touch-action:none;}
  .rs::after{
    content:'';position:absolute;right:8px;bottom:8px;width:22px;height:22px;
    border-right:4px solid #38bdf8;border-bottom:4px solid #38bdf8;opacity:.85;
  }

  /* ============ 工具栏 ============ */
  #toolbar{left:16px;top:12px;width:auto;max-width:calc(100vw - 32px);flex-direction:column;}
  #toolbar .panel-head{padding:4px 10px;}
  #toolbar .panel-body{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;}
  button.tb{
    font:inherit;font-size:var(--btn-font);font-weight:700;
    padding:.45em .85em;min-height:66px;border-radius:14px;
    border:2px solid #33507d;background:#182741;color:#dce8f8;
    cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .08s;
  }
  button.tb:hover{background:#213352;border-color:#4a7ab8;}
  button.tb:active{transform:translateY(2px);}
  button.tb.primary{
    background:linear-gradient(180deg,#0ea5e9,#0284c7);
    border-color:#38bdf8;color:#04121f;
  }
  button.tb.primary.playing{
    background:linear-gradient(180deg,#f59e0b,#d97706);
    border-color:#fbbf24;color:#1a1200;
  }
  button.tb.icon{padding:.45em .65em;min-width:76px;}
  .speed-wrap{display:flex;align-items:center;gap:8px;
    font-size:var(--small-font);color:#8fa8c8;padding:0 6px;}
  .speed-wrap input[type=range]{width:200px;height:44px;accent-color:#38bdf8;cursor:pointer;}
  .speed-wrap b{color:#38bdf8;min-width:2.6em;display:inline-block;font-variant-numeric:tabular-nums;}

  /* ============ 变量面板 ============ */
  #varsPanel{left:16px;top:106px;width:540px;height:330px;}
  .kv-row{
    display:flex;gap:10px;align-items:baseline;font-size:var(--var-font);
    line-height:1.5;padding:4px 0;border-bottom:1px dashed #1b293f;
  }
  .kv-row .k{color:#7d93b3;flex:0 0 auto;}
  .kv-row .v{
    color:#2dd4bf;font-weight:800;font-family:ui-monospace,Consolas,monospace;
    word-break:break-word;text-align:right;flex:1 1 auto;
  }
  .sec-title{
    font-size:var(--small-font);color:#5f7796;letter-spacing:.08em;
    margin:12px 0 6px;text-transform:uppercase;font-weight:700;
  }
  .stack-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  .frame{
    font-family:ui-monospace,Consolas,monospace;font-size:var(--var-font);
    font-weight:800;padding:.15em .6em;border-radius:10px;
    background:#0d1728;border:2px solid #1b293f;color:#8aa2c0;
  }
  .frame.active{
    border-color:#38bdf8;background:rgba(56,189,248,.22);color:#fff;
    box-shadow:0 0 0 3px rgba(56,189,248,.35);
  }
  .frame-empty{color:#3d5474;font-size:var(--var-font);}
  .arrow{color:#3f5a7d;font-size:var(--var-font);font-weight:800;}

  .vrow{
    display:flex;flex-direction:column;gap:2px;
    padding:5px 10px;margin-bottom:6px;border-radius:10px;
    background:#0d1728;border-left:8px solid #26456b;
  }
  .vrow.k-p{border-left-color:#f472b6;}
  .vrow.k-p1{border-left-color:#2dd4bf;}
  .vrow.k-byte{border-left-color:#c084fc;}
  .vrow.k-elem{border-left-color:#facc15;}
  .vrow.k-n{border-left-color:#22d3ee;}
  .vrow.k-stat{border-left-color:#facc15;}
  .vtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .vname{font-size:var(--var-font);font-weight:800;color:#c8d7ec;
    font-family:ui-monospace,Consolas,monospace;}
  .vtype{font-size:var(--small-font);color:#5f7796;
    font-family:ui-monospace,Consolas,monospace;}
  .vval{
    font-size:var(--var-font);font-weight:800;
    font-family:ui-monospace,Consolas,monospace;
    color:#38bdf8;word-break:break-all;line-height:1.35;
  }
  .vrow.k-p .vval{color:#f472b6;}
  .vrow.k-p1 .vval{color:#2dd4bf;}
  .vrow.k-byte .vval{color:#c084fc;}
  .vrow.k-elem .vval{color:#facc15;}
  .vrow.k-n .vval{color:#22d3ee;}
  .vrow.k-stat .vval{color:#facc15;}
  .vval.dim{color:#5f7796 !important;font-weight:600;}
  @keyframes flash{0%{transform:scale(1);}35%{transform:scale(1.10);filter:brightness(1.6);}100%{transform:scale(1);}}
  .vrow.flash{animation:flash .55s ease-out;}

  /* ============ 数组面板 ============ */
  #arrPanel{left:572px;top:106px;width:600px;height:330px;}
  .arr-head{
    font-size:var(--small-font);color:#9db1cb;
    font-family:ui-monospace,Consolas,monospace;
    margin-bottom:10px;letter-spacing:.03em;
  }
  .arr-head b{color:#38bdf8;}
  .arr-head .gold{color:#facc15;}
  .arr-row{display:flex;gap:10px;flex-wrap:wrap;}
  .arr-cell{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    min-width:5.5rem;padding:.5em .7em .55em;
    border-radius:12px;background:#0d1728;border:2px solid #1b293f;
    font-family:ui-monospace,Consolas,monospace;
    transition:all .28s;
  }
  .arr-cell.is-range{
    background:rgba(250,204,21,.08);
    border-color:rgba(250,204,21,.35);
  }
  .arr-idx{font-size:var(--small-font);color:#4c6689;line-height:1.15;font-weight:700;}
  .arr-val{font-size:calc(var(--var-font) * 1.3);font-weight:800;color:#c8d7ec;line-height:1.15;}
  .arr-addr{font-size:calc(var(--small-font) * .85);color:#3d5474;line-height:1.15;}
  .arr-markers{display:flex;gap:4px;min-height:1.4em;margin-top:2px;align-items:center;flex-wrap:wrap;}
  .mk{
    font-size:calc(var(--small-font) * .8);font-weight:800;line-height:1.3;
    padding:0 .35em;border-radius:6px;letter-spacing:.02em;
  }
  .mk-p   {background:rgba(244,114,182,.35);color:#fbcfe8;border:1px solid #f472b6;}
  .mk-p1  {background:rgba(45,212,191,.35);color:#99f6e4;border:1px solid #2dd4bf;}
  .arr-cell.is-p{
    border-color:#f472b6;background:rgba(244,114,182,.22);
    box-shadow:0 0 0 3px rgba(244,114,182,.45);
  }
  .arr-cell.is-p .arr-val,.arr-cell.is-p .arr-idx{color:#f472b6;}
  .arr-cell.is-p1{
    border-color:#2dd4bf;background:rgba(45,212,191,.22);
    box-shadow:0 0 0 3px rgba(45,212,191,.45);
  }
  .arr-cell.is-p1 .arr-val,.arr-cell.is-p1 .arr-idx{color:#2dd4bf;}
  @keyframes cellPulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .arr-cell.pulse{animation:cellPulse .6s ease-out;}

  /* ============ 指针图面板 ============ */
  #ptrPanel{left:1188px;top:106px;width:560px;height:330px;}
  .ptr-map{
    display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;
    min-height:3em;
  }
  .ptr-map-empty{color:#3d5474;font-size:var(--var-font);font-family:ui-monospace,monospace;}
  .ptr-node{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:.45em 1em;border-radius:12px;background:#0d1728;
    border:2px solid #1b293f;font-family:ui-monospace,Consolas,monospace;
    transition:all .28s;
  }
  .ptr-node.is-p{
    border-color:#f472b6;background:rgba(244,114,182,.14);
    box-shadow:0 0 0 2px rgba(244,114,182,.35);
  }
  .ptr-node.is-p .ptr-label,.ptr-node.is-p .ptr-val{color:#f472b6;}
  .ptr-node.is-p1{
    border-color:#2dd4bf;background:rgba(45,212,191,.14);
    box-shadow:0 0 0 2px rgba(45,212,191,.35);
  }
  .ptr-node.is-p1 .ptr-label,.ptr-node.is-p1 .ptr-val{color:#2dd4bf;}
  .ptr-node.is-target{
    border-color:#2dd4bf;background:rgba(45,212,191,.15);
    box-shadow:0 0 0 2px rgba(45,212,191,.4);
  }
  .ptr-node.is-target .ptr-label,
  .ptr-node.is-target .ptr-val,
  .ptr-node.is-target .ptr-addr{color:#2dd4bf;}
  .ptr-node.is-gold{
    border-color:#facc15;background:rgba(250,204,21,.14);
    box-shadow:0 0 0 2px rgba(250,204,21,.45);
  }
  .ptr-node.is-gold .ptr-label,
  .ptr-node.is-gold .ptr-val,
  .ptr-node.is-gold .ptr-addr{color:#facc15;}
  .ptr-node.pulse{animation:cellPulse .55s ease-out;}
  .ptr-label{font-size:var(--var-font);font-weight:800;color:#c8d7ec;}
  .ptr-addr{font-size:calc(var(--small-font) * .9);color:#4c6689;}
  .ptr-val{font-size:var(--var-font);font-weight:700;color:#9fb6d2;}
  .ptr-arrow{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:calc(var(--var-font) * 1.2);font-weight:800;
    animation:arrowPulse 1.6s ease-in-out infinite;
  }
  .ptr-arrow .addr{
    font-size:calc(var(--small-font) * .9);letter-spacing:0;
    font-family:ui-monospace,Consolas,monospace;
  }
  .ptr-arrow.c-pink{color:#f472b6;}
  .ptr-arrow.c-pink .addr{color:#f472b6;}
  .ptr-arrow.c-teal{color:#2dd4bf;}
  .ptr-arrow.c-teal .addr{color:#2dd4bf;}
  @keyframes arrowPulse{
    0%,100%{opacity:.55;transform:translateX(0);}
    50%{opacity:1;transform:translateX(4px);}
  }
  .ptr-pair{display:flex;align-items:center;gap:8px;padding:4px 8px;
    background:rgba(56,189,248,.06);border-radius:10px;}

  /* ============ 输出面板 ============ */
  #outPanel{left:16px;top:448px;width:540px;height:230px;}
  .out-line{
    font-family:ui-monospace,Consolas,monospace;
    font-size:var(--out-font);line-height:1.35;color:#86efac;
    word-break:break-all;white-space:pre;
  }
  .out-line.out-empty{color:#3d5474;font-size:calc(var(--out-font) * .7);}
  .out-exit{
    margin-top:14px;padding-top:12px;border-top:2px dashed #22334d;
    font-family:ui-monospace,Consolas,monospace;
    font-size:calc(var(--out-font) * .62);font-weight:800;color:#facc15;
  }
  .cursor{
    display:inline-block;color:#4ade80;font-weight:400;
    animation:blink 1s step-end infinite;margin-left:2px;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

  /* ============ 说明条 ============ */
  #explainPanel{left:572px;top:448px;width:1176px;height:230px;}
  .ex-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
  .ex-line-tag{
    font-size:var(--small-font);font-weight:800;color:#04121f;
    background:#38bdf8;border-radius:8px;padding:.15em .7em;white-space:nowrap;
  }
  .ex-title{font-size:var(--explain-font);font-weight:800;color:#ffffff;line-height:1.35;}
  .ex-body{font-size:var(--explain-font);line-height:1.6;color:#b8c9e0;}
  .ex-body b,.ex-body strong{color:#eaf3ff;}
  .ex-body code{
    font-family:ui-monospace,Consolas,monospace;
    background:rgba(148,163,184,.18);border-radius:6px;
    padding:0 .35em;color:#e2e8f0;
  }
  .ex-body .tip{display:block;margin-top:8px;padding:8px 12px;border-radius:10px;
    background:rgba(45,212,191,.12);border-left:6px solid #2dd4bf;color:#bff5ec;}
  .ex-body .warn{display:block;margin-top:8px;padding:8px 12px;border-radius:10px;
    background:rgba(251,191,36,.14);border-left:6px solid #fbbf24;color:#ffe6b0;}
  .ex-body .win{display:block;margin-top:8px;padding:10px 14px;border-radius:10px;
    background:rgba(250,204,21,.16);border-left:6px solid #facc15;color:#fff3c4;font-weight:700;}
  .ex-body .err{display:block;margin-top:8px;padding:8px 12px;border-radius:10px;
    background:rgba(239,68,68,.16);border-left:6px solid #ef4444;color:#fecaca;font-weight:700;}

  /* ============ 缩略图 ============ */
  #miniPanel{left:1780px;top:106px;width:176px;height:400px;}
  #miniPanel .panel-head{padding:4px 8px;cursor:move;}
  #miniPanel .panel-title{font-size:var(--small-font);}
  #miniPanel .panel-close{width:38px;height:38px;min-width:38px;font-size:24px;}
  #miniBody{position:relative;flex:1 1 auto;overflow:hidden;background:rgba(5,12,23,.6);}
  #miniScroll{position:absolute;inset:0;overflow:hidden;}
  .mini-line{
    height:9px;line-height:9px;font-size:5.5px;
    font-family:ui-monospace,Consolas,monospace;
    white-space:pre;overflow:hidden;color:#7d93b3;padding-left:3px;
  }
  .mini-line .ln-mini{color:#3f5a7d;margin-right:3px;}
  .mini-line.cur{
    background:rgba(56,189,248,.55);
    box-shadow:inset 0 0 0 1px rgba(56,189,248,1);
    color:#ffffff;
  }
  /* 修复③：视口荧光框永远显示在最上层 */
  #miniBox{
    position:absolute;left:0;right:0;top:0;height:40px;
    border:2px solid rgba(56,189,248,.95);background:rgba(56,189,248,.12);
    pointer-events:none;box-sizing:border-box;z-index:5;
    box-shadow:0 0 0 1px rgba(56,189,248,.5);
  }

  /* ============ 提示词 ============ */
  #promptPanel{left:16px;top:106px;width:900px;height:520px;display:none;}
  #promptPanel pre{
    font-family:ui-monospace,Consolas,monospace;
    font-size:var(--small-font);line-height:1.6;color:#a9bdd8;
    white-space:pre-wrap;word-break:break-word;
  }
</style>
</head>
<body>

<div id="codeArea">
  <div id="codeScroll"><div id="codeInner"></div></div>
</div>

<div class="panel" id="toolbar">
  <div class="panel-head">
    <span class="panel-title">C 逐步执行模拟 · 指针相减 p1 - p</span>
    <button class="panel-close" data-close="toolbar" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <button class="tb" id="btnReset">⟲ 重置</button>
    <button class="tb" id="btnPrev">◀ 上一步</button>
    <button class="tb primary" id="btnPlay">▶ 播放</button>
    <button class="tb" id="btnNext">下一步 ▶</button>
    <div class="speed-wrap">
      速度<input type="range" id="speed" min="120" max="2000" step="20" value="700">
      <b id="speedLabel">0.70s</b>
    </div>
    <button class="tb icon" id="btnFull" title="全屏 (F)">⛶</button>
    <button class="tb icon" id="btnPanels" title="显示/隐藏全部面板 (H)">👁</button>
    <button class="tb icon" id="btnMini" title="显示/隐藏缩略图 (M)">🗺</button>
    <button class="tb icon" id="btnLayout" title="重置布局">⊞</button>
    <button class="tb icon" id="btnPrompt" title="提示词">📝</button>
  </div>
</div>

<div class="panel" id="varsPanel">
  <div class="panel-head">
    <span class="panel-title">调用栈 · 变量表 · 状态</span>
    <button class="panel-close" data-close="varsPanel" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="kv-row"><span class="k">当前函数</span><span class="v" id="vFunc">—</span></div>
    <div class="kv-row"><span class="k">调用栈深度</span><span class="v" id="vDepth">0</span></div>
    <div class="kv-row"><span class="k">执行位置</span><span class="v" id="vCtx">—</span></div>
    <div class="kv-row"><span class="k">正在求值</span><span class="v" id="vExpr">—</span></div>
    <div class="kv-row"><span class="k">语句结果</span><span class="v" id="vExprVal">—</span></div>

    exprVal:'把 stdio.h 的内容插入到本文件',

  /* ---- 第 2 步 / 第 2 行 ---- */

  snap({

var MINI_LINE_H = 9;

function syncMini(){
  if(!codeLineEls.length) return;
  var fullLineH = codeLineEls[0].getBoundingClientRect().height || 1;
  var miniTotal = TOTAL_LINES * MINI_LINE_H;
  var visibleLines = codeScroll.clientHeight / fullLineH;
  var boxTop = (codeScroll.scrollTop / fullLineH) * MINI_LINE_H;
  var boxH   = visibleLines * MINI_LINE_H;
  if(boxTop < 0) boxTop = 0;
  if(boxH > miniTotal) boxH = miniTotal;
  if(boxTop + boxH > miniTotal) boxTop = Math.max(0, miniTotal - boxH);
  miniBox.style.top = boxTop + 'px';
  miniBox.style.height = boxH + 'px';
}

function centerOnLine(n){
  var el = null;
  for(var i=0;i<codeLineEls.length;i++){
    if(+codeLineEls[i].dataset.line === n){ el = codeLineEls[i]; break; }
  }
  if(!el) return;
  var cr = codeScroll.getBoundingClientRect();
  var er = el.getBoundingClientRect();
  var delta = (er.top + er.height/2) - (cr.top + cr.height/2);
  codeScroll.scrollTop += delta;
  requestAnimationFrame(syncMini);
}

function scrollToLineNo(n){
  var el = null;
  for(var i=0;i<codeLineEls.length;i++){
    if(+codeLineEls[i].dataset.line === n){ el = codeLineEls[i]; break; }
  }
  if(!el) return;
  var cr = codeScroll.getBoundingClientRect();
  var er = el.getBoundingClientRect();
  var delta = (er.top + er.height/2) - (cr.top + cr.height/2);
  codeScroll.scrollTop += delta;
  syncMini();
}

  } else {
    h += '<div class="ptr-node">' +
           '<div class="ptr-label">p1</div>' +
           '<div class="ptr-addr">@ '+ADDR_P1+'</div>' +
           '<div class="ptr-val">（未声明）</div>' +
         '</div>';
  }

  /* 结果节点 */
  if(step.vars.elemDiff !== '（未计算）'){
    h += '<div class="ptr-pair">' +
           '<div class="ptr-node is-gold">' +
             '<div class="ptr-label">p1 - p</div>' +
             '<div class="ptr-addr">元素个数</div>' +
             '<div class="ptr-val">'+step.vars.elemDiff+'</div>' +
           '</div>' +
           '<div class="ptr-node is-gold">' +
             '<div class="ptr-label">字节差</div>' +
             '<div class="ptr-addr">0x10</div>' +
             '<div class="ptr-val">16 字节</div>' +
           '</div>' +
         '</div>';
  }

  ptrMapEl.innerHTML = h;
}

function centerActiveLine(){
  var el = codeScroll.querySelector('.code-line.active');
  if(!el) return;
  var er = el.getBoundingClientRect();
  var cr = codeScroll.getBoundingClientRect();
  var delta = (er.top + er.height/2) - (cr.top + cr.height/2);
  if(Math.abs(delta) > 4) codeScroll.scrollTop = Math.max(0, codeScroll.scrollTop + delta);
}

/* 修复④：同时更新全屏代码和缩略图的当前行高亮 */
function updateCode(step){
  var activeLine = step ? step.line : null;
  for(var w=0;w<codeLineEls.length;w++){
    var el = codeLineEls[w];
    var n = Number(el.dataset.line);
    if(activeLine !== null && n === activeLine) el.classList.add('active');
    else el.classList.remove('active');
  }
  /* 缩略图当前行高亮 —— 修复缩略图定位无荧光 */
  for(var j=0;j<miniLineEls.length;j++){
    var m = miniLineEls[j];
    var mn = Number(m.dataset.mline);
    if(activeLine !== null && mn === activeLine) m.classList.add('cur');
    else m.classList.remove('cur');
  }
  centerActiveLine();
}

function makeCursor(){
  var cur = document.createElement('span');
  cur.className = 'cursor';
  cur.textContent = '▊';
  return cur;
}

function updateOutput(idx){
  var text = (idx >= 0 && STEPS[idx]) ? STEPS[idx].out : '';
  if(text === ''){
    outBody.innerHTML = '<div class="out-line out-empty">（等待程序输出…）</div>';
    return;
  }
  var parts = text.split('\n');
  if(parts.length > 0 && parts[parts.length - 1] === '') parts.pop();
  var h = '';
  for(var w=0;w<parts.length;w++){
    h += '<div class="out-line">'+esc(parts[w])+'</div>';
  }
  outBody.innerHTML = h;
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current-1] : null;

  updateCode(step);
  if(step){
    renderVars(step, prev);
    renderArray(step);
    renderPtrMap(step);
    updateOutput(current);
    exTag.textContent = '第 ' + step.line + ' 行';
    exTitle.innerHTML = step.title;
    exBody.innerHTML  = step.desc;
  } else {
    renderVars({func:'—',stack:[],vars:{ctx:'—',expr:'—',exprVal:'—',note:'—',
      p:'尚未声明',p1:'尚未声明',byteDiff:'（未计算）',elemDiff:'（未计算）',
      n:'尚未声明',outBuf:'（空）',printfCnt:'0',retVal:'—'}}, null);
    renderArray({array:null});
    renderPtrMap({array:null});
    outBody.innerHTML = '<div class="out-line out-empty">（等待程序输出…）</div>';
    exTag.textContent = '第 — 行';
    exTitle.textContent = '点击「播放」或「下一步」开始';
    exBody.innerHTML = '<b>本程序演示：指针相减 p1 - p（得元素个数 4）· 指针不能相加</b><br>' +
      '共 11 行代码、' + STEPS.length + ' 个执行步骤。<br>' +
      '屏幕最终输出 <b>1 行</b>：<code>p1 - p = 4</code>，退出码 <b>0</b>。';
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;
  syncMini();
}

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  if(playing) btnPlay.classList.add('playing');
  else btnPlay.classList.remove('playing');
}

function tick(){
  if(current >= STEPS.length - 1){ pause(); return; }
  current++; render();
  if(current >= STEPS.length - 1) pause();
}

function play(){
  if(playing) return;
  if(current >= STEPS.length - 1){ current = -1; render(); }
  playing = true; updatePlayBtn();
  clearInterval(timer); timer = setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false; clearInterval(timer); timer = null; updatePlayBtn();
}

function nextStep(){ pause(); if(current < STEPS.length - 1){ current++; render(); } }
function prevStep(){ pause(); if(current > -1){ current--; render(); } }
function resetAll(){ pause(); current = -1; codeScroll.scrollTop = 0; render(); }

btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  speedLabel.textContent = (speed/1000).toFixed(2) + 's';
  if(playing){ clearInterval(timer); timer = setInterval(tick, speed); }
});

/* ============= 面板系统 ============= */
var zTop = 10;
var allPanels = [];

function activatePanel(p){
  zTop++;
  p.style.zIndex = zTop;
  for(var i=0;i<allPanels.length;i++) allPanels[i].classList.remove('is-active');
  p.classList.add('is-active');
}

function makeDraggable(panel, handle){
  var dragging = false, sx=0, sy=0, ox=0, oy=0;
  handle.addEventListener('pointerdown', function(e){
    if(e.target.closest('.panel-close')) return;
    dragging = true; activatePanel(panel);
    var r = panel.getBoundingClientRect();
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function(e){
    if(!dragging) return;
    panel.style.left = (ox + e.clientX - sx) + 'px';
    panel.style.top  = (oy + e.clientY - sy) + 'px';
  });
  function stop(e){ if(!dragging) return; dragging=false; try{handle.releasePointerCapture(e.pointerId);}catch(_){} }
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

function makeResizable(panel, handle){
  var resizing = false, sx=0, sy=0, ow=0, oh=0;
  handle.addEventListener('pointerdown', function(e){
    resizing = true; activatePanel(panel);
    var r = panel.getBoundingClientRect();
    panel.style.left = r.left + 'px'; panel.style.top = r.top + 'px';
    panel.style.right = 'auto'; panel.style.bottom = 'auto';
    panel.style.width = r.width + 'px'; panel.style.height = r.height + 'px';
    panel.style.minWidth = '0'; panel.style.minHeight = '0';
    panel.style.maxWidth = 'none'; panel.style.maxHeight = 'none';
    sx = e.clientX; sy = e.clientY; ow = r.width; oh = r.height;
    try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault(); e.stopPropagation();
  });
  handle.addEventListener('pointermove', function(e){
    if(!resizing) return;
    var w = ow + e.clientX - sx, h = oh + e.clientY - sy;
    if(w < 0) w = 0; if(h < 0) h = 0;
    panel.style.width = w + 'px'; panel.style.height = h + 'px';
  });
  function stop(e){ if(!resizing) return; resizing=false; try{handle.releasePointerCapture(e.pointerId);}catch(_){} }
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
}

function setupPanels(){
  allPanels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
  for(var i=0;i<allPanels.length;i++){
    (function(p){
      var head = p.querySelector('.panel-head');
      if(head) makeDraggable(p, head);
      var rs = p.querySelector('.rs');
      if(rs) makeResizable(p, rs);
      p.addEventListener('pointerdown', function(e){
        if(e.target.closest('.panel-close')) return;
        activatePanel(p);
      }, true);
    })(allPanels[i]);
  }
  var closers = document.querySelectorAll('.panel-close');
  for(var j=0;j<closers.length;j++){
    (function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var id = b.dataset.close;
        var el = document.getElementById(id);
        if(el) el.style.display = 'none';
      });
    })(closers[j]);
  }
}

/* ============= 默认布局 ============= */
function setRect(el, x, y, w, h){
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.right = 'auto'; el.style.bottom = 'auto';
  if(w !== null && w !== undefined) el.style.width = w + 'px';
  if(h !== null && h !== undefined) el.style.height = h + 'px';
  el.style.minWidth = '0'; el.style.minHeight = '0';
  el.style.maxWidth = 'none'; el.style.maxHeight = 'none';
}

function resetLayout(){
  var W = window.innerWidth, H = window.innerHeight;
  var tb  = document.getElementById('toolbar');
  var vp  = document.getElementById('varsPanel');
  var ap  = document.getElementById('arrPanel');
  var pp  = document.getElementById('ptrPanel');
  var op  = document.getElementById('outPanel');
  var ep  = document.getElementById('explainPanel');
  var mpn = document.getElementById('miniPanel');
  var prp = document.getElementById('promptPanel');

  var all = [tb,vp,ap,pp,op,ep,mpn];
  for(var i=0;i<all.length;i++) all[i].style.display = '';

  if(W >= 1500){
    setRect(tb, 16, 12, null, null);
    setRect(vp, 16, 106, 540, 330);
    setRect(ap, 572, 106, 600, 330);
    setRect(pp, 1188, 106, 560, 330);
    setRect(op, 16, 448, 540, 230);
    setRect(ep, 572, 448, 1176, 230);
    setRect(mpn, Math.max(16, W - 192), 106, 176, 400);
  }else{
    var cw = Math.max(260, Math.round(W * 0.47));
    setRect(tb, 10, 8, null, null);
    setRect(vp, 10, 96, cw, Math.round(H*0.24));
    setRect(ap, 10 + cw + 10, 96, cw, Math.round(H*0.24));
    setRect(pp, 10, 96 + Math.round(H*0.25), cw, Math.round(H*0.24));
    setRect(op, 10 + cw + 10, 96 + Math.round(H*0.25), cw, Math.round(H*0.24));
    setRect(ep, 10, 96 + Math.round(H*0.50), Math.max(200, W - 20), Math.round(H*0.24));
    setRect(mpn, Math.max(10, W - 100), 96, 88, Math.round(H*0.4));
  }
  setRect(prp, 16, 106, Math.min(900, W-32), Math.min(520, H-140));

  zTop = 10;
  for(var k=0;k<allPanels.length;k++){
    zTop++; allPanels[k].style.zIndex = zTop;
    allPanels[k].classList.remove('is-active');
  }
  requestAnimationFrame(syncMini);
}

/* ============= 缩略图交互 ============= */
miniBody.addEventListener('pointerdown', function(){
  activatePanel(document.getElementById('miniPanel'));
});
miniBody.addEventListener('click', function(e){
  var r = miniScroll.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / MINI_LINE_H);
  if(idx < 0) idx = 0;
  if(idx > TOTAL_LINES - 1) idx = TOTAL_LINES - 1;
  scrollToLineNo(CODE_LINES[idx].n);
});

codeScroll.addEventListener('scroll', function(){
  requestAnimationFrame(syncMini);
}, {passive:true});
window.addEventListener('resize', function(){ requestAnimationFrame(syncMini); });

/* ============= 工具栏 & 快捷键 ============= */
btnFull.addEventListener('click', function(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); }
  else { (document.exitFullscreen && document.exitFullscreen()); }
});

var panelsHidden = false;
function togglePanels(){
  panelsHidden = !panelsHidden;
  var ids = ['toolbar','varsPanel','arrPanel','ptrPanel','outPanel','explainPanel','miniPanel','promptPanel'];
  for(var i=0;i<ids.length;i++){
    var el = document.getElementById(ids[i]);
    if(!el) continue;
    el.style.display = panelsHidden ? 'none' : '';
  }
  if(!panelsHidden) resetLayout();
}
btnPanels.addEventListener('click', togglePanels);

var miniVisible = true;
function toggleMini(){
  miniVisible = !miniVisible;
  document.getElementById('miniPanel').style.display = miniVisible ? '' : 'none';
}
btnMini.addEventListener('click', toggleMini);

btnLayout.addEventListener('click', function(){
  panelsHidden = false; miniVisible = true; resetLayout();
});

btnPrompt.addEventListener('click', function(){
  var el = document.getElementById('promptPanel');
  el.style.display = (el.style.display === 'none' || !el.style.display) ? '' : 'none';
  if(el.style.display === ''){
    var W = window.innerWidth, H = window.innerHeight;
    setRect(el, 16, 106, Math.min(900, W-32), Math.min(520, H-140));
    activatePanel(el);
  }
});

promptText.textContent = PROMPT_TEXT;

document.addEventListener('keydown', function(e){
  var t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  else if(e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); }
  else if(e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if(e.code === 'KeyR'){ resetAll(); }
  else if(e.code === 'KeyF'){
    if(!document.fullscreenElement){ (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); }
    else { (document.exitFullscreen && document.exitFullscreen()); }
  }
  else if(e.code === 'KeyM'){ toggleMini(); }
  else if(e.code === 'KeyH'){ togglePanels(); }
});

/* ============= 初始化 ============= */
var current = -1;
var playing = false;
var timer = null;
var speed = Number(speedInput.value);

setupPanels();
resetLayout();
speedLabel.textContent = (speed/1000).toFixed(2) + 's';
render();
requestAnimationFrame(syncMini);
window.addEventListener('load', function(){ requestAnimationFrame(syncMini); });

})();
</script>
