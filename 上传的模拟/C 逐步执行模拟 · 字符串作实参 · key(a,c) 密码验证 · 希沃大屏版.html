<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 逐步执行模拟 · 字符串作实参 · key(a,c) 密码验证 · 希沃大屏版</title>
<style>
/* ======================================================================
   希沃大屏教学版 —— 字符串作实参 · key(a,c) 密码验证
   逻辑要点：
     · 第 18~27 行（key 函数体）必须第 12 行调用后才执行，且执行两次
     · strcmp("hello","world") = -15 ≠ 0 → continue
     · strcmp("hello","hello") =  0      → break
     · 输出 4 个逻辑行（含空行），末尾不换行
   ====================================================================== */
:root{
  --bg:#0d1117;
  --code-font:   clamp(34px, 4.4vw, 92px);
  --ln-font:     clamp(22px, 2.2vw, 52px);
  --out-font:    clamp(28px, 3.0vw, 64px);
  --var-font:    clamp(15px, 1.75vw, 34px);
  --ch-font:     clamp(15px, 1.75vw, 34px);
  --explain-font:clamp(18px, 2.1vw, 44px);
  --btn-font:    clamp(15px, 1.9vw, 36px);
  --title-font:  clamp(15px, 1.8vw, 34px);
  --accent:#38bdf8;
  --green:#4ade80;
  --amber:#fbbf24;
  --pink:#f472b6;
  --purple:#c084fc;
  --teal:#2dd4bf;
  --orange:#fb923c;
  --gold:#facc15;
  --red:#ef4444;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg);color:#dce8f8;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===================== 全屏代码区（永不遮挡） ===================== */
#codeScroll{
  position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:1;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
#codeScroll::-webkit-scrollbar{width:16px;height:16px;}
#codeScroll::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:9px;}
#codeScroll::-webkit-scrollbar-track{background:#0d1117;}

#codeInner{padding:12px 0 40vh 0;}

.cl{
  display:flex;white-space:pre;
  padding:0 3vw 0 0;
  border-left:10px solid transparent;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font);
  line-height:1.48;
  transition:background .25s,border-color .25s,opacity .3s,color .3s;
}
.cl .ln{
  flex:0 0 auto;width:3.2ch;text-align:right;margin-right:1.6ch;
  color:#3d5578;font-size:var(--ln-font);line-height:inherit;
  font-variant-numeric:tabular-nums;user-select:none;
  align-self:center;
}
.cl .src{flex:0 0 auto;color:#c9d8ee;}

.cl.done .src{color:#7b8ea8;}
.cl.done .ln{color:#2c405e;}

.cl.active{
  background:linear-gradient(90deg,rgba(56,189,248,.34),rgba(56,189,248,.02));
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 2px rgba(56,189,248,.30);
}
.cl.active .src{color:#ffffff;}
.cl.active .ln{color:var(--accent);font-weight:700;}
.cl.active{animation:linePulse .5s ease-out;}
@keyframes linePulse{
  0%{transform:translateX(-16px);opacity:.55;}
  100%{transform:translateX(0);opacity:1;}
}

/* 语法高亮 */
.pp{color:var(--purple);font-weight:700;}
.str{color:var(--green);}
.cmt{color:#5b7292;font-style:italic;}
.fn{color:var(--accent);}
.fn-key{color:var(--amber);font-weight:700;}
.fn-cmp{color:var(--pink);font-weight:700;}
.fn-out{color:var(--green);font-weight:700;}
.fn-in{color:var(--teal);font-weight:700;}
.kw{color:var(--pink);font-weight:700;}
.kw-cont{color:#facc15;font-weight:800;background:rgba(250,204,21,.12);padding:0 .14em;border-radius:4px;}
.kw-break{color:#ef4444;font-weight:800;background:rgba(239,68,68,.14);padding:0 .14em;border-radius:4px;}
.num{color:var(--amber);}
.op{color:var(--orange);font-weight:700;}
.nl-hl{
  color:#c084fc;font-weight:800;
  background:rgba(192,132,252,.14);
  padding:0 .14em;border-radius:4px;
  text-decoration:underline wavy rgba(192,132,252,.6);
}

/* ===================== 浮动面板 ===================== */
.panel{
  position:fixed;z-index:100;
  display:flex;flex-direction:column;
  background:rgba(13,17,23,.84);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(56,189,248,.30);
  border-radius:16px;
  box-shadow:0 14px 50px rgba(0,0,0,.65);
  overflow:hidden;
  transition:border-color .18s,box-shadow .18s;
}
.panel.top{
  border-color:rgba(56,189,248,.9);
  box-shadow:0 0 0 2px rgba(56,189,248,.28),0 18px 60px rgba(0,0,0,.78);
}
.phead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  background:linear-gradient(180deg,rgba(30,48,78,.95),rgba(20,32,52,.95));
  border-bottom:1px solid rgba(56,189,248,.22);
  cursor:grab;touch-action:none;
  font-size:var(--title-font);font-weight:700;color:#9fd8ff;
  letter-spacing:.02em;
}
.phead:active{cursor:grabbing;}
.ptitle{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbtns{margin-left:auto;display:flex;gap:8px;flex:0 0 auto;}
.pb{
  width:clamp(28px,2vw,44px);height:clamp(28px,2vw,44px);
  border-radius:10px;border:1px solid rgba(120,160,210,.38);
  background:rgba(30,48,78,.75);color:#bcd4f0;
  font-size:clamp(13px,1vw,22px);line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s;
}
.pb:hover{background:rgba(56,189,248,.30);border-color:var(--accent);color:#fff;}

.pbody{
  flex:1 1 auto;min-height:0;overflow:auto;
  padding:10px 12px;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
.pbody::-webkit-scrollbar{width:10px;height:10px;}
.pbody::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}

.panel.collapsed .pbody{display:none;}
.panel.collapsed .rs{display:none;}

.rs{
  position:absolute;right:0;bottom:0;width:38px;height:38px;
  cursor:nwse-resize;z-index:9;touch-action:none;
}
.rs::after{
  content:'';position:absolute;right:6px;bottom:6px;width:18px;height:18px;
  border-right:4px solid rgba(56,189,248,.85);
  border-bottom:4px solid rgba(56,189,248,.85);
  border-radius:0 0 5px 0;
}

/* ===================== 控制栏 ===================== */
#p-bar .pbody{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  overflow:visible;padding:10px 12px;
}
#p-bar button.act{
  font-size:var(--btn-font);font-weight:700;
  padding:.42em .82em;min-height:clamp(38px,3vw,66px);
  border-radius:12px;border:1px solid rgba(120,160,210,.42);
  background:rgba(30,48,78,.85);color:#dce8f8;cursor:pointer;
  transition:background .15s,border-color .15s,transform .08s;
  white-space:nowrap;
}
#p-bar button.act:hover{background:rgba(56,189,248,.28);border-color:var(--accent);}
#p-bar button.act:active{transform:translateY(2px);}
#p-bar button.act:disabled{opacity:.3;cursor:not-allowed;}
#p-bar button.primary{
  background:linear-gradient(180deg,#0ea5e9,#0284c7);
  border-color:#38bdf8;color:#04121f;
}
#p-bar button.primary.playing{
  background:linear-gradient(180deg,#f59e0b,#d97706);
  border-color:#fbbf24;color:#1a1200;
}
.speedWrap{
  display:flex;align-items:center;gap:10px;
  font-size:var(--btn-font);color:#9db1cb;white-space:nowrap;
  padding:0 6px;
}
.speedWrap input[type=range]{
  width:clamp(100px,9vw,240px);height:clamp(20px,1.6vw,38px);
  accent-color:var(--accent);cursor:pointer;
}
.speedWrap b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.6em;display:inline-block;}
.counter{
  font-size:var(--btn-font);color:#9fd8ff;font-weight:700;
  padding:.38em .78em;border-radius:10px;background:rgba(56,189,248,.14);
  white-space:nowrap;
}

/* ===================== 字符数组可视化 ===================== */
.strWrap{
  background:rgba(45,212,191,.04);
  border:1px solid rgba(45,212,191,.22);
  border-radius:12px;
  padding:10px 10px 12px;
  margin-bottom:10px;
}
.strTitle{
  display:flex;align-items:baseline;gap:10px;
  font-size:calc(var(--var-font)*.8);color:#8fb9c8;
  margin-bottom:8px;flex-wrap:wrap;
}
.strTitle b{
  font-family:ui-monospace,Consolas,monospace;
  color:var(--teal);font-size:calc(var(--var-font)*1.0);
  font-weight:800;
}
.strTitle .hint{margin-left:auto;font-size:.7em;color:#5f7796;}

.ptrRow{
  display:flex;align-items:center;gap:.55em;flex-wrap:wrap;
  padding:.28em .7em;margin-bottom:.4em;border-radius:8px;
  background:rgba(244,114,182,.12);
  border:1px solid rgba(244,114,182,.4);
  font-family:ui-monospace,Consolas,monospace;
  font-size:calc(var(--var-font)*.82);
  transition:opacity .35s;
}
.ptrRow.hidden{display:none;}
.ptrItem{display:flex;align-items:center;gap:.22em;}
.ptrItem .pn{color:var(--pink);font-weight:800;}
.ptrItem .pt{color:#a04b6e;font-size:.78em;padding:.04em .34em;border-radius:4px;background:rgba(244,114,182,.18);}
.ptrItem .pa{color:var(--pink);font-weight:800;}
.ptrItem .pg{color:#ffd6ea;font-weight:800;}
.ptrNote{margin-left:auto;color:#c08aa0;font-size:.7em;font-family:"Segoe UI",sans-serif;}

.strGrid{
  display:grid;gap:.32em;
  grid-template-columns:auto repeat(6,1fr);
  align-items:stretch;
}
.strHead{
  text-align:center;font-size:calc(var(--var-font)*.66);color:#6d82a2;
  padding:.08em 0;font-family:ui-monospace,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
.strName{
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:.5em;
  font-family:ui-monospace,Consolas,monospace;
  font-size:calc(var(--var-font)*1.05);font-weight:800;
  white-space:nowrap;
}
.strName.na{color:var(--teal);}
.strName.nc{color:var(--gold);}

.ch{
  text-align:center;border-radius:9px;
  padding:.32em .05em .36em;
  background:#0d1728;border:2px solid #1b293f;
  transition:background .28s,border-color .28s,box-shadow .28s,transform .28s;
  min-width:0;overflow:hidden;
}
.ch .chVal{
  display:block;
  font-family:ui-monospace,Consolas,monospace;
  font-weight:800;font-size:calc(var(--var-font)*1.25);
  color:#8aa2c0;line-height:1.2;
  white-space:nowrap;
}
.ch .chVal.dimv{color:#425571;font-weight:600;}
.ch .chVal.nullv{
  color:var(--purple);
  background:rgba(192,132,252,.18);
  border-radius:5px;padding:0 .22em;
  display:inline-block;
  font-size:calc(var(--var-font)*1.05);
}
.ch .chIdx{
  display:block;margin-top:.18em;
  font-size:calc(var(--var-font)*.6);color:#3d5474;
  font-variant-numeric:tabular-nums;
}

.ch.is-hl{
  border-color:var(--accent);background:rgba(56,189,248,.18);
  box-shadow:0 0 0 2px rgba(56,189,248,.45),0 0 18px rgba(56,189,248,.3);
  transform:translateY(-3px);
}
.ch.is-hl .chVal{color:#ffffff;}
.ch.is-hl .chVal.nullv{background:rgba(192,132,252,.4);}

.ch.is-emit{
  border-color:var(--gold);background:rgba(250,204,21,.28);
  box-shadow:0 0 0 2px rgba(250,204,21,.75),0 0 24px rgba(250,204,21,.5);
  transform:translateY(-4px) scale(1.07);
}
.ch.is-emit .chVal{color:#fff8d0;}
.ch.is-emit .chVal.nullv{background:rgba(192,132,252,.55);color:#fff;}

.ch.is-done{
  border-color:var(--green);background:rgba(74,222,128,.10);
  box-shadow:0 0 0 1px rgba(74,222,128,.28);
}
.ch.is-done .chVal{color:#c9f7d6;}

@keyframes chFlash{
  0%{transform:scale(1);}
  40%{transform:scale(1.3);color:#fff;}
  100%{transform:scale(1);}
}
.ch .chVal.flash{animation:chFlash .55s ease-out;}

/* ===================== 调用栈 ===================== */
.stackStrip{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  padding:.5em .75em;border-radius:10px;
  background:rgba(56,189,248,.08);
  border:1px solid rgba(56,189,248,.28);
  margin-bottom:10px;
}
.stackLabel{
  font-size:calc(var(--var-font)*.8);color:#9db1cb;
  font-family:ui-monospace,Consolas,monospace;
  flex:0 0 auto;
}
.stackBody{display:flex;align-items:center;gap:.45em;flex-wrap:wrap;}
.frame{
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  font-size:calc(var(--var-font)*.95);
  padding:.22em .68em;border-radius:9px;
  background:#0d1728;border:1px solid #1e3350;color:#8aa2c0;
  transition:all .25s;
}
.frame.main{border-left:4px solid rgba(34,211,238,.7);}
.frame.keyf{border-left:4px solid rgba(251,191,36,.9);}
.frame.topF{
  border-color:var(--accent);background:rgba(56,189,248,.22);color:#fff;
  box-shadow:0 0 16px rgba(56,189,248,.55);
  animation:framePop .4s ease-out;
}
.frame.keyf.topF{
  border-color:var(--amber);background:rgba(251,191,36,.24);
  box-shadow:0 0 18px rgba(251,191,36,.55);
}
@keyframes framePop{
  0%{transform:scale(.6);opacity:0;}
  60%{transform:scale(1.16);}
  100%{transform:scale(1);opacity:1;}
}
.arr2{color:#3f5a7d;font-size:calc(var(--var-font)*1.05);}
.empty{color:#3d5474;font-size:calc(var(--var-font)*.85);font-family:ui-monospace,monospace;}

/* ===================== 变量分组 ===================== */
.scope-group{
  display:flex;flex-direction:column;gap:.16em;
  border-radius:10px;padding:.42em .5em .5em;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(148,163,184,.10);
  margin-bottom:8px;
}
.scope-group.scope-main{border-left:4px solid rgba(34,211,238,.55);}
.scope-group.scope-key{border-left:4px solid rgba(251,191,36,.7);background:rgba(251,191,36,.03);}
.scope-head{
  display:flex;align-items:baseline;gap:.5em;
  font-size:calc(var(--var-font)*.8);color:#8aa2c0;
  padding:0 .3em .2em;
}
.scope-head .fname{
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  color:#9fd8ff;font-size:calc(var(--var-font)*1.0);
}
.scope-head .role{color:#6d82a2;margin-left:auto;font-size:calc(var(--var-font)*.74);}

.vrow{
  display:flex;align-items:center;gap:.5em;
  padding:.22em .55em;border-radius:8px;
  background:#0d1728;border:1px solid #1b293f;
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.vk{
  flex:0 0 auto;color:#8399b8;white-space:nowrap;
  font-family:ui-monospace,Consolas,monospace;
  display:flex;align-items:baseline;gap:.4em;
}
.vt{font-size:.72em;color:#4d5f78;padding:.02em .3em;border-radius:4px;background:rgba(148,163,184,.1);}
.vv{
  flex:1 1 auto;min-width:0;text-align:right;
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vv.dim{color:#5f7796;font-weight:500;font-style:italic;}
.scope-key .vv{color:var(--amber);}
.vrow.changed{border-color:rgba(56,189,248,.9);background:rgba(56,189,248,.14);}
.vrow.changed .vv{color:#ffffff;}
.scope-key .vrow.changed{border-color:rgba(251,191,36,.9);background:rgba(251,191,36,.16);}
.vv.flash{animation:vflash .55s ease-out;}
@keyframes vflash{
  0%{transform:scale(1);}
  30%{transform:scale(1.22);color:#fff;text-shadow:0 0 18px currentColor;}
  100%{transform:scale(1);}
}

/* ===================== 输出面板 ===================== */
.outNote{
  font-size:calc(var(--var-font)*.78);color:#8ba7c8;
  padding:.4em .7em;margin-bottom:8px;border-radius:8px;
  background:rgba(192,132,252,.10);border-left:4px solid var(--purple);
  line-height:1.5;
}
.console{
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font);line-height:1.42;color:#86efac;
  white-space:pre-wrap;word-break:break-word;
  min-height:2em;padding:.2em 0;
}
.out-line{white-space:pre-wrap;word-break:break-all;}
.out-line.empty{color:#3d5474;min-height:1.2em;}
.nlMark{
  display:inline-block;
  color:#c084fc;background:rgba(192,132,252,.18);
  border-radius:4px;padding:0 .34em;margin:0 .12em;
  font-size:.68em;font-weight:800;vertical-align:middle;
  line-height:1.4;
}
.inMark{
  display:inline-block;
  color:#67e8f9;background:rgba(103,232,249,.14);
  border-radius:4px;padding:0 .34em;margin:0 .12em;
  font-size:.62em;font-weight:700;vertical-align:middle;
  line-height:1.4;
}
.cursor{
  display:inline-block;color:var(--green);
  animation:blink 1s step-end infinite;margin-left:3px;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ===================== 说明条 ===================== */
.expLine{
  display:inline-block;padding:.16em .65em;border-radius:8px;
  background:rgba(56,189,248,.20);color:var(--accent);
  font-weight:800;font-size:.84em;margin-right:.55em;vertical-align:middle;
}
.expLine.gold{background:rgba(250,204,21,.22);color:#facc15;}
.expLine.mv{background:rgba(244,114,182,.22);color:var(--pink);}
.expLine.pre{background:rgba(192,132,252,.22);color:var(--purple);}
.expLine.ret{background:rgba(251,191,36,.22);color:var(--amber);}
.expLine.inp{background:rgba(45,212,191,.22);color:var(--teal);}
.expLine.cont{background:rgba(250,204,21,.22);color:#facc15;}
.expLine.brk{background:rgba(239,68,68,.22);color:#fca5a5;}
#expText{
  font-size:var(--explain-font);line-height:1.5;color:#c3d4ea;
}
#expText strong{color:#fff;}
#expText code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(148,163,184,.18);border-radius:5px;
  padding:0 .32em;color:#e6eefb;
}
#expText .tip{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(45,212,191,.12);border-left:6px solid var(--teal);
  color:#bff5ec;font-size:.9em;
}
#expText .warn{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(251,191,36,.13);border-left:6px solid var(--amber);
  color:#ffe6b0;font-size:.9em;
}
#expText .danger{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(239,68,68,.16);border-left:6px solid #ef4444;
  color:#ffc9c9;font-size:.9em;
}
#expText .win{
  display:block;margin-top:.5em;padding:.4em .72em;border-radius:9px;
  background:rgba(250,204,21,.16);border-left:6px solid var(--gold);
  color:#fff3c4;font-size:.9em;font-weight:600;
}

/* ===================== 缩略图 ===================== */
#miniBody{position:relative;padding:8px;overflow:hidden;cursor:pointer;}
#miniInner{position:relative;}
.ml{
  white-space:pre;overflow:hidden;
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  line-height:1.35;
  opacity:.72;
  transition:opacity .2s,background .2s;
}
.ml.active{opacity:1;background:rgba(56,189,248,.30);box-shadow:inset 3px 0 0 var(--accent);}
.ml.done{opacity:.40;}
#miniView{
  position:absolute;left:0;right:0;top:0;
  border:2px solid rgba(56,189,248,.85);
  background:rgba(56,189,248,.10);
  border-radius:5px;pointer-events:none;
  transition:top .08s linear,height .08s linear;
  z-index:3;
}
</style>
</head>
<body>

<!-- ===================== 全屏代码区 ===================== -->
<div id="codeScroll">
  <div id="codeInner"></div>
</div>

<!-- ===================== 控制栏 ===================== -->
<div class="panel" id="p-bar">
  <div class="phead">
    <span class="ptitle">▣ 控制台</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse" title="折叠">▁</button>

<script>
(function(){
'use strict';

/* =====================================================================
   一、源代码数据（严格 27 行，与真实 C 文件一致）
   ===================================================================== */
var LINES = [
  {n:1,  h:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>                          <span class="cmt">// 包含标准输入输出头文件</span>'},
  {n:2,  h:'<span class="pp">#include</span> <span class="str">&lt;string.h&gt;</span>                         <span class="cmt">// 包含字符串处理头文件</span>'},
  {n:3,  h:'<span class="kw">int</span> <span class="fn-key">key</span>(<span class="kw">char</span> a[], <span class="kw">char</span> c[]);                <span class="cmt">// 声明密码验证函数</span>'},
  {n:4,  h:'<span class="kw">int</span> <span class="fn">main</span>() {                                <span class="cmt">// 主函数</span>'},
  {n:5,  h:'    <span class="kw">char</span> a[<span class="num">6</span>], c[<span class="num">6</span>];                        <span class="cmt">// 定义原密码和新密码数组</span>'},
  {n:6,  h:'    <span class="kw">int</span> i, j;                               <span class="cmt">// 定义循环变量</span>'},
  {n:7,  h:'    <span class="fn-out">printf</span>(<span class="str">"Input key:"</span>);                   <span class="cmt">// 提示输入原密码</span>'},
  {n:8,  h:'    <span class="fn-in">scanf</span>(<span class="str">"%s"</span>, a);                         <span class="cmt">// 输入原密码</span>'},
  {n:9,  h:'    <span class="kw">for</span>(i<span class="op">=</span><span class="num">1</span>; i<span class="op">&lt;=</span><span class="num">5</span>; i<span class="op">++</span>) {                   <span class="cmt">// 最多验证5次</span>'},
  {n:10, h:'        <span class="fn-out">printf</span>(<span class="str">"Input key again:"</span>);         <span class="cmt">// 提示再次输入</span>'},
  {n:11, h:'        <span class="fn-in">scanf</span>(<span class="str">"%s"</span>, c);                     <span class="cmt">// 输入新密码</span>'},
  {n:12, h:'        j <span class="op">=</span> <span class="fn-key">key</span>(a, c);                      <span class="cmt">// 调用key函数验证</span>'},
  {n:13, h:'        <span class="kw">if</span>(j <span class="op">!=</span> <span class="num">0</span>) <span class="kw-cont">continue</span>;                <span class="cmt">// 如果密码错误，继续验证</span>'},
  {n:14, h:'        <span class="kw-break">break</span>;                              <span class="cmt">// 密码正确，退出循环</span>'},
  {n:15, h:'    }'},
  {n:16, h:'    <span class="kw">return</span> <span class="num">0</span>;                               <span class="cmt">// 返回0，程序结束</span>'},
  {n:17, h:'}'},
  {n:18, h:'<span class="kw">int</span> <span class="fn-key">key</span>(<span class="kw">char</span> a1[], <span class="kw">char</span> c1[]) {             <span class="cmt">// 密码验证函数</span>'},
  {n:19, h:'    <span class="kw">int</span> l;                                  <span class="cmt">// 定义比较结果变量</span>'},
  {n:20, h:'    l <span class="op">=</span> <span class="fn-cmp">strcmp</span>(a1, c1);                     <span class="cmt">// 比较两个字符串</span>'},
  {n:21, h:'    <span class="kw">if</span>(l <span class="op">==</span> <span class="num">0</span>) {                            <span class="cmt">// 如果相等</span>'},
  {n:22, h:'        <span class="fn-out">printf</span>(<span class="str">"Key is right!Go to next..."</span>);'},
  {n:23, h:'    } <span class="kw">else</span> {                                 <span class="cmt">// 否则</span>'},
  {n:24, h:'        <span class="fn-out">printf</span>(<span class="str">"Key is error.Please input key again:<span class="nl-hl">\\n\\n</span>"</span>);'},
  {n:25, h:'    }'},
  {n:26, h:'    <span class="kw">return</span> l;                               <span class="cmt">// 返回比较结果</span>'},
  {n:27, h:'}'}
];

/* =====================================================================
   二、构建全屏代码区 + 缩略图
   ===================================================================== */
var codeScroll = document.getElementById('codeScroll');
var codeInner  = document.getElementById('codeInner');
var miniInner  = document.getElementById('miniInner');
var miniBody   = document.getElementById('miniBody');
var miniView   = document.getElementById('miniView');

var codeLineEls = [];
var miniLineEls = [];

LINES.forEach(function(L){
  var d = document.createElement('div');
  d.className = 'cl';
  d.dataset.line = L.n;
  d.innerHTML = '<span class="ln">' + L.n + '</span><span class="src">' + L.h + '</span>';
  codeInner.appendChild(d);
  codeLineEls.push(d);

  var m = document.createElement('div');
  m.className = 'ml';
  m.dataset.line = L.n;
  m.innerHTML = L.h;
  miniInner.appendChild(m);
  miniLineEls.push(m);
});

/* =====================================================================
   三、逐步执行数据（42 步）
   ===================================================================== */
var NULL_MARK = '\\0';

var S = {
  a: ['?','?','?','?','?','?'],
  c: ['?','?','?','?','?','?'],
  i: null, j: null, l: null,
  keyActive: false,
  stack: [],
  expr: '—', exprVal: '—', note: '—',
  pc: 0,
  strcmpCount: 0, scanfCount: 0, printfCount: 0,
  keyCount: 0, contCount: 0, brkCount: 0,
  forRounds: 0,
  mainRet: '—',
  out: '',
  inputNote: null     /* 当前步的 scanf 回显，仅用于输出面板显示 */
};

var STEPS = [];

function emit(o){
  if (o.stack)      S.stack = o.stack.slice();
  if (o.a !== undefined) S.a = o.a ? o.a.slice() : null;
  if (o.c !== undefined) S.c = o.c ? o.c.slice() : null;
  if (o.i !== undefined) S.i = o.i;
  if (o.j !== undefined) S.j = o.j;
  if (o.l !== undefined) S.l = o.l;
  if (o.keyActive !== undefined) S.keyActive = !!o.keyActive;
  if (o.expr !== undefined)    S.expr = o.expr;
  if (o.exprVal !== undefined) S.exprVal = o.exprVal;
  if (o.note !== undefined)    S.note = o.note;
  if (o.pc !== undefined)      S.pc = o.pc;
  if (o.strcmpCount !== undefined) S.strcmpCount = o.strcmpCount;
  if (o.scanfCount  !== undefined) S.scanfCount  = o.scanfCount;
  if (o.printfCount !== undefined) S.printfCount = o.printfCount;
  if (o.keyCount    !== undefined) S.keyCount    = o.keyCount;
  if (o.contCount   !== undefined) S.contCount   = o.contCount;
  if (o.brkCount    !== undefined) S.brkCount    = o.brkCount;
  if (o.forRounds   !== undefined) S.forRounds   = o.forRounds;
  if (o.mainRet !== undefined) S.mainRet = o.mainRet;
  if (o.append)   S.out += o.append;
  if (o.appendNl) S.out += '\n';
  if (o.inputNote !== undefined) S.inputNote = o.inputNote;

  STEPS.push({
    line: o.line,
    kind: o.kind || 'exec',
    title: o.title,
    desc: o.desc,
    stack: S.stack.slice(),
    func: S.stack.length ? S.stack[S.stack.length-1] : '—',
    a: S.a ? S.a.slice() : null,
    c: S.c ? S.c.slice() : null,
    i: S.i, j: S.j, l: S.l,
    keyActive: S.keyActive,
    expr: S.expr, exprVal: S.exprVal, note: S.note,
    pc: S.pc,
    strcmpCount: S.strcmpCount,
    scanfCount:  S.scanfCount,
    printfCount: S.printfCount,
    keyCount:    S.keyCount,
    contCount:   S.contCount,
    brkCount:    S.brkCount,
    forRounds:   S.forRounds,
    mainRet: S.mainRet,
    out: S.out,
    inputNote: S.inputNote,
    hlA:    o.hlA    || [],
    hlC:    o.hlC    || [],
    emitA:  o.emitA  || [],
    emitC:  o.emitC  || [],
    doneA:  o.doneA  || [],
    doneC:  o.doneC  || [],
    gold:   !!o.gold
  });
}

/* ============ 第 1 步：第 1 行 ============ */
S.note = '预处理：包含 stdio.h，printf / scanf 的声明来自这里';
emit({
  line:1, kind:'pre',
  title:'#include &lt;stdio.h&gt;',
  desc:'预处理指令：包含标准输入输出头文件，让 <code>printf</code>、<code>scanf</code> 拿到函数声明。<br>' +
       '这一行<b>不是 C 语句</b>，编译之前就处理完了，不产生任何屏幕输出。'
});

/* ============ 第 2 步：第 2 行 ============ */
S.note = '预处理：包含 string.h，strcmp 的声明来自这里';
emit({
  line:2, kind:'pre',
  title:'#include &lt;string.h&gt;',
  desc:'预处理指令：包含字符串处理头文件，让第 20 行的 <code>strcmp</code> 拿到函数声明。' +
       '<span class="tip"><b>本程序要做什么？</b><br>' +
       '① 让用户输入一次<b>原密码</b>，存到字符数组 a；<br>' +
       '② 最多循环 5 次：输入<b>新密码</b>存到 c，调用 <code>key(a, c)</code> 验证；<br>' +
       '③ 验证函数用 <code>strcmp</code> 比较两个字符串：相等返回 0，不等返回差值；<br>' +
       '④ 不相等 → <code>continue</code> 继续下一次循环；相等 → <code>break</code> 退出。<br>' +
       '<b>模拟输入约定：</b>原密码 a = <code>"hello"</code>；第 1 次 c = <code>"world"</code>（错），' +
       '第 2 次 c = <code>"hello"</code>（对）。</span>'
});

/* ============ 第 3 步：第 3 行 原型声明 ============ */
S.note = 'key 原型已声明（不执行），仅告诉编译器函数签名';
emit({
  line:3, kind:'pre',
  title:'int key(char a[], char c[]);   ← 原型声明（不执行）',
  desc:'这是<b>函数原型声明</b>，不产生任何运行时代码：<br>' +
       '· 函数名：<code>key</code>，返回类型 <code>int</code>；<br>' +
       '· 参数 1：<code>char a[]</code>——<b>看似字符数组，实为 <code>char *</code></b>；<br>' +
       '· 参数 2：<code>char c[]</code>——同样是 <code>char *</code>。' +
       '<span class="danger"><b>⚠ 函数声明 ≠ 函数定义：</b><br>' +
       '第 3 行只登记"长相"，第 18~27 行才是"身体"。<br>' +
       '第 12 行的 <code>key(a, c)</code> 出现在第 18 行的定义<b>之前</b>，' +
       '必须有第 3 行的声明，编译器才能正确检查参数类型。</span>'
});

/* ============ 第 4 步：第 4 行 main 入口 ============ */
S.stack = ['main'];
S.note = 'main 栈帧建立，程序正式开始';
emit({
  line:4, kind:'exec',
  title:'int main() {   程序从 main 开始执行',
  desc:'操作系统把控制权交给 <code>main</code>，程序正式开始：<br>' +
       '· 系统为 main 建立<b>栈帧</b>；<br>' +
       '· 调用栈中现在只有 <code>main</code> 这一帧；<br>' +
       '· 接下来执行 main 函数体的第一条语句（第 5 行）。' +
       '<span class="tip"><b>先给出预测：</b><br>' +
       '本次模拟输入原密码 <code>"hello"</code>；第 1 轮输入 <code>"world"</code>（不等 → continue）；' +
       '第 2 轮输入 <code>"hello"</code>（相等 → break）。<br>' +
       '最终屏幕上有 3 个可见行 + 1 个空行。</span>'
});

/* ============ 第 5 步：第 5 行 char a[6], c[6] ============ */
S.a = ['?','?','?','?','?','?'];
S.c = ['?','?','?','?','?','?'];
S.note = 'a、c 都是未初始化的 char[6]（5 字符 + 1 个 \\0）';
emit({
  line:5, kind:'exec',
  title:'char a[6], c[6];   ← 两块未初始化的字符数组',
  desc:'在 main 的栈帧中声明两个字符数组：<br>' +
       '· <code>char a[6]</code>——存放<b>原密码</b>，最多 5 个可见字符 + 1 个结束符；<br>' +
       '· <code>char c[6]</code>——存放<b>新输入密码</b>，同样是 6 个字节；<br>' +
       '· 此刻两者都<b>未初始化</b>，格子里是垃圾数据（用 <b>?</b> 表示）；<br>' +
       '· 合法下标 <b>0 ~ 5</b>，共 6 个字节。' +
       '<span class="warn"><b>为什么是 6 而不是 5？</b><br>' +
       'C 语言的字符串末尾必须有一个 <code>\\0</code>（空字符）作为结束标志。<br>' +
       '要存 5 个字符，就需要 5 + 1 = 6 个字节。</span>'
});

/* ============ 第 6 步：第 6 行 int i, j ============ */
S.i = null; S.j = null;
S.note = 'i、j 未初始化';
emit({
  line:6, kind:'exec',
  title:'int i, j;   ← 两个循环/结果变量',
  desc:'在 main 的栈帧中声明两个整型变量：<br>' +
       '· <b>i</b>——for 循环的控制变量，从 1 到 5；<br>' +
       '· <b>j</b>——用来接收 <code>key()</code> 的返回值（比较结果）；<br>' +
       '· 此刻两者都<b>未初始化</b>，里面是垃圾值；<br>' +
       '· 第 9 行会给 i 赋值 1，第 12 行会给 j 赋值。'
});

/* ============ 第 7 步：第 7 行 printf ============ */
S.printfCount = 1;
S.append = 'Input key:';
S.pc = 1;
S.note = '第 1 次 printf：输出 "Input key:"（无换行）';
emit({
  line:7, kind:'out',
  title:'printf("Input key:");   →   输出 <b>Input key:</b>',
  desc:'调用 <code>printf</code> 输出提示文字：<br>' +
       '· 格式串里<b>没有格式说明符</b>，也没有 <code>\\n</code>，整串原样输出且<b>不换行</b>；<br>' +
       '· 光标停在冒号后面，等待第 8 行的 <code>scanf</code>；<br>' +
       '· 用户输入的字符会接在冒号后面。' +
       '<span class="tip"><b>屏幕当前内容：</b><code>Input key:</code></span>'
});

/* ============ 第 8 步：第 8 行 scanf 输入 hello ============ */
S.a = ['h','e','l','l','o',NULL_MARK];
S.scanfCount = 1;
S.inputNote = 'hello';
S.note = '用户输入 "hello" → a[0..4] + a[5]=\\0';
emit({
  line:8, kind:'inp',
  hlA: [0,1,2,3,4,5],
  title:'scanf("%s", a);   →   用户输入 <b>"hello"</b>',
  desc:'<code>scanf("%s", a)</code> 从键盘读取一个"单词"（遇空白停止）：<br>' +
       '· 参数 <code>a</code> 是数组名，<b>作参数时退化为 <code>&amp;a[0]</code></b>（<code>char *</code>）；<br>' +
       '· <code>scanf</code> 需要这个地址才能把输入写进 a 的内存；<br>' +
       '· 用户输入 <b>hello</b> → <code>a[0]=\'h\'</code>、<code>a[1]=\'e\'</code>、<code>a[2]=\'l\'</code>、' +
       '<code>a[3]=\'l\'</code>、<code>a[4]=\'o\'</code>；<br>' +
       '· 末尾自动补 <b><code>\\0</code></b> 到 <code>a[5]</code>——这是字符串结束标志。' +
       '<span class="win">★ 字符数组 a 现在的状态：<b>h e l l o \\0</b>（正好填满 6 个格子）</span>'
});

/* ============ 第 9 步：第 9 行 for i=1（第 1 次） ============ */
S.i = 1;
S.forRounds = 1;
S.doneA = [0,1,2,3,4,5];
S.note = 'i = 1；1<=5 为真，进入第 1 轮循环';
emit({
  line:9, kind:'exec',
  title:'for(i=1; i&lt;=5; i++)   i = 1，1 &lt;= 5 成立',
  desc:'进入验证循环：<br>' +
       '· 初始化 <code>i = 1</code>，i 从 <b>1</b> 开始；<br>' +
       '· 判断 <code>i &lt;= 5</code> → <b>真</b>；<br>' +
       '· 进入循环体，准备执行第 10 行；<br>' +
       '· 循环最多允许 5 次输入机会，i 依次取值 1、2、3、4、5。'
});

/* ============ 第 10 步：第 10 行 printf（第 1 轮） ============ */
S.printfCount = 2;
S.append = 'Input key again:';
S.pc = 2;
S.note = '第 2 次 printf：输出 "Input key again:"（无换行）';
emit({
  line:10, kind:'out',
  title:'printf("Input key again:");   →   输出 <b>Input key again:</b>',

var zTop = 100;

function bringFront(el){
  zTop += 1;
  el.style.zIndex = zTop;
  panelEls.forEach(function(p){ p.classList.remove('top'); });
  el.classList.add('top');
}

function makePanel(el){
  var head = el.querySelector('.phead');
  var rs   = el.querySelector('.rs');

  el.addEventListener('pointerdown', function(){ bringFront(el); }, true);

  var cbtn = el.querySelector('[data-act="collapse"]');
  if (cbtn) cbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.classList.toggle('collapsed');
  });
  var xbtn = el.querySelector('[data-act="close"]');
  if (xbtn) xbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.style.display = 'none';
  });

  head.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    bringFront(el);
    var r = el.getBoundingClientRect();
    var dx = e.clientX - r.left;
    var dy = e.clientY - r.top;
    function mv(ev){
      el.style.left = (ev.clientX - dx) + 'px';
      el.style.top  = (ev.clientY - dy) + 'px';
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
  });

  if (rs) rs.addEventListener('pointerdown', function(e){
    bringFront(el);
    var r = el.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    function mv(ev){
      el.style.width  = Math.max(0, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(0, sh + ev.clientY - sy) + 'px';
      if (el.id === 'p-mini') rebuildMini();
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      if (el.id === 'p-mini') rebuildMini();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
    e.stopPropagation();
  });
}
panelEls.forEach(makePanel);

var miniLineH = 8;

function rebuildMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;

  var body = document.getElementById('miniBody');
  var w = body.clientWidth - 16;
  if (w <= 10) return;

  /* 最长一行约 75 字符 */
  var f = Math.max(2, w / 75);
  miniLineH = f * 1.35;

  miniInner.style.fontSize = f + 'px';
  miniLineEls.forEach(function(el){
    el.style.height = miniLineH + 'px';
    el.style.lineHeight = miniLineH + 'px';
  });
  syncMini();
}

function syncMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;
  if (!miniLineH) return;

  var firstCl = codeLineEls[0];
  if (!firstCl) return;

  var lineH = firstCl.getBoundingClientRect().height;
  if (!lineH) return;

  var lineTopOffset = firstCl.offsetTop;
  var sTop = codeScroll.scrollTop;
  var sH   = codeScroll.clientHeight;

  var relTop = Math.max(0, sTop - lineTopOffset);
  var firstIdx = relTop / lineH;
  var count    = sH / lineH;

  var total = 27 * miniLineH;
  var top  = firstIdx * miniLineH;
  var h    = count * miniLineH;

  if (top < 0) top = 0;
  if (top > total) top = total;
  if (top + h > total) h = total - top;
  if (h < 4) h = 4;

  miniView.style.top    = top + 'px';
  miniView.style.height = h + 'px';
}

miniBody.addEventListener('click', function(e){
  if (!miniLineH) return;
  var r = miniInner.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLineH);
  if (idx < 0) idx = 0;
  if (idx > 26) idx = 26;
  centerLine(idx + 1, true);
});

function paintChars(cells, arr, hl, em, dn){
  for (var k = 0; k < cells.length; k++){
    var cell = cells[k];
    var valEl = cell.querySelector('.chVal');
    var raw = arr ? arr[k] : '?';
    var shown = (raw === NULL_MARK) ? '\\0' : String(raw);
    var isNull = (raw === NULL_MARK);

    if (valEl.textContent !== shown){
      valEl.textContent = shown;
      valEl.classList.remove('flash');
      void valEl.offsetWidth;
      valEl.classList.add('flash');
    }
    valEl.classList.toggle('dimv', !arr || raw === '?');
    valEl.classList.toggle('nullv', isNull);

    cell.classList.remove('is-hl','is-emit','is-done');
    if (em.indexOf(k) !== -1)       cell.classList.add('is-emit');
    else if (hl.indexOf(k) !== -1)  cell.classList.add('is-hl');
    else if (dn.indexOf(k) !== -1)  cell.classList.add('is-done');
  }
}

function renderGrids(step){
  var a = step ? step.a : null;
  var c = step ? step.c : null;
  var hlA = (step && step.hlA)   || [];
  var hlC = (step && step.hlC)   || [];
  var emA = (step && step.emitA) || [];
  var emC = (step && step.emitC) || [];
  var dnA = (step && step.doneA) || [];
  var dnC = (step && step.doneC) || [];

  var key = (a ? a.join(',') : 'x') + '|' + (c ? c.join(',') : 'x') + '|' +
            hlA.join(',') + '|' + hlC.join(',') + '|' +
            emA.join(',') + '|' + emC.join(',') + '|' +
            dnA.join(',') + '|' + dnC.join(',');
  if (key === lastGridKey) return;
  lastGridKey = key;

  paintChars(cellsA, a, hlA, emA, dnA);
  paintChars(cellsC, c, hlC, emC, dnC);
}

function renderPtr(step){
  var on = !!(step && step.keyActive);
  var key = on ? '1' : '0';
  if (key === lastPtrKey) return;
  lastPtrKey = key;
  ptrRow.classList.toggle('hidden', !on);
}

function renderStack(step){
  var stack = (step && step.stack) || [];
  var key = stack.join('/');
  if (key === lastStackKey) return;
  lastStackKey = key;

  if (!stack.length){
    stackBody.innerHTML = '<span class="empty">（空）</span>';
    return;
  }
  var html = '';
  for (var k = 0; k < stack.length; k++){
    if (k > 0) html += '<span class="arr2">→</span>';
    var cls = 'frame';
    if (stack[k] === 'main') cls += ' main';
    else if (stack[k] === 'key') cls += ' keyf';
    if (k === stack.length - 1) cls += ' topF';
    var label = stack[k] === 'main' ? 'main()' : 'key(char a1[], char c1[])';
    html += '<span class="' + cls + '">' + label + '</span>';
  }
  stackBody.innerHTML = html;
}

  return s;
}

function fmtNum(v){
  if (v === null || v === undefined) return '未初始化';
  return String(v);
}

function renderVars(step, prevStep){
  if (!step){
    lastVarsKey = null;
    varsBlock.innerHTML = '';
    return;
  }
  var key = step.line + '|' + step.stack.join('/') + '|' +
            (step.a ? step.a.join('') : 'x') + '|' +
            (step.c ? step.c.join('') : 'x') + '|' +
            step.i + '|' + step.j + '|' + step.l + '|' + step.keyActive;
  if (key === lastVarsKey) return;
  lastVarsKey = key;

  varsBlock.innerHTML = '';

  var inMain = step.stack.indexOf('main') !== -1;
  var inKey  = step.stack.indexOf('key')  !== -1;

  /* ---- main 作用域 ---- */
  if (inMain){
    var gM = document.createElement('div');
    gM.className = 'scope-group scope-main';
    var hM = document.createElement('div');
    hM.className = 'scope-head';
    hM.innerHTML = '<span class="fname">main</span><span class="role">主函数作用域</span>';
    gM.appendChild(hM);

    var aStr = fmtArr(step.a);
    var aChg = prevStep && fmtArr(prevStep.a) !== aStr;
    gM.appendChild(buildVarRow('a', 'char[6]', aStr, !step.a, aChg));

    var cStr = fmtArr(step.c);
    var cChg = prevStep && fmtArr(prevStep.c) !== cStr;
    gM.appendChild(buildVarRow('c', 'char[6]', cStr, !step.c, cChg));

    var iChg = prevStep && prevStep.i !== step.i;
    gM.appendChild(buildVarRow('i', 'int', fmtNum(step.i), step.i === null, iChg));

    var jChg = prevStep && prevStep.j !== step.j;
    gM.appendChild(buildVarRow('j', 'int', fmtNum(step.j), step.j === null, jChg));

    varsBlock.appendChild(gM);
  }

  /* ---- key 作用域 ---- */
  if (inKey){
    var gF = document.createElement('div');
    gF.className = 'scope-group scope-key';
    var hF = document.createElement('div');
    hF.className = 'scope-head';
    hF.innerHTML = '<span class="fname">key</span><span class="role">函数作用域（形参是指针）</span>';
    gF.appendChild(hF);

    gF.appendChild(buildVarRow('a1', 'char *', '→ &a[0]', false, false));
    gF.appendChild(buildVarRow('c1', 'char *', '→ &c[0]', false, false));

    var lChg = prevStep && prevStep.l !== step.l;
    gF.appendChild(buildVarRow('l', 'int', fmtNum(step.l), step.l === null, lChg));

    varsBlock.appendChild(gF);
  }

  /* 闪烁 */
  Array.prototype.slice.call(varsBlock.querySelectorAll('.vrow.changed .vv'))
    .forEach(function(el){
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    });
}

function centerLine(n, smooth){
  var el = codeInner.querySelector('.cl[data-line="' + n + '"]');
  if (!el) return;
  var target = el.offsetTop - codeScroll.clientHeight / 2 + el.offsetHeight / 2;
  if (target < 0) target = 0;
  codeScroll.scrollTo({top: target, behavior: smooth ? 'smooth' : 'auto'});
}

function renderOutput(step){
  var text = step ? step.out : '';
  var inputNote = step ? step.inputNote : null;
  var key = text + '||' + (inputNote || '');
  if (key === lastOut) return;
  lastOut = key;

  consoleBody.innerHTML = '';

  /* 输入回显（青色标记，仅用于辅助说明，不计入 printf 输出） */
  if (inputNote){
    var inDiv = document.createElement('div');
    inDiv.className = 'out-line';
    inDiv.style.fontSize = '.78em';
    inDiv.style.opacity = '.9';
    var im = document.createElement('span');
    im.className = 'inMark';
    im.textContent = '[in:' + inputNote + ']';
    im.title = 'scanf 输入回显，不计入 printf 输出';
    inDiv.appendChild(im);
    consoleBody.appendChild(inDiv);
  }

  if (!text){
    var cur0 = document.createElement('span');
    cur0.className = 'cursor';
    cur0.textContent = '▊';
    consoleBody.appendChild(cur0);
    return;
  }

  /* 按 \n 分割，逐行渲染；末尾空行会保留，光标放在最后 */
  var parts = text.split('\n');

  parts.forEach(function(part, idx){
    var d = document.createElement('div');
    d.className = 'out-line';
    if (part === ''){
      d.classList.add('empty');
      d.innerHTML = '&nbsp;';
    } else {
      d.textContent = part;
    }
    consoleBody.appendChild(d);
  });

  /* 光标 */
  var cur = document.createElement('span');
  cur.className = 'cursor';
  cur.textContent = '▊';
  consoleBody.appendChild(cur);

  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current - 1] : null;
  var activeLine = step ? step.line : null;

  var done = {};
  for (var k = 0; k <= current; k++){
    if (STEPS[k]) done[STEPS[k].line] = true;
  }

  codeLineEls.forEach(function(el){
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);
    el.classList.toggle('done', !!done[n] && n !== activeLine);
  });

  updateMiniActive(activeLine);
  renderGrids(step);
  renderPtr(step);
  renderStack(step);
  renderVars(step, prev);
  renderOutput(step);

  if (step){
    var cls = 'expLine';
    if (step.kind === 'pre') cls += ' pre';
    else if (step.kind === 'call') cls += ' mv';
    else if (step.kind === 'out') cls += ' gold';
    else if (step.kind === 'ret') cls += ' ret';
    else if (step.kind === 'inp') cls += ' inp';
    else if (step.kind === 'cont') cls += ' cont';
    else if (step.kind === 'brk') cls += ' brk';

    expText.innerHTML =
      '<span class="' + cls + '">第 ' + step.line + ' 行</span>' +
      '<strong>' + step.title + '</strong><br>' + step.desc;
    stepCounter.textContent = '步骤 ' + (current + 1) + ' / ' + STEPS.length;
  } else {
    expText.innerHTML =
      '<strong>点击「▶ 播放」或「下一步」，开始逐条执行程序。</strong><br>' +
      '本程序演示 <b>字符数组作实参 + strcmp 比较 + continue/break 循环控制</b>。<br>' +
      '· <b>初始：</b>a、c 都是未初始化的 <code>char[6]</code><br>' +
      '· <b>输入原密码：</b>a = <code>"hello"</code><br>' +
      '· <b>第 1 轮：</b>c = <code>"world"</code> → <code>strcmp("hello","world") = -15 ≠ 0</code> ' +
      '→ 输出错误提示 → <code>continue</code><br>' +
      '· <b>第 2 轮：</b>c = <code>"hello"</code> → <code>strcmp("hello","hello") = 0</code> ' +
      '→ 输出成功提示 → <code>break</code><br>' +
      '· <b>循环结束：</b>main 返回 0，程序正常结束<br>' +
      '<span class="tip"><b>核心结论：</b><code>strcmp</code> 返回 0 表示字符串相等；' +
      '<code>continue</code> 继续下一轮、<code>break</code> 终止循环，二者配合实现"重试到成功为止"。<br>' +
      '<b>预计输出：</b><br>' +
      '<code>Input key:Input key again:Key is error.Please input key again:</code><br>' +
      '<code>&nbsp;</code>（空行）<br>' +
      '<code>Input key again:Key is right!Go to next...</code></span>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  if (activeLine) centerLine(activeLine, true);
  window.requestAnimationFrame(syncMini);
}

/* =====================================================================
   十、播放控制
   ===================================================================== */
function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btnPlay.classList.toggle('playing', playing);
}

function tick(){
  if (current >= STEPS.length - 1){ pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}

function play(){
  if (playing) return;
  if (current >= STEPS.length - 1){ current = -1; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}

function nextStep(){
  pause();
  if (current < STEPS.length - 1){ current += 1; render(); }
}

function prevStep(){
  pause();
  if (current > -1){ current -= 1; render(); }
}

function resetAll(){
  pause();
  current = -1;
  lastOut = null;
  lastVarsKey = null;
  lastGridKey = null;
  lastPtrKey = null;
  lastStackKey = null;
  consoleBody.innerHTML = '';
  codeScroll.scrollTop = 0;
  render();
  window.requestAnimationFrame(function(){
    codeScroll.scrollTop = 0;
    syncMini();
  });
}

btnPlay.addEventListener('click', function(){ if (playing) pause(); else play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

function updateSpeedLabel(){
  speedLbl.textContent = (speed / 1000).toFixed(1) + 's';
}
speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  updateSpeedLabel();
  if (playing){
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

btnFs.addEventListener('click', function(){
  if (!document.fullscreenElement){
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});

btnPanels.addEventListener('click', function(){
  var anyVisible = panelEls.some(function(p){ return p.style.display !== 'none'; });
  panelEls.forEach(function(p){
    p.style.display = anyVisible ? 'none' : '';
    if (!anyVisible) p.classList.remove('collapsed');
  });
  if (!anyVisible) rebuildMini();
});

btnMini.addEventListener('click', function(){
  var m = document.getElementById('p-mini');
  var hidden = (m.style.display === 'none');
  m.style.display = hidden ? '' : 'none';
  if (hidden) rebuildMini();
});

btnLayout.addEventListener('click', function(){
  panelEls.forEach(function(p){
    p.style.display = '';
    p.classList.remove('collapsed');
  });
  applyDefaultLayout();
  render();
});

/* =====================================================================
   十一、全局快捷键
   ===================================================================== */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

  if (e.code === 'Space'){ e.preventDefault(); if (playing) pause(); else play(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR'){ e.preventDefault(); resetAll(); }
  else if (e.code === 'KeyF'){ e.preventDefault(); btnFs.click(); }
  else if (e.code === 'KeyM'){ e.preventDefault(); btnMini.click(); }
  else if (e.code === 'KeyH'){ e.preventDefault(); btnPanels.click(); }
});

/* =====================================================================
   十二、滚动同步
   ===================================================================== */
var rafPending = false;
function scheduleSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){
    rafPending = false;
    syncMini();
  });
}

codeScroll.addEventListener('scroll', scheduleSync, {passive:true});
window.addEventListener('resize', function(){
  rebuildMini();
  scheduleSync();
});
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ rebuildMini(); syncMini(); });
}

/* =====================================================================
   十三、启动
   ===================================================================== */
applyDefaultLayout();
updateSpeedLabel();
render();
window.requestAnimationFrame(function(){
  rebuildMini();
  syncMini();
});
window.setTimeout(function(){ rebuildMini(); syncMini(); }, 300);

})();
</script>
</body>
</html>
