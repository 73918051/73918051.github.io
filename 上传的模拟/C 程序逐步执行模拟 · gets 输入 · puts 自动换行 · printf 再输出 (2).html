<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · gets 输入 · puts 自动换行 · printf 再输出</title>
<style>
/* =========================================================
   主题变量（希沃大屏：1920×1080 下代码 ≥80px）
   ========================================================= */
:root{
  --bg:#0d1117;
  --text:#e6edf7;
  --muted:#7d93b3;
  --accent:#38bdf8;
  --green:#4ade80;
  --amber:#fbbf24;
  --pink:#f472b6;
  --purple:#c084fc;
  --teal:#2dd4bf;
  --orange:#fb923c;
  --gold:#facc15;
  --danger:#ef4444;

  --code-font:    clamp(80px, 5vw, 120px);
  --out-font:     clamp(72px, 4.2vw, 110px);
  --var-font:     clamp(40px, 2.1vw, 56px);
  --explain-font: clamp(48px, 2.8vw, 72px);
  --btn-font:     clamp(40px, 2.2vw, 60px);
  --title-font:   clamp(56px, 3vw, 80px);
  --head-font:    clamp(32px, 1.8vw, 46px);
  --ln-scale:     0.55;          /* 行号 = 代码字号的 0.55 倍 */
}
*{ box-sizing:border-box; }
html,body{
  height:100%; margin:0; padding:0;
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;
}

/* =========================================================
   全屏代码舞台（不透明，永远在最底层）
   ========================================================= */
#stage{
  position:fixed; inset:0; z-index:1;
  background:#0d1117;
}
#codeScroll{
  position:absolute; inset:0;
  overflow:auto;
  padding:26px 60px 30vh 26px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font);
  line-height:1.35;
  scrollbar-width:thin; scrollbar-color:#334155 #0d1117;
}
#codeScroll::-webkit-scrollbar{ width:16px; height:16px; }
#codeScroll::-webkit-scrollbar-track{ background:#0d1117; }
#codeScroll::-webkit-scrollbar-thumb{ background:#2c3f5e; border-radius:8px; }

.code-line{
  display:flex; align-items:flex-start; gap:.45em;
  white-space:pre;
  padding:.05em .35em;
  border-left:10px solid transparent;
  border-radius:10px;
  transition:background .25s,border-color .25s,opacity .25s;
  width:max-content;
  min-width:100%;
}
.code-line .ln{
  flex:0 0 auto;
  font-size:calc(1em * var(--ln-scale));
  line-height:calc(1.35 / var(--ln-scale));
  width:2.4em; text-align:right;
  color:#3f5a7d; user-select:none;
  font-variant-numeric:tabular-nums;
}
.code-line .src{ flex:0 0 auto; }
.code-line.active{
  background:linear-gradient(90deg,rgba(56,189,248,.26),rgba(56,189,248,.04));
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 3px rgba(56,189,248,.25);
}
.code-line.active .ln{ color:var(--accent); font-weight:700; }
.code-line.active .src{ color:#ffffff; }
.code-line.done{ opacity:.4; }

/* 语法高亮 */
.pp{ color:var(--purple); font-weight:700; }
.kw{ color:var(--pink);   font-weight:700; }
.fn{ color:var(--accent); font-weight:700; }
.str{ color:var(--green); }
.esc{ color:var(--gold); font-weight:800; }
.num{ color:var(--amber); }
.op{ color:var(--orange); font-weight:800; }
.cmt{ color:#5b6f8c; font-style:italic; }
.hi{ color:var(--gold); font-weight:800; }

/* =========================================================
   悬浮面板通用
   ========================================================= */
.fp{
  position:fixed; z-index:200;
  display:flex; flex-direction:column;
  background:rgba(13,17,23,.78);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:2px solid rgba(56,189,248,.32);
  border-radius:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  overflow:hidden;
  transition:background .2s,border-color .2s,box-shadow .2s;
  min-width:0; min-height:0;
}
.fp:hover{ background:rgba(13,17,23,.93); }
.fp.active{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(56,189,248,.35),0 26px 70px rgba(0,0,0,.7);
}
.fp.hidden{ display:none; }
.fp.collapsed .fp-body{ display:none; }
.fp.collapsed .fp-resize{ display:none; }

.fp-head{
  flex:0 0 auto;
  display:flex; align-items:center; gap:14px;
  padding:12px 18px;
  cursor:move;
  user-select:none; touch-action:none;
  background:linear-gradient(180deg,rgba(56,189,248,.20),rgba(56,189,248,.03));
  border-bottom:2px solid rgba(56,189,248,.22);
}
.fp-title{
  font-size:var(--head-font); font-weight:800; letter-spacing:.02em;
  color:#dcefff; white-space:nowrap; flex:1 1 auto;
  overflow:hidden; text-overflow:ellipsis;
}
.fp-btn{
  flex:0 0 auto;
  font:inherit; font-size:calc(var(--head-font) * .9);
  line-height:1;
  width:1.9em; height:1.9em; min-width:40px; min-height:40px;
  display:flex; align-items:center; justify-content:center;
  border-radius:12px; cursor:pointer;
  background:rgba(148,163,184,.14);
  border:2px solid rgba(148,163,184,.28);
  color:#cfe2f7;
  transition:background .15s,border-color .15s,transform .1s;
}
.fp-btn:hover{ background:rgba(56,189,248,.28); border-color:var(--accent); }
.fp-btn:active{ transform:translateY(2px); }
.fp-close:hover{ background:rgba(239,68,68,.45); border-color:#ef4444; color:#fff; }

.fp-body{
  flex:1 1 auto; min-height:0; min-width:0;
  overflow:auto;
  padding:16px 18px;
  scrollbar-width:thin; scrollbar-color:#334155 transparent;
}
.fp-body::-webkit-scrollbar{ width:12px; height:12px; }
.fp-body::-webkit-scrollbar-thumb{ background:#2c3f5e; border-radius:8px; }

.fp-resize{
  position:absolute; right:0; bottom:0;
  width:54px; height:54px;
  cursor:nwse-resize;
  touch-action:none;
  background:
    linear-gradient(135deg,transparent 44%,rgba(56,189,248,.85) 46%,rgba(56,189,248,.85) 54%,transparent 56%),
    linear-gradient(135deg,transparent 66%,rgba(56,189,248,.55) 68%,rgba(56,189,248,.55) 76%,transparent 78%);
  z-index:5;
}

/* =========================================================
   顶部控制栏
   ========================================================= */
#fpTop{ max-width:97vw; }
#fpTop .fp-body{ padding:12px 18px; }
.ctrl-row{ display:flex; align-items:center; flex-wrap:wrap; gap:16px; }
.ctrl-btn{
  font:inherit; font-size:var(--btn-font); font-weight:700;
  min-height:72px; padding:8px 26px;
  border-radius:16px; cursor:pointer;
  background:rgba(30,45,70,.92);
  border:2px solid rgba(56,189,248,.35);
  color:#e6f3ff;
  transition:background .15s,border-color .15s,transform .1s;
  white-space:nowrap;
}
.ctrl-btn:hover{ background:rgba(45,70,110,.98); border-color:var(--accent); }
.ctrl-btn:active{ transform:translateY(2px); }
.ctrl-btn.primary{
  background:linear-gradient(180deg,#0ea5e9,#0284c7);
  border-color:#7dd3fc; color:#04121f;
}
.ctrl-btn.primary.playing{
  background:linear-gradient(180deg,#f59e0b,#d97706);
  border-color:#fbbf24; color:#1a1200;
}
.speed-box{
  display:flex; align-items:center; gap:14px;
  font-size:calc(var(--btn-font) * .82); color:var(--muted);
  white-space:nowrap;
}
.speed-box input[type=range]{ width:220px; height:16px; accent-color:var(--accent); cursor:pointer; }
.speed-box b{ color:var(--accent); font-variant-numeric:tabular-nums; min-width:5.5ch; display:inline-block; }

/* =========================================================
   变量 / 数组面板
   ========================================================= */
.arr-block{ margin-bottom:18px; }
.arr-cap{
  font-size:calc(var(--var-font) * .95);
  color:#a9c2e0; margin-bottom:10px;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.arr-cap b{ color:var(--accent); font-family:ui-monospace,Consolas,monospace; }
.arr-cap .dim{ color:#5f7796; font-size:.82em; }

.arr-grid{
  display:grid;
  grid-template-columns:repeat(10,minmax(0,1fr));
  gap:8px;
  font-size:var(--var-font);
}
.cell{
  text-align:center;
  border-radius:12px; padding:8px 2px 10px;
  background:#101b2c; border:3px solid #1e2f49;
  transition:background .25s,border-color .25s,box-shadow .25s,transform .25s;
  overflow:hidden; min-width:0;
}
.cell .ci{
  display:block; font-size:.5em; color:#5f7796; line-height:1.2;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.cell .cv{
  display:block; font-family:ui-monospace,Consolas,monospace;
  font-weight:800; font-size:1em; line-height:1.3; color:#8aa2c0;
}
.cell.is-uninit{ border-color:#27384f; background:#0a1320; }
.cell.is-uninit .cv{ color:#4a6280; font-size:.85em; }
.cell.is-nul{ border-color:#5b4b8a; background:#161029; }
.cell.is-nul .cv{ color:#c4b5fd; font-size:.75em; }
.cell.is-space{ border-color:#7a3d5c; background:#25101c; }
.cell.is-space .cv{ color:#f9a8d4; }
.cell.is-done{ border-color:var(--green); background:rgba(74,222,128,.14); }
.cell.is-done .cv{ color:#c9f7d6; }
.cell.is-hl{
  border-color:var(--accent); background:rgba(56,189,248,.26);
  box-shadow:0 0 0 3px rgba(56,189,248,.5),0 0 26px rgba(56,189,248,.45);
  transform:translateY(-4px);
}
.cell.is-hl .cv{ color:#ffffff; }
.cell.is-emit{
  border-color:var(--gold); background:rgba(250,204,21,.34);
  box-shadow:0 0 0 4px rgba(250,204,21,.7),0 0 34px rgba(250,204,21,.6);
  transform:translateY(-6px) scale(1.08);
}
.cell.is-emit .cv{ color:#fffbe0; }

.var-table{ display:flex; flex-direction:column; gap:8px; }
.var-row{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:8px 16px; border-radius:12px;
  background:#0f1a2b; border:2px solid #1b293f;
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.var-row .vname{ color:var(--muted); font-size:.72em; white-space:nowrap; flex:0 0 auto; }
.var-row .vval{
  font-family:ui-monospace,Consolas,monospace; font-weight:800;
  font-size:.9em; text-align:right;
  color:var(--accent); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  flex:1 1 auto; min-width:0;
}
.var-row.changed{ border-color:var(--accent); background:rgba(56,189,248,.16); }
.var-row.k-ctx  .vval{ color:var(--green); }
.var-row.k-ptr  .vval{ color:var(--accent); }
.var-row.k-ch   .vval{ color:var(--gold); }
.var-row.k-expr .vval{ color:var(--pink); }
.var-row.k-note .vval{ color:var(--teal); }
.var-row.k-cnt  .vval{ color:var(--amber); }
.var-row.k-ret  .vval{ color:var(--gold); }

@keyframes pop{
  0%{ transform:scale(1); }
  35%{ transform:scale(1.2); filter:brightness(1.7); }
  100%{ transform:scale(1); }
}
.flash{ animation:pop .45s ease-out; }

/* =========================================================
   程序输出面板
   ========================================================= */
#outBody{
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font);
  line-height:1.5;
  color:#86efac;
  white-space:pre;
  overflow:auto;
}
#outBody::-webkit-scrollbar{ width:12px; height:12px; }
#outBody::-webkit-scrollbar-thumb{ background:#2c3f5e; border-radius:8px; }
.out-line{ margin:0; white-space:pre; min-height:1.3em; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.out-line.new{ animation:fadeIn .45s ease-out; }
.cursor{
  display:inline-block; color:#4ade80; margin-left:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0; } }
.out-empty-ph{ color:#3d5474; font-size:.7em; }

/* =========================================================
   说明条
   ========================================================= */
#fpExplain .fp-body{
  font-size:var(--explain-font);
  line-height:1.6;
  color:#c6d8ee;
}
.ex-badge{
  display:inline-block; padding:4px 20px; border-radius:12px;
  background:rgba(56,189,248,.22); color:var(--accent);
  font-size:.68em; font-weight:800; margin-right:16px;
  vertical-align:middle;
}
.ex-badge.gold{ background:rgba(250,204,21,.26); color:var(--gold); }
.ex-badge.danger{ background:rgba(239,68,68,.24); color:#fca5a5; }
.ex-title{ display:inline; color:#ffffff; font-weight:800; }
.ex-desc{ margin-top:14px; }
.ex-desc code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(148,163,184,.18); border-radius:8px;
  padding:2px 12px; color:#e2e8f0; font-size:.92em;
}
.ex-desc b{ color:#ffffff; }
.tip{
  display:block; margin-top:16px; padding:14px 20px; border-radius:12px;
  background:rgba(45,212,191,.12); border-left:8px solid var(--teal);
  color:#bff5ec; font-size:.92em;
}
.warn{
  display:block; margin-top:16px; padding:14px 20px; border-radius:12px;
  background:rgba(251,191,36,.14); border-left:8px solid var(--amber);
  color:#ffe6b0; font-size:.92em;
}
.danger{
  display:block; margin-top:16px; padding:14px 20px; border-radius:12px;
  background:rgba(239,68,68,.16); border-left:8px solid var(--danger);
  color:#ffc9c9; font-size:.92em;
}

/* =========================================================
   缩略图（VSCode minimap 风格）
   ========================================================= */
#fpMap .fp-body{ padding:0; overflow:hidden; }
#mapInner{
  position:relative;
  width:100%; height:100%;
  overflow:hidden;
  background:rgba(5,10,18,.55);
}
.map-line{
  display:block;
  white-space:pre;
  overflow:hidden;
  color:#8aa2c0;
  padding-left:6px;
  transition:background .2s;
}
.map-line.cur{
  background:rgba(56,189,248,.40);
  box-shadow:inset 4px 0 0 var(--accent);
}
.map-line .ln{ display:none; }
.map-view{
  position:absolute; left:0; right:0; top:0; height:0;
  background:rgba(56,189,248,.16);
  border-top:3px solid rgba(56,189,248,.9);
  border-bottom:3px solid rgba(56,189,248,.9);
  pointer-events:none;
  box-shadow:0 0 22px rgba(56,189,248,.35);
}

/* =========================================================
   小屏兜底
   ========================================================= */
@media (max-width:1100px){
  :root{
    --code-font: clamp(30px, 4.6vw, 80px);
    --out-font:  clamp(28px, 4vw, 72px);
    --var-font:  clamp(18px, 2.6vw, 40px);
    --explain-font: clamp(20px, 2.8vw, 48px);
    --btn-font:  clamp(18px, 2.2vw, 40px);
    --head-font: clamp(16px, 2vw, 32px);
  }
}
</style>
</head>
<body>

<!-- ========== 全屏代码舞台（不透明，永远在最底层） ========== -->
<div id="stage">
  <div id="codeScroll"></div>
</div>

<!-- ========== 顶部控制栏 ========== -->
<div class="fp" id="fpTop" data-panel="top">
  <div class="fp-head">
    <span class="fp-title">C 程序逐步执行模拟 · gets → puts → printf</span>
    <button class="fp-btn" data-act="collapse" title="折叠">–</button>
    <button class="fp-btn fp-close" data-act="close" title="关闭">×</button>
  </div>
  <div class="fp-body">
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btnReset">⟲ 重置</button>
      <button class="ctrl-btn" id="btnPrev">◀ 上一步</button>
      <button class="ctrl-btn primary" id="btnPlay">▶ 自动播放</button>
      <button class="ctrl-btn" id="btnNext">下一步 ▶</button>
      <span class="speed-box">
        速度
        <input type="range" id="speed" min="60" max="1600" step="20" value="360">
        <b id="speedLabel">0.36s</b>
      </span>
      <button class="ctrl-btn" id="btnFull">⛶ 全屏</button>
      <button class="ctrl-btn" id="btnAllPanels">▦ 面板</button>
      <button class="ctrl-btn" id="btnMap">🗺 缩略图</button>
      <button class="ctrl-btn" id="btnLayout">⇱ 重置布局</button>
    </div>
  </div>
  <div class="fp-resize"></div>
</div>

<!-- ========== 变量 / 数组 / 状态面板 ========== -->
<div class="fp" id="fpVars" data-panel="vars">
  <div class="fp-head">
    <span class="fp-title">字符数组 e[10] · 运行状态</span>
    <button class="fp-btn" data-act="collapse" title="折叠">–</button>
    <button class="fp-btn fp-close" data-act="close" title="关闭">×</button>
  </div>
  <div class="fp-body">
    <div class="arr-block">
      <div class="arr-cap">
        <span>字符数组 <b>e[10]</b></span>
        <span class="dim">char e[10]; —— 10 字节 · 未初始化 → gets 只写必要字节</span>
      </div>
      <div class="arr-grid" id="arrGrid"></div>
    </div>
    <div class="var-table" id="varTable"></div>
  </div>
  <div class="fp-resize"></div>
</div>

<!-- ========== 程序输出面板 ========== -->
<div class="fp" id="fpOut" data-panel="out">
  <div class="fp-head">
    <span class="fp-title">程序运行结果（屏幕输出）</span>
    <button class="fp-btn" data-act="collapse" title="折叠">–</button>
    <button class="fp-btn fp-close" data-act="close" title="关闭">×</button>
  </div>
  <div class="fp-body" id="outBody"></div>
  <div class="fp-resize"></div>
</div>

<!-- ========== 当前语句说明条 ========== -->
<div class="fp" id="fpExplain" data-panel="explain">
  <div class="fp-head">
    <span class="fp-title">当前语句说明</span>
    <button class="fp-btn" data-act="collapse" title="折叠">–</button>
    <button class="fp-btn fp-close" data-act="close" title="关闭">×</button>
  </div>
  <div class="fp-body" id="explainBody"></div>
  <div class="fp-resize"></div>
</div>

<!-- ========== 代码缩略图 ========== -->
<div class="fp" id="fpMap" data-panel="map">
  <div class="fp-head">
    <span class="fp-title">缩略图</span>
    <button class="fp-btn" data-act="collapse" title="折叠">–</button>
    <button class="fp-btn fp-close" data-act="close" title="关闭">×</button>
  </div>
  <div class="fp-body">
    <div id="mapInner"></div>
    <div class="map-view" id="mapView"></div>
  </div>
  <div class="fp-resize"></div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     一、真实 C 程序数据（唯一权威）
     ---------------------------------------------------------
       char e[10];           // 10 字节，未初始化
       gets(e);              // 读入 "Hi there"，e[0..7]，e[8]='\0'，e[9] 未初始化
       puts(e);              // 输出 "Hi there" + 自动换行
       printf("%s", e);      // 输出 "Hi there"，不换行
       输出 2 行：Hi there / Hi there（第 2 行末尾无换行）
       gets 1 次、puts 1 次、printf 1 次、scanf 0 次
     ========================================================= */
  var E_LEN = 10;
  var INPUT = 'Hi there';                       /* 8 个字符，含 1 个空格 */
  var INPUT_CHARS = INPUT.split('');

  var E = new Array(E_LEN).fill(null);          /* null = 未初始化 */

  function isNul(c){ return c === '\0'; }
  function isSpace(c){ return c === ' '; }
  function disp(c){
    if (c === null) return '?';
    if (c === '\0') return '\\0';
    if (c === '\n') return '\\n';
    if (c === '\t') return '\\t';
    if (c === ' ')  return '␣';
    return c;
  }

  /* =========================================================
     二、源代码（8 行，逐行渲染；代码与行尾注释同行不折行）
     ========================================================= */
  var CODE_HTML = [
    /* 1 */ '<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>                    <span class="cmt">// 包含标准输入输出头文件</span>',
    /* 2 */ '<span class="kw">int</span> <span class="fn">main</span>() {                             <span class="cmt">// 定义主函数</span>',
    /* 3 */ '    <span class="kw">char</span> e[<span class="num">10</span>];                          <span class="cmt">// 定义字符数组</span>',
    /* 4 */ '    <span class="fn">gets</span>(e);                              <span class="cmt">// 输入字符串，可含空格</span>',
    /* 5 */ '    <span class="fn">puts</span>(e);                              <span class="cmt">// 输出字符串</span>',
    /* 6 */ '    <span class="fn">printf</span>(<span class="str">"%s"</span>, e);                     <span class="cmt">// 再次输出字符串</span>',
    /* 7 */ '    <span class="kw">return</span> <span class="num">0</span>;                           <span class="cmt">// 返回0，程序结束</span>',
    /* 8 */ '}'
  ];

  /* =========================================================
     三、步骤生成
     ========================================================= */

  var current = -1;

  function updateArr(step){
    var arr  = (step && step.arr)  || E;
    var hl   = (step && step.hl)   || [];
    var emit = (step && step.emit) || [];
    var done = (step && step.done) || [];

    cells.forEach(function(cell){
      var i = Number(cell.getAttribute('data-key'));
      var valEl = cell.querySelector('.cv');
      var v = disp(arr[i]);

      if (valEl.textContent !== v) {
        valEl.textContent = v;
        valEl.classList.remove('flash');
        void valEl.offsetWidth;
        valEl.classList.add('flash');
      }

      cell.classList.remove('is-uninit','is-nul','is-space','is-hl','is-done','is-emit');

      var ch = arr[i];
      if (ch === null)      cell.classList.add('is-uninit');
      else if (ch === '\0') cell.classList.add('is-nul');
      else if (ch === ' ')  cell.classList.add('is-space');

      var isEmit = emit.indexOf(i) !== -1;
      var isHl   = hl.indexOf(i)   !== -1;
      var isDone = done.indexOf(i) !== -1;

      if (isEmit)      cell.classList.add('is-emit');
      else if (isHl)   cell.classList.add('is-hl');
      else if (isDone) cell.classList.add('is-done');
    });
  }

  function updateVars(step, prevStep){
    VAR_ROWS.forEach(function(r){
      var row = varTable.querySelector('.var-row[data-key="' + r.key + '"]');
      if (!row) return;
      var valEl = row.querySelector('.vval');
      var val = step ? String(step[r.key]) : '—';
      var old = prevStep ? String(prevStep[r.key]) : '—';
      if (valEl.textContent !== val) {
        valEl.textContent = val;
        valEl.title = val;
        valEl.classList.remove('flash');
        void valEl.offsetWidth;
        valEl.classList.add('flash');
        if (prevStep && old !== val) {
          row.classList.add('changed');
          window.setTimeout(function(){ row.classList.remove('changed'); }, 700);
        }
      }
    });
  }

  function updateCode(step){
    var activeLine = step ? step.line : -1;
    codeLines.forEach(function(el){
      var n = Number(el.dataset.line);
      el.classList.toggle('active', n === activeLine);
      el.classList.toggle('done', activeLine > 0 && n < activeLine);
    });
    centerActiveLine();
  }

  function centerActiveLine(){
    var el = codeScroll.querySelector('.code-line.active');
    if (!el) return;
    window.requestAnimationFrame(function(){
      var er = el.getBoundingClientRect();
      var cr = codeScroll.getBoundingClientRect();
      var delta = (er.top + er.height / 2) - (cr.top + cr.height / 2);
      if (Math.abs(delta) > 6) {
        codeScroll.scrollTop += delta;
        syncMapView();
      }
    });
  }

  function makeCursor(){
    var s = document.createElement('span');
    s.className = 'cursor';
    s.textContent = '▊';
    return s;
  }

  /* ---- 输出面板：puts 后有换行 → 光标进入下一行；printf 后无换行 → 光标停在行尾 ---- */
  function updateOutput(idx){
    var text = (idx >= 0 && STEPS[idx]) ? STEPS[idx].out : '';
    if (text === lastOutText) return;
    var prevLineCount = outBody.querySelectorAll('.out-line').length;
    lastOutText = text;

    outBody.innerHTML = '';

    if (text === '') {
      var ph = document.createElement('div');
      ph.className = 'out-line out-empty-ph';
      ph.textContent = '（等待程序输出…）';
      outBody.appendChild(ph);
      return;
    }

    var lines = text.split('\n');
    for (var k = 0; k < lines.length; k++) {
      var d = document.createElement('div');
      d.className = 'out-line';
      if (k >= prevLineCount) d.classList.add('new');
      if (lines[k] === '') d.innerHTML = '&nbsp;';
      else d.textContent = lines[k];
      outBody.appendChild(d);
    }
    /* 光标永远停在最后一行末尾 */
    outBody.lastChild.appendChild(makeCursor());
    outBody.scrollTop = outBody.scrollHeight;
  }

  function updateExplain(step){

        '· <b>输入</b>：<code>gets(e);</code> → 本模拟输入 <b>"' + INPUT + '"</b>（8 字符，含 1 个空格）<br>' +
        '· <b>输出 1</b>：<code>puts(e);</code> → 逐字符输出 + <b>自动换行</b><br>' +

        '<span class="danger"><b>⚠ 安全提示：</b><code>gets</code> 不做边界检查，是不安全函数，C11 标准已删除。现代代码请用 <code>fgets(e, 10, stdin)</code>。</span>';

      '<span class="ex-title">' + step.title + '</span>' +

  /* =========================================================
     六、缩略图同步（荧光框 = 全屏可见区域）
     ========================================================= */
  var mapSyncPending = false;
  function syncMapView(){
    if (mapSyncPending) return;
    mapSyncPending = true;
    window.requestAnimationFrame(function(){
      mapSyncPending = false;
      if (!codeLines.length) return;
      var fullLH = codeLines[0].getBoundingClientRect().height || 1;
      var innerH = mapInner.clientHeight;
      if (innerH <= 0) return;
      var N = codeLines.length;                     /* 8 行 */
      var mapLH = innerH / N;                       /* 缩略图单行高度 = 总高 / 8 */

      /* 缩略图每行字号 / 行高跟随面板尺寸 */
      var fs = Math.max(5, Math.min(mapLH * 0.52, mapInner.clientWidth / 40, 34));
      for (var k = 0; k < mapLines.length; k++) {
        mapLines[k].style.height     = mapLH + 'px';
        mapLines[k].style.lineHeight = mapLH + 'px';
        mapLines[k].style.fontSize   = fs + 'px';
      }

      /* 可见行数与荧光框 */
      var visibleLines = codeScroll.clientHeight / fullLH;
      var boxH = Math.min(innerH, visibleLines * mapLH);
      var top  = (codeScroll.scrollTop / fullLH) * mapLH;
      top = Math.max(0, Math.min(innerH - boxH, top));

      mapView.style.top    = top + 'px';
      mapView.style.height = Math.max(8, boxH) + 'px';
    });
  }

  function paintMapCurrent(step){
    var idx = step ? step.line - 1 : -1;
    for (var k = 0; k < mapLines.length; k++) {
      mapLines[k].classList.toggle('cur', k === idx);
    }
  }

  /* 点击缩略图 → 平滑滚动到对应行 */
  mapInner.addEventListener('click', function(e){
    var rect = mapInner.getBoundingClientRect();
    var y = e.clientY - rect.top;
    var N = mapLines.length || 8;
    var idx = Math.floor(y / (rect.height / N));
    idx = Math.max(0, Math.min(N - 1, idx));
    var fullLH = codeLines[0].getBoundingClientRect().height || 1;
    codeScroll.scrollTo({ top: idx * fullLH, behavior: 'smooth' });
    window.setTimeout(syncMapView, 260);
    window.setTimeout(syncMapView, 520);
  });

  codeScroll.addEventListener('scroll', syncMapView, { passive: true });

  /* =========================================================
     七、主渲染
     ========================================================= */
  function render(){
    var step = current >= 0 ? STEPS[current] : null;
    var prev = current > 0 ? STEPS[current - 1] : null;

    updateCode(step);
    updateVars(step, prev);
    updateArr(step);
    updateOutput(current);
    updateExplain(step);
    paintMapCurrent(step);
    syncMapView();

    btnPrev.disabled = current < 0;
    btnNext.disabled = current >= STEPS.length - 1;
  }

  function updatePlayBtn(){
    btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
    btnPlay.classList.toggle('playing', playing);
  }

  function tick(){
    if (current >= STEPS.length - 1) { pause(); return; }
    current += 1;
    render();
    if (current >= STEPS.length - 1) pause();
  }

  function play(){
    if (playing) return;
    if (current >= STEPS.length - 1) { current = -1; render(); }
    playing = true;
    updatePlayBtn();
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
    tick();
  }

  function pause(){
    playing = false;
    window.clearInterval(timer);
    timer = null;
    updatePlayBtn();
  }

  function nextStep(){
    pause();
    if (current < STEPS.length - 1) { current += 1; render(); }
  }

  function prevStep(){
    pause();
    if (current > -1) { current -= 1; render(); }
  }

  function resetAll(){
    pause();
    current = -1;
    lastOutText = null;
    outBody.innerHTML = '';
    codeScroll.scrollTop = 0;
    render();
  }

  /* =========================================================
     八、面板系统：拖动 / 调整大小 / 置顶 / 关闭 / 折叠
     ========================================================= */
  var zTop = 300;
  var allPanels = Array.prototype.slice.call(document.querySelectorAll('.fp'));

  function raise(el){
    zTop += 1;
    el.style.zIndex = zTop;
    allPanels.forEach(function(p){ p.classList.toggle('active', p === el); });
  }

  function makeDraggable(el, handle){
    handle.addEventListener('pointerdown', function(e){
      if (e.target.closest('button')) return;
      e.preventDefault();
      raise(el);
      var sx = e.clientX, sy = e.clientY;
      var r  = el.getBoundingClientRect();
      var ox = r.left, oy = r.top;
      el.style.left = ox + 'px';
      el.style.top  = oy + 'px';

      function move(ev){
        el.style.left = (ox + ev.clientX - sx) + 'px';
        el.style.top  = (oy + ev.clientY - sy) + 'px';
      }
      function up(){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        syncMapView();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  }

  function makeResizable(el, handle){
    handle.addEventListener('pointerdown', function(e){
      e.preventDefault();
      e.stopPropagation();
      raise(el);
      var sx = e.clientX, sy = e.clientY;
      var r  = el.getBoundingClientRect();
      var ow = r.width, oh = r.height;
      el.style.left   = r.left + 'px';
      el.style.top    = r.top + 'px';
      el.style.width  = ow + 'px';
      el.style.height = oh + 'px';
      el.classList.remove('collapsed');

      function move(ev){
        /* 不设最小 / 最大限制，用户拖多大就多大 */
        el.style.width  = Math.max(0, ow + ev.clientX - sx) + 'px';
        el.style.height = Math.max(0, oh + ev.clientY - sy) + 'px';
        syncMapView();
      }
      function up(){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        syncMapView();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', up);
    });
  }

  allPanels.forEach(function(el){
    var head   = el.querySelector('.fp-head');
    var resize = el.querySelector('.fp-resize');
    if (head)   makeDraggable(el, head);
    if (resize) makeResizable(el, resize);
    el.addEventListener('pointerdown', function(){ raise(el); }, true);
    el.addEventListener('focusin',     function(){ raise(el); });
  });

  /* 折叠 / 关闭按钮 */
  document.querySelectorAll('.fp-btn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var panel = btn.closest('.fp');
      raise(panel);
      var act = btn.getAttribute('data-act');
      if (act === 'collapse') {
        panel.classList.toggle('collapsed');
        btn.textContent = panel.classList.contains('collapsed') ? '+' : '–';
      } else if (act === 'close') {
        panel.classList.add('hidden');
      }
      syncMapView();
    });
  });

  /* =========================================================
     九、默认布局 / 重置布局
     ========================================================= */
  function defaultLayout(){
    var W = window.innerWidth, H = window.innerHeight, G = 16;

    var fpTop     = document.getElementById('fpTop');
    var fpVars    = document.getElementById('fpVars');
    var fpOut     = document.getElementById('fpOut');
    var fpExplain = document.getElementById('fpExplain');
    var fpMap     = document.getElementById('fpMap');

    [fpTop, fpVars, fpOut, fpExplain, fpMap].forEach(function(el){
      el.style.width = '';
      el.style.height = '';
      el.style.left = '';
      el.style.top = '';
      el.classList.remove('hidden', 'collapsed', 'active');
      var cb = el.querySelector('[data-act="collapse"]');
      if (cb) cb.textContent = '–';
    });

    /* 顶栏：水平居中，贴顶 */
    var tw = fpTop.offsetWidth, th = fpTop.offsetHeight;
    fpTop.style.left = Math.max(G, (W - tw) / 2) + 'px';
    fpTop.style.top  = G + 'px';

    /* 缩略图：右上 */
    var mw = Math.max(220, Math.min(360, W * 0.17));
    var mh = Math.max(260, H * 0.60);
    fpMap.style.width  = mw + 'px';
    fpMap.style.height = mh + 'px';
    fpMap.style.left = (W - mw - G) + 'px';
    fpMap.style.top  = (G + th + 18) + 'px';

    /* 变量面板：左上 */
    var vw = Math.max(400, Math.min(940, W * 0.44));
    var vh = Math.max(320, Math.min(720, H * 0.54));
    fpVars.style.width  = vw + 'px';
    fpVars.style.height = vh + 'px';
    fpVars.style.left = G + 'px';
    fpVars.style.top  = (G + th + 18) + 'px';

    /* 输出面板：左下 */
    var ow = Math.max(340, Math.min(760, W * 0.33));
    var oh = Math.max(220, Math.min(400, H * 0.30));
    fpOut.style.width  = ow + 'px';
    fpOut.style.height = oh + 'px';
    fpOut.style.left = G + 'px';
    fpOut.style.top  = Math.max(G + th + 18, H - oh - G) + 'px';

    /* 说明条：底部中间偏右 */
    var ew = Math.max(440, Math.min(1400, W - vw - mw - G * 4));
    fpExplain.style.width = ew + 'px';
    fpExplain.style.left  = (G + vw + G) + 'px';
    fpExplain.style.top   = Math.max(G + th + 18, H - fpExplain.offsetHeight - G) + 'px';

    /* 层级顺序 */
    zTop = 300;
    [fpMap, fpVars, fpOut, fpExplain, fpTop].forEach(function(el){
      zTop += 1;
      el.style.zIndex = zTop;
    });

    syncMapView();
  }

  /* =========================================================
     十、全屏 / 面板总开关 / 快捷键
     ========================================================= */
  function toggleFullscreen(){
    if (!document.fullscreenElement) {
      var el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    }
  }

  var panelsHidden = false;
  function toggleAllPanels(){
    panelsHidden = !panelsHidden;
    allPanels.forEach(function(p){
      if (panelsHidden) p.classList.add('hidden');
      else              p.classList.remove('hidden');
    });
    if (!panelsHidden) syncMapView();
  }

  var mapHidden = false;
  function toggleMap(){
    mapHidden = !mapHidden;
    var fpMap = document.getElementById('fpMap');
    fpMap.classList.toggle('hidden', mapHidden);
    if (!mapHidden) { raise(fpMap); syncMapView(); }
  }

  document.addEventListener('keydown', function(e){
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    switch (e.code) {
      case 'Space':      e.preventDefault(); playing ? pause() : play(); break;
      case 'ArrowRight': e.preventDefault(); nextStep(); break;
      case 'ArrowLeft':  e.preventDefault(); prevStep(); break;
      case 'KeyR':       resetAll(); break;
      case 'KeyF':       toggleFullscreen(); break;
      case 'KeyM':       toggleMap(); break;
      case 'KeyH':       toggleAllPanels(); break;
    }
  });

  /* =========================================================
     十一、按钮事件
     ========================================================= */
  btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
  btnNext.addEventListener('click', nextStep);
  btnPrev.addEventListener('click', prevStep);
  btnReset.addEventListener('click', resetAll);
  btnFull.addEventListener('click', toggleFullscreen);
  btnAllP.addEventListener('click', toggleAllPanels);
  btnMap.addEventListener('click', toggleMap);
  btnLayout.addEventListener('click', defaultLayout);

  speedInput.addEventListener('input', function(){
    speed = Number(speedInput.value);
    speedLabel.textContent = (speed / 1000).toFixed(2) + 's';
    if (playing) {
      window.clearInterval(timer);
      timer = window.setInterval(tick, speed);
    }
  });

  /* =========================================================
     十二、窗口尺寸变化
     ========================================================= */
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    syncMapView();
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(syncMapView, 120);
  });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(syncMapView);
  }

  /* =========================================================
     十三、启动
     ========================================================= */
  speedLabel.textContent = (speed / 1000).toFixed(2) + 's';
  updatePlayBtn();
  render();
  window.requestAnimationFrame(function(){
    defaultLayout();
    window.requestAnimationFrame(syncMapView);
  });
  window.setTimeout(syncMapView, 200);
  window.setTimeout(syncMapView, 600);

})();
</script>
</body>
</html>
