<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 二维数组查找元素 · continue 跳过 · flag 标记 · 希沃大屏版</title>
<style>
  /* ============ 字号硬指标（1920×1080 后排 10 米可读） ============ */
  :root{
    --code-font: clamp(80px, 5vw, 120px);
    --out-font:  clamp(72px, 4.5vw, 110px);
    --var-font:  clamp(40px, 2.4vw, 60px);
    --explain-font: clamp(48px, 2.8vw, 72px);
    --btn-font:  clamp(40px, 2.2vw, 60px);
    --title-font:clamp(56px, 3vw, 80px);
    --head-font: clamp(32px, 1.6vw, 46px);

    --bg:#0d1117;
    --panel-bg: rgba(13,17,23,.78);
    --border:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --accent:#58a6ff;
    --green:#3fb950;
    --amber:#d29922;
    --pink:#f778ba;
    --purple:#bc8cff;
    --teal:#39d353;
    --orange:#ffa657;
    --gold:#e3b341;
    --red:#f85149;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  /* ============ 全屏代码舞台（不透明，永远在最底层） ============ */
  #codeStage{
    position:fixed;inset:0;background:var(--bg);
    overflow:auto;scrollbar-width:thin;scrollbar-color:#3a4a5e transparent;
    z-index:1;
  }
  #codeStage::-webkit-scrollbar{width:22px;height:22px;}
  #codeStage::-webkit-scrollbar-track{background:#0b0f14;}
  #codeStage::-webkit-scrollbar-thumb{background:#334155;border-radius:12px;border:4px solid #0b0f14;}
  #codeInner{display:inline-block;min-width:100%;padding:24px 0 40px;}

  .code-line{
    display:flex;align-items:flex-start;
    padding:.06em 2em .06em .5em;
    border-left:10px solid transparent;
    /* 用 pre 保留前导缩进空格 */
    white-space:pre;
    transition:background .25s,border-color .25s,opacity .25s;
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    font-size:var(--code-font);
    line-height:1.35;
  }
  .code-line .ln{
    flex:0 0 auto;width:3ch;text-align:right;color:#3f4d5e;
    user-select:none;font-variant-numeric:tabular-nums;margin-right:.5em;
    font-size:.7em;
  }
  .code-line .src{
    flex:0 0 auto;
    white-space:pre;
  }
  .code-line.skip{opacity:.18;}
  .code-line.active{
    background:linear-gradient(90deg,rgba(88,166,255,.26),rgba(88,166,255,.02) 70%);
    border-left-color:var(--accent);
    box-shadow:inset 0 0 0 3px rgba(88,166,255,.35);
  }
  .code-line.active .ln{color:var(--accent);font-weight:700;}
  .code-line.active .src{color:#ffffff;}

  .pp{color:var(--purple);font-weight:600;}
  .str{color:var(--green);}
  .cmt{color:#6e7d8f;font-style:italic;}
  .fn{color:var(--accent);}
  .kw{color:var(--pink);font-weight:600;}
  .num{color:var(--amber);}
  .op{color:var(--orange);font-weight:700;}

  /* ============ 通用悬浮面板 ============ */
  .panel{
    position:fixed;z-index:100;
    background:var(--panel-bg);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:2px solid rgba(120,160,220,.28);
    border-radius:18px;
    display:flex;flex-direction:column;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.65);
    transition:border-color .15s,box-shadow .15s,opacity .15s;
  }
  .panel:hover{opacity:1;}
  .panel.active-panel{
    border-color:rgba(88,166,255,.95);
    box-shadow:0 0 0 3px rgba(88,166,255,.35),0 22px 60px rgba(0,0,0,.75);
  }
  .panel-head{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:10px 14px;cursor:move;user-select:none;touch-action:none;
    background:rgba(255,255,255,.05);
    border-bottom:1px solid rgba(120,160,220,.18);
  }
  .panel-title{
    font-size:var(--head-font);font-weight:700;color:#c9d7e8;
    letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .panel-body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 14px;}
  .panel-body::-webkit-scrollbar{width:14px;height:14px;}
  .panel-body::-webkit-scrollbar-thumb{background:#334155;border-radius:8px;}

  .pclose{
    margin-left:auto;flex:0 0 auto;
    width:56px;height:56px;line-height:1;
    font-size:40px;font-weight:700;
    border-radius:12px;border:2px solid rgba(248,81,73,.55);
    background:rgba(248,81,73,.18);color:#ffb3ae;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .pclose:hover{background:rgba(248,81,73,.42);color:#fff;}

  .resizer{
    position:absolute;right:0;bottom:0;width:46px;height:46px;
    cursor:nwse-resize;touch-action:none;
    background:linear-gradient(135deg,transparent 46%,rgba(120,170,255,.6) 46%);
    border-bottom-right-radius:16px;
  }
  .resizer:hover{background:linear-gradient(135deg,transparent 46%,rgba(88,166,255,1) 46%);}

  /* ============ 控制栏 ============ */
  #panelTools .panel-body{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  }
  .btn{
    font:inherit;font-size:var(--btn-font);font-weight:700;
    min-height:76px;padding:0 26px;border-radius:14px;
    border:2px solid rgba(120,160,220,.4);
    background:rgba(30,44,64,.9);color:#dce8f8;cursor:pointer;
    white-space:nowrap;touch-action:manipulation;
  }
  .btn:hover{background:rgba(48,70,100,.95);border-color:#5c8dd0;}
  .btn:active{transform:translateY(2px);}
  .btn:disabled{opacity:.3;cursor:not-allowed;}
  .btn.primary{background:linear-gradient(180deg,#1f6feb,#1158c7);border-color:#58a6ff;color:#fff;}
  .btn.primary.playing{background:linear-gradient(180deg,#d29922,#a16207);border-color:#e3b341;color:#1a1200;}
  .speed{display:flex;align-items:center;gap:12px;font-size:var(--head-font);color:#9fb3cc;}
  .speed input[type=range]{width:240px;height:36px;accent-color:var(--accent);cursor:pointer;}
  .speed b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:5ch;display:inline-block;}

  /* ============ 数组可视化 ============ */
  .arr-title{font-size:var(--head-font);color:#9fb3cc;margin:6px 0 8px;letter-spacing:.02em;}
  .arr-title b{color:var(--accent);}
  .arr-title i{color:var(--gold);font-style:normal;font-weight:700;}
  .arr-grid{display:grid;gap:8px;grid-template-columns:4.6em repeat(3,minmax(0,1fr));}
  .arr-head{font-size:var(--head-font);color:#6e8199;text-align:center;font-variant-numeric:tabular-nums;}
  .arr-head.mcol{text-align:right;padding-right:8px;}
  .arr-cell{
    text-align:center;border-radius:10px;padding:6px 2px;
    background:rgba(20,30,44,.9);border:2px solid #24334a;
    transition:background .25s,border-color .25s,box-shadow .25s,transform .25s;
    overflow:hidden;
  }
  .arr-cell .idx{display:block;font-size:.52em;color:#6e8199;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .arr-cell .val{
    display:block;font-family:ui-monospace,Consolas,monospace;font-weight:800;
    font-size:1.25em;color:#93a7c0;font-variant-numeric:tabular-nums;line-height:1.3;
  }
  .arr-cell.mtag{
    font-size:var(--head-font);color:#6e8199;font-weight:700;text-align:right;
    padding-right:8px;line-height:2.4;background:transparent;border-color:transparent;
  }
  .arr-cell.is-hl{border-color:var(--accent);background:rgba(88,166,255,.22);box-shadow:0 0 0 3px rgba(88,166,255,.4);transform:translateY(-3px);}
  .arr-cell.is-hl .val{color:#fff;} .arr-cell.is-hl .idx{color:var(--accent);}
  .arr-cell.is-skip{border-color:var(--teal);background:rgba(57,211,83,.16);box-shadow:0 0 0 3px rgba(57,211,83,.35);}
  .arr-cell.is-skip .val{color:#bff5ec;} .arr-cell.is-skip .idx{color:var(--teal);}
  .arr-cell.is-found{border-color:var(--gold);background:rgba(227,179,65,.28);box-shadow:0 0 0 3px rgba(227,179,65,.6),0 0 22px rgba(227,179,65,.5);transform:translateY(-4px);}
  .arr-cell.is-found .val{color:#fff8d0;} .arr-cell.is-found .idx{color:var(--gold);}
  @keyframes cellFlash{0%{transform:scale(1);}40%{transform:scale(1.3);color:#fff;}100%{transform:scale(1);}}
  .arr-cell .val.flash{animation:cellFlash .5s ease-out;}

  /* ============ 变量表 ============ */
  .var-row{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:8px 12px;border-radius:12px;margin-bottom:6px;
    background:rgba(20,30,44,.85);border:2px solid #1e2a3d;
    font-size:var(--var-font);transition:background .25s,border-color .25s;
  }
  .var-row.k-ctx{background:rgba(31,111,235,.22);border-color:#2f5c9e;}
  .var-row.k-main{border-left:8px solid rgba(34,211,238,.7);}
  .var-row.k-val{border-left:8px solid rgba(247,120,186,.9);}
  .var-row.k-sw{border-left:8px solid rgba(57,211,83,.9);}
  .var-row.k-money{border-left:8px solid rgba(210,153,34,.95);}
  .var-row.k-note{border-left:8px solid rgba(57,211,83,.8);}
  .var-row.k-ret{border-left:8px solid rgba(210,153,34,.6);}
  .var-row.k-gold{border-left:8px solid rgba(227,179,65,.95);}
  .var-row.k-cnt{border-left:8px solid rgba(188,140,255,.9);}
  .var-row.changed{border-color:rgba(88,166,255,.95);background:rgba(88,166,255,.18);}
  .var-name{color:#93a7c0;white-space:nowrap;font-size:.72em;flex:0 0 auto;}
  .var-value{
    font-family:ui-monospace,Consolas,monospace;font-weight:800;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;
    flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  }
  .var-value.dim{color:#5f7796;font-weight:500;}
  .var-row.k-ctx .var-value{color:var(--green);}
  .var-row.k-main .var-value{color:#67e8f9;}
  .var-row.k-val .var-value{color:var(--pink);}
  .var-row.k-sw .var-value{color:var(--teal);}
  .var-row.k-money .var-value{color:var(--amber);}
  .var-row.k-note .var-value{color:var(--teal);}
  .var-row.k-ret .var-value{color:var(--amber);}
  .var-row.k-gold .var-value{color:var(--gold);}
  .var-row.k-cnt .var-value{color:var(--purple);}
  @keyframes vflash{0%{transform:scale(1);}35%{transform:scale(1.22);color:#fff;text-shadow:0 0 16px var(--accent);}100%{transform:scale(1);}}
  .var-value.flash{animation:vflash .5s ease-out;}

  /* ============ 输出面板 ============ */
  #consoleBody{
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:var(--out-font);line-height:1.5;color:#ffd76e;
    white-space:pre-wrap;word-break:break-all;
  }
  #consoleBody:empty::before{content:"（等待程序输出…）";color:#3d5474;}
  .out-line{margin:0;white-space:pre-wrap;animation:outIn .5s ease-out both;}
  @keyframes outIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  /* ============ 说明条 ============ */
  #explainBody{font-size:var(--explain-font);line-height:1.45;color:#c4d4e8;}
  .ex-line{
    display:inline-block;margin-right:14px;padding:4px 18px;border-radius:10px;
    background:rgba(88,166,255,.22);color:#8ecbff;font-weight:800;font-size:.8em;
    vertical-align:middle;
  }
  .ex-line.ans{background:rgba(210,153,34,.26);color:#ffd479;}
  .ex-line.mv{background:rgba(247,120,186,.26);color:#ffa8d8;}
  .ex-line.skip{background:rgba(57,211,83,.22);color:#7ee89a;}
  .ex-line.gold{background:rgba(227,179,65,.26);color:#ffe08a;}
  .ex-line.warn{background:rgba(248,81,73,.26);color:#ffb3ae;}
  #explainBody strong{color:#fff;}
  #explainBody code{
    font-family:ui-monospace,Consolas,monospace;background:rgba(148,163,184,.18);
    border-radius:6px;padding:0 8px;color:#e2e8f0;font-size:.92em;
  }
  #explainBody .tip,#explainBody .warn,#explainBody .danger,#explainBody .win{
    display:block;margin-top:10px;padding:10px 16px;border-radius:10px;font-size:.9em;line-height:1.45;
  }
  #explainBody .tip{background:rgba(57,211,83,.12);border-left:10px solid var(--teal);color:#bff5ec;}
  #explainBody .warn{background:rgba(210,153,34,.14);border-left:10px solid var(--amber);color:#ffe6b0;}
  #explainBody .danger{background:rgba(248,81,73,.16);border-left:10px solid var(--red);color:#ffc9c9;}
  #explainBody .win{background:rgba(227,179,65,.16);border-left:10px solid var(--gold);color:#fff3c4;font-weight:700;}

  /* ============ 缩略图（VSCode minimap） ============ */
  #miniContent{
    position:relative;width:100%;
    background:rgba(8,12,18,.55);
  }
  .mini-line{
    height:8px;line-height:8px;font-size:7px;overflow:hidden;
    white-space:pre;
    font-family:ui-monospace,Consolas,monospace;
    padding-left:2px;border-left:2px solid transparent;
    opacity:.72;
  }
  .mini-line.active{background:rgba(88,166,255,.42);border-left-color:#58a6ff;opacity:1;}
  .mini-line.skip{opacity:.22;}
  .mini-line .cmt{color:#4a5a6b;}
  .mini-viewport{
    position:absolute;left:0;right:0;
    border:2px solid rgba(88,166,255,.95);
    background:rgba(88,166,255,.16);
    border-radius:4px;pointer-events:none;
  }

  .hidden{display:none !important;}
</style>
</head>
<body>

<!-- ============ 全屏代码舞台 ============ -->
<div id="codeStage"><div id="codeInner"></div></div>

<!-- ============ 控制栏 ============ -->
<div class="panel" id="panelTools" data-panel>
  <div class="panel-head" data-drag>
    <span class="panel-title">控制台</span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="panel-body">
    <button class="btn" id="btnReset">⟲ 重置</button>
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <label class="speed">速度
      <input type="range" id="speed" min="80" max="2000" step="20" value="600">
      <b id="speedLabel">0.60s</b>
    </label>
    <button class="btn" id="btnFull">⛶ 全屏</button>
    <button class="btn" id="btnPanels">▣ 面板</button>
    <button class="btn" id="btnMini">▤ 缩略图</button>
    <button class="btn" id="btnLayout">⤾ 重置布局</button>
  </div>
  <div class="resizer" data-resize></div>
</div>

<!-- ============ 变量 / 数组 / 状态面板 ============ -->
<div class="panel" id="panelVars" data-panel>
  <div class="panel-head" data-drag>
    <span class="panel-title">数组 a[2][3] · 变量 · 循环条件 · 状态表</span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="arr-title">二维数组 <b>a[2][3]</b>　当前考察 <b>蓝</b>　continue 跳过 <i style="color:#39d353">青</i>　找到 <i>金</i></div>
    <div class="arr-grid" id="arrGrid"></div>
    <div id="varTable" style="margin-top:18px"></div>
  </div>
  <div class="resizer" data-resize></div>
</div>

<!-- ============ 程序输出面板 ============ -->
<div class="panel" id="panelOut" data-panel>
  <div class="panel-head" data-drag>
    <span class="panel-title">程序运行结果（屏幕输出）</span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="panel-body"><div id="consoleBody"></div></div>
  <div class="resizer" data-resize></div>
</div>

<!-- ============ 当前语句说明条 ============ -->
<div class="panel" id="panelExplain" data-panel>
  <div class="panel-head" data-drag>
    <span class="panel-title" id="stepCounter">步骤 — / —</span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="panel-body"><div id="explainBody"></div></div>
  <div class="resizer" data-resize></div>
</div>

<!-- ============ 缩略图面板 ============ -->
<div class="panel" id="panelMini" data-panel>
  <div class="panel-head" data-drag>
    <span class="panel-title">缩略图</span>
    <button class="pclose" data-close title="关闭">×</button>
  </div>
  <div class="panel-body" style="padding:0;position:relative;">
    <div id="miniContent"></div>
    <div class="mini-viewport" id="miniViewport"></div>
  </div>
  <div class="resizer" data-resize></div>
</div>

<script>
(function(){
'use strict';

/* ================================================================
   一、源代码（严格 21 行，与教材一致）
   ================================================================ */
var CODE = [
/*1 */ '<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>                   <span class="cmt">// 包含标准输入输出头文件</span>',
/*2 */ '<span class="kw">int</span> <span class="fn">main</span>() {                            <span class="cmt">// 定义主函数</span>',
/*3 */ '    <span class="kw">static</span> <span class="kw">int</span> a[<span class="num">2</span>][<span class="num">3</span>] <span class="op">=</span> {<span class="num">10</span>,<span class="num">3</span>,<span class="num">5</span>,<span class="num">7</span>,<span class="num">9</span>,<span class="num">12</span>}; <span class="cmt">// 定义并初始化二维数组</span>',
/*4 */ '    <span class="kw">int</span> i, j, m, t, k, flag<span class="op">=</span><span class="num">0</span>;         <span class="cmt">// 定义变量和标记</span>',
/*5 */ '    <span class="fn">printf</span>(<span class="str">"Please input number:"</span>);    <span class="cmt">// 提示输入</span>',
/*6 */ '    <span class="fn">scanf</span>(<span class="str">"%d"</span>, <span class="op">&amp;</span>m);                    <span class="cmt">// 输入要查找的值</span>',
/*7 */ '    <span class="kw">for</span>(i<span class="op">=</span><span class="num">0</span>; i<span class="op">&lt;</span><span class="num">2</span>; i<span class="op">++</span>) {               <span class="cmt">// 外层循环，遍历行</span>',
/*8 */ '        <span class="kw">for</span>(j<span class="op">=</span><span class="num">0</span>; j<span class="op">&lt;</span><span class="num">3</span>; j<span class="op">++</span>) {           <span class="cmt">// 内层循环，遍历列</span>',
/*9 */ '            <span class="kw">if</span>(a[i][j] <span class="op">!=</span> m) {          <span class="cmt">// 如果当前元素不等于m</span>',
/*10*/ '                <span class="kw">continue</span>;               <span class="cmt">// 跳过本次循环</span>',
/*11*/ '            }',
/*12*/ '            t<span class="op">=</span>i; k<span class="op">=</span>j; flag<span class="op">=</span><span class="num">1</span>;           <span class="cmt">// 记录行列下标，标记找到</span>',
/*13*/ '        }',
/*14*/ '    }',
/*15*/ '    <span class="kw">if</span>(flag<span class="op">==</span><span class="num">1</span>) {                       <span class="cmt">// 如果找到</span>',
/*16*/ '        <span class="fn">printf</span>(<span class="str">"a[%d][%d]:%d"</span>, t, k, a[t][k]); <span class="cmt">// 输出结果</span>',
/*17*/ '    } <span class="kw">else</span> {                           <span class="cmt">// 否则</span>',
/*18*/ '        <span class="fn">printf</span>(<span class="str">"None"</span>);                <span class="cmt">// 输出未找到</span>',
/*19*/ '    }',
/*20*/ '    <span class="kw">return</span> <span class="num">0</span>;                          <span class="cmt">// 返回0，程序结束</span>',
/*21*/ '}'
];

/* ================================================================
   二、执行状态模型
   ================================================================ */
var A = [[10,3,5],[7,9,12]];   // 二维数组 a
var NROW = 2, NCOL = 3;
var IN_VAL = 12;                // 模拟键盘输入

var vi='—', vj='—', vm='—', vt='—', vk='—', vflag='0';
var outText = '';
var CNT = {printf:0, scanf:0, cont:0, cmp:0, found:0};
var STEPS = [];

function keyA(r,c){ return r+','+c; }
function snapA(){ return A.map(function(r){ return r.slice(); }); }

function push(o){
  STEPS.push({
    line: o.line,
    ctx: o.ctx || '—',
    vars: { i: vi, j: vj, m: vm, t: vt, k: vk, flag: vflag },
    condOuter: o.condOuter || '—',

/* ================================================================
   五、渲染
   ================================================================ */
var current = -1, playing = false, timer = null;
var speed = Number(document.getElementById('speed').value);
var lastOutText = null;

function valueOf(step, key){
  if (!step) return '—';
  if (key === 'ctx') return step.ctx || '—';
  if (key.slice(0,2) === 'c_') {
    var k = key.slice(2);
    return String(step.cnt[k]);
  }
  var v = step.vars[key];
  if (v === undefined) v = step[key];
  return (v === undefined || v === null) ? '—' : v;
}

function updateVars(step, prev){
  VAR_ROWS.forEach(function(r){
    var row = varTable.querySelector('.var-row[data-key="' + r.key + '"]');
    if (!row) return;
    var valEl = row.querySelector('.var-value');
    var val = String(valueOf(step, r.key));
    var old = String(valueOf(prev, r.key));
    if (valEl.textContent !== val) {
      valEl.textContent = val;
      valEl.title = val;
      valEl.classList.toggle('dim', val === '—');
      valEl.classList.remove('flash');
      void valEl.offsetWidth;
      valEl.classList.add('flash');
      if (prev && old !== val) {
        row.classList.add('changed');
        setTimeout(function(){ row.classList.remove('changed'); }, 700);
      }
    }
  });
}

function updateArr(step){
  var hl   = (step && step.hl)      || [];
  var sk   = (step && step.skipCell)|| [];
  var fd   = (step && step.found)   || [];
  cellsA.forEach(function(cell){
    var kk = cell.getAttribute('data-key');
    var valEl = cell.querySelector('.val');
    var rc = kk.split(',');
    var v = String(A[Number(rc[0])][Number(rc[1])]);
    if (valEl.textContent !== v) {
      valEl.textContent = v;
      valEl.classList.remove('flash'); void valEl.offsetWidth; valEl.classList.add('flash');
    }
    cell.classList.toggle('is-found', fd.indexOf(kk) !== -1);
    cell.classList.toggle('is-hl',   (hl.indexOf(kk) !== -1) && (fd.indexOf(kk) === -1));
    cell.classList.toggle('is-skip', (sk.indexOf(kk) !== -1) && (hl.indexOf(kk) === -1) && (fd.indexOf(kk) === -1));
  });
}

function updateCode(step){
  var activeLine = step ? step.line : null;
  var skipLines = (step && step.skip) || [];
  codeLines.forEach(function(el){
    var n = Number(el.dataset.line);
    el.classList.toggle('active', activeLine !== null && n === activeLine);
    el.classList.toggle('skip', skipLines.indexOf(n) !== -1);
  });
  miniLines.forEach(function(el){
    var n = Number(el.dataset.ml);
    el.classList.toggle('active', activeLine !== null && n === activeLine);
    el.classList.toggle('skip', skipLines.indexOf(n) !== -1);
  });
}

function centerActiveLine(){
  var el = codeInner.querySelector('.code-line.active');
  if (!el) return;
  var r  = el.getBoundingClientRect();
  var cr = codeStage.getBoundingClientRect();
  var delta = (r.top + r.height/2) - (cr.top + cr.height/2);
  if (Math.abs(delta) > 3) {
    codeStage.scrollTop = Math.max(0, codeStage.scrollTop + delta);
  }
}

function updateOutput(text){
  if (text === lastOutText) return;
  lastOutText = text;
  consoleBody.innerHTML = '';
  if (text) {
    var parts = text.split('\n');
    if (parts.length && parts[parts.length-1] === '') parts.pop();
    parts.forEach(function(p, i){
      var d = document.createElement('div');
      d.className = 'out-line';
      d.textContent = p;
      d.style.animationDelay = (i * 0.08) + 's';
      consoleBody.appendChild(d);
    });
  }
  consoleBody.parentNode.scrollTop = consoleBody.parentNode.scrollHeight;
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current-1] : null;

  updateCode(step);
  updateVars(step, prev);
  updateArr(step);
  updateOutput(current >= 0 && STEPS[current] ? STEPS[current].out : '');

  if (step) {
    var isMv  = (step.line === 10 || step.line === 12 || step.line === 16);
    var isAns = (step.line === 3 || step.line === 4 || step.line === 20 || step.line === 21);
    var cls = step.gold ? ' gold'
            : (step.skip && step.skip.length > 3 ? ' skip'
            : (isMv ? ' mv' : (isAns ? ' ans' : '')));

    explainBody.innerHTML =
      '<span class="ex-line' + cls + '">第 ' + step.line + ' 行</span>' +
      '<strong>' + step.title + '</strong> —— ' + step.desc;
    stepCounter.textContent = '步骤 ' + (current+1) + ' / ' + STEPS.length;
  } else {
    explainBody.innerHTML =
      '<em>点击「▶ 播放」或「下一步」，开始逐条执行程序。<br>' +
      '本程序在 <b>2×3 的二维数组</b> 中查找用户输入的数 m。<br>' +
      '· <b>输入</b>：<code>scanf("%d", &amp;m);</code> → 本模拟输入 <b>12</b>；<br>' +
      '· <b>数组</b>：<code>static int a[2][3] = {10,3,5,7,9,12};</code>；<br>' +
      '· <b>遍历</b>：<code>for(i=0;i&lt;2;i++) for(j=0;j&lt;3;j++)</code>；<br>' +
      '· <b>过滤</b>：<code>if(a[i][j] != m) continue;</code>；<br>' +
      '· <b>记录</b>：<code>t=i; k=j; flag=1;</code>；<br>' +
      '· <b>输出</b>：<code>if(flag==1) printf("a[%d][%d]:%d", t, k, a[t][k]);</code><br>' +
      '&nbsp;&nbsp;&nbsp;&nbsp;<code>else printf("None");</code>。<br>' +
      '<b>预计输出：</b><code>Please input number:12⏎a[1][2]:12</code></em>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  document.getElementById('btnPrev').disabled = current < 0;
  document.getElementById('btnNext').disabled = current >= STEPS.length - 1;

  centerActiveLine();
  syncMinimap();
}

/* ================================================================
   六、缩略图同步
   ================================================================ */
var rafPending = false;
function syncMinimap(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    rafPending = false;
    var total = codeStage.scrollHeight;
    var clientH = codeStage.clientHeight;
    var contentH = miniContent.offsetHeight || 1;
    var maxScroll = Math.max(1, total - clientH);

    var vpH = Math.max(10, (clientH / total) * contentH);
    if (vpH > contentH) vpH = contentH;

    var top = (codeStage.scrollTop / maxScroll) * Math.max(0, contentH - vpH);
    miniViewport.style.top = top + 'px';
    miniViewport.style.height = vpH + 'px';
  });
}

codeStage.addEventListener('scroll', syncMinimap, {passive:true});
window.addEventListener('resize', function(){ syncMinimap(); });
if (window.ResizeObserver) {
  new ResizeObserver(function(){ syncMinimap(); }).observe(codeStage);
  new ResizeObserver(function(){ syncMinimap(); }).observe(miniContent);
}

/* 点击缩略图跳转 */
miniContent.addEventListener('click', function(e){
  var rect = miniContent.getBoundingClientRect();
  var y = e.clientY - rect.top;
  var contentH = miniContent.offsetHeight || 1;
  var frac = Math.min(1, Math.max(0, y / contentH));
  var maxScroll = Math.max(1, codeStage.scrollHeight - codeStage.clientHeight);
  codeStage.scrollTop = frac * maxScroll;
  syncMinimap();
});

/* ================================================================
   七、播放控制
   ================================================================ */
var btnPlay  = document.getElementById('btnPlay');
var btnPrev  = document.getElementById('btnPrev');
var btnNext  = document.getElementById('btnNext');
var btnReset = document.getElementById('btnReset');
var speedInput = document.getElementById('speed');
var speedLabel = document.getElementById('speedLabel');

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btnPlay.classList.toggle('playing', playing);
}
function pause(){
  playing = false;
  clearInterval(timer); timer = null;
  updatePlayBtn();
}
function tick(){
  if (current >= STEPS.length - 1) { pause(); return; }
  current++;
  render();
  if (current >= STEPS.length - 1) pause();
}
function play(){
  if (playing) return;
  if (current >= STEPS.length - 1) { current = -1; render(); }
  playing = true;
  updatePlayBtn();
  clearInterval(timer);
  timer = setInterval(tick, speed);
  tick();
}
function nextStep(){ pause(); if (current < STEPS.length - 1) { current++; render(); } }
function prevStep(){ pause(); if (current > -1) { current--; render(); } }
function resetAll(){
  pause();
  current = -1;
  lastOutText = null;
  consoleBody.innerHTML = '';
  codeStage.scrollTop = 0;
  codeStage.scrollLeft = 0;
  render();
}

btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  speedLabel.textContent = (speed/1000).toFixed(2) + 's';
  if (playing) { clearInterval(timer); timer = setInterval(tick, speed); }
});

/* ================================================================
   八、面板：拖动 / 缩放 / 置顶 / 关闭
   ================================================================ */
var zTop = 100;
function bringToFront(el){
  zTop++;
  el.style.zIndex = zTop;
  document.querySelectorAll('[data-panel]').forEach(function(p){
    p.classList.toggle('active-panel', p === el);
  });
}

var panels = Array.prototype.slice.call(document.querySelectorAll('[data-panel]'));

panels.forEach(function(panel){
  panel.addEventListener('pointerdown', function(){ bringToFront(panel); }, true);

  /* 拖动 */
  var head = panel.querySelector('[data-drag]');
  if (head) {
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    head.addEventListener('pointerdown', function(e){
      if (e.target.closest('[data-close]')) return;
      if (e.button !== undefined && e.button !== 0) return;
      var r = panel.getBoundingClientRect();
      panel.style.left = r.left + 'px';
      panel.style.top  = r.top  + 'px';
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      dragging = true; ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
      try { head.setPointerCapture(e.pointerId); } catch(_){}
      e.preventDefault();
    });
    head.addEventListener('pointermove', function(e){
      if (!dragging) return;
      panel.style.left = (ox + e.clientX - sx) + 'px';
      panel.style.top  = (oy + e.clientY - sy) + 'px';
    });
    var endDrag = function(e){
      dragging = false;
      try { head.releasePointerCapture(e.pointerId); } catch(_){}
    };
    head.addEventListener('pointerup', endDrag);
    head.addEventListener('pointercancel', function(){ dragging = false; });
  }

  /* 缩放（无最小/最大限制） */
  var rz = panel.querySelector('[data-resize]');
  if (rz) {
    var resizing = false, rsx = 0, rsy = 0, row = 0, roh = 0;
    rz.addEventListener('pointerdown', function(e){
      var r = panel.getBoundingClientRect();
      panel.style.left = r.left + 'px';
      panel.style.top  = r.top + 'px';
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      resizing = true; row = r.width; roh = r.height;
      rsx = e.clientX; rsy = e.clientY;
      try { rz.setPointerCapture(e.pointerId); } catch(_){}
      e.preventDefault(); e.stopPropagation();
    });
    rz.addEventListener('pointermove', function(e){
      if (!resizing) return;
      panel.style.width  = Math.max(0, row + e.clientX - rsx) + 'px';
      panel.style.height = Math.max(0, roh + e.clientY - rsy) + 'px';
    });
    var endRz = function(e){
      resizing = false;
      try { rz.releasePointerCapture(e.pointerId); } catch(_){}
      syncMinimap();
    };
    rz.addEventListener('pointerup', endRz);
    rz.addEventListener('pointercancel', function(){ resizing = false; });
  }

  /* 关闭 */
  var closeBtn = panel.querySelector('[data-close]');
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e){
      e.stopPropagation();
      panel.dataset.closed = '1';
      panel.style.display = 'none';
    });
  }
});

/* 显示 / 隐藏切换 */
var panelsHidden = false;
var panelTools   = document.getElementById('panelTools');
var panelVars    = document.getElementById('panelVars');
var panelOut     = document.getElementById('panelOut');
var panelExplain = document.getElementById('panelExplain');
var panelMini    = document.getElementById('panelMini');

function toggleAllPanels(){
  panelsHidden = !panelsHidden;
  panels.forEach(function(p){
    if (panelsHidden) {
      p.style.display = 'none';
    } else {
      p.style.display = (p.dataset.closed === '1') ? 'none' : '';
    }
  });
  syncMinimap();
}

function toggleMini(){
  var hidden = (panelMini.style.display === 'none');
  if (hidden) {
    panelMini.style.display = '';
    panelMini.dataset.closed = '0';
  } else {
    panelMini.style.display = 'none';
    panelMini.dataset.closed = '1';
  }
  syncMinimap();
}

document.getElementById('btnPanels').addEventListener('click', toggleAllPanels);
document.getElementById('btnMini').addEventListener('click', toggleMini);

/* 全屏 */
document.getElementById('btnFull').addEventListener('click', function(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
});

/* 重置布局 */
function setRect(el, left, top, w, h){
  el.style.right = 'auto';
  el.style.bottom = 'auto';
  el.style.left = left + 'px';
  el.style.top  = top + 'px';
  if (w === null) { el.style.width = ''; } else { el.style.width = w + 'px'; }
  if (h === null) { el.style.height = ''; } else { el.style.height = h + 'px'; }
}

function resetLayout(){
  var W = window.innerWidth, H = window.innerHeight;

  setRect(panelTools, 12, 12, null, null);

  var varsW = Math.min(860, Math.round(W * 0.44));
  setRect(panelVars, W - varsW - 12, 12, varsW, Math.round((H - 36) * 0.55));

  var outTop = 12 + Math.round((H - 36) * 0.55) + 12;
  setRect(panelOut, W - varsW - 12, outTop, varsW, Math.round((H - 36) * 0.45));

  setRect(panelMini, 12, 220, 220, 320);

  var expW = Math.min(W - varsW - 60, Math.round(W * 0.56));
  setRect(panelExplain, 12, H - 300, expW, 288);

  panels.forEach(function(p){
    p.style.display = (p.dataset.closed === '1') ? 'none' : '';
    p.classList.remove('active-panel');
  });
  zTop = 100;
  panels.forEach(function(p, i){ p.style.zIndex = 100 + i; });

  syncMinimap();
}
document.getElementById('btnLayout').addEventListener('click', function(){
  panels.forEach(function(p){ p.dataset.closed = '0'; });
  panelsHidden = false;
  resetLayout();
});

/* ================================================================
   九、全局快捷键
   ================================================================ */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  switch (e.code) {
    case 'Space':       e.preventDefault(); playing ? pause() : play(); break;
    case 'ArrowRight':  e.preventDefault(); nextStep(); break;
    case 'ArrowLeft':   e.preventDefault(); prevStep(); break;
    case 'KeyR':        e.preventDefault(); resetAll(); break;
    case 'KeyF':        e.preventDefault();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
      break;
    case 'KeyM':        e.preventDefault(); toggleMini(); break;
    case 'KeyH':        e.preventDefault(); toggleAllPanels(); break;
  }
});

/* ================================================================
   十、启动
   ================================================================ */
speedLabel.textContent = (speed/1000).toFixed(2) + 's';
resetLayout();
render();
setTimeout(syncMinimap, 120);
window.addEventListener('load', function(){ setTimeout(syncMinimap, 200); });

})();
</script>
