<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 逐步执行模拟 · 函数调用 · 三目 · 勾股 · 复合块 · 希沃大屏版</title>
<style>
:root{
  --bg:#0d1117;
  --code-font:   clamp(28px, 3.4vw, 66px);
  --ln-font:     clamp(16px, 1.5vw, 34px);
  --out-font:    clamp(22px, 2.3vw, 46px);
  --var-font:    clamp(12px, 1.05vw, 20px);
  --explain-font:clamp(14px, 1.45vw, 28px);
  --btn-font:    clamp(12px, 1.1vw, 22px);
  --title-font:  clamp(12px, 1.1vw, 22px);
  --accent:#38bdf8;
  --green:#4ade80; --amber:#fbbf24;
  --pink:#f472b6; --purple:#c084fc; --teal:#2dd4bf;
  --orange:#fb923c; --gold:#facc15;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:var(--bg);color:#dce8f8;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ===================== 全屏代码区 ===================== */
#codeScroll{
  position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:1;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
#codeScroll::-webkit-scrollbar{width:14px;height:14px;}
#codeScroll::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:9px;}
#codeScroll::-webkit-scrollbar-track{background:#0d1117;}
#codeInner{padding:12px 0 40vh 0;}
.cl{
  display:flex;white-space:pre;padding:0 3vw 0 0;
  border-left:9px solid transparent;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:var(--code-font);line-height:1.4;
  transition:background .25s,border-color .25s,color .25s;
}
.cl .ln{
  flex:0 0 auto;width:3ch;text-align:right;margin-right:1.6ch;
  color:#3d5578;font-size:var(--ln-font);line-height:inherit;
  font-variant-numeric:tabular-nums;user-select:none;align-self:center;
}
.cl .src{flex:0 0 auto;color:#c9d8ee;}
.cl.done .src{color:#7b8ea8;}
.cl.done .ln{color:#2c405e;}
.cl.active{
  background:linear-gradient(90deg,rgba(56,189,248,.34),rgba(56,189,248,.02));
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 2px rgba(56,189,248,.30);
}
.cl.active .src{color:#fff;}
.cl.active .ln{color:var(--accent);font-weight:700;}
.cl.active{animation:linePulse .45s ease-out;}
@keyframes linePulse{
  0%{transform:translateX(-14px);opacity:.55;}
  100%{transform:translateX(0);opacity:1;}
}

.pp{color:var(--purple);font-weight:700;}
.str{color:var(--green);}
.cmt{color:#5b7292;font-style:italic;}
.fn{color:var(--accent);}
.fn-a{color:var(--purple);font-weight:700;}
.fn-b{color:var(--teal);font-weight:700;}
.kw{color:var(--pink);font-weight:700;}
.num{color:var(--amber);}
.op{color:var(--orange);font-weight:700;}
.op-ter{color:#facc15;font-weight:800;background:rgba(250,204,21,.14);padding:0 .12em;border-radius:4px;}
.op-amp{color:#fb923c;font-weight:800;background:rgba(251,146,60,.14);padding:0 .12em;border-radius:4px;}
.op-cast{color:#facc15;font-weight:800;background:rgba(250,204,21,.16);padding:0 .12em;border-radius:4px;text-decoration:underline wavy rgba(250,204,21,.55);}
.nl-hl{color:#c084fc;font-weight:800;background:rgba(192,132,252,.16);padding:0 .1em;border-radius:3px;}

/* ===================== 浮动面板 ===================== */
.panel{
  position:fixed;z-index:100;display:flex;flex-direction:column;
  background:rgba(13,17,23,.88);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  backdrop-filter:blur(14px) saturate(150%);
  border:1px solid rgba(56,189,248,.30);
  border-radius:14px;
  box-shadow:0 14px 50px rgba(0,0,0,.65);
  overflow:hidden;transition:border-color .18s,box-shadow .18s;
}
.panel.top{
  border-color:rgba(56,189,248,.9);
  box-shadow:0 0 0 2px rgba(56,189,248,.28),0 18px 60px rgba(0,0,0,.78);
}
.phead{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:6px 10px;
  background:linear-gradient(180deg,rgba(30,48,78,.95),rgba(20,32,52,.95));
  border-bottom:1px solid rgba(56,189,248,.22);
  cursor:grab;touch-action:none;
  font-size:var(--title-font);font-weight:700;color:#9fd8ff;
}
.phead:active{cursor:grabbing;}
.ptitle{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pbtns{margin-left:auto;display:flex;gap:6px;}
.pb{
  width:clamp(22px,1.6vw,32px);height:clamp(22px,1.6vw,32px);
  border-radius:8px;border:1px solid rgba(120,160,210,.38);
  background:rgba(30,48,78,.75);color:#bcd4f0;
  font-size:clamp(11px,.85vw,16px);line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.pb:hover{background:rgba(56,189,248,.30);border-color:var(--accent);color:#fff;}
.pbody{
  flex:1 1 auto;min-height:0;overflow:auto;padding:8px 10px;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
.pbody::-webkit-scrollbar{width:8px;height:8px;}
.pbody::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}
.panel.collapsed .pbody{display:none;}
.panel.collapsed .rs{display:none;}
.rs{
  position:absolute;right:0;bottom:0;width:28px;height:28px;
  cursor:nwse-resize;z-index:9;touch-action:none;
}
.rs::after{
  content:'';position:absolute;right:5px;bottom:5px;width:12px;height:12px;
  border-right:3px solid rgba(56,189,248,.85);
  border-bottom:3px solid rgba(56,189,248,.85);
  border-radius:0 0 3px 0;
}

/* ===================== 控制栏 ===================== */
#p-bar .pbody{display:flex;flex-wrap:wrap;align-items:center;gap:8px;overflow:visible;padding:8px 10px;}
#p-bar button.act{
  font-size:var(--btn-font);font-weight:700;
  padding:.34em .68em;min-height:clamp(28px,2.1vw,42px);
  border-radius:10px;border:1px solid rgba(120,160,210,.42);
  background:rgba(30,48,78,.85);color:#dce8f8;cursor:pointer;
  white-space:nowrap;
}
#p-bar button.act:hover{background:rgba(56,189,248,.28);border-color:var(--accent);}
#p-bar button.act:disabled{opacity:.3;cursor:not-allowed;}
#p-bar button.primary{background:linear-gradient(180deg,#0ea5e9,#0284c7);border-color:#38bdf8;color:#04121f;}
#p-bar button.primary.playing{background:linear-gradient(180deg,#f59e0b,#d97706);border-color:#fbbf24;color:#1a1200;}
.speedWrap{display:flex;align-items:center;gap:8px;font-size:var(--btn-font);color:#9db1cb;white-space:nowrap;padding:0 4px;}
.speedWrap input[type=range]{width:clamp(70px,6.5vw,160px);height:20px;accent-color:var(--accent);cursor:pointer;}
.speedWrap b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3em;display:inline-block;}
.counter{
  font-size:var(--btn-font);color:#9fd8ff;font-weight:700;
  padding:.3em .6em;border-radius:8px;background:rgba(56,189,248,.14);white-space:nowrap;
}

/* ===================== 变量 / 调用栈 ===================== */
.infoStrip{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  padding:5px 7px;border-radius:8px;
  background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.24);
  margin-bottom:8px;font-family:ui-monospace,Consolas,monospace;
  font-size:calc(var(--var-font)*.9);
}
.infoStrip .tag{padding:.12em .45em;border-radius:5px;background:rgba(148,163,184,.16);color:#9db1cb;font-size:.85em;}
.infoStrip .val{color:var(--teal);font-weight:800;}
.infoStrip .val.fn{color:var(--purple);}

.stackStrip{
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  padding:5px 7px;border-radius:8px;
  background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.28);
  margin-bottom:8px;
}
.stackLabel{font-size:calc(var(--var-font)*.85);color:#9db1cb;font-family:ui-monospace,monospace;flex:0 0 auto;}
.stackBody{display:flex;align-items:center;gap:.4em;flex-wrap:wrap;}
.frame{
  font-family:ui-monospace,monospace;font-weight:800;
  font-size:calc(var(--var-font)*1.0);
  padding:.18em .6em;border-radius:8px;
  background:#0d1728;border:1px solid #1e3350;color:#8aa2c0;
  transition:all .25s;
}
.frame.main{border-left:3px solid rgba(34,211,238,.7);}
.frame.af{border-left:3px solid rgba(192,132,252,.9);}
.frame.bf{border-left:3px solid rgba(45,212,191,.9);}
.frame.block{border-left:3px solid rgba(250,204,21,.9);}
.frame.topF{
  border-color:var(--accent);background:rgba(56,189,248,.22);color:#fff;
  box-shadow:0 0 14px rgba(56,189,248,.55);animation:framePop .4s ease-out;
}
.frame.af.topF{border-color:var(--purple);background:rgba(192,132,252,.24);box-shadow:0 0 16px rgba(192,132,252,.55);}
.frame.bf.topF{border-color:var(--teal);background:rgba(45,212,191,.24);box-shadow:0 0 16px rgba(45,212,191,.55);}
@keyframes framePop{
  0%{transform:scale(.6);opacity:0;}
  60%{transform:scale(1.15);}
  100%{transform:scale(1);opacity:1;}
}
.arr2{color:#3f5a7d;}
.empty{color:#3d5474;font-size:calc(var(--var-font)*.85);font-family:ui-monospace,monospace;}

.scope-group{
  display:flex;flex-direction:column;gap:.14em;
  border-radius:8px;padding:.38em .45em .45em;
  background:rgba(255,255,255,.015);
  border:1px solid rgba(148,163,184,.10);
  margin-bottom:7px;
}
.scope-group.scope-main{border-left:3px solid rgba(34,211,238,.55);}
.scope-group.scope-a{border-left:3px solid rgba(192,132,252,.75);background:rgba(192,132,252,.03);}
.scope-group.scope-b{border-left:3px solid rgba(45,212,191,.75);background:rgba(45,212,191,.03);}
.scope-group.scope-blk{border-left:3px solid rgba(250,204,21,.75);background:rgba(250,204,21,.03);}
.scope-head{
  display:flex;align-items:baseline;gap:.45em;
  font-size:calc(var(--var-font)*.85);color:#8aa2c0;
  padding:0 .3em .15em;
}
.scope-head .fname{font-family:ui-monospace,monospace;font-weight:800;color:#9fd8ff;font-size:calc(var(--var-font)*1.02);}
.scope-head .role{color:#6d82a2;margin-left:auto;font-size:calc(var(--var-font)*.78);}
.vrow{
  display:flex;align-items:center;gap:.45em;
  padding:.2em .5em;border-radius:7px;
  background:#0d1728;border:1px solid #1b293f;
  font-size:var(--var-font);transition:background .3s,border-color .3s;
}
.vk{
  flex:0 0 auto;color:#8399b8;white-space:nowrap;
  font-family:ui-monospace,monospace;
  display:flex;align-items:baseline;gap:.35em;
}
.vt{font-size:.75em;color:#4d5f78;padding:.02em .28em;border-radius:3px;background:rgba(148,163,184,.1);}
.vv{
  flex:1 1 auto;min-width:0;text-align:right;
  font-family:ui-monospace,monospace;font-weight:800;
  color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.vv.dim{color:#5f7796;font-weight:500;font-style:italic;}
.scope-a .vv{color:var(--purple);}
.scope-b .vv{color:var(--teal);}
.scope-blk .vv{color:var(--gold);}
.vrow.changed{border-color:rgba(56,189,248,.9);background:rgba(56,189,248,.14);}
.vrow.changed .vv{color:#fff;}
.scope-a .vrow.changed{border-color:rgba(192,132,252,.9);background:rgba(192,132,252,.16);}
.scope-b .vrow.changed{border-color:rgba(45,212,191,.9);background:rgba(45,212,191,.16);}
.scope-blk .vrow.changed{border-color:rgba(250,204,21,.9);background:rgba(250,204,21,.16);}
.vv.flash{animation:vflash .55s ease-out;}
@keyframes vflash{
  0%{transform:scale(1);}
  30%{transform:scale(1.2);color:#fff;text-shadow:0 0 16px currentColor;}
  100%{transform:scale(1);}
}

/* ===================== 输出 ===================== */
.outNote{
  font-size:calc(var(--var-font)*.82);color:#8ba7c8;
  padding:.35em .6em;margin-bottom:6px;border-radius:7px;
  background:rgba(192,132,252,.10);border-left:4px solid var(--purple);
  line-height:1.45;
}
.console{
  font-family:ui-monospace,monospace;
  font-size:var(--out-font);line-height:1.4;color:#86efac;
  white-space:pre-wrap;word-break:break-all;
  min-height:2em;padding:.2em 0;
}
.out-line{white-space:pre-wrap;word-break:break-all;}
.out-line.empty{color:#3d5474;min-height:1.1em;}
.nlMark{
  display:inline-block;background:rgba(192,132,252,.22);color:#c084fc;
  border-radius:3px;padding:0 .3em;font-weight:800;font-size:.7em;
  margin-left:2px;vertical-align:middle;
}
.cursor{
  display:inline-block;color:var(--green);
  animation:blink 1s step-end infinite;margin-left:2px;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ===================== 说明条 ===================== */
.expLine{
  display:inline-block;padding:.12em .55em;border-radius:7px;
  background:rgba(56,189,248,.20);color:var(--accent);
  font-weight:800;font-size:.85em;margin-right:.5em;vertical-align:middle;
}
.expLine.gold{background:rgba(250,204,21,.22);color:#facc15;}
.expLine.mv{background:rgba(244,114,182,.22);color:var(--pink);}
.expLine.pre{background:rgba(192,132,252,.22);color:var(--purple);}
.expLine.ret{background:rgba(251,191,36,.22);color:var(--amber);}
#expText{font-size:var(--explain-font);line-height:1.46;color:#c3d4ea;}
#expText strong{color:#fff;}
#expText code{
  font-family:ui-monospace,monospace;
  background:rgba(148,163,184,.18);border-radius:4px;
  padding:0 .3em;color:#e6eefb;
}
#expText .tip{
  display:block;margin-top:.4em;padding:.35em .65em;border-radius:8px;
  background:rgba(45,212,191,.12);border-left:5px solid var(--teal);
  color:#bff5ec;font-size:.92em;
}
#expText .warn{
  display:block;margin-top:.4em;padding:.35em .65em;border-radius:8px;
  background:rgba(251,191,36,.13);border-left:5px solid var(--amber);
  color:#ffe6b0;font-size:.92em;
}
#expText .win{
  display:block;margin-top:.4em;padding:.35em .65em;border-radius:8px;
  background:rgba(250,204,21,.16);border-left:5px solid var(--gold);
  color:#fff3c4;font-size:.92em;font-weight:600;
}

/* ===================== 缩略图 ===================== */
#miniBody{position:relative;padding:6px;overflow:auto;cursor:pointer;}
#miniInner{position:relative;}
.ml{
  white-space:pre;overflow:hidden;
  font-family:ui-monospace,monospace;line-height:1.3;
  opacity:.62;transition:opacity .2s,background .2s,box-shadow .2s;
  border-left:2px solid transparent;
  padding-left:3px;
}
.ml.done{opacity:.38;}
.ml.active{
  opacity:1;
  background:rgba(56,189,248,.42);
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.6),
             0 0 10px rgba(56,189,248,.55);
  color:#ffffff !important;
  font-weight:800;
  text-shadow:0 0 6px rgba(56,189,248,.9);
}
#miniView{
  position:absolute;left:0;right:0;top:0;height:0;
  border:2px solid rgba(56,189,248,.9);
  background:linear-gradient(180deg,rgba(56,189,248,.16),rgba(56,189,248,.06));
  border-radius:4px;pointer-events:none;
  transition:top .08s linear,height .08s linear;
  box-shadow:0 0 14px rgba(56,189,248,.55);
  z-index:5;
}
</style>
</head>
<body>

<div id="codeScroll"><div id="codeInner"></div></div>

<!-- 控制栏 -->
<div class="panel" id="p-bar">
  <div class="phead">
    <span class="ptitle">▣ 控制台</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse">▁</button>
      <button class="pb" data-act="close">✕</button>
    </span>
  </div>
  <div class="pbody">
    <button class="act" id="btnReset">⟲ 重置</button>
    <button class="act" id="btnPrev">◀ 上一步</button>
    <button class="act primary" id="btnPlay">▶ 播放</button>
    <button class="act" id="btnNext">下一步 ▶</button>
    <label class="speedWrap">速度
      <input type="range" id="speed" min="200" max="3000" step="100" value="800">
      <b id="speedLbl">0.8s</b>
    </label>
    <button class="act" id="btnFs">⛶ 全屏</button>
    <button class="act" id="btnPanels">▣ 面板</button>
    <button class="act" id="btnMini">▤ 缩略图</button>
    <button class="act" id="btnLayout">↺ 重置布局</button>
    <span class="counter" id="stepCounter">步骤 — / 0</span>
  </div>
  <div class="rs"></div>
</div>

<!-- 调用栈 · 变量 -->
<div class="panel" id="p-vars">
  <div class="phead">
    <span class="ptitle">调用栈 · 三组同名变量 · 状态表</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse">▁</button>
      <button class="pb" data-act="close">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div class="infoStrip">
      <span class="tag">当前函数</span>
      <span class="val fn" id="funcVal">—</span>
      <span style="color:#2c3f5e">│</span>
      <span class="tag">模拟输入</span>
      <span class="val" id="inputVal">10 25 18 · 3 4 5 · 70 80 90</span>
    </div>
    <div class="stackStrip">
      <span class="stackLabel">调用栈</span>
      <span class="stackBody" id="stackBody"><span class="empty">（空）</span></span>
    </div>
    <div id="varsBlock"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- 输出 -->
<div class="panel" id="p-out">
  <div class="phead">
    <span class="ptitle">程序运行结果（屏幕输出）</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse">▁</button>
      <button class="pb" data-act="close">✕</button>
    </span>
  </div>
  <div class="pbody">
    <div class="outNote">紫色 ⏎ 表示 putchar('\n') 产生的换行；其余 printf 末尾都没有 \n，输出会紧挨在一起</div>
    <div class="console" id="consoleBody"></div>
  </div>
  <div class="rs"></div>
</div>

<!-- 说明 -->
<div class="panel" id="p-exp">
  <div class="phead">
    <span class="ptitle">当前语句说明</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse">▁</button>
      <button class="pb" data-act="close">✕</button>
    </span>
  </div>
  <div class="pbody"><div id="expText"></div></div>
  <div class="rs"></div>
</div>

<!-- 缩略图 -->
<div class="panel" id="p-mini">
  <div class="phead">
    <span class="ptitle">缩略图</span>
    <span class="pbtns">
      <button class="pb" data-act="collapse">▁</button>
      <button class="pb" data-act="close">✕</button>
    </span>
  </div>
  <div class="pbody" id="miniBody">
    <div id="miniInner"></div>
    <div id="miniView"></div>
  </div>
  <div class="rs"></div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   源代码（26 行）
   ========================================================= */
var LINES = [
  {n:1,  h:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>                          <span class="cmt">// 包含标准输入输出头文件</span>'},
  {n:2,  h:'<span class="kw">void</span> <span class="fn-a">a</span>() {                                  <span class="cmt">// 函数a</span>'},
  {n:3,  h:'    <span class="kw">int</span> x, y, z;                            <span class="cmt">// 局部变量</span>'},
  {n:4,  h:'    <span class="fn">printf</span>(<span class="str">"Please input x,y,z:"</span>);'},
  {n:5,  h:'    <span class="fn">scanf</span>(<span class="str">"%d%d%d"</span>, <span class="op-amp">&amp;</span>x, <span class="op-amp">&amp;</span>y, <span class="op-amp">&amp;</span>z);'},
  {n:6,  h:'    <span class="fn">printf</span>(<span class="str">"The Max is:%d"</span>, <span class="op-ter">(x&gt;y?x:y)&gt;z?(x&gt;y?x:y):z</span>);'},
  {n:7,  h:'}'},

var zTop = 100;
var panelEls = Array.prototype.slice.call(document.querySelectorAll('.panel'));
function bringFront(el){
  zTop += 1; el.style.zIndex = zTop;
  panelEls.forEach(function(p){ p.classList.remove('top'); });
  el.classList.add('top');
}
function makePanel(el){
  var head = el.querySelector('.phead');
  var rs   = el.querySelector('.rs');
  el.addEventListener('pointerdown', function(){ bringFront(el); }, true);
  var cbtn = el.querySelector('[data-act="collapse"]');
  if (cbtn) cbtn.addEventListener('click', function(e){ e.stopPropagation(); el.classList.toggle('collapsed'); });
  var xbtn = el.querySelector('[data-act="close"]');
  if (xbtn) xbtn.addEventListener('click', function(e){ e.stopPropagation(); el.style.display = 'none'; });
  head.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    bringFront(el);
    var r = el.getBoundingClientRect();
    var dx = e.clientX - r.left, dy = e.clientY - r.top;
    function mv(ev){ el.style.left = (ev.clientX-dx)+'px'; el.style.top = (ev.clientY-dy)+'px'; }
    function up(){ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); }
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    e.preventDefault();
  });
  if (rs) rs.addEventListener('pointerdown', function(e){
    bringFront(el);
    var r = el.getBoundingClientRect();
    var sx=e.clientX, sy=e.clientY, sw=r.width, sh=r.height;
    function mv(ev){
      el.style.width = Math.max(0, sw+ev.clientX-sx)+'px';
      el.style.height = Math.max(0, sh+ev.clientY-sy)+'px';
      if (el.id==='p-mini'){ rebuildMini(); syncMini(); }
    }
    function up(){
      document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up);
      if (el.id==='p-mini'){ rebuildMini(); syncMini(); }
    }
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    e.preventDefault(); e.stopPropagation();
  });
}
panelEls.forEach(makePanel);

/* =========================================================
   缩略图：rebuildMini 计算字号/行高；syncMini 更新荧光框；
   updateMiniActive 高亮当前执行行
   ========================================================= */
var miniLineH = 8;
var miniActiveLine = -1;

function rebuildMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;
  var body = document.getElementById('miniBody');
  var w = body.clientWidth - 12;
  if (w <= 10) return;
  var f = Math.max(2, w/75);
  miniLineH = f * 1.32;
  miniInner.style.fontSize = f+'px';
  miniLineEls.forEach(function(el){
    el.style.height = miniLineH+'px';
    el.style.lineHeight = miniLineH+'px';
  });
  syncMini();
}

function syncMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;
  if (!miniLineH) return;
  var firstCl = codeLineEls[0];
  if (!firstCl) return;
  var lineH = firstCl.getBoundingClientRect().height;
  if (!lineH) return;
  var lineTopOffset = firstCl.offsetTop;
  var sTop = codeScroll.scrollTop;
  var sH   = codeScroll.clientHeight;
  var relTop = Math.max(0, sTop - lineTopOffset);
  var firstIdx = relTop / lineH;
  var count    = sH / lineH;
  var total = 26 * miniLineH;
  var top  = firstIdx * miniLineH;
  var h    = count * miniLineH;
  if (top < 0) top = 0;
  if (top > total) top = total;
  if (top + h > total) h = total - top;
  if (h < 4) h = 4;
  miniView.style.top = top+'px';
  miniView.style.height = h+'px';
}

/* 更新缩略图中当前执行行高亮，并让缩略图自动滚到当前行可见 */
function updateMiniActive(lineNo){
  miniActiveLine = (lineNo === null || lineNo === undefined) ? -1 : lineNo;
  miniLineEls.forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.line) === miniActiveLine);
  });
  if (miniActiveLine > 0){
    var el = miniInner.querySelector('.ml[data-line="' + miniActiveLine + '"]');
    if (el){
      var body = document.getElementById('miniBody');
      var er = el.getBoundingClientRect();
      var br = body.getBoundingClientRect();
      if (er.top < br.top + 10 || er.bottom > br.bottom - 10){
        var target = el.offsetTop - body.clientHeight/2 + miniLineH/2;
        if (target < 0) target = 0;
        body.scrollTop = target;
      }
    }
  }
}

/* 点击缩略图跳转到对应行 */
miniBody.addEventListener('click', function(e){
  if (!miniLineH) return;
  var r = miniInner.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLineH);
  if (idx < 0) idx = 0;
  if (idx > 25) idx = 25;
  centerLine(idx+1, true);
});

var current = -1;
var playing = false;
var timer = null;
var speed = Number(speedInput.value);
var lastStackKey = null, lastVarsKey = null, lastOutKey = null;

function renderStack(step){
  var stack = (step && step.stack) || [];
  var key = stack.join('/');
  if (key === lastStackKey) return;
  lastStackKey = key;
  if (!stack.length){
    stackBody.innerHTML = '<span class="empty">（空）</span>';
    return;
  }
  var html = '';
  for (var k = 0; k < stack.length; k++){
    if (k > 0) html += '<span class="arr2">→</span>';
    var cls = 'frame';
    if (stack[k] === 'main') cls += ' main';
    else if (stack[k] === 'a') cls += ' af';
    else if (stack[k] === 'b') cls += ' bf';
    else if (stack[k] === 'block') cls += ' block';
    if (k === stack.length - 1) cls += ' topF';
    var label = stack[k] === 'main' ? 'main()'
              : stack[k] === 'a'    ? 'a()'
              : stack[k] === 'b'    ? 'b()'
              :                       '{ }';
    html += '<span class="'+cls+'">'+label+'</span>';
  }
  stackBody.innerHTML = html;
}

function buildVarRow(name, type, value, dim, changed){
  var row = document.createElement('div');
  row.className = 'vrow' + (changed ? ' changed' : '');
  var k = document.createElement('span'); k.className = 'vk'; k.textContent = name;
  if (type){ var t = document.createElement('span'); t.className='vt'; t.textContent=type; k.appendChild(t); }
  var v = document.createElement('span'); v.className = 'vv' + (dim ? ' dim' : ''); v.textContent = value;
  row.appendChild(k); row.appendChild(v);
  return row;
}
function fmtNum(v){ return (v === null || v === undefined) ? '—' : String(v); }

function renderVars(step, prevStep){
  if (!step){ lastVarsKey = null; varsBlock.innerHTML = ''; return; }
  var key = step.line + '|' + step.stack.join('/') + '|' +
            step.aX + '|' + step.aY + '|' + step.aZ + '|' +
            step.bX + '|' + step.bY + '|' + step.bZ + '|' +
            step.cX + '|' + step.cY + '|' + step.cZ;
  if (key === lastVarsKey) return;
  lastVarsKey = key;
  varsBlock.innerHTML = '';

  /* a 作用域 */
  if (step.aX !== null || step.aY !== null || step.aZ !== null){
    var gA = document.createElement('div');
    gA.className = 'scope-group scope-a';
    var hA = document.createElement('div');
    hA.className = 'scope-head';
    hA.innerHTML = '<span class="fname">a()</span><span class="role">函数 a 作用域</span>';
    gA.appendChild(hA);
    gA.appendChild(buildVarRow('x', 'int', fmtNum(step.aX), step.aX === null,
      prevStep && prevStep.aX !== step.aX));
    gA.appendChild(buildVarRow('y', 'int', fmtNum(step.aY), step.aY === null,
      prevStep && prevStep.aY !== step.aY));
    gA.appendChild(buildVarRow('z', 'int', fmtNum(step.aZ), step.aZ === null,
      prevStep && prevStep.aZ !== step.aZ));
    varsBlock.appendChild(gA);
  }

  /* b 作用域 */
  if (step.bX !== null || step.bY !== null || step.bZ !== null){
    var gB = document.createElement('div');
    gB.className = 'scope-group scope-b';
    var hB = document.createElement('div');
    hB.className = 'scope-head';
    hB.innerHTML = '<span class="fname">b()</span><span class="role">函数 b 作用域</span>';
    gB.appendChild(hB);
    gB.appendChild(buildVarRow('x', 'int', fmtNum(step.bX), step.bX === null,
      prevStep && prevStep.bX !== step.bX));
    gB.appendChild(buildVarRow('y', 'int', fmtNum(step.bY), step.bY === null,
      prevStep && prevStep.bY !== step.bY));
    gB.appendChild(buildVarRow('z', 'int', fmtNum(step.bZ), step.bZ === null,
      prevStep && prevStep.bZ !== step.bZ));
    varsBlock.appendChild(gB);
  }

  /* 复合块作用域 */
  if (step.cX !== null || step.cY !== null || step.cZ !== null){
    var gC = document.createElement('div');
    gC.className = 'scope-group scope-blk';
    var hC = document.createElement('div');
    hC.className = 'scope-head';
    hC.innerHTML = '<span class="fname">{ }</span><span class="role">复合块作用域</span>';
    gC.appendChild(hC);
    gC.appendChild(buildVarRow('x', 'int', fmtNum(step.cX), step.cX === null,
      prevStep && prevStep.cX !== step.cX));
    gC.appendChild(buildVarRow('y', 'int', fmtNum(step.cY), step.cY === null,
      prevStep && prevStep.cY !== step.cY));
    gC.appendChild(buildVarRow('z', 'int', fmtNum(step.cZ), step.cZ === null,
      prevStep && prevStep.cZ !== step.cZ));
    varsBlock.appendChild(gC);
  }

  Array.prototype.slice.call(varsBlock.querySelectorAll('.vrow.changed .vv'))
    .forEach(function(el){
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    });
}

function centerLine(n, smooth){
  var el = codeInner.querySelector('.cl[data-line="' + n + '"]');
  if (!el) return;
  var target = el.offsetTop - codeScroll.clientHeight/2 + el.offsetHeight/2;
  if (target < 0) target = 0;
  codeScroll.scrollTo({top: target, behavior: smooth ? 'smooth' : 'auto'});
}

function updateCode(step){
  var activeLine = step ? step.line : null;
  var doneSet = {};
  for (var k = 0; k <= current; k++) if (STEPS[k]) doneSet[STEPS[k].line] = true;
  for (var w = 0; w < codeLineEls.length; w++){
    var el = codeLineEls[w];
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);
    el.classList.toggle('done', !!doneSet[n] && n !== activeLine);
  }
  centerLine(activeLine, true);
  updateMiniActive(activeLine);
}

function renderOutput(step){
  var text = step ? step.out : '';
  if (text === lastOutKey) return;
  lastOutKey = text;
  consoleBody.innerHTML = '';
  if (!text){
    var cur0 = document.createElement('span');
    cur0.className = 'cursor'; cur0.textContent = '▊';
    consoleBody.appendChild(cur0);
    return;
  }
  var parts = text.split('\n');
  // 由于 putchar 输出的是 \n，split 后最后一段可能是空
  var trailingNl = false;
  if (parts.length > 1 && parts[parts.length-1] === ''){ trailingNl = true; parts.pop(); }
  parts.forEach(function(ln, i){
    var d = document.createElement('div');
    d.className = 'out-line';
    if (ln.length === 0){
      d.classList.add('empty');
      d.innerHTML = '&nbsp;';
    } else {
      d.textContent = ln;
    }
    // 除了最后一行之外，每行末尾都加一个换行标记
    if (i < parts.length - 1 || trailingNl){
      var nl = document.createElement('span');
      nl.className = 'nlMark'; nl.textContent = '⏎';
      d.appendChild(nl);
    }
    consoleBody.appendChild(d);
  });
  var cur = document.createElement('span');
  cur.className = 'cursor'; cur.textContent = '▊';
  consoleBody.appendChild(cur);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current-1] : null;

  updateCode(step);
  renderStack(step);
  renderVars(step, prev);
  renderOutput(step);

  window.requestAnimationFrame(function(){
    syncMini();
    window.setTimeout(syncMini, 220);
  });

  funcValEl.textContent = step ? step.func : '—';

  if (step){
    var cls = 'expLine';
    if (step.cls === 'pre') cls += ' pre';
    else if (step.cls === 'ret') cls += ' ret';
    else if (step.cls === 'gold') cls += ' gold';
    else if (step.cls === 'mv') cls += ' mv';

    expText.innerHTML =
      '<span class="'+cls+'">第 '+step.line+' 行</span>' +
      '<strong>'+step.title+'</strong><br>'+step.desc;
    stepCounter.textContent = '步骤 ' + (current+1) + ' / ' + STEPS.length;
  } else {
    expText.innerHTML =
      '<strong>点击「▶ 播放」或「下一步」，开始逐条执行程序。</strong><br>' +
      '本程序演示 <b>函数调用</b>、<b>同名变量作用域</b>、<b>三目运算符</b>、' +
      '<b>if-else 二选一</b>、<b>勾股判定</b>、<b>复合块作用域</b> 与 <b>(float) 强制转换</b>：<br>' +
      '· <b>a()</b>：10、25、18 → 用三目求最大值 25；<br>' +
      '· <b>putchar(\'\\n\')</b>：输出一个换行；<br>' +
      '· <b>b()</b>：3、4、5 → 3²+4²=25=5² 是直角三角形；<br>' +
      '· <b>复合块 { }</b>：70、80、90 → 平均值 80.00；<br>' +
      '· 三组 x、y、z 分别位于 a、b、复合块内，<b>互不影响</b>。<br>' +
      '<b>共 ' + STEPS.length + ' 个执行步骤，请用「▶ 播放」逐步查看。</b>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;
}

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btnPlay.classList.toggle('playing', playing);
}
function tick(){
  if (current >= STEPS.length-1){ pause(); return; }
  current += 1; render();
  if (current >= STEPS.length-1) pause();
}
function play(){
  if (playing) return;
  if (current >= STEPS.length-1){ current = -1; render(); }
  playing = true; updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}
function pause(){
  playing = false; window.clearInterval(timer); timer = null; updatePlayBtn();
}
function nextStep(){ pause(); if (current < STEPS.length-1){ current += 1; render(); } }
function prevStep(){ pause(); if (current > -1){ current -= 1; render(); } }
function resetAll(){
  pause(); current = -1;
  lastOutKey = null; lastVarsKey = null; lastStackKey = null;
  consoleBody.innerHTML = '';
  codeScroll.scrollTop = 0;
  updateMiniActive(null);
  render();
  window.requestAnimationFrame(function(){
    codeScroll.scrollTop = 0;
    rebuildMini();
    syncMini();
  });
}

btnPlay.addEventListener('click', function(){ if (playing) pause(); else play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  speedLbl.textContent = (speed/1000).toFixed(1)+'s';
  if (playing){
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

btnFs.addEventListener('click', function(){
  if (!document.fullscreenElement){
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});
btnPanels.addEventListener('click', function(){
  var anyVisible = panelEls.some(function(p){ return p.style.display !== 'none'; });
  panelEls.forEach(function(p){
    p.style.display = anyVisible ? 'none' : '';
    if (!anyVisible) p.classList.remove('collapsed');
  });
  if (!anyVisible) rebuildMini();
});
btnMini.addEventListener('click', function(){
  var m = document.getElementById('p-mini');
  var hidden = (m.style.display === 'none');
  m.style.display = hidden ? '' : 'none';
  if (hidden){
    rebuildMini();
    syncMini();
    updateMiniActive(current >= 0 && STEPS[current] ? STEPS[current].line : -1);
  }
});
btnLayout.addEventListener('click', function(){
  panelEls.forEach(function(p){ p.style.display = ''; p.classList.remove('collapsed'); });
  applyDefaultLayout();
  render();
});

document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space'){ e.preventDefault(); if (playing) pause(); else play(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR'){ e.preventDefault(); resetAll(); }
  else if (e.code === 'KeyF'){ e.preventDefault(); btnFs.click(); }
  else if (e.code === 'KeyM'){ e.preventDefault(); btnMini.click(); }
  else if (e.code === 'KeyH'){ e.preventDefault(); btnPanels.click(); }
});

/* 滚动 / resize 同步 */
var rafPending = false;
function scheduleSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){ rafPending = false; syncMini(); });
}
codeScroll.addEventListener('scroll', scheduleSync, {passive:true});
window.addEventListener('resize', function(){ rebuildMini(); syncMini(); });
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ rebuildMini(); syncMini(); });
}

/* 启动 */
applyDefaultLayout();
speedLbl.textContent = (speed/1000).toFixed(1)+'s';
render();
window.requestAnimationFrame(function(){
  rebuildMini();
  syncMini();
  updateMiniActive(current >= 0 && STEPS[current] ? STEPS[current].line : -1);
});
window.setTimeout(function(){ rebuildMini(); syncMini(); }, 300);
window.setTimeout(function(){ rebuildMini(); syncMini(); }, 800);

})();
</script>
</body>
