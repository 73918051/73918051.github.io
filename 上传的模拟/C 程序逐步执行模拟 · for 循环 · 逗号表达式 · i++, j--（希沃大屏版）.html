<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · for 循环 · 逗号表达式 · i++, j--（希沃大屏版）</title>
<style>
/* ================= 全局变量（大屏字号硬指标） ================= */
:root{
  --code-font: clamp(80px, 4.16vw, 150px);  /* 1920 下 ≈80px；4K 下 ≈150px */
  --ln-font:   clamp(56px, 2.9vw, 110px);
  --out-font:  clamp(72px, 3.9vw, 140px);
  --var-font:  clamp(40px, 2.1vw, 80px);
  --explain-font: clamp(48px, 2.5vw, 90px);
  --btn-font:  clamp(40px, 2.05vw, 70px);
  --panel-title: clamp(28px, 1.6vw, 52px);
  --mini-font: clamp(11px, 0.72vw, 22px);

  --bg:#0d1117;
  --panel-bg:rgba(13,20,33,.86);
  --border:rgba(56,189,248,.28);
  --accent:#38bdf8;
  --text:#e6edf3;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;
}

/* ================= 全屏代码区（视觉主体，不透明） ================= */
#codeArea{
  position:fixed;inset:0;z-index:1;
  overflow:auto;background:#0d1117;
  scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:#2c3f5e transparent;
}
#codeArea::-webkit-scrollbar{width:16px;height:16px;}
#codeArea::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:10px;}
#codeArea::-webkit-scrollbar-track{background:#0d1117;}

#codeInner{
  position:relative;
  width:max-content;min-width:100%;
  padding:28px 60px 45vh 0;
}

.code-line{
  --lh: calc(var(--code-font) * 1.42);
  display:flex;align-items:flex-start;
  padding:4px 48px 4px 0;
  border-left:14px solid transparent;
  white-space:pre;                 /* 绝不折行 */
  line-height:var(--lh);
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  font-size:var(--code-font);
  transition:background .25s,border-color .25s,opacity .25s;
}
.code-line .ln{
  flex:0 0 auto;
  position:sticky;left:0;z-index:2;      /* 横向滚动时行号始终可见 */
  width:2.6ch;text-align:right;
  padding:0 18px 0 10px;
  color:#3d5a80;font-size:var(--ln-font);line-height:var(--lh);
  user-select:none;font-variant-numeric:tabular-nums;
  background:#0d1117;
  transition:background .25s,color .25s;
}
.code-line .src{flex:0 0 auto;line-height:var(--lh);padding-right:24px;}

.code-line.done{opacity:.34;}
.code-line.active{
  background:#0e2a44;
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 2px rgba(56,189,248,.28);
}
.code-line.active .ln{color:var(--accent);font-weight:900;background:#0e2a44;}
.code-line.active .src{color:#ffffff;}
/* 循环体执行时给第 5 行加浅绿底 */
.code-line.body-hit .src{
  background:linear-gradient(90deg,rgba(74,222,128,.20),transparent);
  border-radius:10px;
}

/* 语法着色 */
.pp{color:#c084fc;font-weight:700;}
.str{color:#7ee787;}
.cmt{color:#6b7f9e;font-style:italic;}
.fn{color:#79c0ff;}
.kw{color:#ff7b72;font-weight:700;}
.num{color:#ffa657;}
.op{color:#ffa657;font-weight:700;}
.comma{color:#f472b6;font-weight:900;}    /* 逗号表达式 · 逗号高亮 */
.semi{color:#2dd4bf;font-weight:900;}     /* for 三段分隔 · 分号高亮 */

/* ================= 悬浮面板通用 ================= */
.panel{
  position:fixed;z-index:100;
  display:flex;flex-direction:column;
  background:var(--panel-bg);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:3px solid var(--border);
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.68);
  overflow:hidden;
  transition:border-color .18s, box-shadow .18s, background .18s;
}
.panel.active{
  border-color:#38bdf8;
  box-shadow:0 0 0 5px rgba(56,189,248,.30), 0 26px 80px rgba(0,0,0,.8);
}
.panel-head{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:10px 14px;
  background:linear-gradient(180deg,rgba(40,66,100,.85),rgba(22,38,62,.85));
  border-bottom:1px solid rgba(56,189,248,.18);
  cursor:grab;
  touch-action:none;
}
.panel-head:active{cursor:grabbing;}
.panel-title{
  font-size:var(--panel-title);font-weight:800;color:#9fd8ff;
  white-space:nowrap;letter-spacing:.02em;
}
.panel-close{
  margin-left:auto;flex:0 0 auto;
  width:56px;height:56px;border-radius:14px;
  border:2px solid rgba(248,113,113,.5);
  background:rgba(248,113,113,.16);color:#fca5a5;
  font-size:36px;line-height:1;font-weight:700;
  cursor:pointer;display:grid;place-items:center;
  transition:background .15s,transform .1s;
}
.panel-close:hover{background:rgba(248,113,113,.35);}
.panel-close:active{transform:scale(.94);}
.panel-body{
  flex:1 1 auto;min-height:0;min-width:0;
  overflow:auto;
  scrollbar-width:thin;scrollbar-color:#334155 transparent;
}
.panel-body::-webkit-scrollbar{width:12px;height:12px;}
.panel-body::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}

/* 右下角缩放把手（不设最小/最大限制） */
.panel-resizer{
  position:absolute;right:0;bottom:0;width:56px;height:56px;
  cursor:nwse-resize;touch-action:none;z-index:9;
}
.panel-resizer::after{
  content:"";position:absolute;right:8px;bottom:8px;
  width:26px;height:26px;
  border-right:5px solid rgba(56,189,248,.85);
  border-bottom:5px solid rgba(56,189,248,.85);
  border-radius:0 0 8px 0;
}

/* ================= 顶部控制栏 ================= */
#panelTop{width:min(1800px,calc(100vw - 32px));}
.top-controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  padding:14px 16px;
}
.btn{
  font-family:inherit;font-size:var(--btn-font);font-weight:700;
  min-height:76px;padding:10px 24px;
  border-radius:16px;
  border:2px solid rgba(56,189,248,.35);
  background:rgba(30,48,74,.9);color:#dbeafe;
  cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover:not(:disabled){background:rgba(46,72,110,.95);border-color:#38bdf8;}
.btn:active:not(:disabled){transform:translateY(2px);}
.btn:disabled{opacity:.32;cursor:not-allowed;}
.btn.primary{
  background:linear-gradient(180deg,#0ea5e9,#0284c7);
  border-color:#38bdf8;color:#04121f;
}
.btn.primary.playing{
  background:linear-gradient(180deg,#f59e0b,#d97706);
  border-color:#fbbf24;color:#1a1200;
}
.speed-wrap{
  display:flex;align-items:center;gap:14px;
  font-size:var(--btn-font);color:#9fb6d4;
  padding:0 10px;
}
#speed{
  width:280px;height:44px;accent-color:var(--accent);cursor:pointer;
}
#speedLabel{
  color:var(--accent);font-weight:900;min-width:4.5ch;
  font-variant-numeric:tabular-nums;
}

/* ================= 变量 / for 状态面板 ================= */
#panelVars{width:760px;}
#varBody{display:flex;flex-direction:column;gap:10px;padding:16px;}
.var-row{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding:9px 16px;border-radius:12px;
  background:rgba(22,34,54,.72);
  border:2px solid rgba(30,52,80,.9);
  border-left:8px solid rgba(56,189,248,.45);
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.var-row.k-ctx  {background:rgba(20,46,80,.8);border-left-color:#22d3ee;}
.var-row.k-main {border-left-color:#22d3ee;}
.var-row.k-phase{border-left-color:#38bdf8;}
.var-row.k-cond {border-left-color:#f472b6;}
.var-row.k-mid  {border-left-color:#c084fc;}
.var-row.k-round{border-left-color:#fbbf24;}
.var-row.k-note {border-left-color:#2dd4bf;}
.var-row.k-ret  {border-left-color:rgba(251,191,36,.5);}
.var-row.changed{background:rgba(56,189,248,.22);border-color:#38bdf8;}
.var-name{color:#8fa8c8;white-space:nowrap;}
.var-value{
  font-family:ui-monospace,Consolas,monospace;font-weight:900;
  color:var(--accent);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.var-value.dim{color:#5f7796;font-weight:500;}
.var-row.k-phase .var-value{color:#38bdf8;}
.var-row.k-cond  .var-value{color:#f472b6;}
.var-row.k-mid   .var-value{color:#c084fc;}
.var-row.k-round .var-value{color:#fbbf24;}
.var-row.k-note  .var-value{color:#2dd4bf;font-size:.88em;}
@keyframes flashVal{
  0%{transform:scale(1);}
  35%{transform:scale(1.22);color:#fff;text-shadow:0 0 18px var(--accent);}
  100%{transform:scale(1);}
}
.var-value.flash{animation:flashVal .55s ease-out;}

/* ================= 程序输出面板 ================= */
#panelOut{width:760px;}
#outBody{padding:20px 26px;font-family:ui-monospace,Consolas,"Courier New",monospace;}
.out-line{
  font-size:var(--out-font);line-height:1.45;white-space:pre;
  animation:slideIn .35s ease-out;
}
.seg-out{color:#e8f2ff;}
.seg-num{color:#ffa657;font-weight:900;}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-24px);}
  to{opacity:1;transform:none;}
}
#outBody:empty::before{
  content:"（等待程序输出…）";color:#3d5474;font-size:var(--out-font);
}

/* ================= 当前语句说明条 ================= */
#panelExplain{width:1280px;}
#explainBody{
  padding:18px 26px;font-size:var(--explain-font);line-height:1.55;
  color:#c3d4ea;
}
#explainBody strong{color:#fff;}
#explainBody code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(148,163,184,.18);border-radius:8px;
  padding:0 8px;color:#e2e8f0;
}
#explainBody .ex-line{
  display:inline-block;margin-right:14px;padding:2px 14px;
  border-radius:10px;background:rgba(56,189,248,.2);
  color:var(--accent);font-weight:900;font-size:.82em;
}
#explainBody .tip{
  display:block;margin-top:12px;padding:10px 16px;border-radius:12px;
  background:rgba(45,212,191,.12);border-left:8px solid #2dd4bf;color:#bff5ec;
}

/* ================= 代码缩略图（VSCode minimap · 有缩进有颜色） ================= */
#panelMini{width:400px;}
#miniBody{
  padding:12px 8px;
  font-family:ui-monospace,Consolas,monospace;
  font-size:var(--mini-font);
  line-height:1.6;
}
.mini-line{
  display:flex;align-items:flex-start;gap:6px;
  padding:2px 6px;border-radius:5px;
  cursor:pointer;
  white-space:pre;                 /* 保留缩进 */
  overflow:hidden;
  transition:background .15s;
}
.mini-line:hover{background:rgba(56,189,248,.14);}
.mini-line .mini-ln{
  flex:0 0 auto;min-width:2.2ch;text-align:right;
  color:#3d5a80;
}
.mini-line .mini-src{
  flex:1 1 auto;white-space:pre;overflow:hidden;
  text-overflow:clip;
}
.mini-line.done{opacity:.42;}
.mini-line.cur{
  background:rgba(56,189,248,.32);
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.7);
}
.mini-line.cur .mini-ln{color:#38bdf8;font-weight:700;}
.mini-line.cur .mini-src{color:#fff;}

/* 小屏兜底 */
@media (max-width:900px){
  :root{
    --code-font:clamp(28px,6.6vw,56px);
    --ln-font:clamp(20px,4.8vw,38px);
    --out-font:clamp(28px,6.6vw,52px);
    --var-font:clamp(18px,4vw,32px);
    --explain-font:clamp(20px,4.4vw,36px);
    --btn-font:clamp(18px,3.8vw,30px);
  }
}
</style>
</head>
<body>

<!-- ==================== 全屏代码区 ==================== -->
<div id="codeArea">
  <div id="codeInner">

    <div class="code-line" data-line="1"><span class="ln">1</span><span class="src"><span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>  <span class="cmt">// 包含标准输入输出头文件</span></span></div>

    <div class="code-line" data-line="2"><span class="ln">2</span><span class="src"><span class="kw">int</span> <span class="fn">main</span>() {  <span class="cmt">// 定义主函数</span></span></div>

    <div class="code-line" data-line="3"><span class="ln">3</span><span class="src">    <span class="kw">int</span> i<span class="comma">,</span> j;  <span class="cmt">// 定义循环变量，均未初始化</span></span></div>

    <div class="code-line" data-line="4"><span class="ln">4</span><span class="src">    <span class="kw">for</span> (i <span class="op">=</span> <span class="num">0</span><span class="comma">,</span> j <span class="op">=</span> <span class="num">5</span><span class="semi">;</span> i <span class="op">&lt;</span> <span class="num">3</span><span class="semi">;</span> i<span class="op">++</span><span class="comma">,</span> j<span class="op">--</span>) {  <span class="cmt">// 逗号分隔多个表达式</span></span></div>

    <div class="code-line" data-line="5"><span class="ln">5</span><span class="src">        <span class="fn">printf</span>(<span class="str">"i=%d, j=%d\n"</span><span class="comma">,</span> i<span class="comma">,</span> j);  <span class="cmt">// 输出 i、j 当前值</span></span></div>

    <div class="code-line" data-line="6"><span class="ln">6</span><span class="src">    }  <span class="cmt">// 循环体结束</span></span></div>

    <div class="code-line" data-line="7"><span class="ln">7</span><span class="src">    <span class="kw">return</span> <span class="num">0</span>;  <span class="cmt">// 返回 0，程序结束</span></span></div>

    <div class="code-line" data-line="8"><span class="ln">8</span><span class="src">}  <span class="cmt">// main 函数体结束</span></span></div>

  </div>
</div>

<!-- ==================== 顶部控制栏 ==================== -->
<div class="panel" id="panelTop">
  <div class="panel-head">
    <span class="panel-title">🎛 控制台</span>
    <button class="panel-close" data-close="panelTop" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div class="top-controls">
      <button class="btn" id="btnReset">⟲ 重置</button>
      <button class="btn" id="btnPrev">◀ 上一步</button>
      <button class="btn primary" id="btnPlay">▶ 自动播放</button>
      <button class="btn" id="btnNext">下一步 ▶</button>
      <label class="speed-wrap">速度
        <input type="range" id="speed" min="400" max="2400" step="100" value="1200">
        <b id="speedLabel">1.2s</b>
      </label>
      <button class="btn" id="btnFull">⛶ 全屏</button>
      <button class="btn" id="btnTogglePanels">👁 面板</button>
      <button class="btn" id="btnToggleMini">🗺 缩略图</button>
      <button class="btn" id="btnResetLayout">↺ 重置布局</button>
    </div>
  </div>
  <div class="panel-resizer"></div>
</div>

<!-- ==================== 变量 / for 状态面板 ==================== -->
<div class="panel" id="panelVars">
  <div class="panel-head">
    <span class="panel-title">📊 变量 · for 阶段 · 状态表</span>
    <button class="panel-close" data-close="panelVars" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div id="varBody"></div>
  </div>
  <div class="panel-resizer"></div>
</div>

<!-- ==================== 程序输出面板 ==================== -->
<div class="panel" id="panelOut">
  <div class="panel-head">
    <span class="panel-title">🖥 屏幕输出</span>
    <button class="panel-close" data-close="panelOut" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div id="outBody"></div>
  </div>
  <div class="panel-resizer"></div>
</div>

<!-- ==================== 当前语句说明条 ==================== -->
<div class="panel" id="panelExplain">
  <div class="panel-head">
    <span class="panel-title">💡 当前语句说明</span>
    <button class="panel-close" data-close="panelExplain" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div id="explainBody"></div>
  </div>
  <div class="panel-resizer"></div>
</div>

<!-- ==================== 代码缩略图 ==================== -->
<div class="panel" id="panelMini">
  <div class="panel-head">
    <span class="panel-title">🗺 缩略图</span>
    <button class="panel-close" data-close="panelMini" title="关闭">×</button>
  </div>
  <div class="panel-body">
    <div id="miniBody"></div>
  </div>
  <div class="panel-resizer"></div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. 状态构造函数
     ========================================================= */
  function V(o) {
    var v = {
      i:        '—',
      j:        '—',
      phase:    '—',
      cond:     '—',
      updExpr:  '—',
      round:    '—',
      out:      '—',
      note:     '—',
      prints:   0,
      ret:      '—'
    };
    for (var k in o) { if (Object.prototype.hasOwnProperty.call(o, k)) v[k] = o[k]; }
    return v;
  }

  /* =========================================================
     2. 逐步执行轨迹（16 步，覆盖 8 行代码）
        真实执行：i: 0→1→2→3，j: 5→4→3→2
        条件判断 4 次（真真真假），循环体 3 次，更新 3 次
        printf 3 次，输出 3 行，返回值 0
     ========================================================= */
  var STEPS = [
    {   /* 0 */
      line: 1, ctx: '预处理阶段',
      vars: V({}),
      out: null,
      title: '预处理指令 #include &lt;stdio.h&gt;',
      desc: '预处理器把标准输入输出头文件 <code>stdio.h</code> 的内容引入源文件，使 printf 获得正确的函数声明。这一行不产生任何屏幕输出。'
    },
    {   /* 1 */
      line: 2, ctx: 'main',
      vars: V({}),
      out: null,
      title: '程序入口 int main() {',
      desc: '操作系统把控制权交给 main，程序正式开始执行。系统为 main 建立栈帧，接下来声明的整型变量 i、j 就存放在这个栈帧里。'
    },
    {   /* 2 */
      line: 3, ctx: 'main · 声明循环变量',
      vars: V({ i: '未初始化（不定值）', j: '未初始化（不定值）' }),
      out: null,
      title: 'int i, j;  一条语句声明两个 int，都不给初值',
      desc: '这一行是<b>一条语句</b>，用逗号声明两个 int 变量，各占 <b>4 个字节</b>，但<b>都没有初始化</b>。下一行的 for 会先给它们赋初值，所以这里的不定值不会造成问题。注意：这里声明语句里的逗号只是变量分隔符，不是逗号表达式。'
    },
    {   /* 3 */
      line: 4, ctx: 'main · for 初始化表达式',
      vars: V({ i: '0', j: '5',
                phase: '初始化（只执行一次）',
                updExpr: 'i++, j--（本轮还没到）',
                round: '第 0 轮（尚未进入循环体）',
                note: 'i = 0，j = 5 只执行一次' }),
      out: null,
      title: 'for (i = 0, j = 5; ...)  初始化表达式执行',
      desc: 'for 圆括号里用<b>分号</b>分成三段：<code>初始化 ; 条件 ; 更新</code>。<br><b>第 ① 段是初始化表达式</b>，只执行一次。<code>i = 0, j = 5</code> 是一个<b>逗号表达式</b>：从左到右依次求值，先执行 <code>i = 0</code>，再执行 <code>j = 5</code>；前一项的值被丢弃，但副作用保留，所以 i 变成 <b>0</b>，j 变成 <b>5</b>。整个逗号表达式的值等于最后一项的值（5），但 for 的初始化<b>不使用</b>这个值，只利用副作用。<br><b>注意：分号才是 for 三段的分隔符，逗号不能代替分号</b>——逗号只能在同一段里并列多个表达式。'
    },
    {   /* 4 */
      line: 4, ctx: 'main · 条件判断（第 1 次）',
      vars: V({ i: '0', j: '5',
                phase: '条件判断',
                cond: '0 < 3 → 真（1）',
                round: '即将进入第 1 轮',
                note: '条件成立 → 执行循环体' }),
      out: null,

  /* =========================================================
     3. DOM 引用
     ========================================================= */
  var codeArea    = document.getElementById('codeArea');
  var codeInner   = document.getElementById('codeInner');
  var codeLines   = Array.prototype.slice.call(document.querySelectorAll('.code-line'));
  var varBody     = document.getElementById('varBody');
  var outBody     = document.getElementById('outBody');
  var explainBody = document.getElementById('explainBody');
  var miniBody    = document.getElementById('miniBody');

  var btnPlay     = document.getElementById('btnPlay');
  var btnPrev     = document.getElementById('btnPrev');
  var btnNext     = document.getElementById('btnNext');
  var btnReset    = document.getElementById('btnReset');
  var btnFull     = document.getElementById('btnFull');
  var btnTogglePanels = document.getElementById('btnTogglePanels');
  var btnToggleMini   = document.getElementById('btnToggleMini');
  var btnResetLayout  = document.getElementById('btnResetLayout');
  var speedInput  = document.getElementById('speed');
  var speedLabel  = document.getElementById('speedLabel');

  /* =========================================================
     4. 变量表行定义
     ========================================================= */
  var VAR_ROWS = [
    { key:'ctx',     name:'当前执行位置',              kind:'k-ctx'   },
    { key:'i',       name:'i  (int) 的值',            kind:'k-main'  },
    { key:'j',       name:'j  (int) 的值',            kind:'k-main'  },
    { key:'phase',   name:'for 当前阶段',             kind:'k-phase' },
    { key:'cond',    name:'条件 i < 3 的值',          kind:'k-cond'  },
    { key:'updExpr', name:'更新表达式 i++, j--',      kind:'k-mid'   },
    { key:'round',   name:'迭代轮次',                 kind:'k-round' },
    { key:'out',     name:'本轮 printf 输出',         kind:'k-round' },
    { key:'note',    name:'关键规则提示',             kind:'k-note'  },
    { key:'prints',  name:'printf 调用次数',          kind:'k-ctx'   },
    { key:'ret',     name:'main 返回值',              kind:'k-ret'   }
  ];

  /* 循环体执行步骤（第 5、8、11 步）——用于给第 5 行加浅底 */
  var BODY_STEPS = [5, 8, 11];

  /* =========================================================
     5. 运行状态
     ========================================================= */
  var current    = -1;
  var playing    = false;
  var timer      = null;
  var speed      = Number(speedInput.value);
  var lastOutSig = '';

  /* =========================================================
     6. 构建变量表骨架
     ========================================================= */
  function buildVarTable() {
    varBody.innerHTML = VAR_ROWS.map(function (r) {
      return '<div class="var-row ' + r.kind + '" data-key="' + r.key + '">' +
               '<span class="var-name">' + r.name + '</span>' +
               '<span class="var-value dim">—</span>' +
             '</div>';
    }).join('');
  }

  function valueOf(step, key) {
    if (!step) return '—';
    if (key === 'ctx') return step.ctx;
    return step.vars[key];
  }

  function updateVars(step, prevStep) {
    VAR_ROWS.forEach(function (r) {
      var row   = varBody.querySelector('.var-row[data-key="' + r.key + '"]');
      if (!row) return;
      var valEl = row.querySelector('.var-value');
      var val   = String(valueOf(step, r.key));
      var old   = String(valueOf(prevStep, r.key));

      if (valEl.textContent !== val) {
        valEl.textContent = val;
        valEl.classList.toggle('dim', val === '—');
        valEl.title = val;
        valEl.classList.remove('flash');
        void valEl.offsetWidth;
        valEl.classList.add('flash');
        if (prevStep && old !== val) {
          row.classList.add('changed');
          window.setTimeout(function () { row.classList.remove('changed'); }, 750);
        }
      }
    });
  }

  /* =========================================================
     7. 代码高亮 + 自动居中
     ========================================================= */
  function centerActiveLine() {
    var el = codeInner.querySelector('.code-line.active');
    if (!el) return;
    window.requestAnimationFrame(function () {
      var targetTop = el.offsetTop - (codeArea.clientHeight - el.offsetHeight) / 2;
      if (Math.abs(codeArea.scrollTop - targetTop) > 8) {
        codeArea.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
      }
    });
  }

  function updateCode(step) {
    var activeLine = step ? step.line : null;
    codeLines.forEach(function (el) {
      var n = Number(el.dataset.line);
      el.classList.toggle('active', activeLine !== null && n === activeLine);
      el.classList.toggle('done',   activeLine !== null && n <  activeLine);
      el.classList.toggle('body-hit',
        n === 5 && current >= 0 && BODY_STEPS.indexOf(current) !== -1);
    });
    centerActiveLine();
    updateMini(step);
  }

  /* =========================================================
     8. 缩略图：真正渲染 8 行代码 —— 有缩进、有颜色、美观
     ========================================================= */
  function buildMini() {
    miniBody.innerHTML = codeLines.map(function (el) {
      var n = el.dataset.line;
      var lnText = el.querySelector('.ln').textContent;
      var srcHTML = el.querySelector('.src').innerHTML;   /* 保留缩进和语法着色 */
      return '<div class="mini-line" data-line="' + n + '">' +
               '<span class="mini-ln">' + lnText + '</span>' +
               '<span class="mini-src">' + srcHTML + '</span>' +
             '</div>';
    }).join('');

    miniBody.addEventListener('click', function (e) {
      var row = e.target.closest ? e.target.closest('.mini-line') : null;
      if (!row) return;
      var n = Number(row.dataset.line);
      var target = codeInner.querySelector('.code-line[data-line="' + n + '"]');
      if (target) {
        codeArea.scrollTo({
          top: Math.max(0, target.offsetTop - 60),
          behavior: 'smooth'
        });
      }
    });
  }

  function updateMini(step) {
    var activeLine = step ? step.line : null;
    Array.prototype.forEach.call(miniBody.querySelectorAll('.mini-line'), function (d) {
      var n = Number(d.dataset.line);
      d.classList.toggle('cur', activeLine !== null && n === activeLine);
      d.classList.toggle('done', activeLine !== null && n < activeLine);
    });
  }

  /* =========================================================
     9. 输出区
     ========================================================= */
  function resolveOut(upto) {
    for (var i = upto; i >= 0; i--) {
      if (STEPS[i] && STEPS[i].out) return STEPS[i].out;
    }
    return null;
  }

  function updateOutput(upto) {
    var lines = resolveOut(upto);
    var sig   = lines ? JSON.stringify(lines) : '';

    if (sig === lastOutSig) return;
    lastOutSig = sig;

    outBody.innerHTML = '';
    if (!lines) return;

    lines.forEach(function (segs) {
      var div = document.createElement('div');
      div.className = 'out-line';
      segs.forEach(function (seg) {
        var span = document.createElement('span');
        span.className = 'seg-' + (seg.c || 'out');
        span.textContent = seg.t;
        div.appendChild(span);
      });
      outBody.appendChild(div);
    });
  }

  /* =========================================================
     10. 总渲染
     ========================================================= */
  function render() {
    var step = current >= 0 ? STEPS[current] : null;
    var prev = current > 0 ? STEPS[current - 1] : null;

    updateCode(step);
    updateVars(step, prev);
    updateOutput(current);

    if (step) {
      explainBody.innerHTML =
        '<span class="ex-line">第 ' + step.line + ' 行</span>' +
        '<strong>' + step.title + '</strong> —— ' + step.desc;
    } else {
      explainBody.innerHTML =
        '<em>点击「自动播放」或「下一步」，开始逐条执行程序。' +
        '（空格 = 播放/暂停，← → = 上一步/下一步，R = 重置，F = 全屏，M = 缩略图，H = 面板显示/隐藏）</em>';
    }

    btnPrev.disabled = current < 0;
    btnNext.disabled = current >= STEPS.length - 1;
  }

  /* =========================================================
     11. 播放控制
     ========================================================= */
  function updatePlayBtn() {
    btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
    btnPlay.classList.toggle('playing', playing);
  }

  function tick() {
    if (current >= STEPS.length - 1) { pause(); return; }
    current += 1;
    render();
    if (current >= STEPS.length - 1) pause();
  }

  function play() {
    if (playing) return;
    if (current >= STEPS.length - 1) { current = -1; render(); }
    playing = true;
    updatePlayBtn();
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
    tick();
  }

  function pause() {
    playing = false;
    window.clearInterval(timer);
    timer = null;
    updatePlayBtn();
  }

  function nextStep() {
    pause();
    if (current < STEPS.length - 1) { current += 1; render(); }
  }

  function prevStep() {
    pause();
    if (current > -1) { current -= 1; render(); }
  }

  function resetAll() {
    pause();
    current = -1;
    lastOutSig = '';
    outBody.innerHTML = '';
    render();
    codeArea.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
  }

  /* =========================================================
     12. 面板系统：拖动 / 缩放（无限制） / 关闭 / 点击置顶
     ========================================================= */
  var PANEL_IDS = ['panelTop', 'panelVars', 'panelOut', 'panelExplain', 'panelMini'];
  var zTop = 100;

  function bringToFront(el) {
    zTop += 1;
    el.style.zIndex = String(zTop);
    PANEL_IDS.forEach(function (id) {
      var p = document.getElementById(id);
      if (p) p.classList.toggle('active', p === el);
    });
  }

  function makeDraggable(el, handle) {
    handle.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('.panel-close')) return;
      if (e.target.closest && e.target.closest('.panel-resizer')) return;
      e.preventDefault();
      bringToFront(el);
      var rect = el.getBoundingClientRect();
      var offX = e.clientX - rect.left;
      var offY = e.clientY - rect.top;

      function onMove(ev) {
        el.style.left   = (ev.clientX - offX) + 'px';
        el.style.top    = (ev.clientY - offY) + 'px';
        el.style.right  = 'auto';
        el.style.bottom = 'auto';
      }
      function onUp() {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  /* 任意大小：不设最小/最大限制（仅保留 8px 防止完全消失） */
  function makeResizable(el, handle) {
    handle.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      e.stopPropagation();
      bringToFront(el);
      var rect = el.getBoundingClientRect();
      var startX = e.clientX, startY = e.clientY;
      var startW = rect.width,  startH = rect.height;

      function onMove(ev) {
        var w = startW + (ev.clientX - startX);
        var h = startH + (ev.clientY - startY);
        el.style.width  = Math.max(8, w) + 'px';
        el.style.height = Math.max(8, h) + 'px';
      }
      function onUp() {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
      }
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  function initPanels() {
    PANEL_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;

      /* 任意位置按下 → 立即置顶（捕获阶段） */
      el.addEventListener('pointerdown', function () { bringToFront(el); }, true);
      el.addEventListener('focusin',   function () { bringToFront(el); }, true);

      var head = el.querySelector('.panel-head');
      if (head) makeDraggable(el, head);

      var resizer = el.querySelector('.panel-resizer');
      if (resizer) makeResizable(el, resizer);

      var closeBtn = el.querySelector('.panel-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          el.style.display = 'none';
        });
      }
    });
  }

  /* =========================================================
     13. 重置布局
     ========================================================= */
  function resetLayout() {
    var W = window.innerWidth, H = window.innerHeight;

    /* 全部显示并清除内联尺寸 / 位置 / 层级 */
    PANEL_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.display = '';
      el.style.left = el.style.top = el.style.right = el.style.bottom = '';
      el.style.width = el.style.height = '';
      el.style.zIndex = '';
      el.classList.remove('active');
    });

    void document.body.offsetHeight;   /* 强制重排后再测量 */

    var top   = document.getElementById('panelTop');
    var vars  = document.getElementById('panelVars');
    var out   = document.getElementById('panelOut');
    var exp   = document.getElementById('panelExplain');
    var mini  = document.getElementById('panelMini');

    /* 默认层级：控制栏 > 变量 > 输出 > 说明 > 缩略图 */
    if (top)  top.style.zIndex  = '500';
    if (vars) vars.style.zIndex = '490';
    if (out)  out.style.zIndex  = '480';
    if (exp)  exp.style.zIndex  = '470';
    if (mini) mini.style.zIndex = '460';
    zTop = 500;

    /* 顶部控制栏：水平居中 */
    if (top && top.offsetWidth) {
      top.style.left = Math.max(16, (W - top.offsetWidth) / 2) + 'px';
      top.style.top  = '16px';
    }

    var belowTop = (top && top.offsetHeight) ? (top.offsetHeight + 32) : 140;

    /* 变量面板：左上 */
    if (vars && vars.offsetWidth) {
      vars.style.left = '20px';
      vars.style.top  = belowTop + 'px';
    }
    /* 输出面板：右上 */
    if (out && out.offsetWidth) {
      out.style.left = Math.max(20, W - out.offsetWidth - 20) + 'px';
      out.style.top  = belowTop + 'px';
    }
    /* 缩略图：右侧、输出面板下方 */
    if (mini && mini.offsetWidth) {
      var miniTop = belowTop + 20;
      if (out && out.offsetHeight) miniTop = belowTop + out.offsetHeight + 30;
      mini.style.left = Math.max(20, W - mini.offsetWidth - 20) + 'px';
      mini.style.top  = Math.round(miniTop) + 'px';
    }
    /* 说明条：底部居中 */
    if (exp && exp.offsetWidth) {
      exp.style.left = Math.max(20, (W - exp.offsetWidth) / 2) + 'px';
      exp.style.top  = Math.max(180, H - exp.offsetHeight - 20) + 'px';
    }
  }

  /* =========================================================
     14. 面板显示 / 隐藏 / 全屏
     ========================================================= */
  function anyPanelVisible() {
    return PANEL_IDS.some(function (id) {
      var el = document.getElementById(id);
      return el && el.style.display !== 'none';
    });
  }

  function showAllPanels() {
    PANEL_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.display = '';
      bringToFront(el);       /* 重新显示时置顶 */
    });
  }

  function hideAllPanels() {
    PANEL_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }

  function toggleAllPanels() {
    if (anyPanelVisible()) hideAllPanels();
    else showAllPanels();
  }

  function toggleMini() {
    var el = document.getElementById('panelMini');
    if (!el) return;
    if (el.style.display === 'none') {
      el.style.display = '';
      bringToFront(el);
    } else {
      el.style.display = 'none';
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen ||
       document.documentElement.webkitRequestFullscreen ||
       function () {}).call(document.documentElement);
    } else {
      (document.exitFullscreen ||
       document.webkitExitFullscreen ||
       function () {}).call(document);
    }
  }

  /* =========================================================
     15. 事件绑定
     ========================================================= */
  btnPlay.addEventListener('click', function () { playing ? pause() : play(); });
  btnNext.addEventListener('click', nextStep);
  btnPrev.addEventListener('click', prevStep);
  btnReset.addEventListener('click', resetAll);
  btnFull.addEventListener('click', toggleFullscreen);
  btnTogglePanels.addEventListener('click', toggleAllPanels);
  btnToggleMini.addEventListener('click', toggleMini);
  btnResetLayout.addEventListener('click', resetLayout);

  speedInput.addEventListener('input', function () {
    speed = Number(speedInput.value);
    speedLabel.textContent = (speed / 1000).toFixed(1) + 's';
    if (playing) {
      window.clearInterval(timer);
      timer = window.setInterval(tick, speed);
    }
  });

  /* 全局快捷键：与面板可见性无关 */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' && e.target.type !== 'range') return;

    switch (e.code) {
      case 'Space':
        e.preventDefault();
        playing ? pause() : play();
        break;
      case 'ArrowRight': e.preventDefault(); nextStep(); break;
      case 'ArrowLeft':  e.preventDefault(); prevStep(); break;
      case 'KeyR':       e.preventDefault(); resetAll(); break;
      case 'KeyF':       e.preventDefault(); toggleFullscreen(); break;
      case 'KeyM':       e.preventDefault(); toggleMini(); break;
      case 'KeyH':       e.preventDefault(); toggleAllPanels(); break;
    }
  });

  window.addEventListener('resize', function () {
    PANEL_IDS.forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.style.display === 'none') return;
      var l = parseFloat(el.style.left);
      var t = parseFloat(el.style.top);
      if (!isNaN(l) && l > window.innerWidth - 60)  el.style.left = (window.innerWidth - 60) + 'px';
      if (!isNaN(t) && t > window.innerHeight - 40) el.style.top  = (window.innerHeight - 40) + 'px';
    });
  });

  /* =========================================================
     16. 初始化
     ========================================================= */
  buildVarTable();
  buildMini();
  initPanels();
  speedLabel.textContent = (speed / 1000).toFixed(1) + 's';
  render();

  /* 布局在字体 / 尺寸测量完成后进行 */
  window.requestAnimationFrame(function () {
    resetLayout();
    window.setTimeout(resetLayout, 140);
  });

})();
</script>
</body>
</html>
