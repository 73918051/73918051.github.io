/* =====================================================================
   三、逐步执行数据
   ===================================================================== */
var S = {
  i: null, n: null, m: null, k: null,
  funRet: null,
  keyActive: false,
  stack: [],
  expr: '—', exprVal: '—', note: '—',
  pc: 0,
  printfCount: 0, scanfCount: 0, funCount: 0,
  whileCount: 0, bodyCount: 0,
  ifTrue: 0,
  mainRet: '—',
  out: '',
  inputNote: null
};

var STEPS = [];

function emit(o){
  if (o.stack)      S.stack = o.stack.slice();
  if (o.i !== undefined) S.i = o.i;
  if (o.n !== undefined) S.n = o.n;
  if (o.m !== undefined) S.m = o.m;
  if (o.k !== undefined) S.k = o.k;
  if (o.funRet !== undefined) S.funRet = o.funRet;
  if (o.keyActive !== undefined) S.keyActive = !!o.keyActive;
  if (o.expr !== undefined)    S.expr = o.expr;
  if (o.exprVal !== undefined) S.exprVal = o.exprVal;
  if (o.note !== undefined)    S.note = o.note;
  if (o.pc !== undefined)      S.pc = o.pc;
  if (o.printfCount !== undefined) S.printfCount = o.printfCount;
  if (o.scanfCount  !== undefined) S.scanfCount  = o.scanfCount;
  if (o.funCount    !== undefined) S.funCount    = o.funCount;
  if (o.whileCount  !== undefined) S.whileCount  = o.whileCount;
  if (o.bodyCount   !== undefined) S.bodyCount   = o.bodyCount;
  if (o.ifTrue      !== undefined) S.ifTrue      = o.ifTrue;
  if (o.mainRet !== undefined) S.mainRet = o.mainRet;
  if (o.append)   S.out += o.append;
  if (o.inputNote !== undefined) S.inputNote = o.inputNote;

  STEPS.push({
    line: o.line,
    kind: o.kind || 'exec',
    title: o.title,
    desc: o.desc,
    stack: S.stack.slice(),
    func: S.stack.length ? S.stack[S.stack.length-1] : '—',
    i: S.i, n: S.n, m: S.m, k: S.k,
    funRet: S.funRet,
    keyActive: S.keyActive,
    expr: S.expr, exprVal: S.exprVal, note: S.note,
    pc: S.pc,
    printfCount: S.printfCount,
    scanfCount:  S.scanfCount,
    funCount:    S.funCount,
    whileCount:  S.whileCount,
    bodyCount:   S.bodyCount,
    ifTrue:      S.ifTrue,
    mainRet: S.mainRet,
    out: S.out,
    inputNote: S.inputNote,
    gold: !!o.gold
  });
}

/* ============ 1：第 1 行 ============ */
S.note = '预处理：包含 stdio.h，printf / scanf 的声明来自这里';
emit({
  line:1, kind:'pre',
  title:'#include &lt;stdio.h&gt;',
  desc:'预处理指令：把标准输入输出头文件包含进来，让 <code>printf</code>、<code>scanf</code> 拿到函数声明。<br>' +
       '这一行<b>不是 C 语句</b>，编译之前就处理完了，不产生任何屏幕输出。'
});

/* ============ 2：第 2 行 fun 定义登记 ============ */
S.note = 'fun 定义已登记（不执行），调用时才运行';
emit({
  line:2, kind:'pre',
  title:'int fun(int m) { ... }   定义素数判断函数（不执行）',
  desc:'编译器在这里<b>登记</b> fun 函数的定义：<br>' +
       '· 返回类型 <code>int</code>，参数是一个 <code>int m</code>；<br>' +
       '· 函数体在第 3~9 行：先用 while 检查能否被整除，再返回 1 或 0；<br>' +
       '· <b>此刻不会执行</b>——只有 main 中第 16 行调用 <code>fun(n)</code> 时才真正运行。' +
       '<span class="tip"><b>fun 的判定思路：</b><br>' +
       '从 k=1（对应除数 2）开始，只要 k 不超过 m/2 且 m 不能被 (k+1) 整除就 k++；<br>' +
       '循环结束后，如果 k 一直走到了 <code>m/2 + 1</code>，说明没有任何除数能整除 m，' +
       '同时排除 m=1，就返回 1（是素数），否则返回 0。</span>'
});

/* ============ 3：第 11 行 main 入口 ============ */
S.stack = ['main'];
S.note = 'main 栈帧建立，程序正式开始';
emit({
  line:11, kind:'exec',
  title:'int main() {   程序从 main 开始执行',
  desc:'操作系统把控制权交给 <code>main</code>，程序正式开始，系统为 main 建立<b>栈帧</b>。<br>' +
       '<b>整体流程：</b><br>' +
       '① 第 12 行：<code>int n, i;</code>；<br>' +
       '② 第 13 行：<code>for(i=1; i&lt;=10; i++)</code> 循环 10 次；<br>' +
       '③ 第 14 行：<code>printf</code> 提示输入；<br>' +
       '④ 第 15 行：<code>scanf</code> 读入 n；<br>' +
       '⑤ 第 16 行：<code>if(fun(n))</code> 调用 fun 判断；<br>' +
       '⑥ 第 17/19 行：根据返回值输出 YES 或 No!；<br>' +
       '⑦ 第 22 行：返回 0。' +
       '<span class="tip"><b>本次模拟输入：</b><br>' +
       '· 第 1 次循环：n = <b>7</b>（素数）；<br>' +
       '· 第 2 次循环：n = <b>4</b>（合数）。<br>' +
       '为了演示完整过程，模拟<b>前 2 次循环</b>，其余 8 次迭代跳过。<br>' +
       '<b>预计屏幕输出（3 个逻辑行，含 1 个空行）：</b><br>' +
       '<code>⏎</code> / <code>please enter n:YES</code> / <code>please enter n:No!</code></span>'
});

/* ============ 4：第 12 行 int n, i ============ */
emit({
  line:12, kind:'exec',
  title:'int n, i;   声明两个局部变量（未初始化）',
  desc:'声明两个整型变量，都<b>没有初始化</b>：<br>' +
       '· <b>n</b>：用来接收用户输入的数；<br>' +
       '· <b>i</b>：for 循环的计数变量；<br>' +
       '· 此刻它们的值是<b>栈上的垃圾值</b>，表中显示为 <b>—（未读入）</b>。'
});

/* =====================================================================
   外层 for 循环：共 10 次，详细演示前 2 次
   ===================================================================== */
var INPUTS = [7, 4];

for (var iter = 0; iter < INPUTS.length; iter++) {
  var curN = INPUTS[iter];

  /* ---- 第 13 行：for 初始化 ---- */
  S.i = iter + 1;
  emit({
    line:13, kind:'mv',
    title:'for 第 ' + S.i + ' 轮：<b>i = ' + S.i + '</b>',
    desc:'for 循环的<b>初始化部分</b>（或 i++ 步进后再次进入条件判断）：<br>' +
         '· i = <b>' + S.i + '</b>；<br>' +
         '· 接下来判断条件 <code>i &lt;= 10</code>。',
    expr:'i = ' + S.i,
    exprVal:'i 被设置为 ' + S.i,
    note:'i = ' + S.i
  });

  /* ---- 第 13 行：for 条件判断 ---- */
  emit({
    line:13, kind:'mv',
    title:'for 条件：<b>' + S.i + ' &lt;= 10</b> → <b>真</b>',
    desc:'判断循环条件 <code>i &lt;= 10</code>：<br>' +
         '· i = <b>' + S.i + '</b>，<code>' + S.i + ' &lt;= 10</code> 成立；<br>' +
         '· 进入循环体，开始处理第 ' + S.i + ' 个输入。',
    expr:'i <= 10   →   ' + S.i + ' <= 10',
    exprVal:'真（1）→ 进入循环体',
    note:'条件成立，进入循环体'
  });

  /* ---- 第 14 行：printf 提示 ---- */
  S.out += '\nplease enter n:';
  S.printfCount = S.printfCount + 1;
  S.pc = S.printfCount;
  emit({
    line:14, kind:'out',
    title:'printf("\\nplease enter n:");   提示输入',
    desc:'执行 <code>printf</code>：<br>' +
         '· 格式串<b>开头</b>的 <code>\\n</code> 让光标<b>先换到下一行</b>；<br>' +
         '· 然后输出 <b>please enter n:</b>；<br>' +
         '· 末尾<b>没有 <code>\\n</code></b>，所以光标停在冒号后面，等待用户输入。' +
         '<span class="tip"><b>屏幕当前内容：</b><br><code>' +
         S.out.replace(/\n/g, '⏎<br>') + '</code></span>',
    expr:'printf("\\nplease enter n:")',
    exprVal:'先输出换行符，再输出提示（末尾不换行）',
    note:'第 ' + S.printfCount + ' 次 printf：屏幕新增一行提示'
  });

  /* ---- 第 15 行：scanf 阻塞 ---- */
  S.scanfCount = S.scanfCount + 1;
  emit({
    line:15, kind:'inp',
    title:'scanf("%d", &amp;n);   等待输入',
    desc:'调用 <code>scanf("%d", &amp;n)</code>：<br>' +
         '· <code>%d</code> 表示读入一个 <b>十进制整数</b>；<br>' +
         '· <code>&amp;n</code> 是变量 n 的<b>地址</b>——scanf 需要地址才能把值写回去；<br>' +
         '· 程序在此<b>阻塞</b>，等待用户从键盘输入。' +
         '<span class="warn"><b>为什么要写 &amp;？</b><br>' +
         '<code>scanf</code> 需要变量的地址才能把输入的值写入；<br>' +
         '<code>n</code> 是值，<code>&amp;n</code> 才是地址。<br>' +
         '（对比：<code>printf("%d", n)</code> 只要值，不需要 &amp;）</span>',
    expr:'scanf("%d", &n)',
    exprVal:'等待用户输入一个整数',
    note:'程序在此阻塞，等待输入'
  });

  /* ---- 第 15 行：输入完成 ---- */
  S.n = curN;
  S.inputNote = String(curN);
  emit({
    line:15, kind:'inp',
    title:'scanf 读入 <b>' + curN + '</b>，<b>n = ' + curN + '</b>',
    desc:'<code>scanf</code> 把用户输入写入 <code>n</code>：<br>' +
         '· <b>n</b> ' + (iter === 0 ? '从未初始化变为' : '被完全覆盖为') + ' <b>' + curN + '</b>；<br>' +
         '· 第 15 行执行完毕，控制流进入第 16 行。',
    expr:'n ← ' + curN,
    exprVal:'n 的值变为 ' + curN,
    note:'n = ' + curN
  });

  /* ---- 第 16 行：准备调用 fun(n) ---- */
  S.m = null; S.k = null; S.funRet = null;
  S.funCount = S.funCount + 1;
  emit({
    line:16, kind:'call',
    title:'if(fun(n))　准备调用 <b>fun(' + curN + ')</b>',
    desc:'第 16 行是 <code>if(fun(n))</code>：<br>' +
         '· 先求值内层的 <code>fun(n)</code>——把 <b>n = ' + curN + '</b> 作为实参传给 fun；<br>' +
         '· 进入 fun 时，这个值会被<b>复制</b>给形参 <code>m</code>；<br>' +
         '· 控制权交给 fun，main 暂停在这一行等待返回值。' +
         '<span class="warn"><b>值传递：</b><br>' +
         '实参 n 和形参 m 是<b>两个独立的变量</b>，只是值相同。<br>' +
         '在 fun 中修改 m，<b>不会影响</b> main 中的 n。</span>',
    expr:'fun(n)   →   fun(' + curN + ')',
    exprVal:'把实参 n 的值复制给形参 m，控制权交给 fun',
    note:'准备进入 fun 函数（第 ' + S.funCount + ' 次）'
  });

  /* ---- 进入 fun（第 2 行） ---- */
  S.stack = ['main', 'fun'];
  S.m = curN;
  S.keyActive = true;
  emit({
    line:2, kind:'call',
    title:'进入 fun：形参 <b>m = ' + curN + '</b>',
    desc:'控制权交给 fun，函数体开始执行：<br>' +
         '· 形参 <code>m</code> 被创建，初始化为实参的值 <b>' + curN + '</b>；<br>' +
         '· m 是 fun 的<b>局部变量</b>，占 4 字节；<br>' +
         '· 函数返回时，m 会随 fun 的栈帧一起销毁。' +
         '<span class="tip"><b>调用栈：</b>main → fun（fun 成为当前函数）</span>',
    expr:'int m = ' + curN,
    exprVal:'m 被初始化为实参的值',
    note:'m = ' + curN
  });

  /* ---- 第 3 行：k = 1 ---- */
  S.k = 1;
  emit({
    line:3, kind:'gold',
    title:'int k = 1;   <b>k = 1</b>（对应除数 2）',
    desc:'声明并初始化局部变量 k：<br>' +
         '· <b>k = 1</b>，它代表“即将要检查的除数减去 1”；<br>' +
         '· 也就是说，k 表示将要检查的除数是 <code>k + 1</code>；<br>' +
         '· 所以当 k=1 时，检查的除数是 2。' +
         '<span class="tip"><b>为什么要用 k 而不是直接用除数？</b><br>' +
         '程序用 k 表示“已经试过的除数的个数”，' +
         '而 k+1 才是下一个要尝试的除数；<br>' +
         '循环退出时 k 的位置还能直接和 m/2+1 比较，判断是否试完了所有可能的除数。</span>',
    expr:'k = 1',
    exprVal:'k 被设置为 1（对应除数 2）',
    note:'k = 1，准备开始试除'
  });

  /* ---- 第 4 行：while 循环逐次判断 ---- */
  var curK = 1;
  var checkCount = 0;
  while (true) {
    checkCount++;
    S.whileCount = S.whileCount + 1;
    var half = Math.floor(curN / 2);
    var cond1 = (curK <= half);
    var cond2 = cond1 ? (curN % (curK + 1) !== 0) : false;
    var cond  = cond1 && cond2;

    var cond1Str = 'k &lt;= m/2  →  ' + curK + ' &lt;= ' + half;
    var cond2Str;
    if (cond1) {
      cond2Str = 'm % (k+1) != 0  →  ' + curN + ' % ' + (curK + 1) + ' != 0  →  ' +
                 (curN % (curK + 1)) + ' != 0';
    } else {
      cond2Str = 'm % (k+1) != 0  （<b>短路</b>——左侧已经为假，右侧不执行）';
    }

    emit({
      line:4, kind: cond ? 'mv' : 'short',
      title:'while 第 ' + checkCount + ' 次判断：<b>' +
            (cond ? '真 → k++' : '假 → 退出循环') + '</b>',
      desc:'while 条件由两个子条件组成：<br>' +
           '· <b>条件 1</b>：<code>' + cond1Str + '</code> → <b>' + (cond1 ? '真' : '假') + '</b>；' +
           '（m/2 是整数除法，' + curN + '/2 = ' + half + '）<br>' +
           '· <b>条件 2</b>：' + (cond1 ?
             '<code>' + cond2Str + '</code> → <b>' + (cond2 ? '真' : '假') + '</b>；' +
             '（即检查 m 能否被 <b>' + (curK + 1) + '</b> 整除）' :
             cond2Str + '；') +
           '<br>· 用 <code>&amp;&amp;</code> 连接 → 整体 <b>' + (cond ? '真' : '假') + '</b>。' +
           (cond
             ? '<span class="tip"><b>继续循环：</b>' + curN + ' 不能被 ' + (curK + 1) + ' 整除，' +
               '说明 ' + (curK + 1) + ' 不是它的因数。<br>执行 <code>k++</code>，检查下一个除数。</span>'
             : '<span class="win"><b>退出循环：</b>' +
               (cond1 ? curN + ' 能被 ' + (curK + 1) + ' 整除，找到因数了！' :
                        'k 已经超过 m/2，所有可能的除数都试完了。') +
               '<br>k = ' + curK + '，下一步进入第 5 行判断。</span>'),
      expr:'k <= m/2 && m % (k+1) != 0',
      exprVal:'条件1：' + (cond1 ? '真' : '假') +
              '；条件2：' + (cond1 ? (cond2 ? '真' : '假') : '未检查（短路）') +
              ' → 整体 <b>' + (cond ? '真' : '假') + '</b>',
      note: cond ? ('条件成立 → 执行 k++，k 从 ' + curK + ' 变为 ' + (curK + 1))
                 : ('条件不成立 → 退出 while，k = ' + curK)
    });

    if (!cond) break;

    /* k++ */
    curK++;
    S.k = curK;
    S.bodyCount = S.bodyCount + 1;
    emit({
      line:4, kind:'gold',
      title:'k++　→　<b>k = ' + curK + '</b>（下一个除数 ' + (curK + 1) + '）',
      desc:'<code>k++</code> 把 k 往后推一格：<br>' +
           '· k 从 <b>' + (curK - 1) + '</b> 变为 <b>' + curK + '</b>；<br>' +
           '· 下一个要检查的除数是 <b>' + (curK + 1) + '</b>；<br>' +
           '· 回到第 4 行重新判断 while 条件。',
      expr:'k++',
      exprVal:'k 从 ' + (curK - 1) + ' 变为 ' + curK,
      note:'k = ' + curK + '，下一个除数是 ' + (curK + 1)
    });
  }

   ===================================================================== */
var zTop = 100;
var panelEls = Array.prototype.slice.call(document.querySelectorAll('.panel'));

function bringFront(el){
  zTop += 1;
  el.style.zIndex = zTop;
  panelEls.forEach(function(p){ p.classList.remove('top'); });
  el.classList.add('top');
}

function makePanel(el){
  var head = el.querySelector('.phead');
  var rs   = el.querySelector('.rs');

  el.addEventListener('pointerdown', function(){ bringFront(el); }, true);

  var cbtn = el.querySelector('[data-act="collapse"]');
  if (cbtn) cbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.classList.toggle('collapsed');
  });
  var xbtn = el.querySelector('[data-act="close"]');
  if (xbtn) xbtn.addEventListener('click', function(e){
    e.stopPropagation();
    el.style.display = 'none';
  });

  head.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    bringFront(el);
    var r = el.getBoundingClientRect();
    var dx = e.clientX - r.left;
    var dy = e.clientY - r.top;
    function mv(ev){
      el.style.left = (ev.clientX - dx) + 'px';
      el.style.top  = (ev.clientY - dy) + 'px';
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
  });

  if (rs) rs.addEventListener('pointerdown', function(e){
    bringFront(el);
    var r = el.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    function mv(ev){
      el.style.width  = Math.max(0, sw + ev.clientX - sx) + 'px';
      el.style.height = Math.max(0, sh + ev.clientY - sy) + 'px';
      if (el.id === 'p-mini') rebuildMini();
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      if (el.id === 'p-mini') rebuildMini();
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
    e.stopPropagation();
  });
}
panelEls.forEach(makePanel);

var miniLineH = 8;

function rebuildMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;

  var body = document.getElementById('miniBody');
  var w = body.clientWidth - 16;
  if (w <= 10) return;

  var f = Math.max(2, w / 75);
  miniLineH = f * 1.35;

  miniInner.style.fontSize = f + 'px';
  miniLineEls.forEach(function(el){
    el.style.height = miniLineH + 'px';
    el.style.lineHeight = miniLineH + 'px';
  });
  syncMini();
}

function syncMini(){
  var panel = document.getElementById('p-mini');
  if (!panel || panel.style.display === 'none') return;
  if (!miniLineH) return;

  var firstCl = codeLineEls[0];
  if (!firstCl) return;

  var lineH = firstCl.getBoundingClientRect().height;
  if (!lineH) return;

  var lineTopOffset = firstCl.offsetTop;
  var sTop = codeScroll.scrollTop;
  var sH   = codeScroll.clientHeight;

  var relTop = Math.max(0, sTop - lineTopOffset);
  var firstIdx = relTop / lineH;
  var count    = sH / lineH;

  var total = 23 * miniLineH;
  var top  = firstIdx * miniLineH;
  var h    = count * miniLineH;

  if (top < 0) top = 0;
  if (top > total) top = total;
  if (top + h > total) h = total - top;
  if (h < 4) h = 4;

  miniView.style.top    = top + 'px';
  miniView.style.height = h + 'px';
}

miniBody.addEventListener('click', function(e){
  if (!miniLineH) return;
  var r = miniInner.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLineH);
  if (idx < 0) idx = 0;
  if (idx > 22) idx = 22;
  centerLine(idx + 1, true);
});

function updateMiniActive(lineNo){
  miniLineEls.forEach(function(el){
    el.classList.toggle('active', Number(el.dataset.line) === lineNo);
  });
}

function renderStack(step){
  var stack = (step && step.stack) || [];
  var key = stack.join('/');
  if (key === lastStackKey) return;
  lastStackKey = key;

  if (!stack.length){
    stackBody.innerHTML = '<span class="empty">（空）</span>';
    return;
  }
  var html = '';
  for (var k = 0; k < stack.length; k++){
    if (k > 0) html += '<span class="arr2">→</span>';
    var cls = 'frame';
    if (stack[k] === 'main') cls += ' main';
    else if (stack[k] === 'fun') cls += ' funf';
    if (k === stack.length - 1) cls += ' topF';
    var label = stack[k] === 'main' ? 'main()' : 'fun(int m)';
    html += '<span class="' + cls + '">' + label + '</span>';
  }
  stackBody.innerHTML = html;
}

function buildVarRow(name, type, value, dim, changed){
  var row = document.createElement('div');
  row.className = 'vrow' + (changed ? ' changed' : '');
  var k = document.createElement('span');
  k.className = 'vk';
  k.textContent = name;
  if (type){
    var t = document.createElement('span');
    t.className = 'vt';
    t.textContent = type;
    k.appendChild(t);
  }
  var v = document.createElement('span');
  v.className = 'vv' + (dim ? ' dim' : '');
  v.textContent = value;
  row.appendChild(k);
  row.appendChild(v);
  return row;
}

function fmtNum(v){
  if (v === null || v === undefined) return '未初始化';
  return String(v);
}

function renderVars(step, prevStep){
  if (!step){
    lastVarsKey = null;
    varsBlock.innerHTML = '';
    return;
  }
  var key = step.line + '|' + step.stack.join('/') + '|' + step.i + '|' + step.n +
            '|' + step.m + '|' + step.k + '|' + step.funRet;
  if (key === lastVarsKey) return;
  lastVarsKey = key;

  varsBlock.innerHTML = '';

  var inMain = step.stack.indexOf('main') !== -1;
  var inFun  = step.stack.indexOf('fun')  !== -1;

  /* ---- main 作用域 ---- */
  if (inMain){
    var gM = document.createElement('div');
    gM.className = 'scope-group scope-main';
    var hM = document.createElement('div');
    hM.className = 'scope-head';
    hM.innerHTML = '<span class="fname">main</span><span class="role">主函数作用域</span>';
    gM.appendChild(hM);

    var iChg = prevStep && prevStep.i !== step.i;
    gM.appendChild(buildVarRow('i', 'int', fmtNum(step.i), step.i === null, iChg));

    var nChg = prevStep && prevStep.n !== step.n;
    gM.appendChild(buildVarRow('n', 'int', fmtNum(step.n), step.n === null, nChg));

    varsBlock.appendChild(gM);
  }

  /* ---- fun 作用域 ---- */
  if (inFun){
    var gF = document.createElement('div');
    gF.className = 'scope-group scope-fun';
    var hF = document.createElement('div');
    hF.className = 'scope-head';
    hF.innerHTML = '<span class="fname">fun</span><span class="role">函数作用域（每次调用都是新的）</span>';
    gF.appendChild(hF);

    var mChg = prevStep && prevStep.m !== step.m;
    gF.appendChild(buildVarRow('m', 'int', fmtNum(step.m), step.m === null, mChg));

    var kChg = prevStep && prevStep.k !== step.k;
    gF.appendChild(buildVarRow('k', 'int', fmtNum(step.k), step.k === null, kChg));

    varsBlock.appendChild(gF);
  }

  /* 闪烁 */
  Array.prototype.slice.call(varsBlock.querySelectorAll('.vrow.changed .vv'))
    .forEach(function(el){
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    });
}

function centerLine(n, smooth){
  var el = codeInner.querySelector('.cl[data-line="' + n + '"]');
  if (!el) return;
  var target = el.offsetTop - codeScroll.clientHeight / 2 + el.offsetHeight / 2;
  if (target < 0) target = 0;
  codeScroll.scrollTo({top: target, behavior: smooth ? 'smooth' : 'auto'});
}

function renderOutput(step){
  var text = step ? step.out : '';
  var inputNote = step ? step.inputNote : null;
  var key = text + '||' + (inputNote || '');
  if (key === lastOut) return;
  lastOut = key;

  consoleBody.innerHTML = '';

  /* 输入回显（青色标记，辅助说明） */
  if (inputNote){
    var inDiv = document.createElement('div');
    inDiv.className = 'out-line';
    inDiv.style.fontSize = '.78em';
    inDiv.style.opacity = '.9';
    var im = document.createElement('span');
    im.className = 'inMark';
    im.textContent = '[in:' + inputNote + ']';
    im.title = 'scanf 输入回显，不计入 printf 输出';
    inDiv.appendChild(im);
    consoleBody.appendChild(inDiv);
  }

  if (!text){
    var cur0 = document.createElement('span');
    cur0.className = 'cursor';
    cur0.textContent = '▊';
    consoleBody.appendChild(cur0);
    return;
  }

  var parts = text.split('\n');
  parts.forEach(function(part){
    var d = document.createElement('div');
    d.className = 'out-line';
    if (part === ''){
      d.classList.add('empty');
      d.innerHTML = '&nbsp;';
    } else {
      d.textContent = part;
    }
    consoleBody.appendChild(d);
  });

  var cur = document.createElement('span');
  cur.className = 'cursor';
  cur.textContent = '▊';
  consoleBody.appendChild(cur);

  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function render(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0 ? STEPS[current - 1] : null;
  var activeLine = step ? step.line : null;

  var done = {};
  for (var k = 0; k <= current; k++){
    if (STEPS[k]) done[STEPS[k].line] = true;
  }

  codeLineEls.forEach(function(el){
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);
    el.classList.toggle('done', !!done[n] && n !== activeLine);
  });

  updateMiniActive(activeLine);
  renderStack(step);
  renderVars(step, prev);
  renderOutput(step);

  funcValEl.textContent = step ? step.func : '—';
  retValEl.textContent  = (step && step.funRet !== null) ? String(step.funRet) : '—';

  if (step){
    var cls = 'expLine';
    if (step.kind === 'pre') cls += ' pre';
    else if (step.kind === 'call') cls += ' mv';
    else if (step.kind === 'out') cls += ' gold';
    else if (step.kind === 'ret') cls += ' ret';
    else if (step.kind === 'inp') cls += ' inp';
    else if (step.kind === 'short') cls += ' short';
    else if (step.kind === 'skip') cls += ' skip';

    expText.innerHTML =
      '<span class="' + cls + '">第 ' + step.line + ' 行</span>' +
      '<strong>' + step.title + '</strong><br>' + step.desc;
    stepCounter.textContent = '步骤 ' + (current + 1) + ' / ' + STEPS.length;
  } else {
    expText.innerHTML =
      '<strong>点击「▶ 播放」或「下一步」，开始逐条执行程序。</strong><br>' +
      '本程序演示 <b>函数定义与调用</b>、<b>调用栈</b>、<b>值传递</b>、<b>&& 短路求值</b>：<br>' +
      '· <b>fun(m)</b>：素数判断函数，用 while 循环逐个试除；<br>' +
      '· <b>main</b>：for 循环 10 次，每次读入 n 并调用 fun(n)；<br>' +
      '· 本次模拟输入 <b>n = 7</b>（素数 → YES）和 <b>n = 4</b>（合数 → No!）。' +
      '<span class="tip"><b>预计输出（3 个逻辑行，含 1 个空行）：</b><br>' +
      '<code>（空行）</code><br>' +
      '<code>please enter n:YES</code><br>' +
      '<code>please enter n:No!▊</code>（末尾不换行）</span>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  if (activeLine) centerLine(activeLine, true);
  window.requestAnimationFrame(syncMini);
}

/* =====================================================================
   九、播放控制
   ===================================================================== */
function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  btnPlay.classList.toggle('playing', playing);
}

function tick(){
  if (current >= STEPS.length - 1){ pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}

function play(){
  if (playing) return;
  if (current >= STEPS.length - 1){ current = -1; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}

function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}

function nextStep(){
  pause();
  if (current < STEPS.length - 1){ current += 1; render(); }
}

function prevStep(){
  pause();
  if (current > -1){ current -= 1; render(); }
}

function resetAll(){
  pause();
  current = -1;
  lastOut = null;
  lastVarsKey = null;
  lastStackKey = null;
  consoleBody.innerHTML = '';
  codeScroll.scrollTop = 0;
  render();
  window.requestAnimationFrame(function(){
    codeScroll.scrollTop = 0;
    syncMini();
  });
}

btnPlay.addEventListener('click', function(){ if (playing) pause(); else play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

function updateSpeedLabel(){
  speedLbl.textContent = (speed / 1000).toFixed(1) + 's';
}
speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  updateSpeedLabel();
  if (playing){
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

btnFs.addEventListener('click', function(){
  if (!document.fullscreenElement){
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});

btnPanels.addEventListener('click', function(){
  var anyVisible = panelEls.some(function(p){ return p.style.display !== 'none'; });
  panelEls.forEach(function(p){
    p.style.display = anyVisible ? 'none' : '';
    if (!anyVisible) p.classList.remove('collapsed');
  });
  if (!anyVisible) rebuildMini();
});

btnMini.addEventListener('click', function(){
  var m = document.getElementById('p-mini');
  var hidden = (m.style.display === 'none');
  m.style.display = hidden ? '' : 'none';
  if (hidden) rebuildMini();
});

btnLayout.addEventListener('click', function(){
  panelEls.forEach(function(p){
    p.style.display = '';
    p.classList.remove('collapsed');
  });
  applyDefaultLayout();
  render();
});

/* =====================================================================
   十、全局快捷键
   ===================================================================== */
document.addEventListener('keydown', function(e){
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;

  if (e.code === 'Space'){ e.preventDefault(); if (playing) pause(); else play(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR'){ e.preventDefault(); resetAll(); }
  else if (e.code === 'KeyF'){ e.preventDefault(); btnFs.click(); }
  else if (e.code === 'KeyM'){ e.preventDefault(); btnMini.click(); }
  else if (e.code === 'KeyH'){ e.preventDefault(); btnPanels.click(); }
});

/* =====================================================================
   十一、滚动同步
   ===================================================================== */
var rafPending = false;
function scheduleSync(){
  if (rafPending) return;
  rafPending = true;
  window.requestAnimationFrame(function(){
    rafPending = false;
    syncMini();
  });
}

codeScroll.addEventListener('scroll', scheduleSync, {passive:true});
window.addEventListener('resize', function(){
  rebuildMini();
  scheduleSync();
});
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ rebuildMini(); syncMini(); });
}

/* =====================================================================
   十二、启动
   ===================================================================== */
applyDefaultLayout();
updateSpeedLabel();
render();
window.requestAnimationFrame(function(){
  rebuildMini();
  syncMini();
});
window.setTimeout(function(){ rebuildMini(); syncMini(); }, 300);

})();
</script>
</body>
</html>
