<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 字符指针与字符串常量 · p = c 与 p = "How are you"</title>
<style>
  :root{
    --code-font: clamp(80px, 4.3vw, 110px);
    --out-font: clamp(72px, 3.9vw, 100px);
    --var-font: clamp(40px, 2.1vw, 54px);
    --explain-font: clamp(48px, 2.5vw, 64px);
    --btn-font: clamp(40px, 2vw, 52px);

    --bg:#0d1117;
    --panel-bg:rgba(14,22,36,.86);
    --border:#20344f;
    --text:#dce8f8;
    --muted:#8aa0bd;
    --accent:#38bdf8;
    --green:#4ade80;
    --amber:#fbbf24;
    --pink:#f472b6;
    --purple:#c084fc;
    --teal:#2dd4bf;
    --orange:#fb923c;
    --gold:#facc15;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }

  /* ============ 全屏代码区 ============ */
  #codeArea{
    position:fixed;inset:0;z-index:1;overflow:auto;background:#0d1117;
    font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    font-size:var(--code-font);
    line-height:1.26;
    padding:20px 40px 40px 20px;
    white-space:pre;
    scrollbar-width:thin;scrollbar-color:#2c3f5e transparent;
  }
  #codeArea::-webkit-scrollbar{width:16px;height:16px;}
  #codeArea::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}

  .code-line{
    display:flex;align-items:flex-start;gap:.5em;
    padding:.06em 1.2em .06em .2em;
    border-left:.14em solid transparent;
    transition:background .3s,border-color .3s,opacity .3s;
  }
  .code-line .ln{
    flex:0 0 auto;width:2.3ch;text-align:right;color:#3f5a7d;
    user-select:none;font-variant-numeric:tabular-nums;
  }
  .code-line .src{flex:0 0 auto;white-space:pre;}
  .code-line.pending{opacity:.34;}
  .code-line.active{
    background:linear-gradient(90deg,rgba(56,189,248,.28),rgba(56,189,248,.02));
    border-left-color:var(--accent);
    box-shadow:inset 0 0 0 2px rgba(56,189,248,.25);
    opacity:1;
  }
  .code-line.active .ln{color:var(--accent);font-weight:700;}
  .code-line.active .src{color:#ffffff;}
  .code-line.done{opacity:.62;}

  .pp{color:#c084fc;font-weight:700;}
  .str{color:#4ade80;}
  .cmt{color:#5f7796;font-style:italic;}
  .fn{color:#38bdf8;}
  .kw{color:#f472b6;font-weight:700;}
  .num{color:#fbbf24;}
  .op{color:#fb923c;font-weight:700;}
  .hr-key{color:#2dd4bf;font-weight:700;}
  .hr-star{color:#c084fc;font-weight:800;}
  .hr-arr{color:#facc15;font-weight:800;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;}
  .hr-main{color:#22d3ee;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;}
  .hr-block{color:#f472b6;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;}

  /* ============ 面板通用 ============ */
  .panel{
    position:fixed;z-index:100;display:flex;flex-direction:column;
    background:var(--panel-bg);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:3px solid var(--border);border-radius:20px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    color:var(--text);overflow:hidden;
    transition:border-color .2s,box-shadow .2s,opacity .2s;
  }
  .panel.top{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(56,189,248,.3),0 24px 60px rgba(0,0,0,.7);
  }
  .panel.hidden{display:none;}

  .panel-head{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:10px 16px;cursor:move;user-select:none;
    background:linear-gradient(180deg,rgba(56,189,248,.16),rgba(56,189,248,.03));
    border-bottom:2px solid var(--border);
    font-size:var(--var-font);font-weight:800;letter-spacing:.02em;
  }
  .panel-head .ttl{color:#eaf3ff;white-space:nowrap;}
  .panel-head .sub{color:var(--muted);font-size:.72em;font-weight:600;}

  .panel-btn{
    flex:0 0 auto;min-width:64px;min-height:64px;
    display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--btn-font) * .85);line-height:1;
    border-radius:14px;border:2px solid var(--border);
    background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .panel-btn:hover{background:rgba(56,189,248,.28);border-color:var(--accent);}
  .panel-close{margin-left:auto;}

  .panel-body{
    flex:1 1 auto;min-height:0;overflow:auto;padding:14px 16px;
    scrollbar-width:thin;scrollbar-color:#334155 transparent;
  }
  .panel-body::-webkit-scrollbar{width:12px;height:12px;}
  .panel-body::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:8px;}

  .rz{
    position:absolute;right:0;bottom:0;width:56px;height:56px;
    cursor:nwse-resize;z-index:20;
    background:linear-gradient(135deg,transparent 48%,rgba(56,189,248,.85) 50%,rgba(56,189,248,.85) 62%,transparent 64%,
                                transparent 74%,rgba(56,189,248,.5) 76%,rgba(56,189,248,.5) 88%,transparent 90%);
  }
  .rz:hover{background-color:rgba(56,189,248,.18);}

  /* ============ 顶部控制栏 ============ */
  #panelCtrl{padding:0;border-radius:22px;}
  #panelCtrl .ctrl-row{
    display:flex;align-items:center;gap:16px;padding:14px 18px;flex-wrap:wrap;
  }
  .btn{
    font:inherit;font-size:var(--btn-font);font-weight:700;
    min-height:76px;padding:0 26px;border-radius:16px;
    border:3px solid var(--border);background:rgba(255,255,255,.07);
    color:var(--text);cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,transform .1s;
  }
  .btn:hover:not(:disabled){background:rgba(56,189,248,.3);border-color:var(--accent);}
  .btn:active:not(:disabled){transform:translateY(2px);}
  .btn:disabled{opacity:.3;cursor:not-allowed;}
  .btn.primary{
    background:linear-gradient(180deg,#0ea5e9,#0284c7);
    border-color:#38bdf8;color:#04121f;
  }
  .btn.primary.playing{
    background:linear-gradient(180deg,#f59e0b,#d97706);
    border-color:#fbbf24;color:#1a1200;
  }
  .speed-wrap{
    display:flex;align-items:center;gap:14px;
    font-size:var(--btn-font);color:var(--muted);font-weight:700;
  }
  .speed-wrap input[type=range]{
    width:260px;height:28px;accent-color:var(--accent);cursor:pointer;
  }
  .speed-wrap b{color:var(--accent);min-width:4.4em;display:inline-block;font-variant-numeric:tabular-nums;}

  /* ============ 变量面板 ============ */
  .stack-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .stack-cap{color:var(--muted);font-size:.82em;font-weight:700;flex:0 0 auto;}
  .frames{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .frame-card{
    font-family:ui-monospace,Consolas,monospace;font-weight:800;
    font-size:.86em;padding:.14em .6em;border-radius:12px;
    background:#0b1526;border:2px solid #1b293f;color:#8aa2c0;
  }
  .frame-card.top-frame{
    border-color:var(--accent);background:rgba(56,189,248,.24);color:#fff;
    box-shadow:0 0 0 3px rgba(56,189,248,.35);
    animation:popIn .35s ease-out;
  }
  @keyframes popIn{0%{transform:scale(.6);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
  .arrow{color:#3f5a7d;font-weight:800;font-size:.86em;}
  .stack-empty{color:#4c6689;font-family:ui-monospace,monospace;font-size:.86em;}

  .vrow{
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:.2em .7em;border-radius:12px;margin-bottom:6px;
    background:rgba(255,255,255,.045);border:2px solid #1b293f;
    font-size:.9em;
  }
  .vrow .n{color:var(--muted);font-weight:700;white-space:nowrap;flex:0 0 auto;}
  .vrow .v{
    font-family:ui-monospace,Consolas,monospace;font-weight:800;
    color:var(--accent);text-align:right;word-break:break-word;
  }
  .vrow.wrap .v{text-align:left;font-size:.92em;line-height:1.4;}
  .vrow.k-main{border-left:10px solid rgba(34,211,238,.85);}
  .vrow.k-main .v{color:#22d3ee;}
  .vrow.k-block{border-left:10px solid rgba(192,132,252,.85);}
  .vrow.k-block .v{color:var(--purple);}
  .vrow.k-gold{border-left:10px solid rgba(250,204,21,.9);}
  .vrow.k-gold .v{color:var(--gold);}
  .vrow.k-ctx{border-left:10px solid rgba(74,222,128,.85);}
  .vrow.k-ctx .v{color:var(--green);}
  .vrow.k-val{border-left:10px solid rgba(244,114,182,.85);}
  .vrow.k-val .v{color:var(--pink);}
  .vrow.k-sw{border-left:10px solid rgba(45,212,191,.9);}
  .vrow.k-sw .v{color:var(--teal);}
  .vrow.k-cnt{border-left:10px solid rgba(251,191,36,.6);}
  .vrow.k-cnt .v{color:var(--amber);}
  .vrow .v.dim{color:#5f7796;font-weight:600;}
  .vrow.changed{background:rgba(56,189,248,.18);border-color:rgba(56,189,248,.8);}
  @keyframes flash{0%{transform:scale(1);}35%{transform:scale(1.18);color:#fff;text-shadow:0 0 18px var(--accent);}100%{transform:scale(1);}}
  .vrow .v.flash{animation:flash .5s ease-out;}

  .group-title{
    margin:14px 0 8px;font-size:.82em;font-weight:800;letter-spacing:.06em;
    color:#93a9c6;border-bottom:2px dashed #26384f;padding-bottom:4px;
  }
  .group-title:first-child{margin-top:0;}

  /* ============ 内存卡片 ============ */
  #memCells{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .mem-empty{color:#4c6689;font-family:ui-monospace,monospace;font-size:.9em;}
  .mem-cell{
    display:flex;flex-direction:column;gap:.2em;
    min-width:7em;max-width:18em;padding:.35em .6em .45em;
    border-radius:14px;background:#0b1526;border:4px solid #1b293f;
    font-family:ui-monospace,Consolas,monospace;
    transition:background .25s,border-color .25s,box-shadow .25s;
  }
  .mem-cell.main-scope{border-color:#164e63;}
  .mem-cell.block-scope{border-color:#581c87;}
  .mem-cell.rodata{border-color:#78350f;}
  .mem-cell.is-active.main-scope{
    border-color:var(--teal);background:rgba(45,212,191,.18);
    box-shadow:0 0 0 4px rgba(45,212,191,.3);
  }
  .mem-cell.is-active.block-scope{
    border-color:var(--purple);background:rgba(192,132,252,.18);
    box-shadow:0 0 0 4px rgba(192,132,252,.3);
  }
  .mem-cell.is-active.rodata{
    border-color:var(--gold);background:rgba(250,204,21,.18);
    box-shadow:0 0 0 4px rgba(250,204,21,.3);
  }
  @keyframes cellPulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.14);background:rgba(56,189,248,.45);box-shadow:0 0 0 12px rgba(56,189,248,.35);}
    100%{transform:scale(1);}
  }
  .mem-cell.pulse{animation:cellPulse .7s ease-out;}
  .mem-head{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap;}
  .mem-name{font-size:.9em;font-weight:900;color:#e2edff;}
  .mem-scope{
    font-size:.56em;color:#93a9c6;border:2px solid #22334d;
    border-radius:.35rem;padding:0 .35em;line-height:1.3;font-weight:800;
  }
  .mem-scope.main{color:#22d3ee;border-color:#164e63;}
  .mem-scope.block{color:#c084fc;border-color:#581c87;}
  .mem-scope.rodata{color:var(--gold);border-color:#78350f;}
  .mem-addr{font-size:.6em;color:#4c6689;font-weight:700;}
  .mem-val{
    font-size:.8em;font-weight:900;color:#9fb6d2;
    text-align:center;word-break:break-all;line-height:1.4;
  }
  .mem-cell.main-scope .mem-val{color:#22d3ee;}
  .mem-cell.block-scope .mem-val{color:var(--purple);}
  .mem-cell.rodata .mem-val{color:var(--gold);}
  .mem-cell.pointer .mem-val{color:var(--gold);}
  .mem-legend{
    margin-top:14px;font-size:.72em;color:var(--muted);font-weight:700;
    display:flex;gap:22px;flex-wrap:wrap;
  }
  .mem-legend i{display:inline-block;width:.9em;height:.9em;border-radius:5px;margin-right:.35em;vertical-align:-2px;}

  /* ============ 字符网格（字符数组 + 字符串常量） ============ */
  #gridView{display:flex;flex-direction:column;gap:.8em;}
  .grid-empty{color:#4c6689;font-family:ui-monospace,monospace;font-size:.9em;}
  .grid-block{
    display:flex;flex-direction:column;gap:.32em;padding:.5em .65em .6em;
    background:rgba(255,255,255,.03);border-radius:14px;border:2px solid #1b293f;
  }
  .grid-block.main-scope{border-color:#164e63;}
  .grid-block.block-scope{border-color:#581c87;}
  .grid-block.rodata{border-color:#78350f;}
  .grid-head{display:flex;align-items:baseline;gap:.7em;flex-wrap:wrap;}
  .grid-name{font-size:.86em;font-weight:900;color:#e2edff;font-family:ui-monospace,Consolas,monospace;}
  .grid-name.rodata-name{color:var(--green);}
  .grid-scope{
    font-size:.58em;border:2px solid #22334d;border-radius:.35rem;
    padding:0 .35rem;font-weight:800;color:#93a9c6;
  }
  .grid-scope.main{color:#22d3ee;border-color:#164e63;}
  .grid-scope.block{color:#c084fc;border-color:#581c87;}
  .grid-scope.rodata{color:var(--gold);border-color:#78350f;}
  .grid-type{font-size:.62em;color:#4c6689;font-weight:700;}
  .grid-cells{display:flex;gap:.22em;flex-wrap:wrap;}
  .grid-cell{
    display:flex;flex-direction:column;align-items:center;
    min-width:2em;padding:.14em .28em .2em;
    border-radius:9px;background:#0b1526;border:2px solid #1b293f;
    font-family:ui-monospace,Consolas,monospace;
    transition:background .25s,border-color .25s,box-shadow .25s;
  }
  .grid-idx{font-size:.55em;color:#4c6689;line-height:1.2;font-weight:700;}
  .grid-val{font-size:.85em;font-weight:900;color:#c8d7ec;line-height:1.15;}
  .grid-block.rodata .grid-cell{background:#0b1a16;border-color:#1e4034;}
  .grid-block.rodata .grid-val{color:#86efac;}
  .grid-block.rodata .grid-idx{color:#3d7a5f;}
  .grid-cell.is-null .grid-val{color:#7dd3fc;font-weight:900;}
  .grid-cell.is-mark{
    border-color:var(--pink);background:rgba(244,114,182,.26);
    box-shadow:0 0 0 4px rgba(244,114,182,.3);
  }
  .grid-cell.is-mark .grid-val,
  .grid-cell.is-mark .grid-idx{color:var(--pink);}
  .grid-cell.pulse{animation:cellPulse .7s ease-out;}

  /* ============ 输出面板 ============ */
  .out-note{
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:var(--out-font);font-weight:800;color:#fbbf24;
    white-space:pre-wrap;line-height:1.45;word-break:break-word;
    animation:fadeInLine .5s ease-out;
  }
  .out-sub{
    font-family:ui-monospace,Consolas,"Courier New",monospace;
    font-size:calc(var(--out-font) * .78);font-weight:800;color:#86efac;
    white-space:pre-wrap;line-height:1.5;margin-top:.4em;
    animation:fadeInLine .6s ease-out;
  }
  @keyframes fadeInLine{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ============ 说明条 ============ */
  #explainBox{font-size:var(--explain-font);line-height:1.5;color:#c3d4ea;}
  #explainBox .tag{
    display:inline-block;margin-right:14px;padding:.08em .7em;border-radius:12px;
    background:rgba(56,189,248,.24);color:var(--accent);font-weight:900;
    font-size:.78em;vertical-align:middle;
  }
  #explainBox .tag.mv{background:rgba(244,114,182,.26);color:var(--pink);}
  #explainBox .tag.gold{background:rgba(250,204,21,.28);color:var(--gold);}
  #explainBox strong{color:#ffffff;}
  #explainBox code{
    font-family:ui-monospace,Consolas,monospace;
    background:rgba(148,163,184,.18);border-radius:8px;padding:0 .3em;color:#e2e8f0;
  }
  #explainBox .tip{
    display:block;margin-top:.5em;padding:.45em .7em;border-radius:12px;
    background:rgba(45,212,191,.14);border-left:8px solid var(--teal);color:#c6f7ef;
    font-size:.9em;
  }
  #explainBox .warn{
    display:block;margin-top:.5em;padding:.45em .7em;border-radius:12px;
    background:rgba(251,191,36,.14);border-left:8px solid var(--amber);color:#ffe6b0;
    font-size:.9em;
  }
  #explainBox .win{
    display:block;margin-top:.5em;padding:.45em .7em;border-radius:12px;
    background:rgba(250,204,21,.16);border-left:8px solid var(--gold);color:#fff3c4;
    font-size:.92em;font-weight:700;
  }

  /* ============ 缩略图 ============ */
  #panelMini{padding:0;}
  #miniScroll{
    flex:1 1 auto;min-height:0;overflow:hidden;position:relative;
    background:rgba(5,10,18,.65);cursor:pointer;
  }
  #miniInner{
    position:absolute;left:0;top:0;width:100%;
    font-family:ui-monospace,Consolas,monospace;
    font-size:6.5px;line-height:1.42;
    white-space:pre;color:#8fa6c4;
    padding:4px 6px;
  }
  #miniInner .code-line{padding:0;border-left:none;gap:2px;display:block;}
  #miniInner .code-line .ln{display:none;}
  #miniInner .code-line .src{white-space:pre;}
  #miniInner .code-line.active{
    background:rgba(56,189,248,.6);outline:1px solid #38bdf8;
  }
  #miniInner .code-line.pending{opacity:.4;}
  #miniViewport{
    position:absolute;left:0;width:100%;pointer-events:none;
    border:2px solid rgba(56,189,248,.9);border-radius:3px;
    background:rgba(56,189,248,.12);
    box-shadow:0 0 12px rgba(56,189,248,.5);
    display:none;
  }

  @media (max-width:900px){
    :root{
      --code-font: clamp(24px, 6vw, 48px);
      --out-font: clamp(22px, 5vw, 40px);
      --var-font: clamp(14px, 3vw, 22px);
      --explain-font: clamp(15px, 3.2vw, 24px);
      --btn-font: clamp(14px, 3vw, 22px);
    }
  }
</style>
</head>
<body>

<div id="codeArea"></div>

<div class="panel" id="panelCtrl">
  <div class="ctrl-row">
    <button class="btn primary" id="btnPlay">▶ 自动播放</button>
    <button class="btn" id="btnPrev">◀ 上一步</button>
    <button class="btn" id="btnNext">下一步 ▶</button>
    <button class="btn" id="btnReset">⟲ 重置</button>
    <div class="speed-wrap">
      <span>速度</span>
      <input type="range" id="speed" min="120" max="2600" step="40" value="640">
      <b id="speedLabel">0.64s</b>
    </div>
    <button class="btn" id="btnFull">⛶ 全屏</button>
    <button class="btn" id="btnPanels">▣ 面板</button>
    <button class="btn" id="btnMini">▤ 缩略图</button>
    <button class="btn" id="btnLayout">↺ 重置布局</button>
    <span id="stepCounter" style="font-size:var(--btn-font);font-weight:800;color:var(--accent);margin-left:auto;white-space:nowrap;">步骤 — / —</span>
    <button class="panel-btn panel-close" id="closeCtrl">✕</button>
  </div>
  <div class="rz" data-rz></div>
</div>

<div class="panel" id="panelVars">
  <div class="panel-head">
    <span class="ttl">作用域栈 · 变量 · 状态</span>
    <span class="sub" id="depthBadge">作用域 0 层</span>
    <button class="panel-btn panel-close" data-close="panelVars">✕</button>
  </div>
  <div class="panel-body" id="varsBody"></div>
  <div class="rz" data-rz></div>
</div>

<div class="panel" id="panelMem">
  <div class="panel-head">
    <span class="ttl">内存模型</span>
    <span class="sub">栈 + 只读数据段 · 变量 · 地址 · 内容</span>
    <button class="panel-btn panel-close" data-close="panelMem">✕</button>
  </div>
  <div class="panel-body">
    <div id="memCells"></div>
    <div class="mem-legend">
      <span><i style="background:#22d3ee;"></i>main 作用域</span>
      <span><i style="background:#c084fc;"></i>内层块作用域</span>
      <span><i style="background:#facc15;"></i>只读段 / 指针</span>
    </div>
  </div>
  <div class="rz" data-rz></div>
</div>

<div class="panel" id="panelGrid">
  <div class="panel-head">

<script>
(function(){
'use strict';

/* ============================================================
   1. 源代码（15 行）
   ============================================================ */
var SRC_HTML = [
/*  1 */ '<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span> <span class="cmt">// 预处理：包含头文件（本程序未用到 printf）</span>',
/*  2 */ '<span class="kw">int</span> <span class="fn">main</span>() { <span class="cmt">// 主函数：程序入口</span>',
/*  3 */ '    <span class="kw">char</span> <span class="hr-star">*</span><span class="hr-main">p</span>, <span class="hr-main">c</span>[<span class="num">8</span>]; <span class="cmt">// 定义字符串指针 p 和字符数组 c（8 字节）</span>',
/*  4 */ '    <span class="hr-main">p</span> <span class="op">=</span> <span class="hr-arr">c</span>; <span class="cmt">// 数组名 c 退化为 &amp;c[0]（类型 char *）</span>',
/*  5 */ '    <span class="cmt">// 写为一行：</span>',
/*  6 */ '    <span class="hr-block">{</span> <span class="cmt">// 开新作用域①，避免与外层 p、c 重复定义</span>',
/*  7 */ '        <span class="kw">char</span> <span class="hr-block">c</span>[<span class="num">8</span>], <span class="hr-star">*</span><span class="hr-block">p</span> <span class="op">=</span> <span class="hr-arr">c</span>; <span class="cmt">// 块1 内数组遮蔽外层；* 只作用于 p</span>',
/*  8 */ '    <span class="hr-block">}</span> <span class="cmt">// 代码块①结束，块1 内 c、p 全部销毁</span>',
/*  9 */ '    <span class="cmt">// 指向字符串常量：</span>',
/* 10 */ '    <span class="hr-block">{</span> <span class="cmt">// 开新作用域②</span>',
/* 11 */ '        <span class="kw">char</span> <span class="hr-star">*</span><span class="hr-block">p</span> <span class="op">=</span> <span class="str">"How are you"</span>; <span class="cmt">// p 指向只读段的字符串常量（12 字节）</span>',
/* 12 */ '        <span class="kw">char</span> <span class="hr-star">*</span><span class="hr-block">q</span> <span class="op">=</span> <span class="str">"Nice to meet you"</span>; <span class="cmt">// q 指向另一个字符串常量（17 字节）</span>',
/* 13 */ '    <span class="hr-block">}</span> <span class="cmt">// 代码块②结束，指针变量销毁，字符串常量仍留在只读段</span>',
/* 14 */ '    <span class="kw">return</span> <span class="hr-key">0</span>; <span class="cmt">// 返回 0 给操作系统（不打印）</span>',
/* 15 */ '}'
];

var TOTAL_LINES = 15;

/* ============================================================
   2. 构建逐步执行轨迹
   ============================================================ */
var STEPS = [];

function buildSteps(){
  var steps = [];
  var scopeStack = [];

  /* 栈上变量状态 */
  var V = {
    mainP: { decl:false, scope:'main',  type:'char *',   size:8, addr:'0x7FFD2000',
             ptr:null, ptrName:null },
    mainC: { decl:false, scope:'main',  type:'char[8]',  size:8, addr:'0x7FFD2008',
             chars:null },
    b1C:   { decl:false, scope:'block1', type:'char[8]', size:8, addr:'0x7FFD1F00',
             chars:null },
    b1P:   { decl:false, scope:'block1', type:'char *',  size:8, addr:'0x7FFD1F08',
             ptr:null, ptrName:null },
    b2P:   { decl:false, scope:'block2', type:'char *',  size:8, addr:'0x7FFD1EE0',
             ptr:null, ptrName:null },
    b2Q:   { decl:false, scope:'block2', type:'char *',  size:8, addr:'0x7FFD1EE8',
             ptr:null, ptrName:null }
  };

  /* 只读段的字符串常量 */
  var LIT1 = { text:'How are you',        addr:'0x402000', bytes:12 };
  var LIT2 = { text:'Nice to meet you',   addr:'0x402010', bytes:17 };

  function fmtPtr(m){
    if(!m.decl) return '—';
    if(m.ptr) return m.ptr + ' → ' + m.ptrName;
    return '未初始化（野指针）';
  }
  function fmtRow(m, isMain){
    if(!m.decl) return isMain ? '尚未声明' : '不在作用域内';
    if(m.type.indexOf('[') >= 0) return m.type + '（' + m.size + ' 字节）· 未初始化';
    return fmtPtr(m);
  }

  function makeMem(hlKey, pulseKey){
    var list = [
      ['mainP','p','main','main'],
      ['mainC','c','main','main'],
      ['b1C','c','block1','块1'],
      ['b1P','p','block1','块1'],
      ['b2P','p','block2','块2'],
      ['b2Q','q','block2','块2']
    ];
    var out = [];
    for(var i=0;i<list.length;i++){
      var k = list[i][0], m = V[k];
      if(!m.decl) continue;
      var isPtr = (m.type.indexOf('*') >= 0);
      out.push({
        key: k,
        name: list[i][1],
        scope: list[i][3],
        scopeCls: (m.scope === 'main' ? 'main' : 'block'),
        type: m.type,
        addr: m.addr,
        size: m.size,
        content: (m.type.indexOf('[') >= 0) ? '8 字节 · 未初始化' : fmtPtr(m),
        pointer: isPtr,
        active: (k === hlKey),
        pulse:  (k === pulseKey)
      });
    }
    /* 只读段：当 block2 被引用后出现 */
    if(V.b2P.decl){
      out.push({
        key: 'lit1',
        name: '"How are you"',
        scope: '只读段',
        scopeCls: 'rodata',
        type: 'char[12]',
        addr: LIT1.addr,
        size: LIT1.bytes,
        content: '11 字符 + \\0（只读）',
        pointer: false,
        active: (hlKey === 'lit1'),
        pulse:  (pulseKey === 'lit1')
      });
    }
    if(V.b2Q.decl){
      out.push({
        key: 'lit2',
        name: '"Nice to meet you"',
        scope: '只读段',
        scopeCls: 'rodata',
        type: 'char[17]',
        addr: LIT2.addr,
        size: LIT2.bytes,
        content: '16 字符 + \\0（只读）',
        pointer: false,
        active: (hlKey === 'lit2'),
        pulse:  (pulseKey === 'lit2')
      });
    }
    return out;
  }

  /* 字符网格 */
  function strCells(s, markFirst, pulse){
    var out = [];
    for(var i=0;i<s.length;i++){
      var ch = s[i];
      out.push({
        idx: String(i),
        ch: (ch === ' ') ? '␣' : ch,
        isNull: false,
        isMark: markFirst && i === 0,
        pulse: pulse && markFirst && i === 0
      });
    }
    out.push({
      idx: String(s.length),
      ch: '\\0',
      isNull: true,
      isMark: false,
      pulse: false
    });
    return out;
  }

  function uninitCells(n){
    var out = [];
    for(var i=0;i<n;i++) out.push({ idx:String(i), ch:'?', isNull:false, isMark:false, pulse:false });
    return out;
  }

  function makeGrids(hl, pulse){
    var grids = [];

    function pushStackArr(key, label, scope, scopeCls, base, size, markFirst, pulseFirst){
      if(!V[key].decl) return;
      var cells = uninitCells(size);
      if(markFirst && cells.length > 0){
        cells[0].isMark = true;
        cells[0].pulse = pulseFirst;
      }
      grids.push({
        key: key,
        label: label,
        scope: scope,
        scopeCls: scopeCls,
        base: base,
        type: 'char[' + size + ']',
        isLit: false,
        cells: cells
      });
    }

    pushStackArr('mainC', 'c · main', '栈', 'main', V.mainC.addr, 8,
                 V.mainP.ptr === V.mainC.addr, hl === 'mainC' || pulse === 'mainC');
    pushStackArr('b1C', 'c · 块1', '栈', 'block', V.b1C.addr, 8,
                 V.b1P.ptr === V.b1C.addr, hl === 'b1C' || pulse === 'b1C');

    if(V.b2P.decl){
      grids.push({
        key: 'lit1',
        label: '"How are you" · 只读数据段',
        scope: '只读段',
        scopeCls: 'rodata',
        base: LIT1.addr,
        type: 'char[12]',
        isLit: true,
        cells: strCells(LIT1.text, V.b2P.ptr === LIT1.addr, hl === 'lit1' || pulse === 'lit1')
      });
    }
    if(V.b2Q.decl){
      grids.push({
        key: 'lit2',
        label: '"Nice to meet you" · 只读数据段',
        scope: '只读段',
        scopeCls: 'rodata',
        base: LIT2.addr,
        type: 'char[17]',
        isLit: true,
        cells: strCells(LIT2.text, V.b2Q.ptr === LIT2.addr, hl === 'lit2' || pulse === 'lit2')
      });
    }
    return grids;
  }

  var outText = '';

  function snap(o){
    steps.push({
      line: o.line,
      cls: o.cls || 'ans',
      ctx: o.ctx || '—',
      expr: o.expr || '—',
      exprVal: o.exprVal || '—',
      note: o.note || '—',
      title: o.title || '—',
      desc: o.desc || '',
      func: o.func || '—',
      scopeStack: scopeStack.slice(),
      cells: makeMem(o.hl, o.pulse),
      grids: makeGrids(o.hl, o.pulse),
      vars: {
        mainP: fmtRow(V.mainP, true),
        mainC: fmtRow(V.mainC, true),
        b1C:   fmtRow(V.b1C, false),
        b1P:   fmtRow(V.b1P, false),
        b2P:   fmtRow(V.b2P, false),
        b2Q:   fmtRow(V.b2Q, false)
      },
      printfCount: 0,
      outLines: 0,
      ret: o.ret,
      out: outText
    });
  }

  /* ================= 第 1 行：预处理 ================= */
  snap({
    line: 1, func:'—',
    ctx:'预处理阶段 · 第 1 行',
    expr:'#include <stdio.h>',
    exprVal:'把 stdio.h 的内容插入本文件（编译前由预处理器处理）',
    note:'预处理指令，不产生任何运行代码',
    title:'#include &lt;stdio.h&gt;　预处理指令',
    desc:'以 <code>#</code> 开头的都是<b>预处理指令</b>，在编译之前由预处理器处理。<br>' +
         '· 它<b>不是</b> C 语句，<b>不占运行时间，也不产生任何机器指令</b>；<br>' +
         '· 本程序<b>并没有用到 printf</b>，这一行其实可以省略，保留它只是为了保持标准写法。' +
         '<span class="tip"><b>本次模拟预测：</b>本程序不做任何计算、<b>也没有任何输出语句</b>，' +
         '运行时屏幕将保持空白，程序退出码为 <b>0</b>。<br>' +
         '观察重点有四个：<br>' +
         '① <b>字符数组 c[8]</b> 是栈上的可写内存，共 8 字节；<br>' +
         '② <b>字符串常量</b> 放在<b>只读数据段 .rodata</b>，不是栈，生存期是整段程序；<br>' +
         '③ <code>p = c;</code> 中数组名 c 退化为 <code>&amp;c[0]</code>，类型正是 <code>char *</code>；<br>' +
         '④ 指针既能指向栈数组，也能指向只读段字符串——但后者<b>不能修改内容</b>。</span>'
  });

  /* ================= 第 2 行：进入 main ================= */
  scopeStack.push('main');
  snap({
    line: 2, func:'main', cls:'gold',
    ctx:'main · 程序入口 · 第 2 行',
    expr:'int main() {',
    exprVal:'为 main 建立栈帧，作用域入栈（作用域栈深度 1）',
    note:'main 栈帧建立，准备存放局部变量',
    title:'int main() {　程序从这里开始',
    desc:'操作系统调用 <code>main</code>，程序正式开始执行。<br>' +
         '· 系统为 main 建立一个<b>栈帧</b>，用来存放它的局部变量；<br>' +
         '· 栈帧里接下来会分配一个字符指针 <code>p</code>（8 字节）和一个字符数组 <code>c[8]</code>（8 字节）；<br>' +
         '· 后面的语句大多是<b>声明</b>，只是向编译器申请内存，本身不做任何计算。' +
         '<span class="tip"><b>作用域栈：</b>main（深度 1）</span>'
  });

  /* ================= 第 3 行：char *p, c[8]; ================= */
  V.mainP.decl = true;
  V.mainC.decl = true;
  V.mainC.chars = uninitCells(8);
  snap({
    line: 3, func:'main', hl:'mainP', pulse:'mainP', cls:'ans',
    ctx:'main · 声明指针 p 与字符数组 c · 第 3 行',
    expr:'char *p, c[8];',
    exprVal:'p 在 0x7FFD2000（8 字节），c[8] 在 0x7FFD2008（8 字节）',
    note:'p 是野指针，c 的 8 个字节都是垃圾值',
    title:'char *p, c[8];　→　分配字符指针 p 和字符数组 c',
    desc:'声明两个变量：<br>' +
         '· <code>char *p</code>：<b>p 是一个指针变量</b>，占 8 字节，' +
         '假设地址 <code>0x7FFD2000</code>；它用来存放字符的地址；<br>' +
         '· <code>char c[8]</code>：<b>c 是一个字符数组</b>，连续 <b>8 字节</b>，' +
         '假设起始地址 <code>0x7FFD2008</code>；<br>' +
         '· 两者都<b>没有初始化</b>：p 里是垃圾地址（野指针），' +
         'c 的 8 个字节是栈上的垃圾字符。' +
         '<span class="warn"><b>易错点：</b><code>char *p, c[8];</code> 中，' +
         '<b>*</b> 只作用于紧跟其后的 <code>p</code>；<br>' +
         '<code>c</code> 并不是「指向 char 的指针」，而是一个真正的字符数组，' +
         '<code>sizeof(c)</code> = 8。<br>' +
         '写成 <code>char *p, *c[8];</code> 才是「p 是指针，c 是 8 个指针的数组」。</span>'
  });

  /* ================= 第 4 行：p = c; ================= */
  V.mainP.ptr = V.mainC.addr;
  V.mainP.ptrName = 'c[0]';
  snap({
    line: 4, func:'main', hl:'mainP', pulse:'mainP', cls:'mv',
    ctx:'main · 字符数组名退化为首元素地址 · 第 4 行',
    expr:'p = c;',
    exprVal:'c 退化为 &c[0] = 0x7FFD2008，类型 char *，写入 main.p',
    note:'main.p 现在指向 main.c[0]，*p 与 c[0] 是同一块内存',
    title:'p = c;　→　数组名 c 退化为 &amp;c[0]，地址存进 p',
    desc:'执行赋值语句 <code>p = c;</code>：<br>' +
         '· 在 C 中，数组名 <code>c</code> 出现在表达式里时会<b>自动退化</b>为指向首元素的指针，' +
         '也就是 <code>&amp;c[0]</code>；<br>' +
         '· <code>&amp;c[0]</code> 的类型是 <code>char *</code>，值就是数组首地址 ' +
         '<code>0x7FFD2008</code>；<br>' +
         '· 把这个地址写入 p 所占的 8 字节内存；<br>' +
         '· 从此 <b>p 指向 c[0]</b>：<code>*p</code> 就是 <code>c[0]</code>，' +
         '<code>p[i]</code> 就是 <code>c[i]</code>；<br>' +
         '· <code>p + 1</code> 前进 <b>sizeof(char) = 1</b> 字节，指向 <code>c[1]</code>。' +
         '<span class="tip"><b>三条等价写法：</b><br>' +
         '<code>p = c;</code>　<code>p = &amp;c[0];</code>　<code>p = &amp;*c;</code> —— 效果完全相同。<br>' +
         '<b>数组名 vs 指针变量：</b><br>' +
         '· <code>c</code> 是数组名，不能被赋值、不能自增：<code>c = p;</code>、<code>c++</code> 都非法；<br>' +
         '· <code>p</code> 是指针变量，可以随意改写：<code>p = c + 3;</code>、<code>p++</code> 都合法。<br>' +
         '<b>注意：</b>这里只取了地址，<b>没有复制数组内容</b>——c 还是那 8 个字节，' +
         'p 和 c 指向的是同一块内存。</span>' +
         '<span class="warn"><b>此时 c 还没有被写入任何字符</b>，8 个字节仍然是垃圾值。' +
         '如果现在调用 <code>printf("%s", p)</code> 会一直往后找 <code>\\0</code>，' +
         '属于未定义行为——这正是「字符数组必须先写入有效内容，才能当字符串用」的原因。</span>'
  });

  /* ================= 第 5 行：注释 ================= */
  snap({
    line: 5, func:'main', cls:'ans',
    ctx:'main · 注释行 · 第 5 行',
    expr:'// 写为一行：',
    exprVal:'（注释内容，编译器直接忽略）',
    note:'注释不产生任何代码，变量保持原样',
    title:'// 写为一行：　→　注释行，不执行',
    desc:'这一行是<b>注释</b>。<br>' +
         '· 编译器会把 <code>//</code> 到行尾的内容全部忽略，不生成任何代码；<br>' +
         '· 它提示接下来要演示「声明 + 初始化」写在一行的等价形式；<br>' +
         '· 也就是把字符数组声明和指针初始化合成一条语句：<code>char c[8], *p = c;</code>。' +
         '<span class="tip"><b>一行声明多个变量：</b><br>' +
         '<code>char c[8], *p = c;</code> 相当于<br>' +
         '<code>char c[8];</code><br>' +
         '<code>char *p = c;</code><br>' +
         '注意 <b>*</b> 只作用于紧跟其后的 <code>p</code>，' +
         '<code>c</code> 仍然是一个字符数组，不是指针。</span>'
  });

  /* ================= 第 6 行：{ ================= */
  scopeStack.push('块1 { }');
  snap({
    line: 6, func:'main · 块1', cls:'mv',
    ctx:'main · 进入块1（作用域①） · 第 6 行',
    expr:'{',
    exprVal:'开启新作用域，作用域栈深度变为 2',
    note:'块1 内可以重新使用 c、p 这两个名字',
    title:'{　→　进入新的代码块（作用域①）',
    desc:'左花括号 <code>{</code> 开启一个新的<b>代码块</b>，也就是一个新的<b>作用域（scope）</b>。<br>' +
         '· 在块内声明的变量只在这个块里有效；<br>' +
         '· 块内的变量可以与块外<b>同名</b>，块内的那个叫「<b>遮蔽</b>（shadow）」了外层；<br>' +
         '· 进入块时，会在栈上为块内变量开辟新的空间。' +
         '<span class="tip"><b>为什么要加这层花括号？</b><br>' +
         '原程序片段里 <code>char *p, c[8];</code> 和后面的 ' +
         '<code>char c[8], *p = c;</code> 如果在同一个作用域，' +
         '就构成<b>重复定义</b>，编译会报错。<br>' +
         '放进独立代码块后，两组同名变量各活各的，程序合法，也更容易看清区别。</span>'
  });

  /* ================= 第 7 行（前）：块1 内 char c[8]; ================= */
  V.b1C.decl = true;
  V.b1C.chars = uninitCells(8);
  snap({
    line: 7, func:'main · 块1', hl:'b1C', pulse:'b1C', cls:'ans',
    ctx:'块1 · 声明块内的字符数组 c · 第 7 行',
    expr:'char c[8], *p = c;   →   先执行 char c[8]',
    exprVal:'块1 内 c[8] 分配在 0x7FFD1F00，连续 8 字节',

    var isBody = (k === 6) || (k === 10) || (k === 11);
    h += '<div class="code-line' + (isBody ? ' pending' : '') + '" data-mline="' + (k+1) + '">' +
           '<span class="src">' + SRC_HTML[k] + '</span>' +
         '</div>';
  }
  miniInner.innerHTML = h;
})();

var codeLines = Array.prototype.slice.call(codeArea.querySelectorAll('.code-line'));
var miniLines = Array.prototype.slice.call(miniInner.querySelectorAll('.code-line'));

/* ---- 变量表结构 ---- */
var VAR_ROWS = [
  { key:'ctx',        name:'当前执行位置',                    cls:'k-ctx',   wrap:true  },
  { key:'funcName',   name:'当前正在执行的作用域',            cls:'k-main',  wrap:false },
  { key:'scopeDepth', name:'作用域栈深度',                    cls:'k-cnt',   wrap:false },
  { key:'expr',       name:'正在求值的语句',                  cls:'k-val',   wrap:true  },
  { key:'exprVal',    name:'语句结果',                        cls:'k-val',   wrap:true  },
  { key:'note',       name:'关键状态提示',                    cls:'k-sw',    wrap:true  },
  { key:'mainP',      name:'main · p（char *）',              cls:'k-main',  wrap:false },
  { key:'mainC',      name:'main · c（char[8]）',             cls:'k-main',  wrap:false },
  { key:'b1C',        name:'块1 · c（char[8]）',              cls:'k-block', wrap:false },
  { key:'b1P',        name:'块1 · p（char *）',               cls:'k-block', wrap:false },
  { key:'b2P',        name:'块2 · p（char *）',               cls:'k-block', wrap:false },
  { key:'b2Q',        name:'块2 · q（char *）',               cls:'k-block', wrap:false },
  { key:'printfCount',name:'printf 调用次数',                 cls:'k-cnt',   wrap:false },
  { key:'outLines',   name:'输出行数',                        cls:'k-cnt',   wrap:false },
  { key:'ret',        name:'main 返回值',                     cls:'k-cnt',   wrap:false }
];

(function buildVars(){
  var h = '<div class="group-title">作用域栈</div>';
  h += '<div class="stack-row"><span class="stack-cap">当前栈</span><span class="frames" id="framesBox"><span class="stack-empty">（空）</span></span></div>';
  h += '<div class="group-title">变量与状态</div>';
  for(var w = 0; w < VAR_ROWS.length; w++){
    var r = VAR_ROWS[w];
    h += '<div class="vrow ' + r.cls + (r.wrap ? ' wrap' : '') + '" data-key="' + r.key + '">' +
           '<span class="n">' + r.name + '</span>' +
           '<span class="v dim">—</span>' +
         '</div>';
  }
  varsBody.innerHTML = h;
})();

var framesBox = document.getElementById('framesBox');

function disp(v){ return (v === null || v === undefined || v === '') ? '—' : String(v); }

function getRowValue(step, key){
  if(!step) return null;
  switch(key){
    case 'funcName':   return step.func;
    case 'scopeDepth': return step.scopeStack.length;
    case 'mainP':      return step.vars.mainP;
    case 'mainC':      return step.vars.mainC;
    case 'b1C':        return step.vars.b1C;
    case 'b1P':        return step.vars.b1P;
    case 'b2P':        return step.vars.b2P;
    case 'b2Q':        return step.vars.b2Q;
    case 'printfCount':return step.printfCount;
    case 'outLines':   return step.outLines;
    case 'ret':        return step.ret;
    default: return step[key];
  }
}

/* ---- 内存卡片 ---- */
function renderMem(step){
  var cells = (step && step.cells) ? step.cells : [];
  if(!cells.length){
    memCellsEl.innerHTML = '<span class="mem-empty">（栈上还没有分配任何变量）</span>';
    return;
  }
  var h = '';
  for(var i=0;i<cells.length;i++){
    var c = cells[i];
    var cls = 'mem-cell ' + (c.scopeCls === 'main' ? 'main-scope'
                              : c.scopeCls === 'rodata' ? 'rodata'
                              : 'block-scope');
    if(c.pointer) cls += ' pointer';
    if(c.active)  cls += ' is-active';
    if(c.pulse)   cls += ' pulse';
    h += '<div class="' + cls + '" data-key="' + c.key + '">' +
           '<div class="mem-head">' +
             '<span class="mem-name">' + c.name + '</span>' +
             '<span class="mem-scope ' + c.scopeCls + '">' + c.scope + '</span>' +
           '</div>' +
           '<div class="mem-addr">' + c.addr + '　' + c.type + '　' + c.size + ' 字节</div>' +
           '<div class="mem-val">' + c.content + '</div>' +
         '</div>';
  }
  memCellsEl.innerHTML = h;
}

/* ---- 字符数组与字符串常量 ---- */
var lastMark = { key: null, idx: -1 };
function renderGrids(step){
  var grids = (step && step.grids) ? step.grids : [];
  if(!grids.length){
    gridViewEl.innerHTML = '<span class="grid-empty">（尚未分配任何字符数组 / 字符串常量）</span>';
    lastMark = { key: null, idx: -1 };
    return;
  }
  var h = '';
  for(var i=0;i<grids.length;i++){
    var g = grids[i];
    var cls = 'grid-block ' + (g.scopeCls === 'main' ? 'main-scope'
                               : g.scopeCls === 'rodata' ? 'rodata'
                               : 'block-scope');
    h += '<div class="' + cls + '">' +
           '<div class="grid-head">' +
             '<span class="grid-name' + (g.isLit ? ' rodata-name' : '') + '">' +
               g.label + '</span>' +
             '<span class="grid-scope ' + g.scopeCls + '">' + g.scope + '</span>' +
             '<span class="grid-type">' + g.type + ' · ' + g.base + '</span>' +
           '</div>' +
           '<div class="grid-cells">';
    for(var k=0; k<g.cells.length; k++){
      var c = g.cells[k];
      var ccls = 'grid-cell';
      if(c.isNull) ccls += ' is-null';
      if(c.isMark){
        ccls += ' is-mark';
        if(c.pulse && !(lastMark.key === g.key && lastMark.idx === k)) ccls += ' pulse';
      }
      h += '<div class="' + ccls + '">' +
             '<div class="grid-idx">' + c.idx + '</div>' +
             '<div class="grid-val">' + c.ch + '</div>' +
           '</div>';
    }
    h += '</div></div>';
  }
  gridViewEl.innerHTML = h;
  /* 更新上次标记 */
  for(var q=0;q<grids.length;q++){
    for(var r=0;r<grids[q].cells.length;r++){
      if(grids[q].cells[r].isMark){
        lastMark = { key: grids[q].key, idx: r };
        break;
      }
    }
  }
}

/* ---- 作用域栈 ---- */
function renderFrames(step){
  var stack = (step && step.scopeStack) ? step.scopeStack : [];
  if(!stack.length){
    framesBox.innerHTML = '<span class="stack-empty">（空）</span>';
    return;
  }
  var h = '';
  for(var w = 0; w < stack.length; w++){
    if(w > 0) h += '<span class="arrow">→</span>';
    var isTop = (w === stack.length - 1);
    h += '<span class="frame-card' + (isTop ? ' top-frame' : '') + '">' + stack[w] + '</span>';
  }
  framesBox.innerHTML = h;
}

/* ---- 变量表 ---- */
function renderVars(step){
  for(var w = 0; w < VAR_ROWS.length; w++){
    var r = VAR_ROWS[w];
    var row = varsBody.querySelector('.vrow[data-key="' + r.key + '"]');
    if(!row) continue;
    var vEl = row.querySelector('.v');
    var val = step ? disp(getRowValue(step, r.key)) : '—';
    if(vEl.textContent !== val){
      vEl.textContent = val;
      vEl.title = val;
      if(val === '—' ||
         val.indexOf('尚未声明') >= 0 ||
         val.indexOf('不在作用域') >= 0){
        vEl.classList.add('dim');
      } else {
        vEl.classList.remove('dim');
      }
      vEl.classList.remove('flash');
      void vEl.offsetWidth;
      vEl.classList.add('flash');
      row.classList.add('changed');
      (function(rr){ window.setTimeout(function(){ rr.classList.remove('changed'); }, 700); })(row);
    }
  }
  if(step){
    depthBadge.textContent = '作用域 ' + step.scopeStack.length + ' 层';
  } else {
    depthBadge.textContent = '作用域 0 层';
  }
}

/* ---- 输出面板 ---- */
var lastOut = null;
function renderOut(step){
  var txt = step ? step.out : '';
  if(txt === lastOut) return;
  lastOut = txt;
  if(txt === ''){
    consoleBody.innerHTML = '<div class="out-note">（程序运行中，尚未产生输出…）</div>';
    return;
  }
  var lines = txt.split('\n');
  var h = '';
  for(var i=0;i<lines.length;i++){
    var line = lines[i];
    if(line === ''){ continue; }
    if(line.indexOf('退出码') >= 0){
      h += '<div class="out-sub">' + line.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    } else {
      h += '<div class="out-note">' + line.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>';
    }
  }
  consoleBody.innerHTML = h;
}

/* ---- 代码区高亮 ---- */
function renderCode(step){
  var activeLine = step ? step.line : null;
  var idx = step ? STEPS.indexOf(step) : -1;
  var e6 = -1, e10 = -1;
  for(var q=0;q<STEPS.length;q++){
    if(STEPS[q].line === 6 && e6 < 0) e6 = q;
    if(STEPS[q].line === 10 && e10 < 0) e10 = q;
  }
  var block1Entered = (e6 >= 0 && idx >= e6);
  var block2Entered = (e10 >= 0 && idx >= e10);

  for(var w = 0; w < codeLines.length; w++){
    var el = codeLines[w];
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);
    /* 第 7 行（块1 内）在第 6 行执行前加灰；第 11、12 行（块2 内）在第 10 行执行前加灰 */
    var isBody1 = (n === 7);
    var isBody2 = (n === 11 || n === 12);
    el.classList.toggle('pending', (isBody1 && !block1Entered) || (isBody2 && !block2Entered));
    el.classList.toggle('done', n < (activeLine || 0) && n !== activeLine);
  }
  for(var m = 0; m < miniLines.length; m++){
    var me = miniLines[m];
    var mn = Number(me.dataset.mline);
    me.classList.toggle('active', mn === activeLine);
    var ib1 = (mn === 7);
    var ib2 = (mn === 11 || mn === 12);
    me.classList.toggle('pending', (ib1 && !block1Entered) || (ib2 && !block2Entered));
  }
  centerActiveLine();
}

function centerActiveLine(){
  var el = codeArea.querySelector('.code-line.active');
  if(!el) return;
  var er = el.getBoundingClientRect();
  var cr = codeArea.getBoundingClientRect();
  var delta = (er.top + er.height/2) - (cr.top + cr.height/2);
  if(Math.abs(delta) > 4){
    codeArea.scrollTop = Math.max(0, codeArea.scrollTop + delta);
  }
  syncMini();
}

/* ---- 缩略图同步（同一套行高 / 行索引 / 滚动位置计算逻辑） ---- */
var rafPending = false;
function syncMini(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(function(){
    rafPending = false;
    var firstLine = codeArea.querySelector('.code-line');
    if(!firstLine) return;
    var lineH = firstLine.getBoundingClientRect().height;
    if(lineH <= 0) return;

    var miniH = miniScroll.clientHeight;
    if(miniH <= 0){ miniView.style.display='none'; return; }
    var miniLineH = miniH / TOTAL_LINES;

    var scrollTop = codeArea.scrollTop;
    var firstVisible = scrollTop / lineH;
    var visibleCount = codeArea.clientHeight / lineH;

    var vpTop = firstVisible * miniLineH;
    var vpHeight = Math.max(8, visibleCount * miniLineH);
    vpTop = Math.max(0, Math.min(miniH - vpHeight, vpTop));

    miniView.style.display = 'block';
    miniView.style.height = vpHeight + 'px';
    miniView.style.top = vpTop + 'px';
  });
}

codeArea.addEventListener('scroll', syncMini, { passive:true });
window.addEventListener('resize', syncMini);

miniScroll.addEventListener('click', function(e){
  var r = miniScroll.getBoundingClientRect();
  var y = e.clientY - r.top;
  var ratio = y / r.height;
  var firstLine = codeArea.querySelector('.code-line');
  var lineH = firstLine.getBoundingClientRect().height;
  var target = Math.floor(ratio * TOTAL_LINES);
  codeArea.scrollTo({ top: Math.max(0, target * lineH), behavior:'smooth' });
  window.setTimeout(syncMini, 260);
});

/* ---- 主渲染 ---- */
var cur = -1;

function render(){
  var step = (cur >= 0) ? STEPS[cur] : null;

  renderCode(step);
  renderVars(step);
  renderFrames(step);
  renderMem(step);
  renderGrids(step);
  renderOut(step);

  if(step){
    explainBox.innerHTML =
      '<span class="tag' + (step.cls === 'mv' ? ' mv' : step.cls === 'gold' ? ' gold' : '') + '">第 ' + step.line + ' 行</span>' +
      '<strong>' + step.title + '</strong> —— ' + step.desc;
    stepCounter.textContent = '步骤 ' + (cur + 1) + ' / ' + STEPS.length;
  } else {
    explainBox.innerHTML =
      '<em>点击「自动播放」或「下一步」，开始逐条执行程序。<br><br>' +
      '<b>本程序演示：字符指针 · 字符串常量 · 作用域遮蔽 · 无输出</b><br>' +
      '· 第 3 行：<code>char *p, c[8];</code> 分配 8 字节指针 + 8 字节字符数组；<br>' +
      '· 第 4 行：<code>p = c;</code> 数组名 c 退化为 <code>&amp;c[0]</code>（类型 char *），地址存入 p；<br>' +
      '· 第 5 行：注释，说明「声明 + 初始化」可写在一行；<br>' +
      '· 第 6 行：花括号开启<b>作用域①</b>，解决同名重复定义；<br>' +
      '· 第 7 行：<code>char c[8], *p = c;</code> 块1 内数组遮蔽外层，块1 内 p 指向块1 内 c[0]；<br>' +
      '· 第 8 行：块1 结束，块1 内 c、p 全部销毁（共 16 字节）；<br>' +
      '· 第 9 行：注释，说明接下来演示指向字符串常量；<br>' +
      '· 第 10 行：花括号开启<b>作用域②</b>；<br>' +
      '· 第 11 行：<code>char *p = "How are you";</code> p 指向只读段（12 字节）；<br>' +
      '· 第 12 行：<code>char *q = "Nice to meet you";</code> q 指向另一个字符串常量（17 字节）；<br>' +
      '· 第 13 行：块2 结束，p、q 两个指针销毁（共 16 字节），字符串常量仍留在只读段；<br>' +
      '· 第 14~15 行：return 0，程序正常结束。<br><br>' +
      '<b>运行结果：</b>本程序没有 printf，屏幕无任何输出，退出码 0。<br>' +
      '共 ' + STEPS.length + ' 个执行步骤，请用「自动播放」或方向键逐步查看。</em>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
  }

  btnPrev.disabled = cur < 0;
  btnNext.disabled = cur >= STEPS.length - 1;
}

/* ============================================================
   4. 播放控制
   ============================================================ */
var playing = false, timer = null;
var speed = Number(speedInput.value);

function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  btnPlay.classList.toggle('playing', playing);
}
function tick(){
  if(cur >= STEPS.length - 1){ pause(); return; }
  cur++; render();
  if(cur >= STEPS.length - 1) pause();
}
function play(){
  if(playing) return;
  if(cur >= STEPS.length - 1){ cur = -1; render(); }
  playing = true; updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}
function pause(){
  playing = false;
  window.clearInterval(timer); timer = null;
  updatePlayBtn();
}
function nextStep(){ pause(); if(cur < STEPS.length - 1){ cur++; render(); } }
function prevStep(){ pause(); if(cur > -1){ cur--; render(); } }
function resetAll(){
  pause(); cur = -1; lastOut = null;
  consoleBody.innerHTML = '';
  codeArea.scrollTop = 0;
  render(); syncMini();
}

btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  speedLabel.textContent = (speed/1000).toFixed(2) + 's';
  if(playing){ window.clearInterval(timer); timer = window.setInterval(tick, speed); }
});

btnFull.addEventListener('click', function(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
});

/* ============================================================
   5. 悬浮面板：拖动 / 调整大小 / 点击置顶 / 关闭
   ============================================================ */
var zTop = 200;
function bringToFront(panel){
  zTop += 1;
  panel.style.zIndex = zTop;
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('top'); });
  panel.classList.add('top');
}

function makeDraggable(panel, handle){
  handle.addEventListener('pointerdown', function(e){
    if(e.target.closest('.panel-btn')) return;
    if(e.target.closest('[data-rz]')) return;
    bringToFront(panel);
    var r = panel.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY;
    var ox = r.left, oy = r.top;
    panel.style.left = ox + 'px';
    panel.style.top = oy + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    function mv(ev){
      var nx = ox + ev.clientX - sx;
      var ny = oy + ev.clientY - sy;
      nx = Math.max(-r.width + 100, Math.min(window.innerWidth - 100, nx));
      ny = Math.max(0, Math.min(window.innerHeight - 60, ny));
      panel.style.left = nx + 'px';
      panel.style.top = ny + 'px';
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    e.preventDefault();
  });
}

function makeResizable(panel, handle){
  handle.addEventListener('pointerdown', function(e){
    e.stopPropagation(); e.preventDefault();
    bringToFront(panel);
    var r = panel.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY;
    var w = r.width, h = r.height;
    if(panel.style.right !== 'auto'){
      panel.style.left = r.left + 'px';
      panel.style.right = 'auto';
    }
    if(panel.style.bottom !== 'auto'){
      panel.style.top = r.top + 'px';
      panel.style.bottom = 'auto';
    }
    panel.style.maxWidth = 'none';
    panel.style.maxHeight = 'none';
    function mv(ev){
      var nw = w + ev.clientX - sx;
      var nh = h + ev.clientY - sy;
      if(nw < 20) nw = 20;
      if(nh < 20) nh = 20;
      panel.style.width = nw + 'px';
      panel.style.height = nh + 'px';
      if(panel.id === 'panelMini') window.setTimeout(syncMini, 30);
    }
    function up(){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });
}

var PANELS = ['panelCtrl','panelVars','panelMem','panelGrid','panelOut','panelExplain','panelMini'];

PANELS.forEach(function(id){
  var p = document.getElementById(id);
  var head = p.querySelector('.panel-head') || p.querySelector('.ctrl-row');
  if(head) makeDraggable(p, head);
  var rz = p.querySelector('[data-rz]');
  if(rz) makeResizable(p, rz);
  p.addEventListener('pointerdown', function(){ bringToFront(p); });
  p.addEventListener('focusin', function(){ bringToFront(p); });
});

document.querySelectorAll('.panel-close').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var id = btn.dataset.close || 'panelCtrl';
    var p = document.getElementById(id);
    if(p) p.classList.add('hidden');
  });
});

  p.style.height = '250px';
  p.style.maxWidth = 'none'; p.style.maxHeight = 'none';

  /* 缩略图：默认靠右侧可见位置 */
  p = document.getElementById('panelMini');
  p.style.left = (vw - 220) + 'px';
  p.style.top = '190px';
  p.style.right = 'auto';
  p.style.bottom = 'auto';
  p.style.width = '196px';
  p.style.height = Math.min(560, Math.max(240, vh - 260)) + 'px';
  p.style.maxWidth = 'none'; p.style.maxHeight = 'none';

  var order = ['panelCtrl','panelVars','panelMem','panelGrid','panelExplain','panelOut','panelMini'];
  order.forEach(function(id, idx){
    var el = document.getElementById(id);
    el.style.zIndex = 200 + idx;
    el.classList.remove('top');
  });
  zTop = 200 + order.length;
  document.getElementById('panelMini').classList.add('top');

  PANELS.forEach(function(id){ document.getElementById(id).classList.remove('hidden'); });
  window.setTimeout(syncMini, 60);
  window.setTimeout(syncMini, 260);
}

btnLayout.addEventListener('click', applyLayout);
window.addEventListener('resize', function(){ window.setTimeout(syncMini, 60); });

/* ============================================================
   7. 面板 / 缩略图显示切换
   ============================================================ */
var allHidden = false;
btnPanels.addEventListener('click', function(){
  allHidden = !allHidden;
  PANELS.forEach(function(id){
    document.getElementById(id).classList.toggle('hidden', allHidden);
  });
  if(!allHidden) window.setTimeout(syncMini, 60);
});
btnMini.addEventListener('click', function(){
  document.getElementById('panelMini').classList.toggle('hidden');
  window.setTimeout(syncMini, 60);
});

/* ============================================================
   8. 全局快捷键
   ============================================================ */
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  switch(e.code){
    case 'Space':
      e.preventDefault(); playing ? pause() : play(); break;
    case 'ArrowRight': e.preventDefault(); nextStep(); break;
    case 'ArrowLeft':  e.preventDefault(); prevStep(); break;
    case 'KeyR':       e.preventDefault(); resetAll(); break;
    case 'KeyF':
      e.preventDefault();
      if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
      break;
    case 'KeyM':
      e.preventDefault();
      document.getElementById('panelMini').classList.toggle('hidden');
      window.setTimeout(syncMini, 60);
      break;
    case 'KeyH':
      e.preventDefault();
      allHidden = !allHidden;
      PANELS.forEach(function(id){
        document.getElementById(id).classList.toggle('hidden', allHidden);
      });
      if(!allHidden) window.setTimeout(syncMini, 60);
      break;
  }
});

/* ============================================================
   9. 启动
   ============================================================ */
buildVarsAndStart();

function buildVarsAndStart(){
  speedLabel.textContent = (speed/1000).toFixed(2) + 's';
  render();
  applyLayout();
  window.setTimeout(syncMini, 120);
  window.setTimeout(syncMini, 400);
  window.setTimeout(syncMini, 900);
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ window.setTimeout(syncMini, 80); });
  }
}

})();
</script>
