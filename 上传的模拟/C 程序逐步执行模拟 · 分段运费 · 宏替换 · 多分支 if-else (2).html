<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 分段运费 · 宏替换 · 多分支 if-else</title>
<style>
/* ==========================================================
   全局变量与基础
   ========================================================== */
:root{
  --bg:#0d1117;
  --panel-bg:rgba(13,17,23,.82);
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --accent:#38bdf8;
  --green:#4ade80;
  --amber:#fbbf24;
  --pink:#f472b6;
  --purple:#c084fc;
  --teal:#2dd4bf;
  --orange:#fb923c;

  --code-font: clamp(80px, 5vw, 120px);
  --out-font:  clamp(72px, 4.2vw, 104px);
  --var-font:  clamp(40px, 2.2vw, 58px);
  --explain-font: clamp(48px, 2.6vw, 68px);
  --btn-font:  clamp(40px, 2.2vw, 58px);
  --title-font: clamp(26px, 1.4vw, 34px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

/* ==========================================================
   全屏代码区
   ========================================================== */
#codeWrap{
  position:fixed;inset:0;overflow:auto;background:#0d1117;
  scrollbar-width:thin;scrollbar-color:#30363d transparent;z-index:1;
}
#codeWrap::-webkit-scrollbar{width:16px;height:16px;}
#codeWrap::-webkit-scrollbar-thumb{background:#30363d;border-radius:8px;}
#codeWrap::-webkit-scrollbar-track{background:#0d1117;}

#codeInner{
  width:max-content;
  padding:200px 120px 400px 40px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}

/* 每行代码 + 行尾注释始终在同一行，绝不折行 */
.code-line{
  display:flex;align-items:baseline;
  white-space:pre;
  padding:6px 30px 6px 14px;
  border-left:10px solid transparent;
  font-size:var(--code-font);
  line-height:1.42;
  color:#e6edf3;
  transition:background .25s,border-color .25s,opacity .25s,filter .25s;
}
.code-line .ln{
  flex:0 0 auto;min-width:3ch;text-align:right;margin-right:1.4ch;
  font-size:.62em;color:#3d5573;user-select:none;
  font-variant-numeric:tabular-nums;
}
.code-line .src{flex:0 0 auto;display:flex;white-space:pre;}
.code-line .cmt{margin-left:2em;}

/* 语法着色 */
.pp  {color:#c084fc;font-weight:700;}
.mac {color:#e879f9;font-weight:800;}
.str {color:#7ee787;}
.cmt {color:#8b949e;font-style:italic;}
.fn  {color:#79c0ff;}
.kw  {color:#ff7b72;font-weight:700;}
.num {color:#ffa657;}
.op  {color:#f0883e;font-weight:800;}

/* 代码行状态 */
.code-line.done{opacity:.40;}
.code-line.skip{opacity:.22;filter:grayscale(.7);}
.code-line.hit{
  background:linear-gradient(90deg,rgba(74,222,128,.22),rgba(74,222,128,0));
  border-left-color:var(--green);
}
.code-line.hit .ln{color:var(--green);}
.code-line.active{
  background:linear-gradient(90deg,rgba(56,189,248,.30),rgba(56,189,248,.03));
  border-left-color:var(--accent);
  box-shadow:inset 0 0 0 3px rgba(56,189,248,.20);
}
.code-line.active .src{color:#ffffff;}
.code-line.active .ln{color:var(--accent);font-weight:800;}

/* ==========================================================
   悬浮面板基础
   ========================================================== */
.panel{
  position:fixed;
  background:var(--panel-bg);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border:2px solid var(--border);
  border-radius:18px;
  display:flex;flex-direction:column;
  overflow:hidden;min-width:0;min-height:0;
  box-shadow:0 14px 46px rgba(0,0,0,.62);
  transition:border-color .18s,box-shadow .18s;
  z-index:10;
}
.panel.active{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(56,189,248,.32),0 18px 56px rgba(0,0,0,.7);
}
.panel.hidden{display:none;}
.panel.collapsed .p-body{display:none;}

.p-head{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:rgba(255,255,255,.055);
  border-bottom:1px solid var(--border);
  cursor:move;user-select:none;touch-action:none;
}
.p-title{
  font-size:var(--title-font);color:var(--muted);
  letter-spacing:.08em;white-space:nowrap;font-weight:700;
}
.p-head .sp{flex:1 1 auto;}
.p-btn{
  width:52px;height:52px;min-width:52px;
  border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.07);color:var(--text);
  font-size:30px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,transform .1s;
}
.p-btn:hover{background:rgba(56,189,248,.22);border-color:var(--accent);}
.p-btn:active{transform:scale(.94);}

.p-body{
  flex:1 1 auto;min-height:0;overflow:auto;
  padding:14px 18px 18px;
  scrollbar-width:thin;scrollbar-color:#30363d transparent;
}
.p-body::-webkit-scrollbar{width:12px;height:12px;}
.p-body::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;}

/* 右下角调整大小把手 — 不设最小/最大限制 */
.p-resize{
  position:absolute;right:0;bottom:0;width:56px;height:56px;
  cursor:nwse-resize;touch-action:none;z-index:6;
  display:flex;align-items:flex-end;justify-content:flex-end;
  padding:8px;
}
.p-resize::after{
  content:'';width:22px;height:22px;
  border-right:5px solid var(--accent);
  border-bottom:5px solid var(--accent);
  border-radius:0 0 5px 0;opacity:.75;
}

/* ==========================================================
   面板默认位置与尺寸
   ========================================================== */
#p-top     { left:16px;  top:16px;    max-width:calc(100vw - 32px); }
#p-vars    { left:16px;  top:230px;   width:660px; max-height:520px; }
#p-out     { left:16px;  bottom:16px; width:660px; max-height:400px; }
#p-explain { left:700px; bottom:16px; width:900px; max-height:320px; }
#p-mini    { right:16px; top:16px;    width:360px; height:640px; }

/* ==========================================================
   顶部控制栏
   ========================================================== */
#p-top .p-body{
  display:flex;flex-wrap:wrap;align-items:center;
  gap:14px;padding:14px 18px;overflow:visible;
}
.ctrl-btn{
  font:inherit;font-size:var(--btn-font);font-weight:700;
  min-height:84px;padding:0 24px;border-radius:14px;
  border:2px solid var(--border);background:rgba(255,255,255,.07);
  color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.ctrl-btn:hover:not(:disabled){background:rgba(56,189,248,.20);border-color:var(--accent);}
.ctrl-btn:active:not(:disabled){transform:translateY(3px);}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed;}
.ctrl-btn.primary{
  background:linear-gradient(180deg,#0ea5e9,#0284c7);
  border-color:#38bdf8;color:#04121f;
}
.ctrl-btn.primary.playing{
  background:linear-gradient(180deg,#f59e0b,#d97706);
  border-color:#fbbf24;color:#1a1200;
}
.speed-box{
  display:flex;align-items:center;gap:12px;
  font-size:var(--btn-font);color:var(--muted);white-space:nowrap;
}
.speed-box input[type=range]{width:240px;height:44px;accent-color:var(--accent);cursor:pointer;}
.speed-box b{color:var(--accent);font-variant-numeric:tabular-nums;min-width:3.4ch;display:inline-block;}
#stepCounter{color:var(--accent);font-weight:800;font-size:var(--btn-font);white-space:nowrap;}

/* ==========================================================
   变量面板
   ========================================================== */
.var-row{
  display:flex;justify-content:space-between;align-items:baseline;gap:22px;
  padding:10px 18px;margin-bottom:8px;border-radius:12px;
  background:rgba(255,255,255,.035);
  border-left:8px solid rgba(139,148,158,.35);
  font-size:var(--var-font);
  transition:background .3s,border-color .3s;
}
.var-row.k-mac   {border-left-color:#e879f9;}
.var-row.k-main  {border-left-color:#22d3ee;}
.var-row.k-money {border-left-color:#fbbf24;}
.var-row.k-sub   {border-left-color:#38bdf8;}
.var-row.k-val   {border-left-color:#f472b6;}
.var-row.k-branch{border-left-color:#4ade80;}
.var-row.k-note  {border-left-color:#2dd4bf;}
.var-row.k-ret   {border-left-color:rgba(251,191,36,.5);}
.var-row.k-ctx   {border-left-color:#8b949e;}
.var-row.changed{background:rgba(56,189,248,.16);}
.var-name{color:var(--muted);white-space:nowrap;font-size:.86em;}
.var-value{
  font-family:ui-monospace,Consolas,monospace;font-weight:800;
  color:var(--accent);font-variant-numeric:tabular-nums;
  text-align:right;white-space:nowrap;
}
.var-value.dim{color:#5a6c82;font-weight:600;}
.var-row.k-mac    .var-value{color:#e879f9;}
.var-row.k-money  .var-value{color:var(--amber);}
.var-row.k-val    .var-value{color:var(--pink);}
.var-row.k-branch .var-value{color:var(--green);}
.var-row.k-note   .var-value{color:var(--teal);font-size:.82em;}
.var-row.k-ctx    .var-value{color:#a9b8cc;font-size:.82em;}
@keyframes flashVal{
  0%{transform:scale(1);}
  35%{transform:scale(1.22);color:#fff;text-shadow:0 0 22px var(--accent);}
  100%{transform:scale(1);}
}
.var-value.flash{animation:flashVal .6s ease-out;}

/* ==========================================================
   输出面板
   ========================================================== */
#consoleBody{
  font-family:ui-monospace,Consolas,"Courier New",monospace;
  font-size:var(--out-font);line-height:1.5;color:#e8f2ff;
}
.out-line{white-space:pre;animation:slideIn .4s ease-out;}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-22px);}
  to{opacity:1;transform:none;}
}
.seg-out{color:#e8f2ff;}
.seg-in{color:var(--teal);font-weight:800;}
.seg-money{color:var(--amber);font-weight:800;}

/* ==========================================================
   说明条
   ========================================================== */
#explainBody{font-size:var(--explain-font);line-height:1.5;color:#c6d4e6;}
.ex-line{
  display:inline-block;margin-right:16px;padding:2px 18px;
  border-radius:12px;background:rgba(56,189,248,.20);
  color:var(--accent);font-weight:800;font-size:.78em;
  vertical-align:middle;
}
.ex-line.hit{background:rgba(74,222,128,.22);color:var(--green);}
#explainBody strong{color:#ffffff;}
#explainBody code{
  font-family:ui-monospace,Consolas,monospace;
  background:rgba(148,163,184,.18);border-radius:8px;
  padding:0 10px;color:#eaf3ff;
}
.tip{
  display:block;margin-top:14px;padding:14px 20px;
  border-radius:12px;background:rgba(45,212,191,.12);
  border-left:8px solid var(--teal);color:#bff5ec;font-size:.9em;
}

/* ==========================================================
   代码缩略图（VSCode 风格 minimap）
   —— 使用与全屏代码完全一致的 .code-line 结构，1:1 对应
   ========================================================== */
#miniBody{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  background:rgba(0,0,0,.40);border-radius:0 0 16px 16px;
}
#miniInner{
  position:absolute;left:0;top:0;
  transform-origin:0 0;
  padding:6px 4px 10px 6px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  pointer-events:none;
  will-change:transform;
}
/* 缩略图内部：固定像素字号，保证自然尺寸稳定 */
#miniInner .code-line{
  font-size:22px;
  line-height:1.42;
  padding:1px 4px 1px 2px;
  border-left-width:3px;
  display:flex;align-items:baseline;
  white-space:pre;
}
#miniInner .ln{
  min-width:2.6ch;margin-right:1ch;
  font-size:.68em;
}
#miniInner .cmt{margin-left:1.2em;}

/* 视口高亮框（荧光框）—— 与全屏可见范围精确对应 */
#miniView{
  position:absolute;left:0;width:100%;
  background:rgba(56,189,248,.16);
  border-top:3px solid rgba(56,189,248,.9);
  border-bottom:3px solid rgba(56,189,248,.9);
  box-sizing:border-box;
  pointer-events:none;
  box-shadow:0 0 18px rgba(56,189,248,.45);
  will-change:top,height;
}
</style>
</head>
<body>

<!-- ================= 全屏代码区 ================= -->
<div id="codeWrap">
  <div id="codeInner"></div>
</div>

<!-- ================= 顶部控制栏 ================= -->
<section class="panel" id="p-top">
  <div class="p-head">
    <span class="p-title">控制台 · 分段运费 freight.c</span>
    <span class="sp"></span>
    <button class="p-btn" data-collapse="p-top" title="折叠">−</button>
    <button class="p-btn" data-close="p-top" title="关闭">×</button>
  </div>
  <div class="p-body">
    <button class="ctrl-btn" id="btnReset">⟲ 重置</button>
    <button class="ctrl-btn" id="btnPrev">◀ 上一步</button>
    <button class="ctrl-btn primary" id="btnPlay">▶ 自动播放</button>
    <button class="ctrl-btn" id="btnNext">下一步 ▶</button>
    <button class="ctrl-btn" id="btnFull">⛶ 全屏</button>
    <button class="ctrl-btn" id="btnLayout">⇱ 重置布局</button>
    <label class="speed-box">速度
      <input type="range" id="speed" min="400" max="3000" step="100" value="1500">
      <b id="speedLabel">1.5s</b>
    </label>
    <span id="stepCounter">步骤 — / —</span>
  </div>
  <div class="p-resize" data-resize="p-top"></div>
</section>

<!-- ================= 变量面板 ================= -->
<section class="panel" id="p-vars">
  <div class="p-head">
    <span class="p-title">变量 · 宏 · 子表达式 · 分支 · 状态表</span>
    <span class="sp"></span>
    <button class="p-btn" data-collapse="p-vars" title="折叠">−</button>
    <button class="p-btn" data-close="p-vars" title="关闭">×</button>
  </div>
  <div class="p-body" id="varTable"></div>
  <div class="p-resize" data-resize="p-vars"></div>
</section>

<!-- ================= 输出面板 ================= -->
<section class="panel" id="p-out">
  <div class="p-head">
    <span class="p-title">程序运行结果（屏幕输出）</span>
    <span class="sp"></span>
    <button class="p-btn" data-collapse="p-out" title="折叠">−</button>
    <button class="p-btn" data-close="p-out" title="关闭">×</button>
  </div>
  <div class="p-body" id="consoleBody"></div>
  <div class="p-resize" data-resize="p-out"></div>
</section>

<!-- ================= 当前语句说明条 ================= -->
<section class="panel" id="p-explain">
  <div class="p-head">
    <span class="p-title">当前语句说明</span>
    <span class="sp"></span>
    <button class="p-btn" data-collapse="p-explain" title="折叠">−</button>
    <button class="p-btn" data-close="p-explain" title="关闭">×</button>
  </div>
  <div class="p-body" id="explainBody"></div>
  <div class="p-resize" data-resize="p-explain"></div>
</section>

<!-- ================= 代码缩略图 ================= -->
<section class="panel" id="p-mini">
  <div class="p-head">
    <span class="p-title">代码缩略图</span>
    <span class="sp"></span>
    <button class="p-btn" data-collapse="p-mini" title="折叠">−</button>
    <button class="p-btn" data-close="p-mini" title="关闭">×</button>
  </div>
  <div id="miniBody">
    <div id="miniInner"></div>
    <div id="miniView"></div>
  </div>
  <div class="p-resize" data-resize="p-mini"></div>
</section>

<script>
(function(){
'use strict';

/* ==========================================================
   一、源代码 23 行（代码 + 行尾注释始终同一行，绝不折行）
   ========================================================== */
var CODE = [
  {n:1 , h:'<span class="pp">#include</span> <span class="str">&lt;stdio.h&gt;</span>',                          c:'包含标准输入输出头文件'},
  {n:2 , h:'<span class="pp">#define</span> <span class="mac">M</span> <span class="num">5.0</span>',            c:'定义单价常量 M（宏）'},
  {n:3 , h:'<span class="kw">int</span> <span class="fn">main</span>() {',                                      c:'定义主函数'},
  {n:4 , h:'    <span class="kw">int</span> s, w;',                                                              c:'定义里程 s 和重量 w'},
  {n:5 , h:'    <span class="kw">float</span> money;',                                                           c:'定义运费 money'},
  {n:6 , h:'    <span class="fn">printf</span>(<span class="str">"Please input s:"</span>);',                   c:'提示输入里程（结尾无 \\n，不换行）'},
  {n:7 , h:'    <span class="fn">scanf</span>(<span class="str">"%d"</span>, <span class="op">&amp;</span>s);', c:'输入里程 s，参数是地址 &s'},
  {n:8 , h:'    <span class="fn">printf</span>(<span class="str">"Please input w:"</span>);',                   c:'提示输入重量（结尾无 \\n，不换行）'},
  {n:9 , h:'    <span class="fn">scanf</span>(<span class="str">"%d"</span>, <span class="op">&amp;</span>w);', c:'输入重量 w，参数是地址 &w'},
  {n:10, h:'    <span class="kw">if</span> (s <span class="op">&lt;</span> <span class="num">1000</span>) {',c:'里程小于 1000'},
  {n:11, h:'        money = <span class="mac">M</span> <span class="op">*</span> s <span class="op">*</span> w;',c:'无折扣'},
  {n:12, h:'    } <span class="kw">else if</span> (s <span class="op">&lt;</span> <span class="num">2000</span>) {',c:'里程在 1000~1999'},
  {n:13, h:'        money = <span class="mac">M</span> <span class="op">*</span> <span class="num">0.95</span> <span class="op">*</span> s <span class="op">*</span> w;',c:'95 折'},
  {n:14, h:'    } <span class="kw">else if</span> (s <span class="op">&lt;</span> <span class="num">3000</span>) {',c:'里程在 2000~2999'},
  {n:15, h:'        money = <span class="mac">M</span> <span class="op">*</span> <span class="num">0.92</span> <span class="op">*</span> s <span class="op">*</span> w;',c:'92 折'},
  {n:16, h:'    } <span class="kw">else if</span> (s <span class="op">&lt;</span> <span class="num">5000</span>) {',c:'里程在 3000~4999'},
  {n:17, h:'        money = <span class="mac">M</span> <span class="op">*</span> <span class="num">0.90</span> <span class="op">*</span> s <span class="op">*</span> w;',c:'90 折'},
  {n:18, h:'    } <span class="kw">else</span> {',                                                            c:'里程 &gt;= 5000'},
  {n:19, h:'        money = <span class="mac">M</span> <span class="op">*</span> <span class="num">0.88</span> <span class="op">*</span> s <span class="op">*</span> w;',c:'88 折'},
  {n:20, h:'    }',                                                                                             c:'if-else 链结束'},
  {n:21, h:'    <span class="fn">printf</span>(<span class="str">"\\nmoney=%.2f"</span>, money);',              c:'输出运费（开头 \\n 先换行）'},
  {n:22, h:'    <span class="kw">return</span> <span class="num">0</span>;',                                  c:'返回 0，程序结束'},
  {n:23, h:'}',                                                                                                 c:''}
];

function buildCodeHTML(){
  var html = '';
  for (var i=0;i<CODE.length;i++){
    var l = CODE[i];
    html += '<div class="code-line" data-line="' + l.n + '">' +
              '<span class="ln">' + l.n + '</span>' +
              '<span class="src">' + l.h +
              (l.c ? '<span class="cmt">// ' + l.c + '</span>' : '') +
              '</span></div>';
  }
  return html;
}

/* ==========================================================
   二、模拟输入固定为 s = 1500、w = 10
   money = M * 0.95 * s * w = 5.0 * 0.95 * 1500 * 10 = 71250.0
   ========================================================== */
var IN_S = 1500, IN_W = 10;
function seg(t,c){ return {t:t, c:c||'out'}; }

var OUT_1 = [[seg('Please input s:')]];
var OUT_2 = [[seg('Please input s:'), seg('1500','in')]];
var OUT_3 = [[seg('Please input s:'), seg('1500','in')],
             [seg('Please input w:')]];
var OUT_4 = [[seg('Please input s:'), seg('1500','in')],
             [seg('Please input w:'), seg('10','in')]];
var OUT_5 = [[seg('Please input s:'), seg('1500','in')],
             [seg('Please input w:'), seg('10','in')],
             [seg('\u00A0')],
             [seg('money='), seg('71250.00','money')]];

/* ==========================================================
   三、逐步执行轨迹（22 步）
   ========================================================== */
function V(o){
  var b = {M:'—', s:'—', w:'—', money:'—',
           subExpr:'—', subVal:'—', branch:'—', note:'—',
           prints:0, ret:'—'};
  for (var k in o){ if (Object.prototype.hasOwnProperty.call(o,k)) b[k]=o[k]; }
  return b;
}

var STEPS = [

function valueOf(step, key){
  if (!step) return '—';
  if (key === 'ctx') return step.ctx;
  var v = step.v[key];
  return (v === undefined || v === null) ? '—' : String(v);
}

/* ==========================================================
   八、命中 / 跳过 / 已执行行计算
   ========================================================== */
function getHitLines(idx){
  if (idx >= 12) return [13];
  return [];
}
function getSkipLines(idx){
  if (idx === 11) return [11];
  if (idx >= 12) return [11,14,15,16,17,18,19];
  return [];
}
function getExecutedLines(idx){
  var arr = [];
  for (var i=0;i<=idx;i++){
    if (STEPS[i] && arr.indexOf(STEPS[i].line) === -1) arr.push(STEPS[i].line);
  }
  return arr;
}

/* ==========================================================
   九、代码渲染（全屏 + 缩略图 同步）
   ========================================================== */
function renderCode(){
  var activeLine = current >= 0 ? STEPS[current].line : -1;
  var hit  = getHitLines(current);
  var skip = getSkipLines(current);
  var done = getExecutedLines(current);

  [codeLines, miniLines].forEach(function(list){
    for (var i=0;i<list.length;i++){
      var el = list[i];
      var n  = Number(el.dataset.line);
      var isActive = (n === activeLine);
      el.classList.toggle('active', isActive);
      el.classList.toggle('hit',    hit.indexOf(n)  !== -1);
      el.classList.toggle('skip',   skip.indexOf(n) !== -1);
      el.classList.toggle('done',   !isActive && done.indexOf(n) !== -1 && skip.indexOf(n) === -1);
    }
  });

  centerActiveLine();
  /* 缩略图当前行同步后，立即刷新荧光视口框 */
  syncMiniViewbox();
}

function centerActiveLine(){
  var el = codeInner.querySelector('.code-line.active');
  if (!el) return;
  var target = el.offsetTop + el.offsetHeight/2 - codeWrap.clientHeight/2;
  if (target < 0) target = 0;
  try{
    codeWrap.scrollTo({top: target, behavior:'smooth'});
  }catch(e){
    codeWrap.scrollTop = target;
  }
}

/* ==========================================================
   十、变量表渲染
   ========================================================== */
function renderVars(){
  var step = current >= 0 ? STEPS[current] : null;
  var prev = current > 0  ? STEPS[current-1] : null;

  for (var i=0;i<VAR_ROWS.length;i++){
    var r = VAR_ROWS[i];
    var row = varTable.querySelector('.var-row[data-key="' + r.key + '"]');
    if (!row) continue;
    var valEl = row.querySelector('.var-value');
    var val = valueOf(step, r.key);
    var old = valueOf(prev, r.key);

    if (valEl.textContent !== val){
      valEl.textContent = val;
      valEl.classList.toggle('dim', val === '—');
      valEl.title = val;
      valEl.classList.remove('flash');
      void valEl.offsetWidth;
      valEl.classList.add('flash');
      if (prev && old !== val){
        row.classList.add('changed');
        (function(rr){ window.setTimeout(function(){ rr.classList.remove('changed'); }, 750); })(row);
      }
    }
  }
}

/* ==========================================================
   十一、输出渲染
   ========================================================== */
function resolveOut(upto){
  for (var i=upto;i>=0;i--){
    if (STEPS[i] && STEPS[i].out) return STEPS[i].out;
  }
  return null;
}
function renderOut(){
  var lines = resolveOut(current);
  var sig = lines ? JSON.stringify(lines) : '';
  if (sig === lastOutSig) return;
  lastOutSig = sig;

  if (!lines){ consoleBody.innerHTML = ''; return; }
  var html = '';
  for (var i=0;i<lines.length;i++){
    html += '<div class="out-line">';
    for (var j=0;j<lines[i].length;j++){
      var s = lines[i][j];
      html += '<span class="seg-' + (s.c || 'out') + '">' + s.t + '</span>';
    }
    html += '</div>';
  }
  consoleBody.innerHTML = html;
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

/* ==========================================================
   十二、说明条渲染
   ========================================================== */
function renderExplain(){
  var step = current >= 0 ? STEPS[current] : null;
  if (!step){
    explainBody.innerHTML = '<em style="color:#8b949e;">点击「▶ 自动播放」或「下一步 ▶」开始逐条执行程序。快捷键：空格 播放/暂停，←/→ 上一步/下一步，R 重置，F 全屏，M 缩略图，H 显示/隐藏全部面板。</em>';
    stepCounter.textContent = '步骤 — / ' + STEPS.length;
    return;
  }
  var isHit = getHitLines(current).length > 0;
  explainBody.innerHTML =
    '<span class="ex-line' + (isHit ? ' hit' : '') + '">第 ' + step.line + ' 行</span>' +
    '<strong>' + step.title + '</strong><br>' + step.desc;
  stepCounter.textContent = '步骤 ' + (current+1) + ' / ' + STEPS.length;
}

/* ==========================================================
   十三、缩略图布局 + 与全屏代码区荧光区域完全同步

   核心算法：
   1) 缩略图与全屏代码使用同一份 .code-line 结构，行数 1:1；
   2) 通过"行高比例映射"精确对齐：
      - 全屏行高 fh = fullLine2.offsetTop - fullLine1.offsetTop
      - 缩略图行高 mh = miniLine2.offsetTop - miniLine1.offsetTop
      - 全屏滚动 s → 相对第 1 行顶部偏移 (s - fullLine1.offsetTop) / fh 行
      - 缩略图对应自然 y = miniLine1.offsetTop + 行偏移 × mh
      - 缩略图屏幕 y = miniOffsetY + 自然 y × miniScale
   3) 荧光框高度 = 全屏可见高度 / fh × mh × miniScale
   4) 这样无论字号、行高、视口大小如何变化，荧光框都精确覆盖全屏可见的行。
   ========================================================== */

/* 计算缩略图的缩放比与偏移（同时适配宽高，保证 23 行都可见） */
function measureMini(){
  var cw = miniBody.clientWidth;
  var ch = miniBody.clientHeight;
  if (cw <= 4 || ch <= 4) return false;

  miniInner.style.transform = 'none';
  var W = miniInner.offsetWidth;
  var H = miniInner.offsetHeight;
  if (!W || !H){ miniScale = 1; miniOffsetX = 0; miniOffsetY = 0; return false; }

  /* 同时按宽、高适配，取最小值，保证整块内容可见 */
  var kx = cw / W;
  var ky = ch / H;
  var k = Math.min(kx, ky);
  if (!isFinite(k) || k <= 0) k = 0.1;
  miniScale = k;

  /* 内容比容器小时居中 */
  miniOffsetX = (cw - W * k) / 2;
  miniOffsetY = (ch - H * k) / 2;

  miniInner.style.transform =
    'translate(' + miniOffsetX + 'px,' + miniOffsetY + 'px) scale(' + k + ')';
  miniInner.style.transformOrigin = '0 0';

  return true;
}

/* 读取全屏第 1、2 行的位置，用于计算行高 */
function getFullLineMetrics(){
  var l1 = codeInner.querySelector('.code-line[data-line="1"]');
  var l2 = codeInner.querySelector('.code-line[data-line="2"]');
  if (!l1 || !l2) return null;
  var fh = l2.offsetTop - l1.offsetTop;
  if (fh <= 0) return null;
  return { line1Top: l1.offsetTop, lineH: fh };
}

/* 读取缩略图第 1、2 行的位置，用于计算行高 */
function getMiniLineMetrics(){
  var l1 = miniInner.querySelector('.code-line[data-line="1"]');
  var l2 = miniInner.querySelector('.code-line[data-line="2"]');
  if (!l1 || !l2) return null;
  var mh = l2.offsetTop - l1.offsetTop;
  if (mh <= 0) return null;
  return { line1Top: l1.offsetTop, lineH: mh };
}

/* 视口高亮框 —— 与全屏可见行精确同步 */
function syncMiniViewbox(){
  if (miniScale <= 0) return;
  var fm = getFullLineMetrics();
  var mm = getMiniLineMetrics();
  if (!fm || !mm) return;

  var s = codeWrap.scrollTop;
  var visH = codeWrap.clientHeight;

  /*
    全屏第 1 行内容坐标 = fm.line1Top
    缩略图第 1 行自然坐标 = mm.line1Top
    全屏滚动 s → 相对第 1 行顶部偏移行数 = (s - fm.line1Top) / fm.lineH
    缩略图对应自然 y = mm.line1Top + 行偏移 × mm.lineH
    缩略图屏幕 y = miniOffsetY + 自然 y × miniScale
  */
  var lineOffset = (s - fm.line1Top) / fm.lineH;
  var miniNaturalY = mm.line1Top + lineOffset * mm.lineH;
  var viewTop = miniOffsetY + miniNaturalY * miniScale;

  /* 荧光框高度：全屏可见高度换算到缩略图屏幕像素 */
  var viewH = (visH / fm.lineH) * mm.lineH * miniScale;

  /* 边界处理：荧光框不得超出缩略图内容的可视区 */
  var miniContentTop = miniOffsetY + mm.line1Top * miniScale;
  var miniContentBottom = miniOffsetY
    + (mm.line1Top + 23 * mm.lineH) * miniScale;

  if (viewTop < miniContentTop) viewTop = miniContentTop;
  if (viewTop + viewH > miniContentBottom){
    viewH = Math.max(6, miniContentBottom - viewTop);
  }

  miniView.style.top = viewTop + 'px';
  miniView.style.height = Math.max(6, viewH) + 'px';
}

/* 点击缩略图 → 全屏代码区滚动到对应位置（行索引体系与全屏一致） */
miniBody.addEventListener('click', function(e){
  var fm = getFullLineMetrics();
  var mm = getMiniLineMetrics();
  if (!fm || !mm || miniScale <= 0) return;

  var r = miniBody.getBoundingClientRect();
  var clickY = e.clientY - r.top;

  /* 缩略图屏幕 y → 自然坐标 y */
  var naturalY = (clickY - miniOffsetY) / miniScale;

  /* 自然坐标 → 行索引（相对第 1 行顶部） */
  var lineOffset = (naturalY - mm.line1Top) / mm.lineH;

  /* 行索引 → 全屏内容坐标 */
  var codeContentY = fm.line1Top + lineOffset * fm.lineH;

  /* 定位到该行中点（居中显示） */
  var target = codeContentY - codeWrap.clientHeight / 2;
  if (target < 0) target = 0;

  try{ codeWrap.scrollTo({top: target, behavior:'smooth'}); }
  catch(err){ codeWrap.scrollTop = target; }
});

/* ==========================================================
   十四、总渲染
   ========================================================== */
function renderAll(){
  renderCode();
  renderVars();
  renderOut();
  renderExplain();
  syncMiniViewbox();
  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;
}

/* ==========================================================
   十五、播放控制
   ========================================================== */
function updatePlayBtn(){
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  btnPlay.classList.toggle('playing', playing);
}
function tick(){
  if (current >= STEPS.length - 1){ pause(); return; }
  current += 1;
  renderAll();
  if (current >= STEPS.length - 1) pause();
}
function play(){
  if (playing) return;
  if (current >= STEPS.length - 1){ current = -1; renderAll(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}
function pause(){
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}
function nextStep(){ pause(); if (current < STEPS.length - 1){ current += 1; renderAll(); } }
function prevStep(){ pause(); if (current > -1){ current -= 1; renderAll(); } }
function resetAll(){
  pause();
  current = -1;
  lastOutSig = '';
  consoleBody.innerHTML = '';
  renderAll();
}

/* ==========================================================
   十六、面板系统：拖动 / 任意调整大小 / 点击置顶 / 折叠 / 关闭
   ========================================================== */
var panels = Array.prototype.slice.call(document.querySelectorAll('.panel'));
var zTop = 10;

function bringToFront(p){
  if (!p) return;
  zTop += 1;
  p.style.zIndex = zTop;
  for (var i=0;i<panels.length;i++){
    panels[i].classList.toggle('active', panels[i] === p);
  }
}

/* 任意点击 / 触摸 / 聚焦 → 立即置顶 */
panels.forEach(function(p){
  p.addEventListener('pointerdown', function(){ bringToFront(p); }, true);
  p.addEventListener('focusin',     function(){ bringToFront(p); }, true);
});

/* 拖动 */
function makeDraggable(p, handle){
  var dragging = false, sx=0, sy=0, ox=0, oy=0;
  handle.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    var r = p.getBoundingClientRect();
    p.style.right = 'auto'; p.style.bottom = 'auto';
    p.style.left = r.left + 'px';
    p.style.top  = r.top  + 'px';
    if (!p.style.width)  p.style.width  = r.width  + 'px';
    if (!p.style.height) p.style.height = r.height + 'px';
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = r.left;    oy = r.top;
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
    bringToFront(p);
  });
  handle.addEventListener('pointermove', function(e){
    if (!dragging) return;
    p.style.left = (ox + e.clientX - sx) + 'px';
    p.style.top  = (oy + e.clientY - sy) + 'px';
  });
  function end(e){
    if (!dragging) return;
    dragging = false;
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
  }
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

/* 调整大小 — 不设最小/最大限制 */
function makeResizable(p, handle){
  var resizing = false, sx=0, sy=0, ow=0, oh=0;
  handle.addEventListener('pointerdown', function(e){
    var r = p.getBoundingClientRect();
    p.style.right = 'auto'; p.style.bottom = 'auto';
    p.style.left = r.left + 'px';
    p.style.top  = r.top  + 'px';
    p.style.width  = r.width  + 'px';
    p.style.height = r.height + 'px';
    resizing = true;
    sx = e.clientX; sy = e.clientY;
    ow = r.width;   oh = r.height;
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
    e.stopPropagation();
    bringToFront(p);
  });
  handle.addEventListener('pointermove', function(e){
    if (!resizing) return;
    var w = ow + (e.clientX - sx);
    var h = oh + (e.clientY - sy);
    if (w < 0) w = 0;
    if (h < 0) h = 0;
    p.style.width  = w + 'px';
    p.style.height = h + 'px';
    if (p.id === 'p-mini'){
      if (measureMini()) syncMiniViewbox();
    }
  });
  function end(e){
    if (!resizing) return;
    resizing = false;
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
    if (p.id === 'p-mini'){
      if (measureMini()) syncMiniViewbox();
    }
  }
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
}

panels.forEach(function(p){
  var head = p.querySelector('.p-head');
  var grip = p.querySelector('.p-resize');
  if (head) makeDraggable(p, head);
  if (grip) makeResizable(p, grip);
});

/* 折叠 / 关闭 按钮 */
document.addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.dataset) return;
  if (t.dataset.close){
    var p = document.getElementById(t.dataset.close);
    if (p) p.classList.add('hidden');
  }
  if (t.dataset.collapse){
    var p2 = document.getElementById(t.dataset.collapse);
    if (p2){
      p2.classList.toggle('collapsed');
      if (p2.id === 'p-mini'){
        window.setTimeout(function(){
          if (measureMini()) syncMiniViewbox();
        }, 60);
      }
    }
  }
});

/* 重置布局 */
function resetLayout(){
  panels.forEach(function(p){
    p.classList.remove('hidden','collapsed','active');
    p.style.left = ''; p.style.top = '';
    p.style.right = ''; p.style.bottom = '';
    p.style.width = ''; p.style.height = '';
    p.style.zIndex = '';
  });
  zTop = 10;
  window.setTimeout(function(){
    if (measureMini()) syncMiniViewbox();
    bringToFront(document.getElementById('p-top'));
  }, 80);
}

/* 全部面板显示/隐藏 */
function toggleAllPanels(){
  var anyVisible = panels.some(function(p){ return !p.classList.contains('hidden'); });
  panels.forEach(function(p){
    if (anyVisible) p.classList.add('hidden');
    else p.classList.remove('hidden');
  });
  if (!anyVisible) bringToFront(document.getElementById('p-top'));
  window.setTimeout(function(){
    if (measureMini()) syncMiniViewbox();
  }, 60);
}
function togglePanel(id){
  var p = document.getElementById(id);
  if (!p) return;
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden')) bringToFront(p);
  window.setTimeout(function(){
    if (p.id === 'p-mini' && measureMini()) syncMiniViewbox();
  }, 60);
}

/* ==========================================================
   十七、事件绑定
   ========================================================== */
btnPlay.addEventListener('click', function(){ playing ? pause() : play(); });
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnReset').addEventListener('click', resetAll);
document.getElementById('btnLayout').addEventListener('click', resetLayout);
document.getElementById('btnFull').addEventListener('click', function(){
  if (!document.fullscreenElement){
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});

speedInput.addEventListener('input', function(){
  speed = Number(speedInput.value);
  speedLabel.textContent = (speed/1000).toFixed(1) + 's';
  if (playing){
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

/* 全屏代码区滚动 → 缩略图荧光视口框实时同步（requestAnimationFrame 节流） */
var miniSyncPending = false;
function requestMiniSync(){
  if (miniSyncPending) return;
  miniSyncPending = true;
  window.requestAnimationFrame(function(){
    miniSyncPending = false;
    syncMiniViewbox();
  });
}
codeWrap.addEventListener('scroll', requestMiniSync, {passive:true});

window.addEventListener('resize', function(){
  window.setTimeout(function(){
    if (measureMini()) syncMiniViewbox();
  }, 80);
});

/* 全局快捷键 */
document.addEventListener('keydown', function(e){
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); return; }
  if (e.code === 'ArrowRight'){ e.preventDefault(); nextStep(); return; }
  if (e.code === 'ArrowLeft'){ e.preventDefault(); prevStep(); return; }
  if (e.code === 'KeyR'){ resetAll(); return; }
  if (e.code === 'KeyF'){
    if (!document.fullscreenElement){
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
    return;
  }
  if (e.code === 'KeyM'){ togglePanel('p-mini'); return; }
  if (e.code === 'KeyH'){ toggleAllPanels(); return; }
});

/* ==========================================================
   十八、初始化
   ========================================================== */
speedLabel.textContent = (speed/1000).toFixed(1) + 's';

/* 初次渲染：先渲染内容，再测量缩略图，再同步荧光框 */
renderAll();
window.requestAnimationFrame(function(){
  if (measureMini()) syncMiniViewbox();
  bringToFront(document.getElementById('p-top'));
});

/* 多次延迟重算，确保字体/布局稳定后再定格 */
window.setTimeout(function(){
  if (measureMini()) syncMiniViewbox();
}, 150);
window.setTimeout(function(){
  if (measureMini()) syncMiniViewbox();
}, 600);

/* 字体加载完成后再次同步 */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){
    if (measureMini()) syncMiniViewbox();
  });
}

})();
</script>
</body>
</html>
