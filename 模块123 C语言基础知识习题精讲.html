<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>C语言习题精讲 · 交互式PPT</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* ===== 完全复用第一份HTML的样式，包括滚动条 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a1a2a;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }

        .slides-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw;
            height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar {
            width: 10px;
        }
        .slide::-webkit-scrollbar-track {
            background: #f0f4fa;
            border-radius: 8px;
        }
        .slide::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 8px;
        }
        .slide::-webkit-scrollbar-thumb:hover {
            background: #a0b0c0;
        }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700;
            color: #0a2a4a;
            margin-bottom: 0.4vh;
            line-height: 1.2;
            flex-shrink: 0;
        }
        .slide-title .hl {
            color: #e88934;
        }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72;
            font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh;
            margin-bottom: 0.8vh;
            flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff;
            padding: 0.8vh 2.5vw;
            border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 1vh;
            flex-shrink: 0;
        }
        .core-takeaway strong {
            color: #e88934;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2vh 2vw;
        }
        .content-grid.single {
            grid-template-columns: 1fr;
        }
        .content-grid.three {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .info-block {
            background: #f8fafc;
            padding: 1vh 1.8vw;
            border-radius: 16px;
            border: 1px solid #e9edf4;
            font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600;
            color: #0a2a4a;
            margin-bottom: 0.2vh;
        }
        .info-block p,
        .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44;
            line-height: 1.5;
        }
        .info-block ul {
            padding-left: 2vw;
            margin: 0.2vh 0;
        }
        .info-block ul li {
            margin-bottom: 0.1vh;
        }

        .data-highlight {
            background: #0a2a4a;
            color: #fff;
            padding: 0.2vh 1.5vw;
            border-radius: 40px;
            font-size: clamp(28px, 3vh, 40px);
            font-weight: 600;
            display: inline-block;
        }

        .code-block {
            background: #132433;
            border-radius: 16px;
            padding: 1.2vh 2vw;
            margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .code-block .comment {
            color: #7a9bb5;
        }
        .code-block .keyword {
            color: #ffb347;
        }
        .code-block .string {
            color: #8bcb8b;
        }
        .code-block .func {
            color: #7fc1ff;
        }
        .code-block .num {
            color: #f5a97f;
        }
        .code-label {
            display: inline-block;
            background: #0a2a4a;
            color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600;
            padding: 0.1vh 1.5vw;
            border-radius: 30px;
            margin-bottom: 0.2vh;
            letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a;
            border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .table-wrap {
            overflow-x: auto;
            margin: 0.4vh 0;
        }
        .styled-table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(22px, 2.4vh, 32px);
            background: #f8fafc;
            border-radius: 14px;
            overflow: hidden;
        }
        .styled-table thead {
            background: #0a2a4a;
            color: #fff;
        }
        .styled-table th,
        .styled-table td {
            padding: 0.6vh 1vw;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td {
            border-bottom: none;
        }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .slide-cover .main-title {
            font-size: clamp(64px, 8vh, 96px);
            font-weight: 800;
            color: #0a2a4a;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .slide-cover .sub-title {
            font-size: clamp(36px, 4.5vh, 56px);
            font-weight: 300;
            color: #e88934;
            margin: 1vh 0 2vh 0;
            letter-spacing: 4px;
        }
        .slide-cover .divider-line {
            background: #0a2a4a;
            height: 4px;
            width: 12vw;
            border-radius: 4px;
            margin: 1.5vh auto 2.5vh auto;
        }
        .slide-cover .info-text {
            font-size: clamp(30px, 3.6vh, 48px);
            color: #1f2e44;
            font-weight: 500;
        }
        .slide-cover .date-text {
            font-size: clamp(26px, 3vh, 40px);
            color: #6a7e96;
            margin-top: 1.5vh;
        }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .slide-end .end-title {
            font-size: clamp(68px, 8vh, 96px);
            font-weight: 300;
            color: #0a2a4a;
            letter-spacing: 6px;
        }
        .slide-end .end-line {
            background: #e88934;
            height: 4px;
            width: 10vw;
            border-radius: 4px;
            margin: 2vh auto 3vh auto;
        }
        .slide-end .end-sub {
            font-size: clamp(32px, 3.8vh, 48px);
            color: #1f2e44;
            font-weight: 500;
        }
        .slide-end .end-desc {
            font-size: clamp(26px, 3vh, 40px);
            color: #6a7e96;
            margin-top: 1.2vh;
        }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .slide-chapter .ch-title {
            font-size: clamp(48px, 6vh, 72px);
            font-weight: 700;
            letter-spacing: 2px;
        }
        .slide-chapter .ch-sub {
            font-size: clamp(30px, 3.6vh, 48px);
            color: #b8d0e8;
            margin-top: 1vh;
        }
        .slide-chapter .ch-desc {
            font-size: clamp(28px, 3.2vh, 44px);
            color: #d0dce8;
            margin-top: 1.5vh;
            max-width: 80%;
            line-height: 1.6;
        }

        /* 移除原有的翻页区域，改用坐标检测，因此隐藏它们 */
        .click-area {
            display: none;
        }

        .chart-placeholder {
            background: #f0f6fe;
            border: 3px dashed #8aa9d0;
            border-radius: 20px;
            padding: 1.5vh 2vw;
            text-align: center;
            color: #2a4a6a;
            font-weight: 500;
            margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon {
            font-size: clamp(44px, 5vh, 64px);
            display: block;
            margin-bottom: 0.3vh;
        }

        /* ===== 习题卡片 & 按钮 ===== */
        .exercise-card {
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e9edf4;
            padding: 0.8vh 1.6vw;
            margin-bottom: 0.6vh;
            font-size: clamp(26px, 2.8vh, 38px);
            transition: border-color 0.2s;
            text-align: left;
        }
        .exercise-card .q-text {
            font-weight: 500;
            color: #0a2a4a;
            margin-bottom: 0.2vh;
            font-size: clamp(26px, 2.8vh, 38px);
        }
        .exercise-card .q-options {
            color: #1f2e44;
            font-size: clamp(24px, 2.6vh, 36px);
            padding-left: 1vw;
            line-height: 1.6;
        }
        .exercise-card .q-options .opt-label {
            font-weight: 600;
            color: #0a2a4a;
        }

        .answer-btn-wrapper {
            text-align: center;
            margin-top: 0.3vh;
        }
        .answer-btn {
            display: inline-block;
            background: #0a2a4a;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 0.2vh 2.5vw;
            font-size: clamp(22px, 2.4vh, 32px);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: inherit;
            pointer-events: auto;
            position: relative;
            z-index: auto;
        }
        .answer-btn:hover {
            background: #1a3a5a;
        }
        .answer-btn:active {
            transform: scale(0.96);
        }
        .answer-btn.showing {
            background: #e88934;
        }
        .answer-btn.showing:hover {
            background: #d07820;
        }

        .answer-panel {
            display: none;
            background: #f0f6fe;
            border-radius: 12px;
            padding: 0.6vh 1.6vw;
            margin-top: 0.4vh;
            border-left: 5px solid #e88934;
            font-size: clamp(24px, 2.6vh, 36px);
            line-height: 1.6;
            overflow: hidden;
            transition: max-height 0.3s ease;
            text-align: left;
        }
        .answer-panel.open {
            display: block;
        }
        .answer-panel .ans-label {
            font-weight: 700;
            color: #e88934;
        }
        .answer-panel .ans-detail {
            color: #1f2e44;
        }
        .answer-panel .ans-detail code {
            background: #e8edf4;
            padding: 0.05vh 0.6vw;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
        }
        .answer-panel .ans-detail .hl-orange {
            color: #e88934;
            font-weight: 600;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 0.4vh;
            margin-top: 0.2vh;
            flex: 1 1 auto;
        }
        .exercise-list::-webkit-scrollbar {
            width: 6px;
        }
        .exercise-list::-webkit-scrollbar-track {
            background: #f0f4fa;
            border-radius: 8px;
        }
        .exercise-list::-webkit-scrollbar-thumb {
            background: #c0d0e0;
            border-radius: 8px;
        }

        .exercise-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6vh 1.5vw;
        }
        .exercise-grid-2 .exercise-card {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .slide {
                padding: 2vh 4vw;
            }
            .exercise-grid-2 {
                grid-template-columns: 1fr;
                gap: 0.4vh 0;
            }
            .slide-title {
                font-size: clamp(36px, 4.5vh, 48px);
            }
            .core-takeaway {
                font-size: clamp(28px, 3.2vh, 38px);
            }
            .info-block {
                font-size: clamp(24px, 2.6vh, 34px);
            }
            .code-block {
                font-size: clamp(16px, 2vh, 24px);
                padding: 1vh 2vw;
            }
            .slide-cover .main-title {
                font-size: clamp(44px, 5.5vh, 60px);
            }
            .slide-cover .sub-title {
                font-size: clamp(28px, 3.4vh, 40px);
            }
            .slide-chapter .ch-title {
                font-size: clamp(36px, 4.5vh, 52px);
            }
            .slide-end .end-title {
                font-size: clamp(48px, 6vh, 68px);
            }
            .styled-table {
                font-size: clamp(18px, 2vh, 26px);
            }
            .exercise-card {
                font-size: clamp(22px, 2.4vh, 32px);
                padding: 0.6vh 1.2vw;
            }
            .exercise-card .q-text {
                font-size: clamp(22px, 2.4vh, 32px);
            }
            .exercise-card .q-options {
                font-size: clamp(20px, 2.2vh, 30px);
            }
            .answer-btn {
                font-size: clamp(18px, 2vh, 28px);
                padding: 0.15vh 4vw;
            }
            .answer-panel {
                font-size: clamp(20px, 2.2vh, 30px);
            }
        }
    </style>
</head>
<body>
    <!-- 移除翻页区域，不再使用 -->
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 习题数据 —— 全部从PDF提取（完整数据）
        // ============================================================

        // 辅助：生成习题卡片HTML（按钮居中）
        function exerciseCard(q, idx) {
            const qId = 'q_' + idx + '_' + Math.random().toString(36).substr(2, 6);
            let optHtml = '';
            if (q.options && q.options.length) {
                optHtml = '<div class="q-options">' + q.options.map(o => '<div>' + o + '</div>').join('') + '</div>';
            }
            let ansHtml = '';
            if (q.answer) {
                const ansLabel = q.answerLabel || '正确答案';
                ansHtml = `
                    <div class="answer-panel" id="${qId}_ans">
                        <div><span class="ans-label">${ansLabel}：</span><span class="ans-detail">${q.answer}</span></div>
                        ${q.analysis ? `<div class="ans-detail" style="margin-top:0.2vh;">${q.analysis}</div>` : ''}
                    </div>
                `;
            }
            return `
                <div class="exercise-card" id="${qId}_card">
                    <div class="q-text">${q.question}</div>
                    ${optHtml}
                    <div class="answer-btn-wrapper">
                        <button class="answer-btn" data-target="${qId}_ans" onclick="toggleAnswer('${qId}_ans', this)">📖 显示答案与解析</button>
                    </div>
                    ${ansHtml}
                </div>
            `;
        }

        window.toggleAnswer = function(targetId, btn) {
            const panel = document.getElementById(targetId);
            if (!panel) return;
            const isOpen = panel.classList.contains('open');
            if (isOpen) {
                panel.classList.remove('open');
                btn.textContent = '📖 显示答案与解析';
                btn.classList.remove('showing');
            } else {
                panel.classList.add('open');
                btn.textContent = '📖 收起答案';
                btn.classList.add('showing');
            }
        };

        function exerciseSlide(title, subtitle, takeaway, questions, cols = 1) {
            let gridClass = cols === 2 ? 'exercise-grid-2' : 'exercise-list';
            let itemsHtml = questions.map((q, i) => exerciseCard(q, i)).join('');
            let content = `
                <div class="core-takeaway">${takeaway}</div>
                <div class="${gridClass}" style="flex:1 1 auto;  padding-right:0.2vw;">${itemsHtml}</div>
            `;
            return { title, subtitle, contentBlocks: [{ type: 'custom', html: content }], chapter: '' };
        }

        function chapterSlide(title, subtitle, desc) {
            return { type: 'chapter', title, subtitle, desc };
        }

        function coverSlide(mainTitle, subTitle, date) {
            return { type: 'cover', mainTitle, subTitle, date };
        }

        function endSlide(title, sub, desc) {
            return { type: 'end', title, sub, desc };
        }

        function chunk(arr, size) {
            const result = [];
            for (let i = 0; i < arr.length; i += size) {
                result.push(arr.slice(i, i + size));
            }
            return result;
        }

        // ============================================================
        // 全部习题数据（按PDF顺序，完整）
        // ============================================================

        // ----- 练习题一：进制转换（填空题） -----
        const exercise1 = [
            { question: '(76)₁₀ = ( )₂', answer: '1001100₂', analysis: '76 = 64+8+4 = 2⁶+2³+2² → 1001100₂' },
            { question: '(68.25)₁₀ = ( )₂', answer: '1000100.01₂', analysis: '68=64+4=2⁶+2² → 1000100₂；0.25=2⁻² → .01' },
            { question: '(139)₁₀ = ( )₂', answer: '10001011₂', analysis: '139=128+8+2+1=2⁷+2³+2¹+2⁰ → 10001011₂' },
            { question: '(1770.75)₁₀ = ( )₂', answer: '11011101010.11₂', analysis: '1770=1024+512+128+64+32+8+2=2¹⁰+2⁹+2⁷+2⁶+2⁵+2³+2¹ → 11011101010₂；0.75=0.5+0.25=2⁻¹+2⁻² → .11' },
            { question: '(1024)₁₀ = ( )₂', answer: '10000000000₂', analysis: '1024=2¹⁰ → 1后面10个0' },
            { question: '(2015.875)₁₀ = ( )₂', answer: '11111011111.111₂', analysis: '2015=1024+512+256+128+64+16+8+4+2+1=2¹⁰+2⁹+2⁸+2⁷+2⁶+2⁴+2³+2²+2¹+2⁰ → 11111011111₂；0.875=0.5+0.25+0.125=2⁻¹+2⁻²+2⁻³ → .111' },
            { question: '(100)₂ = ( )₁₀', answer: '4₁₀', analysis: '1×2² + 0×2¹ + 0×2⁰ = 4' },
            { question: '(9.375)₁₀ = ( )₂', answer: '1001.011₂', analysis: '9=8+1=2³+2⁰ → 1001₂；0.375=0.25+0.125=2⁻²+2⁻³ → .011' },
            { question: '(111111)₂ = ( )₁₀', answer: '63₁₀', analysis: '2⁵+2⁴+2³+2²+2¹+2⁰ = 32+16+8+4+2+1 = 63' },
            { question: '(101101101)₂ = ( )₁₀', answer: '365₁₀', analysis: '2⁸+2⁶+2⁵+2³+2²+2⁰ = 256+64+32+8+4+1 = 365' },
            { question: '(0.101)₂ = ( )₁₀', answer: '0.625₁₀', analysis: '1×2⁻¹ + 0×2⁻² + 1×2⁻³ = 0.5 + 0.125 = 0.625' },
            { question: '(0.111)₂ = ( )₁₀', answer: '0.875₁₀', analysis: '1×2⁻¹ + 1×2⁻² + 1×2⁻³ = 0.5+0.25+0.125 = 0.875' },
            { question: '(0.0011)₂ = ( )₁₀', answer: '0.1875₁₀', analysis: '0×2⁻¹+0×2⁻²+1×2⁻³+1×2⁻⁴ = 0.125+0.0625 = 0.1875' },
            { question: '(1011.101)₂ = ( )₁₀', answer: '11.625₁₀', analysis: '整数部分 8+2+1=11；小数部分 0.5+0.125=0.625' },
            { question: '(0.625)₁₀ = ( )₂', answer: '0.101₂', analysis: '0.625 = 0.5+0.125 = 2⁻¹+2⁻³ → .101' },
            { question: '(10101.011)₂ = ( )₁₀', answer: '21.375₁₀', analysis: '整数 16+4+1=21；小数 0.25+0.125=0.375' },
            { question: '(0.15)₁₀ = ( )₂', answer: '0.001001...₂ (近似)', analysis: '0.15×2=0.3→0, 0.3×2=0.6→0, 0.6×2=1.2→1, 0.2×2=0.4→0, 0.4×2=0.8→0, 0.8×2=1.6→1... 循环' },
            { question: '(101010.001)₂ = ( )₁₀', answer: '42.125₁₀', analysis: '整数 32+8+2=42；小数 0.125' },
            { question: '(100.625)₁₀ = ( )₂', answer: '1100100.101₂', analysis: '100=64+32+4=2⁶+2⁵+2² → 1100100₂；0.625=0.5+0.125=2⁻¹+2⁻³ → .101' },
            { question: '(111001.01)₂ = ( )₁₀', answer: '57.25₁₀', analysis: '整数 32+16+8+1=57；小数 0.25' },
        ];

        // ----- 练习题二：二/八/十六→十进制 -----
        const exercise2 = [
            { question: '(11000101)₂ = ( )₁₀', options: ['A. 197', 'B. 198', 'C. 196', 'D. 195'], answer: 'A. 197',
            analysis: '2⁷+2⁶+2²+2⁰ = 128+64+4+1 = 197' },

        let current = 0;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;

        // 鼠标点击翻页（左1/3、右1/3，忽略按钮点击）
        document.addEventListener('click', function(e) {

            if (e.target.closest('.answer-btn') || e.target.closest('button') || e.target.closest('input') || e.target.closest('textarea')) {
                return;
            }
            const x = e.clientX;
            const w = window.innerWidth;
            if (x < w * 0.3333) {
                goTo(current - 1);
            } else if (x > w * 0.6667) {
                goTo(current + 1);
            }
        });

            if (e.key === 'ArrowLeft') goTo(current - 1);

        });

        let touchStartX = 0, touchStartY = 0;

            const diffX = touchStartX - e.changedTouches[0].screenX;
            const diffY = touchStartY - e.changedTouches[0].screenY;

                else goTo(current - 1);
            }
        }, { passive: true });
