<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>模块4 · 运算符——C语言的血液</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1a2a; font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif; }

        .slides-container {
            display: flex;
            width: 100vw; height: 100vh;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            background: #f5f9ff;
        }

        .slide {
            flex: 0 0 100vw; height: 100vh;
            padding: 2.5vh 5vw 2.5vh 5vw;
            display: flex; flex-direction: column; justify-content: flex-start;
            overflow-y: auto;
            background: #ffffff;
            scrollbar-width: thin;
            position: relative;
            font-size: clamp(32px, 3.2vh, 48px);
        }
        .slide::-webkit-scrollbar { width: 10px; }
        .slide::-webkit-scrollbar-track { background: #f0f4fa; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb { background: #c0d0e0; border-radius: 8px; }
        .slide::-webkit-scrollbar-thumb:hover { background: #a0b0c0; }

        .slide-title {
            font-size: clamp(48px, 5.5vh, 72px);
            font-weight: 700; color: #0a2a4a;
            margin-bottom: 0.4vh; line-height: 1.2; flex-shrink: 0;
        }
        .slide-title .hl { color: #e88934; }
        .slide-sub {
            font-size: clamp(32px, 3.6vh, 48px);
            color: #4a5c72; font-weight: 400;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.6vh; margin-bottom: 0.8vh; flex-shrink: 0;
        }
        .core-takeaway {
            background: #f7faff;
            padding: 0.8vh 2.5vw; border-radius: 16px;
            border-left: 6px solid #e88934;
            font-size: clamp(32px, 3.4vh, 46px);
            color: #0a2a4a; font-weight: 500; line-height: 1.5;
            margin-bottom: 1vh; flex-shrink: 0;
        }
        .core-takeaway strong { color: #e88934; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2vh 2vw; }
        .content-grid.single { grid-template-columns: 1fr; }
        .content-grid.three { grid-template-columns: 1fr 1fr 1fr; }
        .info-block {
            background: #f8fafc; padding: 1vh 1.8vw; border-radius: 16px;
            border: 1px solid #e9edf4; font-size: clamp(28px, 3vh, 40px);
        }
        .info-block h4 {
            font-size: clamp(30px, 3.2vh, 42px);
            font-weight: 600; color: #0a2a4a; margin-bottom: 0.2vh;
        }
        .info-block p, .info-block li {
            font-size: clamp(28px, 3vh, 40px);
            color: #1f2e44; line-height: 1.5;
        }
        .info-block ul { padding-left: 2vw; margin: 0.2vh 0; }
        .info-block ul li { margin-bottom: 0.1vh; }

        .data-highlight { background: #0a2a4a; color: #fff; padding: 0.2vh 1.5vw; border-radius: 40px; font-size: clamp(28px, 3vh, 40px); font-weight: 600; display: inline-block; }

        .code-block {
            background: #132433; border-radius: 16px;
            padding: 1.2vh 2vw; margin: 0.4vh 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: clamp(20px, 2.2vh, 30px);
            line-height: 1.8;
            color: #e3eaf2;
            border: 1px solid #1e3349;
            white-space: pre-wrap; word-break: break-word;
        }
        .code-block .comment { color: #7a9bb5; }
        .code-block .keyword { color: #ffb347; }
        .code-block .string { color: #8bcb8b; }
        .code-block .func { color: #7fc1ff; }
        .code-block .num { color: #f5a97f; }
        .code-label {
            display: inline-block; background: #0a2a4a; color: #fff;
            font-size: clamp(20px, 2.2vh, 30px);
            font-weight: 600; padding: 0.1vh 1.5vw; border-radius: 30px;
            margin-bottom: 0.2vh; letter-spacing: 0.3px;
        }
        .output-block {
            background: #1a2a3a; border-radius: 12px;
            padding: 0.6vh 2vw;
            color: #b8d0e8;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(22px, 2.4vh, 32px);
            margin-top: 0.3vh;
            border-left: 6px solid #e88934;
        }

        .chart-placeholder {
            background: #f0f6fe; border: 3px dashed #8aa9d0;
            border-radius: 20px; padding: 1.5vh 2vw;
            text-align: center; color: #2a4a6a;
            font-weight: 500; margin: 0.3vh 0;
            font-size: clamp(28px, 3vh, 40px);
        }
        .chart-placeholder .icon { font-size: clamp(44px, 5vh, 64px); display: block; margin-bottom: 0.3vh; }

        .slide-cover {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-cover .main-title { font-size: clamp(64px, 8vh, 96px); font-weight: 800; color: #0a2a4a; letter-spacing: 2px; line-height: 1.2; }
        .slide-cover .sub-title { font-size: clamp(36px, 4.5vh, 56px); font-weight: 300; color: #e88934; margin: 1vh 0 2vh 0; letter-spacing: 4px; }
        .slide-cover .divider-line { background: #0a2a4a; height: 4px; width: 12vw; border-radius: 4px; margin: 1.5vh auto 2.5vh auto; }
        .slide-cover .info-text { font-size: clamp(30px, 3.6vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-cover .date-text { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.5vh; }

        .slide-end {
            background: linear-gradient(145deg, #ffffff 0%, #f5f9ff 100%);
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-end .end-title { font-size: clamp(68px, 8vh, 96px); font-weight: 300; color: #0a2a4a; letter-spacing: 6px; }
        .slide-end .end-line { background: #e88934; height: 4px; width: 10vw; border-radius: 4px; margin: 2vh auto 3vh auto; }
        .slide-end .end-sub { font-size: clamp(32px, 3.8vh, 48px); color: #1f2e44; font-weight: 500; }
        .slide-end .end-desc { font-size: clamp(26px, 3vh, 40px); color: #6a7e96; margin-top: 1.2vh; }

        .slide-chapter {
            background: linear-gradient(135deg, #0a2a4a 0%, #1a3a5a 100%);
            color: #fff;
            justify-content: center; align-items: center; text-align: center;
        }
        .slide-chapter .ch-title { font-size: clamp(48px, 6vh, 72px); font-weight: 700; letter-spacing: 2px; }
        .slide-chapter .ch-sub { font-size: clamp(30px, 3.6vh, 48px); color: #b8d0e8; margin-top: 1vh; }
        .slide-chapter .ch-desc { font-size: clamp(28px, 3.2vh, 44px); color: #d0dce8; margin-top: 1.5vh; max-width: 80%; line-height: 1.6; }

        .click-area { position: fixed; top: 0; height: 100vh; z-index: 100; cursor: pointer; }
        #clickLeft { left: 0; width: 33.33vw; }
        #clickRight { right: 12px; width: calc(33.33vw - 12px); }
        #clickCenter { left: 33.33vw; width: calc(33.33vw - 12px); cursor: default; }

        .table-wrap { overflow-x: auto; margin: 0.4vh 0; }
        .styled-table {
            width: 100%; border-collapse: collapse;
            font-size: clamp(24px, 2.6vh, 36px);
            background: #f8fafc; border-radius: 14px; overflow: hidden;
        }
        .styled-table thead { background: #0a2a4a; color: #fff; }
        .styled-table th, .styled-table td {
            padding: 0.8vh 1.5vw;
            text-align: left; border-bottom: 1px solid #e2e8f0;
        }
        .styled-table tbody tr:last-child td { border-bottom: none; }

        @media (max-width: 768px) {
            .slide { padding: 2vh 4vw; }
            .content-grid { grid-template-columns: 1fr; gap: 0.8vh 0; }
            .content-grid.three { grid-template-columns: 1fr; }
            .slide-title { font-size: clamp(36px, 4.5vh, 48px); }
            .core-takeaway { font-size: clamp(28px, 3.2vh, 38px); }
            .info-block { font-size: clamp(24px, 2.6vh, 34px); }
            .code-block { font-size: clamp(16px, 2vh, 24px); padding: 1vh 2vw; }
            .slide-cover .main-title { font-size: clamp(44px, 5.5vh, 60px); }
            .slide-cover .sub-title { font-size: clamp(28px, 3.4vh, 40px); }
            .slide-chapter .ch-title { font-size: clamp(36px, 4.5vh, 52px); }
            .slide-end .end-title { font-size: clamp(48px, 6vh, 68px); }
            #clickRight { right: 8px; width: calc(33.33vw - 8px); }
        }
    </style>
</head>
<body>
    <div id="clickLeft" class="click-area"></div>
    <div id="clickCenter" class="click-area"></div>
    <div id="clickRight" class="click-area"></div>
    <div class="slides-container" id="slidesContainer"></div>

    <script>
        // ============================================================
        // 幻灯片数据 (全部知识点，含规则说明+注释代码+运行结果)
        // ============================================================

        // 辅助函数：生成代码块 (每行带注释)
        function codeBlock(code, label = '') {
            return `<div style="margin-top:0.2vh;">
                ${label ? `<div class="code-label">${label}</div>` : ''}
                <div class="code-block">${code}</div>
            </div>`;
        }

        function outputBlock(text) {
            return `<div class="output-block">${text}</div>`;
        }

        function textBlock(html) {
            return `<div class="info-block" style="margin-bottom:0.4vh;">${html}</div>`;
        }

        function tableBlock(headers, rows) {
            let html = `<div class="table-wrap"><table class="styled-table"><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;
            rows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => html += `<td>${cell}</td>`);
                html += `</tr>`;
            });
            html += `</tbody></table></div>`;
            return html;
        }

        function gridBlock(items, cols = 2) {
            let cls = cols === 3 ? 'content-grid three' : (cols === 1 ? 'content-grid single' : 'content-grid');
            let html = items.map(item =>
                `<div class="info-block"><h4>${item.title}</h4><p>${item.content}</p></div>`
            ).join('');
            return `<div class="${cls}">${html}</div>`;
        }

        const slides = [];

        function addSlide(title, subtitle, takeaway, contentBlocks, chapter = '') {
            slides.push({ title, subtitle, takeaway, contentBlocks, chapter });
        }

        // ============================================================
        // 1. 封面 & 目录
        // ============================================================
        slides.push({
            type: 'cover',
            mainTitle: '模块4 · 运算符——C语言的血液',
            subTitle: '15级优先级 · 从括号到逗号',
            date: '授课日期：2026年8月'
        });

        addSlide(
            '📋 课程目录',
            '运算符——C语言的血液',
            '本课件涵盖15级运算符，从最高优先级到最低优先级，逐级深入。',
            [{
                type: 'toc',
                items: [
                    { ch: '体系概览', desc: '15级优先级全景图' },
                    { ch: '第1级', desc: '() [] -> .' },
                    { ch: '第2级', desc: '! ~ ++ -- + - (类型) & * sizeof' },
                    { ch: '第3-5级', desc: '* / % + - << >>' },
                    { ch: '第6-10级', desc: '< <= > >= == != & ^ |' },
                    { ch: '第11-13级', desc: '&& || ?:' },
                    { ch: '第14-15级', desc: '= 复合赋值 ,' },
                    { ch: '综合应用', desc: '奖学金评比' }
                ]
            }]
        );

        // ============================================================
        // 2. 优先级表格 (分3页)
        // ============================================================
        addSlide(
            '15级优先级（第1~5级）',
            '最高优先级',
            '第1级最高，第5级最低。结合方向决定运算顺序。',
            [
                tableBlock(
                    ['优先级', '运算符', '名称', '结合方向'],
                    [
                        ['1', '() [] -> .', '括号、变址、指向成员、成员', '左→右'],
                        ['2', '! ~ ++ -- + - (类型) & * sizeof', '单目运算符', '右→左'],
                        ['3', '* / %', '乘、除、模', '左→右'],
                        ['4', '+ -', '加、减', '左→右'],
                        ['5', '<< >>', '左移、右移', '左→右']
                    ]
                ),
                textBlock('第2级包含10个单目运算符，结合方向为<strong>右→左</strong>。')
            ],
            '体系概览'
        );

        addSlide(
            '15级优先级（第6~10级）',
            '关系与位运算',
            '关系运算优先于位运算，位运算优先级依次为 & ^ |。',
            [
                tableBlock(
                    ['优先级', '运算符', '名称', '结合方向'],
                    [
                        ['6', '< <= > >=', '关系运算符', '左→右'],
                        ['7', '== !=', '等于、不等于', '左→右'],
                        ['8', '&', '按位与', '左→右'],
                        ['9', '^', '按位异或', '左→右'],
                        ['10', '|', '按位或', '左→右']
                    ]
                ),
                textBlock('第7级 <code>==</code> 与第14级 <code>=</code> 功能完全不同，初学者最易混淆。')
            ],
            '体系概览'
        );

        addSlide(
            '15级优先级（第11~15级）',
            '逻辑、条件、赋值、逗号',
            '逻辑运算具有短路特性，赋值优先级极低，逗号最低。',
            [
                tableBlock(
                    ['优先级', '运算符', '名称', '结合方向'],
                    [
                        ['11', '&&', '逻辑与', '左→右'],
                        ['12', '||', '逻辑或', '左→右'],
                        ['13', '?:', '条件运算符', '右→左'],
                        ['14', '= += -= *= /= %= <<= >>= &= ^= |=', '赋值与复合赋值', '右→左'],
                        ['15', ',', '逗号运算符', '左→右']
                    ]
                ),
                textBlock('第11、12级具有<strong>短路求值</strong>特性；第15级逗号优先级最低。')
            ],
            '体系概览'
        );

        // ============================================================
        // 3. 第1级运算符
        // ============================================================
        addSlide(
            '第1级：() 括号运算符',
            '最高优先级 · 强制改变运算顺序',
            '括号内的表达式优先计算，嵌套时内层优先。',
            [
                textBlock('<strong>规则：</strong>括号运算符优先级最高，强制改变表达式的求值顺序。'),
                textBlock('示例：<code>a = a + (a = 4);</code>'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a;                             // 定义整型变量a\n' +
                    '    a = a + (a = 4);                   // 括号内先执行 a=4，再加法，最后赋值\n' +
                    '    printf("%d", a);                   // 输出结果\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('8'),
                textBlock('⚠️ 括号内的 <code>a = 4</code> <strong>不能加分号</strong>，它是表达式的一部分。')
            ],
            '第1级'
        );

        addSlide(
            '第1级：[] -> . 运算符',
            '变址、指向成员、成员',
            '[] 访问数组元素，-> 通过指针访问结构体成员，. 直接访问结构体成员。',
            [
                textBlock('<strong>规则：</strong>三者均为第1级最高优先级。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'struct Student {                        // 定义结构体类型\n' +
                    '    char name[20];                     // 姓名成员\n' +
                    '    int age;                           // 年龄成员\n' +
                    '};\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int arr[3] = {10, 20, 30};         // 定义并初始化数组\n' +
                    '    struct Student stu = {"Tom", 18}; // 定义并初始化结构体变量\n' +
                    '    struct Student *p = &stu;          // 定义指针指向结构体\n' +
                    '    printf("%d\\n", arr[1]);            // [] 变址，输出20\n' +
                    '    printf("%s\\n", stu.name);          // . 成员，输出Tom\n' +
                    '    printf("%d\\n", p->age);            // -> 指向成员，输出18\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('20\nTom\n18')
            ],
            '第1级'
        );

        // ============================================================
        // 4. 第2级：单目运算符
        // ============================================================
        addSlide(
            '第2级：! 逻辑非',
            '非0即1 · 条件等价用法',
            '逻辑非将非0值转为0，0转为1。',
            [
                textBlock('<strong>规则：</strong>!x 当 x 非0时为0，x为0时为1。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 6, b = 0, c = 0, d;        // 定义整型变量\n' +
                    '    d = !a + !b + !c;                  // !6→0, !0→1, !0→1, d=2\n' +
                    '    printf("%d-%d\\n", !d, d);         // !d=0, d=2，输出0-2\n' +
                    '    if (a) printf("a is true\\n");     // 等价于 if(a != 0)\n' +
                    '    if (!b) printf("b is false\\n");   // 等价于 if(b == 0)\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('0-2\na is true\nb is false')
            ],
            '第2级'
        );

        addSlide(
            '第2级：~ 按位取反（正整数）',
            '~6 = -7 · 符号反转',
            '正整数位非：直接对原码取反，得到负数的补码，再求补码。',
            [
                textBlock('<strong>公式：</strong><code>~x = -(x+1)</code>，即 <code>~6 = -7</code>。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 6;                         // 定义正整数6\n' +
                    '    printf("%d\\n", ~a);                // 输出按位取反结果\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('-7'),
                textBlock('计算过程：6的原码 00000110 → 取反 11111001 → 求补码得 -7。')
            ],
            '第2级'
        );

        addSlide(
            '第2级：~ 按位取反（负整数）',
            '~-6 = 5 · 符号反转',
            '负整数位非：先求补码，再取反，结果为正。',
            [
                textBlock('<strong>规则：</strong>负整数位非结果必为正。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = -6;                        // 定义负整数-6\n' +
                    '    printf("%d\\n", ~a);                // 输出按位取反结果\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('5'),
                textBlock('计算：-6的补码 11111010 → 取反 00000101 → 5。')
            ],
            '第2级'
        );

        addSlide(
            '第2级：++ 和 -- 自增自减',
            '前置先变后用 · 后置先用后变',
            '前置先自增（减）再运算，后置先运算再自增（减）。',
            [
                textBlock('<strong>规则：</strong>前置 <code>++i</code> 先自增再取值；后置 <code>i++</code> 先取值再自增。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int i = 3, j = 3;                  // 定义两个变量\n' +
                    '    printf("%d %d\\n", ++i, j++);       // ++i→4, j++→3\n' +
                    '    printf("i=%d, j=%d\\n", i, j);      // i=4, j=4\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('4 3\ni=4, j=4'),
                textBlock('⚠️ 只能用于变量，不能用于常量或表达式。')
            ],
            '第2级'
        );

        addSlide(
            '第2级：自增自减的 printf 陷阱',
            '参数从右向左求值',
            'printf 的参数从右向左求值，导致自增自减的“意外”结果。',
            [

                textBlock('<strong>格式：</strong><code>条件 ? 真值 : 假值</code>'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 7, b = 3, c;               // 定义变量\n' +
                    '    c = a > b ? a + b : a - b;         // 条件成立，取 a+b=10\n' +
                    '    printf("c=%d\\n", c);                // 输出10\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('c=10'),
                textBlock('?: 是表达式，有返回值，可直接赋值。')
            ],
            '第13级'
        );

        addSlide(
            '?: 嵌套与结合性',
            '自右向左结合 · 比较3个数',
            '嵌套 ?: 时，自右向左结合，加括号增强可读性。',
            [
                textBlock('<strong>示例：</strong>求三个数的最大值。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 7, b = 3, c = 5, max;      // 定义变量\n' +
                    '    max = (a > b ? a : b) > c ? (a > b ? a : b) : c;\n' +
                    '    printf("max=%d\\n", max);            // 输出7\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('max=7')
            ],
            '第13级'
        );

        addSlide(
            '?: vs if-else',
            '表达式 vs 语句',
            '?: 是表达式有返回值，if-else 是语句无返回值。',
            [
                tableBlock(
                    ['对比维度', '?: 条件运算符', 'if-else 语句'],
                    [
                        ['本质', '表达式，有返回值', '语句，无返回值'],
                        ['代码量', '简洁，一行', '多行，结构清晰'],
                        ['可赋值', 'c = a>b ? a : b', '不能直接赋值'],
                        ['适用场景', '简单二选一', '复杂多分支逻辑']
                    ]
                )
            ],
            '第13级'
        );

        // ============================================================
        // 8. 第14-15级：赋值与逗号
        // ============================================================
        addSlide(
            '第14级：= 赋值运算符',
            '只能给变量赋值，不能给表达式赋值',
            '= 将右边值赋给左边变量，赋值表达式本身也有值。',
            [
                textBlock('<strong>规则：</strong>左边必须是变量，不能是常量或表达式。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a, b, c;                       // 定义变量\n' +
                    '    a = 10;                            // 正确\n' +
                    '    // b + c = 20;                    // 错误！不能给表达式赋值\n' +
                    '    a = b = c = 5;                    // 连续赋值，自右向左\n' +
                    '    printf("a=%d, b=%d, c=%d\\n", a, b, c);\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('a=5, b=5, c=5')
            ],
            '第14级'
        );

        addSlide(
            '第14级：复合赋值运算符',
            'a += b 等价于 a = a + b',
            '复合赋值将运算与赋值结合，更简洁。',
            [
                textBlock('<strong>示例：</strong><code>a += b</code> 等价于 <code>a = a + b</code>。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 5, b = 3;                  // 定义变量\n' +
                    '    a += b;                            // 等价于 a = a + b，a=8\n' +
                    '    printf("a += b 后 a=%d\\n", a);      // 输出8\n' +
                    '    a *= 2;                            // 等价于 a = a * 2，a=16\n' +
                    '    printf("a *= 2 后 a=%d\\n", a);      // 输出16\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('a += b 后 a=8\na *= 2 后 a=16')
            ],
            '第14级'
        );

        addSlide(
            '复合赋值连续运算',
            'a += a -= 12 + 8 的逐步推导',
            '自右向左计算，注意变量值的变化。',
            [
                textBlock('<strong>示例：</strong><code>int a = 5; a += a -= 12 + 8;</code>'),
                textBlock('步骤：① 12+8=20；② a-=20 → a=-15；③ a+=-15 → a=-30。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a = 5;                         // 定义并初始化a\n' +
                    '    a += a -= 12 + 8;                  // 自右向左，先算a-=20，再a+=-15\n' +
                    '    printf("a=%d\\n", a);                // 输出-30\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('a=-30')
            ],
            '第14级'
        );

        addSlide(
            '第15级：逗号运算符',
            '优先级最低 · 以最后一个表达式的值为结果',
            '自左向右执行，整体值取最后一个表达式。',
            [
                textBlock('<strong>规则：</strong><code>表达式1, 表达式2, ..., 表达式n</code>，结果为表达式n的值。'),
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int a, b, c, result;               // 定义变量\n' +
                    '    result = (a = 3, b = 5, c = 7, a + b + c); // 逗号表达式，值为15\n' +
                    '    printf("result=%d\\n", result);      // 输出15\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('result=15'),
                textBlock('⚠️ 变量声明中的逗号是分隔符，表达式中的逗号才是运算符。')
            ],
            '第15级'
        );

        addSlide(
            'for 循环中的逗号运算符',
            'i = 0, j = 10; i < j; i++, j--',
            '逗号常用于 for 循环的初始化与迭代部分。',
            [
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int i, j;                          // 定义循环变量\n' +
                    '    for (i = 0, j = 5; i < 3; i++, j--) { // 逗号分隔多个表达式\n' +
                    '        printf("i=%d, j=%d\\n", i, j);\n' +
                    '    }\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('i=0, j=5\ni=1, j=4\ni=2, j=3')
            ],
            '第15级'
        );

        // ============================================================
        // 9. 综合应用：奖学金评比
        // ============================================================
        addSlide(
            '综合应用：奖学金评比规则',
            '一等奖、二等奖、三等奖、无奖',
            '各科必须≥60分方可评比，按等级条件输出对应奖项。',
            [
                tableBlock(
                    ['等级', '条件', '输出'],
                    [
                        ['一等奖', '各科≥90 或 平均≥90', 'First prize!'],
                        ['二等奖', '各科≥80且<90 或 平均≥80且<90', 'Second prize!'],
                        ['三等奖', '各科≥70且<80 或 平均≥70且<80', 'Third prize!'],
                        ['无奖', '不符合上述条件或有科<60', 'No prize!']
                    ]
                )
            ],
            '综合应用'
        );

        addSlide(
            '奖学金评比核心逻辑',
            'if-else if 多分支 · && 与 || 的层次',
            '先判断各科是否及格，再按等级条件从高到低判断。',
            [
                textBlock('<strong>逻辑结构：</strong>'),
                codeBlock(
                    'if (各科<60) → No prize!\n' +
                    'else if (一等奖条件) → First prize!\n' +
                    'else if (二等奖条件) → Second prize!\n' +
                    'else if (三等奖条件) → Third prize!\n' +
                    'else → No prize!',
                    ''
                ),
                textBlock('各科条件用 <code>&&</code> 连接，平均分条件用 <code>||</code> 并列。')
            ],
            '综合应用'
        );

        addSlide(
            '奖学金评比完整代码',
            '每行带注释 · 运行示例',
            '完整程序，输入三科成绩，输出奖项。',
            [
                codeBlock(
                    '#include &lt;stdio.h&gt;                   // 包含标准输入输出头文件\n' +
                    'int main() {                            // 定义主函数\n' +
                    '    int chinese, math, english;         // 定义三科成绩\n' +
                    '    float avg;                          // 定义平均分\n' +
                    '    printf("请输入语数外成绩: ");        // 提示输入\n' +
                    '    scanf("%d%d%d", &chinese, &math, &english); // 输入成绩\n' +
                    '    avg = (chinese + math + english) / 3.0; // 计算平均分\n' +
                    '    if (chinese < 60 || math < 60 || english < 60) { // 先判断是否及格\n' +
                    '        printf("No prize!\\n");\n' +
                    '    } else if ((chinese >= 90 && math >= 90 && english >= 90) || avg >= 90) {\n' +
                    '        printf("First prize!\\n");\n' +
                    '    } else if ((chinese >= 80 && math >= 80 && english >= 80 && chinese < 90 && math < 90 && english < 90) || (avg >= 80 && avg < 90)) {\n' +
                    '        printf("Second prize!\\n");\n' +
                    '    } else if ((chinese >= 70 && math >= 70 && english >= 70 && chinese < 80 && math < 80 && english < 80) || (avg >= 70 && avg < 80)) {\n' +
                    '        printf("Third prize!\\n");\n' +
                    '    } else {\n' +
                    '        printf("No prize!\\n");\n' +
                    '    }\n' +
                    '    return 0;                          // 返回0，程序结束\n' +
                    '}',
                    '编写程序'
                ),
                outputBlock('输入：95 92 88  →  输出：First prize!\n输入：82 85 78  →  输出：Second prize!\n输入：72 75 70  →  输出：Third prize!\n输入：65 55 60  →  输出：No prize!')
            ],
            '综合应用'
        );

        // ============================================================
        // 结束页
        // ============================================================
        slides.push({
            type: 'end',
            title: 'Thank You',
            sub: '模块4 · C语言运算符详解',
            desc: '15级优先级 · 从括号到逗号'
        });

        // ============================================================
        // 渲染引擎
        // ============================================================
        const container = document.getElementById('slidesContainer');

        function renderSlide(data) {
            const section = document.createElement('section');
            section.className = 'slide';

            if (data.type === 'cover') {
                section.classList.add('slide-cover');
                section.innerHTML = `
                    <div class="main-title">${data.mainTitle}</div>
                    <div class="sub-title">${data.subTitle}</div>
                    <div class="divider-line"></div>
                    <div class="info-text">中职计算机专业 · 课堂教学</div>
                    <div class="date-text">${data.date}</div>
                `;
                return section;
            }

            if (data.type === 'end') {
                section.classList.add('slide-end');
                section.innerHTML = `
                    <div class="end-title">${data.title}</div>
                    <div class="end-line"></div>
                    <div class="end-sub">${data.sub}</div>
                    <div class="end-desc">${data.desc}</div>
                `;
                return section;
            }

            let meta = '';
            if (data.chapter) {
                meta = `<div style="display:flex; justify-content:space-between; align-items:center; font-size:clamp(20px,2.2vh,30px); color:#8a9bb5; border-bottom:1px solid #eef2f7; padding-bottom:0.3vh; margin-bottom:0.6vh; flex-shrink:0;">
                    <span style="background:#0a2a4a; color:#fff; padding:0.1vh 1.2vw; border-radius:30px; font-weight:600; font-size:clamp(18px,2vh,28px);">${data.chapter}</span>
                </div>`;
            }

            let content = '';
            if (data.takeaway) {
                content += `<div class="core-takeaway">${data.takeaway}</div>`;
            }

            for (const block of data.contentBlocks) {
                if (typeof block === 'string') {
                    content += block;
                } else if (block.type === 'text') {
                    content += block;
                } else if (block.type === 'code') {
                    content += block;
                } else if (block.type === 'output') {
                    content += block;
                } else if (block.type === 'grid') {
                    content += block;
                } else if (block.type === 'table') {
                    content += block;
                } else if (block.type === 'toc') {
                    let itemsHtml = block.items.map(item =>
                        `<div class="info-block" style="background:#f0f6fe; border-color:#0a2a4a; margin-bottom:0.6vh;">
                            <h4 style="font-size:clamp(28px,3.2vh,42px);">${item.ch}</h4>
                            <p style="font-size:clamp(24px,2.8vh,36px); color:#2a4a6a;">${item.desc}</p>
                        </div>`
                    ).join('');
                    content += `<div style="display:grid; grid-template-columns:1fr; gap:0.6vh; margin-top:0.3vh;">${itemsHtml}</div>`;
                } else if (block.type === 'chapter_guide') {
                    content += `<div class="core-takeaway" style="border-left-color:#0a2a4a; background:#eef4fa;">${block.desc}</div>`;
                }
            }

            section.innerHTML = meta + `
                <div class="slide-title">${data.title}</div>
                <div class="slide-sub">${data.subtitle}</div>
                ${content}
            `;
            return section;
        }

        // 处理特殊页面
        slides.forEach((data) => {
            let el;
            if (data.type === 'cover') {
                el = renderSlide(data);
            } else if (data.type === 'end') {
                el = renderSlide(data);
            } else if (data.contentBlocks && data.contentBlocks.length > 0 && data.contentBlocks[0].type === 'chapter_guide') {
                const c = data.contentBlocks[0];
                el = document.createElement('section');
                el.className = 'slide slide-chapter';
                el.innerHTML = `
                    <div class="ch-title">${data.title}</div>
                    <div class="ch-sub">${data.subtitle}</div>
                    <div class="ch-desc">${c.desc}</div>
                `;
            } else {
                el = renderSlide(data);
            }
            container.appendChild(el);
        });

        // ===== 翻页控制 =====
        let current = 0;
        const total = slides.length;

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            container.style.transform = `translateX(-${current * 100}vw)`;
        }

        document.getElementById('clickLeft').addEventListener('click', () => goTo(current - 1));
        document.getElementById('clickRight').addEventListener('click', () => goTo(current + 1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goTo(current - 1);
            else if (e.key === 'ArrowRight') goTo(current + 1);
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) goTo(current + 1);
                else goTo(current - 1);
            }
        }, { passive: true });

        goTo(0);
    </script>
</body>
</html>
