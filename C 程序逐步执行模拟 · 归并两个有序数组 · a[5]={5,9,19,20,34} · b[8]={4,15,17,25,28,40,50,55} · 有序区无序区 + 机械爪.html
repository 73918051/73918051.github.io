<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C 程序逐步执行模拟 · 归并两个有序数组 · a[5]={5,9,19,20,34} · b[8]={4,15,17,25,28,40,50,55} · 有序区/无序区 + 机械爪</title>
<style>
:root{
  --code-font:    clamp(52px, 3.2vw, 80px);
  --ln-font:      clamp(34px, 2.0vw, 52px);
  --out-font:     clamp(48px, 2.8vw, 72px);
  --var-font:     clamp(50px, 1.6vw, 52px);
  --explain-font: clamp(32px, 2.0vw, 48px);
  --btn-font:     clamp(26px, 1.4vw, 40px);
  --title-font:   clamp(26px, 1.6vw, 40px);
  --panel-bg:     rgba(13,17,23,.88);
  --panel-border: rgba(56,189,248,.35);

  --bar-default-1:#3b82f6;
  --bar-default-2:#1d4ed8;
  --bar-active-1:#fcd34d;
  --bar-active-2:#fbbf24;
  --bar-swap-1:#4ade80;
  --bar-swap-2:#22c55e;
  --track-color:#475569;

  --sorted-green:#22c55e;
  --sorted-green-bg:rgba(74,222,128,.12);
  --sorted-green-border:rgba(74,222,128,.65);
  --unsorted-gray-bg:rgba(100,116,139,.06);
  --unsorted-gray-border:rgba(100,116,139,.4);
  --done-dim:rgba(100,116,139,.28);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0d1117;}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#e6edf3;-webkit-tap-highlight-color:transparent;}

#stage{position:fixed;inset:0;background:#0d1117;z-index:0;}
#codeScroll{position:absolute;inset:0;overflow:auto;padding:0 0 38vh 0;scrollbar-width:thin;scrollbar-color:#334155 transparent;}
#codeScroll::-webkit-scrollbar{width:16px;height:16px;}
#codeScroll::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:10px;}
#codeScroll::-webkit-scrollbar-track{background:#0d1117;}

.code-line{display:flex;align-items:flex-start;white-space:pre;font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:var(--code-font);line-height:1.5;border-left:14px solid transparent;transition:background-color .25s,border-color .25s,opacity .25s;}
.code-line .ln{flex:0 0 auto;width:3.6ch;text-align:right;margin-right:1.4rem;font-size:var(--ln-font);color:#3d4f66;user-select:none;font-variant-numeric:tabular-nums;}
.code-line .src{flex:0 0 auto;padding-right:6rem;}

.pp{color:#c084fc;font-weight:600;}
.str{color:#4ade80;}
.cmt{color:#5b6f8c;font-style:italic;}
.fn{color:#38bdf8;}
.kw{color:#f472b6;font-weight:600;}
.num{color:#fbbf24;}
.op{color:#fb923c;font-weight:700;}

.code-line.active{background:linear-gradient(90deg,rgba(56,189,248,.28),rgba(56,189,248,.03));border-left-color:#38bdf8;box-shadow:inset 0 0 0 4px rgba(56,189,248,.22);}
.code-line.active .ln{color:#38bdf8;font-weight:700;}
.code-line.active .src{color:#ffffff;}
.code-line.skip{opacity:.22;}
.code-line.skip .ln{color:#4d5f78;}

.panel{position:fixed;background:var(--panel-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:3px solid var(--panel-border);border-radius:20px;box-shadow:0 16px 48px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;z-index:100;min-width:0;min-height:0;transition:border-color .18s,box-shadow .18s,opacity .18s;}
.panel:hover{background:rgba(13,17,23,.96);}
.panel.active{border-color:#38bdf8;box-shadow:0 0 0 5px rgba(56,189,248,.45),0 16px 48px rgba(0,0,0,.8);}
.panel.hidden{display:none !important;}

.phead{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.3rem .7rem;background:rgba(30,41,59,.95);border-bottom:3px solid rgba(56,189,248,.25);cursor:move;user-select:none;touch-action:none;}
.ptitle{font-size:var(--title-font);font-weight:700;color:#7dd3fc;white-space:nowrap;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;}
.pspacer{flex:1 1 auto;}
.pbtn{flex:0 0 auto;font:inherit;font-size:var(--btn-font);line-height:1;min-width:52px;min-height:52px;border-radius:16px;border:3px solid rgba(148,163,184,.30);background:rgba(30,41,59,.8);color:#cbd5e1;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;}
.pbtn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8;color:#fff;}
.pbtn:active{transform:translateY(2px);}
.pclose{color:#fca5a5;border-color:rgba(248,113,113,.4);}
.pclose:hover{background:rgba(248,113,113,.3);border-color:#f87171;color:#fff;}

.pbody{flex:1 1 auto;min-height:0;min-width:0;overflow:auto;padding:.5rem .7rem;scrollbar-width:thin;scrollbar-color:#334155 transparent;}
.pbody::-webkit-scrollbar{width:14px;height:14px;}
.pbody::-webkit-scrollbar-thumb{background:#2c3f5e;border-radius:10px;}

.presize{position:absolute;right:0;bottom:0;width:48px;height:48px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 38%,rgba(56,189,248,.9) 39%,rgba(56,189,248,.9) 52%,transparent 53%,transparent 60%,rgba(56,189,248,.9) 61%,rgba(56,189,248,.9) 74%,transparent 75%,transparent 80%,rgba(56,189,248,.9) 81%,rgba(56,189,248,.9) 94%,transparent 95%);}
.presize:hover{background-color:rgba(56,189,248,.22);}
.panel.collapsed .pbody{display:none;}

#p-top{left:20px;top:16px;}
#p-top .pbody{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
.ctl{font:inherit;font-size:var(--btn-font);min-height:60px;padding:.3rem 1rem;border-radius:18px;border:3px solid rgba(148,163,184,.30);background:rgba(30,41,59,.8);color:#dbeafe;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;touch-action:manipulation;}
.ctl:hover{background:rgba(56,189,248,.25);border-color:#38bdf8;color:#fff;}
.ctl:active{transform:translateY(2px);}
.ctl:disabled{opacity:.30;cursor:not-allowed;}
.ctl.primary{background:linear-gradient(180deg,#0ea5e9,#0284c7);border-color:#38bdf8;color:#04121f;font-weight:800;}
.ctl.primary.playing{background:linear-gradient(180deg,#f59e0b,#d97706);border-color:#fbbf24;color:#1a1200;}
.speedbox{display:flex;align-items:center;gap:.6rem;font-size:var(--btn-font);color:#94a3b8;white-space:nowrap;}
.speedbox input[type=range]{width:clamp(100px,8vw,200px);height:40px;accent-color:#38bdf8;cursor:pointer;}
.speedbox b{color:#38bdf8;min-width:4ch;font-variant-numeric:tabular-nums;}

#p-vars{left:20px;top:170px;}
.arr-title{font-size:var(--var-font);color:#7d93b3;margin-bottom:.35rem;white-space:normal;line-height:1.4;}
.arr-title b{color:#fbbf24;}
.arr-title i{color:#f59e0b;font-style:normal;}
.arr-title .legend-sorted{color:#4ade80;font-weight:800;}
.arr-title .legend-unsorted{color:#94a3b8;font-weight:800;}

.hud-counter{display:flex;justify-content:space-around;margin-bottom:10px;background:rgba(30,41,59,.6);padding:6px 8px;border-radius:12px;border:2px solid rgba(56,189,248,.2);}
.hud-item{font-size:calc(var(--var-font) * .95);color:#94a3b8;display:flex;align-items:center;gap:6px;}
.hud-item b{color:#38bdf8;font-size:calc(var(--var-font) * 1.3);font-family:ui-monospace;}

.pass-indicator{display:flex;align-items:center;gap:.5rem;background:rgba(30,41,59,.75);border:2px solid rgba(56,189,248,.35);border-radius:12px;padding:.3rem .6rem;font-size:calc(var(--var-font) * .85);color:#c9d7ea;margin-bottom:.4rem;min-height:2.2em;flex-wrap:wrap;transition:border-color .3s,background .3s;}
.pass-indicator .pi-badge{background:linear-gradient(180deg,#38bdf8,#0284c7);color:#04121f;font-weight:900;padding:2px 10px;border-radius:8px;font-size:.92em;white-space:nowrap;}
.pass-indicator .pi-info{color:#c9d7ea;}
.pass-indicator .pi-prog{margin-left:auto;color:#5f7796;font-size:.85em;font-family:ui-monospace;}

.zone-banner{background:rgba(30,41,59,.72);border:2px solid rgba(56,189,248,.32);border-radius:10px;padding:.3rem .6rem;font-size:calc(var(--var-font) * .78);color:#c9d7ea;margin-bottom:.4rem;min-height:2em;display:flex;align-items:center;flex-wrap:wrap;gap:.35em;line-height:1.4;transition:border-color .3s,background .3s;}
.zone-banner b{color:#fbbf24;font-family:ui-monospace,Consolas,monospace;}
.zone-banner .zb-sorted{color:#86efac;font-weight:800;}
.zone-banner .zb-unsorted{color:#cbd5e1;font-weight:800;}
.zone-banner .badge-grab{background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#1a1200;font-weight:900;padding:1px 9px;border-radius:6px;font-size:.92em;letter-spacing:.04em;box-shadow:0 2px 10px rgba(245,158,11,.6);}
.zone-banner .badge-done{background:linear-gradient(180deg,#38bdf8,#0284c7);color:#04121f;font-weight:900;padding:1px 9px;border-radius:6px;font-size:.92em;letter-spacing:.04em;}
.zone-banner .badge-round{background:linear-gradient(180deg,#a78bfa,#7c3aed);color:#fff;font-weight:900;padding:1px 9px;border-radius:6px;font-size:.92em;letter-spacing:.04em;box-shadow:0 2px 10px rgba(124,58,237,.6);}
.zone-banner .zb-hint{color:#5f7796;font-style:italic;}

/* ===== 三数组展示 ===== */
.array-section{position:relative;}
.array-row{display:flex;align-items:center;gap:.4rem;margin-bottom:6px;}
.array-name{flex:0 0 auto;width:2.2rem;font-size:calc(var(--var-font) * 1.0);font-weight:900;font-family:ui-monospace;color:#7dd3fc;text-align:center;}
.array-name.a{color:#38bdf8;}
.array-name.b{color:#a5b4fc;}
.array-name.c{color:#4ade80;}
.ptr-info{flex:0 0 auto;font-size:calc(var(--var-font) * .8);font-family:ui-monospace;color:#5f7796;margin-left:.3rem;white-space:nowrap;}

.arr-grid{display:grid;gap:.25rem;flex:1 1 auto;min-width:0;}
.arr-grid.g5{grid-template-columns:repeat(5,minmax(0,1fr));}
.arr-grid.g8{grid-template-columns:repeat(8,minmax(0,1fr));}
.arr-grid.g13{grid-template-columns:repeat(13,minmax(0,1fr));}

.acell{position:relative;text-align:center;border-radius:10px;padding:.2rem .02rem .25rem;background:#0d1728;border:2px solid #1b293f;transition:background .3s,border-color .3s,box-shadow .3s,transform .3s,opacity .3s;overflow:hidden;}
.acell .aidx{display:block;font-size:calc(var(--var-font) * .62);color:#5f7796;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;}
.acell .aval{display:block;font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:calc(var(--var-font) * 1.1);color:#38bdf8;line-height:1.3;white-space:nowrap;}
.acell.empty .aval{color:#3c5170;font-weight:500;}
.acell.done{opacity:.38;}
.acell.done .aval{color:#64748b;}

/* a / b 数组：待处理蓝色，已处理灰色 */
.acell.pending{background:rgba(56,189,248,.10);border-color:rgba(56,189,248,.45);}
.acell.pending .aval{color:#7dd3fc;}
.acell.processed{background:rgba(100,116,139,.10);border-color:rgba(100,116,139,.35);}
.acell.processed .aval{color:#64748b;}
.acell.processed .aidx{color:#4b5563;}

/* c 数组：有序区绿色，无序区灰色虚线 */
.acell.in-sorted{background:var(--sorted-green-bg);border-color:var(--sorted-green-border);}
.acell.in-sorted .aval{color:#86efac;}
.acell.in-sorted .aidx{color:#6ee7b7;}
.acell.in-unsorted{background:var(--unsorted-gray-bg);border:2px dashed rgba(100,116,139,.4);}
.acell.in-unsorted .aval{color:#475569;}
.acell.in-unsorted .aidx{color:#3d4f66;}

/* 高亮：正在比较 */
.acell.is-cmp{border-color:#fbbf24 !important;background:rgba(251,191,36,.18) !important;box-shadow:0 0 0 3px rgba(251,191,36,.42);transform:translateY(-3px);}
.acell.is-cmp .aval{color:#ffffff;}

/* 高亮：正在被抓取 */
.acell.is-grab{border-color:#f59e0b !important;background:rgba(245,158,11,.28) !important;box-shadow:0 0 0 3px rgba(245,158,11,.55),0 0 20px rgba(245,158,11,.5);transform:translateY(-6px);animation:grabFloat .7s ease-in-out infinite alternate;z-index:5;}
.acell.is-grab .aval{color:#ffedd5;}
@keyframes grabFloat{from{transform:translateY(-7px);}to{transform:translateY(-2px);}}

/* 高亮：正在被写入 c */
.acell.is-write{border-color:#4ade80 !important;background:rgba(74,222,128,.30) !important;box-shadow:0 0 0 3px rgba(74,222,128,.55),0 0 20px rgba(74,222,128,.5);transform:translateY(-5px);z-index:4;}
.acell.is-write .aval{color:#ffffff;}

@keyframes cellFlash{0%{transform:scale(1);}40%{transform:scale(1.35);color:#fff;}100%{transform:scale(1);}}
.acell .aval.flash{animation:cellFlash .45s ease-out;}

/* ===== 机械爪 ===== */
.gripper-rail{position:relative;height:44px;margin:2px 0 4px 0;}
.gripper{position:absolute;top:2px;left:0;width:70px;height:32px;z-index:20;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:left .5s cubic-bezier(.4,0,.2,1),width .5s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1),opacity .25s ease;}
.gripper.active{opacity:1;}
.gripper-label{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#fcd34d,#f59e0b);color:#1a1200;font-weight:900;font-size:calc(var(--var-font) * .8);padding:1px 10px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.65);display:none;z-index:30;border:2px solid #fff3c4;}
.gripper-body{width:100%;height:18px;background:linear-gradient(180deg,#cbd5e1 0%,#94a3b8 100%);border-radius:6px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.55);border:1px solid #64748b;transition:background .3s;}
.gripper-body::before,.gripper-body::after{content:'';position:absolute;width:7px;height:7px;background:#475569;border-radius:50%;top:4px;box-shadow:inset 0 1px 3px rgba(0,0,0,.85);}
.gripper-body::before{left:7px;}
.gripper-body::after{right:7px;}
.gripper-arm{position:absolute;top:16px;width:7px;height:18px;background:linear-gradient(180deg,#cbd5e1,#94a3b8);border-radius:0 0 3px 3px;transform-origin:top center;transition:transform .4s cubic-bezier(.4,0,.2,1),background .3s;box-shadow:0 2px 6px rgba(0,0,0,.5);}
.gripper-arm.left{left:7px;}
.gripper-arm.right{right:7px;}
.gripper.grabbing .gripper-arm.left{transform:rotate(16deg) translateY(6px);}
.gripper.grabbing .gripper-arm.right{transform:rotate(-16deg) translateY(6px);}
.gripper.grabbing .gripper-body{background:linear-gradient(180deg,#fcd34d,#f59e0b);}
.gripper.grabbing .gripper-arm{background:linear-gradient(180deg,#fcd34d,#f59e0b);}

/* 有序区标签带 */
.zone-labels{display:grid;gap:.25rem;margin-top:2px;height:calc(var(--var-font) * .95);}
.zone-labels.g13{grid-template-columns:repeat(13,minmax(0,1fr));}
.zone-lbl{display:flex;align-items:center;justify-content:center;font-size:calc(var(--var-font) * .62);font-weight:800;border-radius:5px;opacity:0;transition:background .3s,color .3s,opacity .3s,box-shadow .3s;white-space:nowrap;overflow:hidden;}
.zone-lbl.sorted-zone{opacity:1;background:linear-gradient(180deg,rgba(74,222,128,.30),rgba(34,197,94,.18));color:#86efac;border:1px solid rgba(74,222,128,.5);}
.zone-lbl.unsorted-zone{opacity:1;background:linear-gradient(180deg,rgba(100,116,139,.20),rgba(71,85,105,.12));color:#94a3b8;border:1px dashed rgba(100,116,139,.35);}
.zone-lbl.sorted-zone.zone-edge{box-shadow:inset -2px 0 0 0 #22c55e;}
.zone-lbl.unsorted-zone.zone-edge{box-shadow:inset 2px 0 0 0 #22c55e;}

/* 变量表 */
.vtable{display:flex;flex-direction:column;gap:.18rem;margin-top:.4rem;}
.vrow{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;padding:.18rem .55rem;border-radius:10px;background:#0d1728;border:2px solid #1b293f;font-size:var(--var-font);transition:background .3s,border-color .3s;}
.vrow.changed{border-color:rgba(56,189,248,.9);background:rgba(56,189,248,.15);}
.vk{color:#8ba3c4;white-space:normal;flex:1 1 auto;min-width:0;font-size:.9em;}
.vv{font-family:ui-monospace,Consolas,monospace;font-weight:800;color:#38bdf8;text-align:right;white-space:normal;flex:0 0 auto;max-width:64%;word-break:break-all;font-variant-numeric:tabular-nums;}
.vv.dim{color:#5f7796;font-weight:500;}
.r-ctx .vv{color:#4ade80;}
.r-j   .vv{color:#38bdf8;}
.r-i   .vv{color:#38bdf8;}
.r-k   .vv{color:#4ade80;}
.r-c1  .vv{color:#2dd4bf;}
.r-c2  .vv{color:#2dd4bf;}
.r-c3  .vv{color:#2dd4bf;}
.r-ifc .vv{color:#a5b4fc;}
.r-expr .vv{color:#a5b4fc;}
.r-eval .vv{color:#a5b4fc;}
.r-note .vv{color:#2dd4bf;font-size:.88em;}
.r-pfn .vv{color:#fb923c;}
.r-ret .vv{color:#fbbf24;}

#p-out{right:20px;bottom:16px;}
.console{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:var(--out-font);line-height:1.55;color:#fbbf24;white-space:pre;min-height:1.2em;}
.console:empty::before{content:"（等待程序输出…）";color:#3d5474;font-size:calc(var(--out-font) * .5);}
@keyframes slideIn{from{opacity:0;transform:translateX(-1.2rem);}to{opacity:1;transform:none;}}
.outline{animation:slideIn .35s ease-out;min-height:1.2em;}

#p-explain{left:20px;bottom:16px;}
.exhead{display:inline-block;margin-right:.7rem;padding:.1rem .65rem;border-radius:.4em;background:rgba(56,189,248,.22);color:#38bdf8;font-weight:800;font-size:calc(var(--explain-font) * .78);vertical-align:middle;}
.exhead.ans{background:rgba(251,191,36,.28);color:#fbbf24;}
.exhead.grn{background:rgba(74,222,128,.28);color:#86efac;}
.exhead.rnd{background:rgba(167,139,250,.30);color:#c4b5fd;}
#explainBody{font-size:var(--explain-font);line-height:1.5;color:#c3d3e8;}
#explainBody strong{color:#fff;}
#explainBody code{font-family:ui-monospace,Consolas,monospace;background:rgba(148,163,184,.18);border-radius:.3rem;padding:0 .3rem;color:#e2e8f0;}
#explainBody .tip{display:block;margin-top:.5rem;padding:.4rem .75rem;border-radius:.5rem;background:rgba(45,212,191,.12);border-left:8px solid #2dd4bf;color:#bff5ec;font-size:calc(var(--explain-font) * .88);}
#explainBody .warn{display:block;margin-top:.5rem;padding:.4rem .75rem;border-radius:.5rem;background:rgba(251,191,36,.14);border-left:8px solid #fbbf24;color:#ffe6b0;font-size:calc(var(--explain-font) * .88);}

#p-mini{right:20px;top:16px;}
#miniBody{position:relative;flex:1 1 auto;min-height:0;min-width:0;overflow:hidden;padding:0 !important;background:rgba(5,10,18,.6);}
#miniContent{position:absolute;inset:0;}
.mini-line{overflow:hidden;white-space:pre;font-family:ui-monospace,Consolas,monospace;color:#8ba3c4;padding-left:5px;border-left:4px solid transparent;opacity:.85;transition:background .2s,border-color .2s,opacity .2s;}
.mini-line.skip{opacity:.26;}
.mini-line.cur{background:rgba(56,189,248,.38);border-left-color:#38bdf8;opacity:1;}
#miniView{position:absolute;left:0;right:0;border:4px solid #38bdf8;background:rgba(56,189,248,.15);box-shadow:0 0 18px rgba(56,189,248,.6);pointer-events:none;border-radius:6px;}

@media (max-width:1000px){
  :root{--code-font:clamp(28px,4.2vw,42px);--ln-font:clamp(18px,2.6vw,28px);--out-font:clamp(34px,5vw,54px);--var-font:clamp(16px,2.2vw,26px);--explain-font:clamp(18px,2.8vw,28px);--btn-font:clamp(16px,2.2vw,24px);--title-font:clamp(16px,2vw,22px);}
  .acell{padding:.15rem .02rem .2rem;}
  .gripper-rail{height:34px;}
  .gripper{height:24px;}
  .gripper-body{height:14px;}
  .gripper-arm{top:12px;height:14px;width:6px;}
  .gripper-arm.left{left:5px;}
  .gripper-arm.right{right:5px;}
  .gripper-label{top:-24px;font-size:12px;padding:1px 6px;}
}
</style>
</head>
<body>

<div id="stage"><div id="codeScroll"></div></div>

<!-- 控制台 -->
<div class="panel" id="p-top" data-panel>
  <div class="phead">
    <span class="ptitle">控制台</span>
    <span class="pspacer"></span>
    <button class="pbtn pfold" title="折叠">—</button>
    <button class="pbtn pclose" title="关闭">✕</button>

/* =========================================================

var A = [5, 9, 19, 20, 34];
var B = [4, 15, 17, 25, 28, 40, 50, 55];
var M = 5, N = 8;
var C = [];
for (var z = 0; z < 13; z++) C.push(null);

var outText = '';
var STEPS = [];

var track = { i: '—', j: '—', k: '—', round: '0', pfnN: '0', ret: '—' };

function push(o) {

/* ---------- 第 1~7 行：初始化 ---------- */
push({
  line: 1, ctx: '预处理阶段 · 编译前已完成',

  title: 'int main() {　程序从这里开始',

});
push({
  line: 5, state: { i: 0, j: 0, k: 0 },
  ctx: 'main · static 数组 a 声明并初始化',
  hlA: [0,1,2,3,4],
  note: 'a[0]~a[4] = 5 9 19 20 34（已升序）',
  title: 'static int a[M] = {5,9,19,20,34};',
  desc: '声明 <b>int 数组 a</b>，长度 M=5，下标 0~4。<br>· <b>a[0]=5、a[1]=9、a[2]=19、a[3]=20、a[4]=34</b>；<br>· 元素<b>已经按升序排好</b>，这是双指针归并的前提。<span class="tip"><b>static 的含义：</b>数组放在静态存储区，程序启动即存在，初值在加载时一次性填好。</span>'
});
push({
  line: 6,

  hlB: [0,1,2,3,4,5,6,7],
  note: 'b[0]~b[7] = 4 15 17 25 28 40 50 55（已升序）',
  title: 'static int b[N] = {4,15,17,25,28,40,50,55};',
  desc: '声明 <b>int 数组 b</b>，长度 N=8，下标 0~7。<br>· <b>b[0]=4、b[1]=15、b[2]=17、b[3]=25、b[4]=28、b[5]=40、b[6]=50、b[7]=55</b>；<br>· 元素<b>同样已按升序排好</b>。'
});

  line: 7,
  ctx: 'main · 声明数组 c 与三个指针 i、j、k',
  note: 'c 是局部数组（初始为随机残留），i=j=k=0',
  title: 'int c[20], i=0, j=0, k=0;',
  desc: '· <b>c[20]</b>：合并结果容器，<b>局部数组，未初始化</b>，界面显示 <code>?</code>；<br>· <b>i=0</b>：a 的读指针；<br>· <b>j=0</b>：b 的读指针；<br>· <b>k=0</b>：c 的写指针。<span class="tip"><b>双指针归并思想：</b>i 和 j 各指向 a、b 队首（各自的最小值）。每次比较 <code>a[i]</code> 与 <code>b[j]</code>，<b>谁小就取谁放进 c[k]</b>，然后把那个指针后移，k 也后移。</span>'

/* ============ 主归并循环 ============ */
var i = 0, j = 0, k = 0, round = 0;

while (true) {
  var condW = (j < N) && (i < M);

  push({
    line: 8, state: { round: round, i: i, j: j, k: k },
    ctx: '主归并 while 条件检查 · 第 ' + round + ' 次',

    expr: 'while(j<N && i<M)',

      line: 10, state: { i: i, j: j + 1, k: k + 1, round: round },
      ctx: 'c[k++] = b[j++]（把 b 的队首搬到 c）',

      expr: 'c[k++] = b[j++]',
      exprVal: 'c[' + k + '] = b[' + j + '] = ' + vB + '　⇒　k→' + (k + 1) + '，j→' + (j + 1),

      grabSrc: { type: 'b', idx: j },
      grabDst: k,
      hlC: [k],
      title: 'c[k++] = b[j++];   →   c[' + k + '] = ' + vB,
      desc: '一行完成 4 件事：<br>① 取出 <b>b[' + j + '] = ' + vB + '</b>；<br>② 写入 <b>c[' + k + ']</b>；<br>③ <code>k++</code>：k ' + k + ' → <b>' + (k + 1) + '</b>；<br>④ <code>j++</code>：j ' + j + ' → <b>' + (j + 1) + '</b>。<span class="tip"><b>后缀 ++ 的时机：</b><code>b[j++]</code> 先取 b[' + j + ']，再让 j 自增。若写成 <code>b[++j]</code>，就会跳过当前元素。</span>'

      ctx: 'c[k++] = a[i++]（把 a 的队首搬到 c）',
      condMain: '真', condIf: '假',

      note: 'a 的读指针 i 后移；c 的写指针 k 后移',
      grabSrc: { type: 'a', idx: i },

function getFullLineHeight() {
  if (codeLines.length > 1) {
    var d = codeLines[1].offsetTop - codeLines[0].offsetTop;

  }
  return (codeLines[0] && codeLines[0].offsetHeight) || 1;

  var activeLine = step ? step.line : -1;
  var skipLines  = step ? step.skip : [];
  codeLines.forEach(function (el) {
    var n = Number(el.dataset.line);
    el.classList.toggle('active', n === activeLine);

  });

function centerActiveLine() {
  var el = codeScroll.querySelector('.code-line.active');
  if (!el) return;
  var lh = getFullLineHeight();
  var maxScroll = codeScroll.scrollHeight - codeScroll.clientHeight;
  if (maxScroll <= 0) return;
  var target = el.offsetTop - (codeScroll.clientHeight - lh) / 2;
  target = Math.max(0, Math.min(maxScroll, target));
  if (Math.abs(target - codeScroll.scrollTop) < 4) return;
  codeScroll.scrollTo({ top: target, behavior: 'smooth' });
}

  });

  ptrK.textContent = 'k=' + (step ? step.k : '—');

  /* 标签带 */
  zoneLbls.forEach(function (lbl, idx) {
    if (idx < k) {
      lbl.className = 'zone-lbl sorted-zone' + (idx === k - 1 ? ' zone-edge' : '');
      lbl.textContent = '有序';
    } else {
      lbl.className = 'zone-lbl unsorted-zone' + (idx === k ? ' zone-edge' : '');
      lbl.textContent = '无序';
    }
  });
}

/* ---------- 机械爪 ---------- */
function renderGripper() {
  var step = current >= 0 ? STEPS[current] : null;
  var grabbing = !!(step && step.grabSrc && step.grabDst !== null && step.grabDst !== undefined);

  if (grabbing) {
    var dstCell = cellsC[step.grabDst];
    if (dstCell) {
      var railRect = gripperRail.getBoundingClientRect();
      var cRect = dstCell.getBoundingClientRect();
      /* 机械爪定位到目标格子正上方 */
      var left = cRect.left - railRect.left + cRect.width / 2 - 35;
      claw.style.left = left + 'px';
      claw.style.width = '70px';
      claw.classList.add('active', 'grabbing');
      clawLabel.textContent = (step.grabSrc.type === 'b' ? 'b[' + step.grabSrc.idx + '] = ' : 'a[' + step.grabSrc.idx + '] = ') + (step.grabSrc.type === 'b' ? B[step.grabSrc.idx] : A[step.grabSrc.idx]);
      clawLabel.style.display = 'block';
      return;
    }
  }
  claw.classList.remove('active', 'grabbing');
  clawLabel.style.display = 'none';
}

/* ---------- 状态横幅 ---------- */
function renderZoneBanner() {
  var step = current >= 0 ? STEPS[current] : null;
  if (!step) {
    zoneBanner.innerHTML = '<span class="zb-hint">尚未开始，等待进入主归并循环…</span>';
    zoneBanner.style.borderColor = 'rgba(56,189,248,.32)';
    return;
  }
  var k = parseInt(step.k);
  var i = parseInt(step.i);
  var j = parseInt(step.j);
  var html = '';
  var sortedTxt = 'c[0..' + (k - 1) + ']' + (k > 0 ? ' = [' + C.slice(0, k).join(', ') + ']' : '');
  var unsortedTxt = 'c[' + k + '..12]';

  if (step.line >= 21 && step.line <= 23) {
    html = '<span class="badge-done">输出阶段</span>' +
           '<span class="zb-sorted">整个 c[0..' + (k - 1) + '] 为有序区，共 ' + k + ' 个元素</span>';
    zoneBanner.style.borderColor = 'rgba(56,189,248,.75)';
  } else if (step.grabSrc && step.grabDst !== null && step.grabDst !== undefined) {
    /* 抓取写入步骤 */
    var srcTxt = step.grabSrc.type === 'b'
      ? 'b[' + step.grabSrc.idx + '] = ' + B[step.grabSrc.idx]
      : 'a[' + step.grabSrc.idx + '] = ' + A[step.grabSrc.idx];
    html = '<span class="badge-grab">机械爪抓取</span>' +
           '从 <b>' + srcTxt + '</b> 取出，写入 <b>c[' + step.grabDst + ']</b>' +
           '<span class="zb-sorted" style="margin-left:.5em">有序区 ' + sortedTxt + '</span>' +
           '<span class="zb-unsorted">无序区 ' + unsortedTxt + '</span>';
    zoneBanner.style.borderColor = 'rgba(74,222,128,.7)';
  } else if (step.line === 8) {
    html = '<span class="badge-round">主循环</span>' +
           'i=' + i + '，j=' + j + '，k=' + k +
           '　比较 <b>a[' + i + ']=' + (i < M ? A[i] : '—') + '</b> 与 <b>b[' + j + ']=' + (j < N ? B[j] : '—') + '</b>';
    zoneBanner.style.borderColor = 'rgba(167,139,250,.65)';
  } else if (step.line === 9) {
    var condIf = step.condIf.indexOf('真') !== -1;
    html = '<span class="badge-grab">比较</span>' +
           'a[' + i + ']=' + (i < M ? A[i] : '—') + '　vs　b[' + j + ']=' + (j < N ? B[j] : '—') +
           '　→ <b>' + (condIf ? 'b 更小，取 b' : 'a 更小/相等，取 a') + '</b>';
    zoneBanner.style.borderColor = 'rgba(251,191,36,.65)';
  } else if (step.line === 15 || step.line === 16 || step.line === 17) {
    html = '<span class="badge-round">收尾 1</span>' +
           '检查 a 是否有剩余：i=' + i + ' < 5 → ' + (i < M ? '真，继续搬' : '假，跳过');
    zoneBanner.style.borderColor = 'rgba(56,189,248,.55)';
  } else if (step.line === 18 || step.line === 19 || step.line === 20) {
    html = '<span class="badge-round">收尾 2</span>' +
           '检查 b 是否有剩余：j=' + j + ' < 8 → ' + (j < N ? '真，继续搬' : '假，结束');
    zoneBanner.style.borderColor = 'rgba(56,189,248,.55)';
  } else if (step.line >= 5 && step.line <= 7) {
    html = '<span class="badge-round">初始化</span>' +
           'a 有 5 个升序元素，b 有 8 个升序元素，c 准备接收 13 个合并元素';
    zoneBanner.style.borderColor = 'rgba(100,116,139,.5)';
  } else {
    html = '<span class="zb-sorted">有序区 ' + sortedTxt + '</span>' +
           '<span style="color:#5f7796">|</span>' +
           '<span class="zb-unsorted">无序区 ' + unsortedTxt + '</span>';
    zoneBanner.style.borderColor = 'rgba(56,189,248,.32)';
  }
  zoneBanner.innerHTML = html;
}

/* ---------- 输出与说明 ---------- */
function renderOut(text) {
  if (text === lastOut) return;
  lastOut = text;
  consoleBody.innerHTML = '';
  if (!text) return;
  var div = document.createElement('div');
  div.className = 'outline';
  div.textContent = text;
  consoleBody.appendChild(div);
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

function renderExplain() {
  var step = current >= 0 ? STEPS[current] : null;
  if (!step) {
    explainBody.innerHTML =
      '<span class="exhead">准备就绪</span>' +
      '<strong>点击「自动播放」或「下一步」，开始逐条执行程序。</strong><br>' +
      '本程序用<b>双指针归并</b>把 <code>a[5]={5,9,19,20,34}</code> 与 <code>b[8]={4,15,17,25,28,40,50,55}</code> 合并成有序的 <code>c</code>：<br>' +
      '· <b>三个指针</b>：<code>i</code> 读 a、<code>j</code> 读 b、<code>k</code> 写 c，初值都是 0；<br>' +
      '· <b>主循环</b> <code>while(j&lt;N &amp;&amp; i&lt;M)</code>：两个数组都还有剩余时，比较 <code>a[i]</code> 与 <code>b[j]</code>；<br>' +
      '· <b>取小者</b>：<code>if(b[j]&lt;a[i])</code> 取 b，否则取 a，写入 <code>c[k++]</code>；<br>' +
      '· <b>收尾</b>：<code>while(i&lt;M)</code> 搬 a 剩余，<code>while(j&lt;N)</code> 搬 b 剩余；<br>' +
      '· <b>输出</b>：<code>printf("%3d", c[i])</code> 打印 c[0..k-1]。<br>' +
      '<b>程序输出：&nbsp;&nbsp;4&nbsp;&nbsp;5&nbsp;&nbsp;9&nbsp;15&nbsp;17&nbsp;19&nbsp;20&nbsp;25&nbsp;28&nbsp;34&nbsp;40&nbsp;50&nbsp;55（共 13 个，同一行，末尾无换行）</b>';
    return;
  }
  var isGrab = !!(step.grabSrc && step.grabDst !== null && step.grabDst !== undefined);
  var isAns = (step.line === 22);
  var isRnd = (step.line === 8 || step.line === 15 || step.line === 18 || step.line === 21);
  var cls = isGrab ? ' grn' : (isAns ? ' ans' : (isRnd ? ' rnd' : ''));
  explainBody.innerHTML =
    '<span class="exhead' + cls + '">第 ' + step.line + ' 行</span>' +
    '<strong>' + step.title + '</strong><br>' + step.desc;
}

/* ---------- 主渲染 ---------- */
function render() {
  var step = current >= 0 ? STEPS[current] : null;
  renderCode(step);
  renderPassIndicator(step);
  renderVars(step);
  renderArrAB();
  renderArrC();
  renderZoneBanner();
  renderOut(step ? step.out : '');
  renderExplain();
  renderGripper();

  hudRound.textContent = step ? step.round : '0';
  hudK.textContent = step ? step.k : '0';
  hudPfn.textContent = step ? step.pfnN : '0';

  btnPrev.disabled = current < 0;
  btnNext.disabled = current >= STEPS.length - 1;

  centerActiveLine();
  requestAnimationFrame(syncMiniScroll);
}

/* =========================================================
   缩略图
   ========================================================= */
var miniLineH = 16;
function layoutMini() {
  var bodyEl = document.getElementById('p-mini').querySelector('.pbody');
  var bodyH = bodyEl.clientHeight;
  if (bodyH <= 0) return;
  var lh = bodyH / 25;
  miniLineH = lh;
  var fs = Math.max(4, Math.min(lh * 0.72, 42));
  miniLines.forEach(function (el) {
    el.style.height = lh + 'px';
    el.style.lineHeight = lh + 'px';
    el.style.fontSize = fs + 'px';
  });
}
function fullLineHeight() {
  if (codeLines.length < 2) return 1;
  var r0 = codeLines[0].getBoundingClientRect();
  var rLast = codeLines[codeLines.length - 1].getBoundingClientRect();
  var h = (rLast.top - r0.top) / (codeLines.length - 1);
  return h > 0 ? h : 1;
}
function syncMiniScroll() {
  var panel = document.getElementById('p-mini');
  if (panel.classList.contains('hidden') || panel.classList.contains('collapsed')) return;
  layoutMini();
  var fh = fullLineHeight();
  var scrollTop = codeScroll.scrollTop;
  var visLines = codeScroll.clientHeight / fh;
  var top = (scrollTop / fh) * miniLineH;
  var hgt = visLines * miniLineH;
  var maxH = miniContent.clientHeight;
  if (top < 0) top = 0;
  if (top + hgt > maxH) {
    top = Math.max(0, maxH - hgt);
    if (hgt > maxH) { top = 0; hgt = maxH; }
  }
  miniView.style.top = top + 'px';
  miniView.style.height = Math.max(6, hgt) + 'px';
}
document.getElementById('miniBody').addEventListener('pointerdown', function (e) {
  bringToFront(document.getElementById('p-mini'));
  var r = miniBody.getBoundingClientRect();
  var y = e.clientY - r.top;
  var idx = Math.floor(y / miniLineH);
  idx = Math.max(0, Math.min(24, idx));
  var fh = fullLineHeight();
  codeScroll.scrollTo({ top: idx * fh, behavior: 'smooth' });
});

/* =========================================================
   面板
   ========================================================= */
var zTop = 100;
var panelEls = Array.prototype.slice.call(document.querySelectorAll('.panel'));
function bringToFront(el) {
  zTop += 1;
  el.style.zIndex = zTop;
  panelEls.forEach(function (p) { p.classList.remove('active'); });
  el.classList.add('active');
}
panelEls.forEach(function (panel) {
  var head = panel.querySelector('.phead');
  var handle = panel.querySelector('.presize');
  var closeBtn = panel.querySelector('.pclose');
  var foldBtn = panel.querySelector('.pfold');

  panel.addEventListener('pointerdown', function () { bringToFront(panel); }, true);

  head.addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    e.preventDefault();
    bringToFront(panel);
    var r = panel.getBoundingClientRect();
    var ox = e.clientX - r.left, oy = e.clientY - r.top;
    function mv(ev) {
      panel.style.left = (ev.clientX - ox) + 'px';
      panel.style.top  = (ev.clientY - oy) + 'px';
      panel.style.right = 'auto'; panel.style.bottom = 'auto';
    }
    function up() {
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      if (panel.id === 'p-vars') requestAnimationFrame(render);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });

  handle.addEventListener('pointerdown', function (e) {
    e.preventDefault(); e.stopPropagation(); bringToFront(panel);
    var r = panel.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY, sw = r.width, sh = r.height;
    function mv(ev) {
      var w = sw + (ev.clientX - sx), h = sh + (ev.clientY - sy);
      panel.style.width  = Math.max(0, w) + 'px';
      panel.style.height = Math.max(0, h) + 'px';
      panel.style.right  = 'auto'; panel.style.bottom = 'auto';
    }
    function up() {
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);
      syncMiniScroll();
      if (panel.id === 'p-vars') requestAnimationFrame(render);
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });

  closeBtn.addEventListener('click', function (e) {
    e.stopPropagation(); panel.classList.add('hidden');
  });
  foldBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (panel.classList.contains('collapsed')) {
      panel.classList.remove('collapsed');
      if (panel.dataset.savedH) panel.style.height = panel.dataset.savedH;
      foldBtn.textContent = '—';
    } else {
      panel.dataset.savedH = panel.style.height || (panel.getBoundingClientRect().height + 'px');
      panel.classList.add('collapsed');
      panel.style.height = 'auto'; foldBtn.textContent = '＋';
    }
    syncMiniScroll();
  });
});

function resetLayout() {
  var W = window.innerWidth, H = window.innerHeight;
  function place(id, l, t, w, h) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('hidden');
    el.style.left   = Math.round(l * W) + 'px';
    el.style.top    = Math.round(t * H) + 'px';
    el.style.width  = Math.round(w * W) + 'px';
    el.style.height = Math.round(h * H) + 'px';
    el.style.right  = 'auto'; el.style.bottom = 'auto'; el.style.zIndex = 100;
  }
  place('p-top',     0.010, 0.014, 0.62, 0.110);
  place('p-vars',    0.010, 0.135, 0.56, 0.640);
  place('p-explain', 0.010, 0.790, 0.62, 0.195);
  place('p-out',     0.645, 0.790, 0.245, 0.195);
  place('p-mini',    0.905, 0.014, 0.085, 0.76);
  zTop = 100;
  panelEls.forEach(function (p) { p.classList.remove('active'); });
  requestAnimationFrame(function () { syncMiniScroll(); render(); });
}
btnLayout.addEventListener('click', resetLayout);
btnFull.addEventListener('click', function () {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
  } else {
    (document.exitFullscreen || function () {}).call(document);
  }
});
btnPanels.addEventListener('click', function () {
  var anyVisible = panelEls.some(function (p) { return !p.classList.contains('hidden'); });
  panelEls.forEach(function (p) { p.classList.toggle('hidden', anyVisible); });
  if (!anyVisible) requestAnimationFrame(function () { syncMiniScroll(); render(); });
});
function toggleMini() {
  var el = document.getElementById('p-mini');
  el.classList.toggle('hidden');
  if (!el.classList.contains('hidden')) {
    bringToFront(el);
    requestAnimationFrame(syncMiniScroll);
  }
}
btnMini.addEventListener('click', toggleMini);

/* =========================================================
   播放控制
   ========================================================= */
function updatePlayBtn() {
  btnPlay.textContent = playing ? '⏸ 暂停' : '▶ 自动播放';
  btnPlay.classList.toggle('playing', playing);
}
function tick() {
  if (current >= STEPS.length - 1) { pause(); return; }
  current += 1;
  render();
  if (current >= STEPS.length - 1) pause();
}
function play() {
  if (playing) return;
  if (current >= STEPS.length - 1) { current = -1; lastOut = null; render(); }
  playing = true;
  updatePlayBtn();
  window.clearInterval(timer);
  timer = window.setInterval(tick, speed);
  tick();
}
function pause() {
  playing = false;
  window.clearInterval(timer);
  timer = null;
  updatePlayBtn();
}
function nextStep() { pause(); if (current < STEPS.length - 1) { current += 1; render(); } }
function prevStep() { pause(); if (current > -1) { current -= 1; render(); } }
function resetAll() {
  pause(); current = -1; lastOut = null;
  consoleBody.innerHTML = ''; codeScroll.scrollTop = 0; render();
}
btnPlay.addEventListener('click', function () { playing ? pause() : play(); });
btnNext.addEventListener('click', nextStep);
btnPrev.addEventListener('click', prevStep);
btnReset.addEventListener('click', resetAll);

speedInput.addEventListener('input', function () {
  speed = Number(speedInput.value);
  speedLabel.textContent = (speed / 1000).toFixed(2) + 's';
  if (playing) {
    window.clearInterval(timer);
    timer = window.setInterval(tick, speed);
  }
});

/* =========================================================
   滚动同步与快捷键
   ========================================================= */
var rafPending = false;
function scheduleSync() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(function () { rafPending = false; syncMiniScroll(); });
}
codeScroll.addEventListener('scroll', scheduleSync, { passive: true });
window.addEventListener('resize', function () {
  scheduleSync();
  centerActiveLine();
  requestAnimationFrame(render);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { scheduleSync(); });
}
if (window.ResizeObserver) {
  var ro = new ResizeObserver(function () { layoutMini(); syncMiniScroll(); });
  ro.observe(document.getElementById('p-mini').querySelector('.pbody'));
  ro.observe(codeScroll);
}
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.code === 'Space')            { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowRight')  { e.preventDefault(); nextStep(); }
  else if (e.code === 'ArrowLeft')   { e.preventDefault(); prevStep(); }
  else if (e.code === 'KeyR')        { resetAll(); }
  else if (e.code === 'KeyF')        { btnFull.click(); }
  else if (e.code === 'KeyM')        { toggleMini(); }
  else if (e.code === 'KeyH')        { btnPanels.click(); }
});

/* =========================================================
   启动
   ========================================================= */
speedLabel.textContent = (speed / 1000).toFixed(2) + 's';
resetLayout();
render();
setTimeout(scheduleSync, 120);
setTimeout(function () { scheduleSync(); render(); }, 500);

})();
</script>
</body>
</html>
